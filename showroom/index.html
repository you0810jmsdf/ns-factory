<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N's factory SHOWROOM | Web 3D ショールーム</title>
  <meta name="description" content="N's factory の革工房をバーチャルで体験。明るいガラスパビリオンで全幕僚が一望できます。">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ND1T7H067Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ND1T7H067Y');
  </script>

  <!-- Three.js importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three/addons/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/libs/meshopt_decoder.module.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/meshopt_decoder.module.js",
      "three/addons/loaders/SVGLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/SVGLoader.js"
    }
  }
  </script>

  <!-- データファイル -->
  <script src="data/showroomData.js"></script>
  <script src="data/staffData.js"></script>
  <script src="data/config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:    #2a2420;
      --accent:     #c9a96a;
      --accent-lt:  #e0c98a;
      --bg:         #f5f2ec;
      --card-bg:    #fffefb;
      --card-bg2:   #f7f4ee;
      --text:       #2a2420;
      --text-sub:   #7a6e60;
      --border:     rgba(201,169,106,0.35);
      --font:       -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }

    /* ===== ヘッダー ===== */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(255,254,251,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    #header a.back {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 13px;
      opacity: 0.8;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #header a.back:hover { opacity: 1; }
    #header .title {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    /* ===== ゾーンメニュー（非表示・SHOWROOM_API互換のためHTML要素は残す） ===== */
    #room-menu { display: none !important; }
    #menu-toggle { display: none !important; }

    /* ===== 現在ゾーンインジケーター（非表示） ===== */
    #room-indicator { display: none !important; }

    /* ===== ホールへ戻るボタン（非表示） ===== */
    #btn-back-hall { display: none !important; }

    /* ===== 3Dキャンバス ===== */
    #canvas-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
    }
    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== 操作ガイドオーバーレイ ===== */
    #guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(245,242,236,0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      cursor: pointer;
    }
    #guide-overlay .guide-box {
      background: rgba(255,254,251,0.96);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 40px;
      text-align: center;
      color: var(--text);
      backdrop-filter: blur(12px);
      max-width: 360px;
      box-shadow: 0 8px 48px rgba(201,169,106,0.12);
    }
    #guide-overlay .guide-box h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    #guide-overlay .guide-box .guide-sub {
      font-size: 11px;
      color: var(--text-sub);
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    #guide-overlay .guide-box .room-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 18px;
    }
    #guide-overlay .guide-box .room-chip {
      background: rgba(201,169,106,0.10);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
    }
    #guide-overlay .guide-box ul {
      list-style: none;
      font-size: 13px;
      line-height: 2;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    #guide-overlay .guide-box .tap-hint {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.45;
    }

    /* ===== 商品情報カード ===== */
    #info-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--border);
      padding: 24px 24px 32px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 150;
      box-shadow: 0 -4px 32px rgba(201,169,106,0.10);
      max-height: 60vh;
      overflow-y: auto;
    }
    #info-card.visible { transform: translateY(0); }
    #info-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    #info-card .card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      line-height: 1.4;
    }
    #info-card .card-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px;
      line-height: 1;
    }
    #info-card .card-lead {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    #info-card .card-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    #info-card .card-meta span { font-size: 13px; color: var(--text-sub); }
    #info-card .card-meta strong { color: var(--text); }
    #info-card .card-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
    }
    #info-card .btn-purchase {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #info-card .btn-purchase:hover { background: var(--accent-lt); }
    #info-card .btn-purchase.disabled {
      background: #e0dbd2;
      color: var(--text-sub);
      cursor: default;
      pointer-events: none;
    }

    /* ===== 接客カード ===== */
    #staff-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--border);
      padding: 16px 20px 20px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 151;
      box-shadow: 0 -4px 32px rgba(201,169,106,0.10);
      max-height: 46vh;
      overflow-y: auto;
    }
    #staff-card.visible { transform: translateY(0); }
    #staff-card .sc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    #staff-card .sc-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    #staff-card .sc-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2px solid var(--accent);
      background: #f0ede6;
      flex-shrink: 0;
    }
    #staff-card .sc-names { display: flex; flex-direction: column; gap: 2px; }
    #staff-card .sc-name { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3; }
    #staff-card .sc-role { font-size: 12px; color: var(--text-sub); }
    #staff-card .sc-close {
      background: none; border: none;
      font-size: 22px; cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px; line-height: 1;
    }
    #staff-card .sc-line {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: var(--card-bg2);
      border-radius: 12px;
      border-left: 3px solid var(--accent);
    }
    #staff-card .sc-line::before { content: '\300C'; }
    #staff-card .sc-line::after  { content: '\300D'; }
    #staff-card .btn-staff {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #staff-card .btn-staff:hover { background: var(--accent-lt); }
    #staff-card .btn-room {
      display: block;
      width: 100%;
      padding: 11px;
      margin-top: 8px;
      background: transparent;
      color: var(--accent);
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1.5px solid var(--accent);
      transition: background 0.2s, color 0.2s;
    }
    #staff-card .btn-room:hover { background: rgba(201,169,106,0.10); }

    /* ===== チャットUI ===== */
    #chat-area {
      margin-top: 14px;
      border-top: 1px solid rgba(201,169,106,0.20);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #chat-area.chat-closed {
      opacity: 0.5;
      pointer-events: none;
    }
    #chat-messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 110px;
      overflow-y: auto;
      padding: 4px 2px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 88%;
    }
    .chat-msg.user { align-self: flex-end; align-items: flex-end; }
    .chat-msg.staff { align-self: flex-start; align-items: flex-start; }
    .chat-bubble {
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
    }
    .chat-msg.user .chat-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.staff .chat-bubble {
      background: var(--card-bg2);
      color: var(--text);
      border-bottom-left-radius: 4px;
      border-left: 2px solid var(--accent);
    }
    .chat-bubble.fallback-notice {
      font-size: 11px;
      color: var(--text-sub);
      background: #f5f0e8;
      border-left: 2px solid var(--accent);
    }
    .chat-typing {
      align-self: flex-start;
      background: var(--card-bg2);
      padding: 8px 14px;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      font-size: 16px;
      letter-spacing: 4px;
      color: var(--text-sub);
      border-left: 2px solid var(--accent);
    }
    #chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid rgba(201,169,106,0.35);
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 80px;
      overflow-y: auto;
      transition: border-color 0.2s;
      background: var(--card-bg2);
      color: var(--text);
    }
    #chat-input:focus { border-color: var(--accent); }
    #chat-send {
      flex-shrink: 0;
      width: 40px; height: 40px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      line-height: 1;
    }
    #chat-send:hover { background: var(--accent-lt); }
    #chat-send:disabled { background: #d8d0c4; cursor: default; }
    .chat-limit-msg {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      padding: 6px 0;
      font-style: italic;
    }
    @media (max-height: 500px) {
      #staff-card { max-height: 90vh; }
      #chat-messages { max-height: 100px; }
    }

    /* ===== フォールバック（白×ゴールド 明るい配色） ===== */
    #fallback {
      display: none;
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: 24px 16px 40px;
      background: var(--bg);
    }
    #fallback h2 {
      font-size: 14px; color: var(--text-sub);
      margin-bottom: 20px; text-align: center;
    }
    .fallback-section-title {
      font-size: 12px; color: var(--accent);
      margin: 24px 0 12px; text-align: center;
      font-weight: 600; letter-spacing: 0.1em;
      grid-column: 1 / -1;
    }
    .fallback-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .fallback-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .fallback-card img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover; background: #ede8e0;
    }
    .fallback-card .fc-body { padding: 12px; }
    .fallback-card .fc-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .fallback-card .fc-price { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    .fallback-card a {
      display: block; text-align: center;
      padding: 8px; background: var(--accent);
      color: #fff; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: 700;
    }
    .fallback-card a.disabled { background: #e0dbd2; color: var(--text-sub); pointer-events: none; }
    .fallback-staff-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .fallback-staff-card img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; object-position: top; background: #ede8e0;
    }
    .fallback-staff-card .fc-body { padding: 10px 12px 12px; }
    .fallback-staff-card .fc-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 2px; }
    .fallback-staff-card .fc-role { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }
    .fallback-staff-card a {
      display: block; text-align: center; padding: 8px;
      background: var(--accent); color: #fff; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: 700;
    }
    .fallback-link-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      padding: 14px;
    }
    .fallback-link-card .fc-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .fallback-link-card .fc-lead { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; line-height: 1.5; }
    .fallback-link-card a {
      display: block; text-align: center; padding: 8px;
      background: var(--accent); color: #fff; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: 700;
    }

    @media (max-width: 480px) {
      #info-card { padding: 20px 16px 28px; }
      #info-card .card-name { font-size: 15px; }
      #staff-card { padding: 16px 16px 20px; }
      #staff-card .sc-name { font-size: 15px; }
    }

    /* デスクトップ: 右下の小さめパネルにして3D空間を覆わない */
    @media (min-width: 700px) {
      #staff-card, #info-card {
        left: auto;
        right: 20px;
        bottom: 20px;
        max-width: 380px;
        border-radius: 18px;
        border: 1px solid var(--border);
        max-height: 72vh;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header id="header">
    <a class="back" href="../index.html">&#8592; トップ</a>
    <span class="title">N's factory SHOWROOM</span>
    <span style="width:60px"></span>
  </header>

  <!-- ハンバーガーボタン（スマホ） -->
  <button id="menu-toggle" aria-label="ゾーンメニュー">&#9776;</button>

  <!-- ゾーンメニュー -->
  <nav id="room-menu">
    <div class="menu-title">ZONES</div>
    <button data-room="hall"       class="active">中央ホール</button>
    <button data-room="techo"             >手帳の間</button>
    <button data-room="katakamuna"        >カタカムナの間</button>
    <button data-room="koubou"            >工房の間</button>
    <button data-room="gallery"           >幕僚ギャラリー</button>
  </nav>

  <!-- 現在ゾーン -->
  <div id="room-indicator">中央ホール</div>

  <!-- ホールへ戻るボタン -->
  <button id="btn-back-hall">&#8592; ホールへ戻る</button>

  <!-- 操作ガイド -->
  <div id="guide-overlay">
    <div class="guide-box">
      <h2>N's factory SHOWROOM</h2>
      <p class="guide-sub">GLASS PAVILION — 全幕僚を一望</p>
      <ul>
        <li>ドラッグ / スワイプで見回す</li>
        <li>ホイール / ピンチでズーム</li>
        <li>ショーケース・幕僚をタップで詳細表示</li>
      </ul>
      <p class="tap-hint">画面をタップして入場</p>
    </div>
  </div>

  <!-- 3Dキャンバス -->
  <div id="canvas-container"></div>

  <!-- 商品情報カード -->
  <div id="info-card">
    <div class="card-header">
      <p class="card-name" id="card-name"></p>
      <button class="card-close" id="card-close">&#x2715;</button>
    </div>
    <p class="card-lead" id="card-lead"></p>
    <div class="card-meta">
      <span><strong>素材</strong>: <span id="card-material"></span></span>
    </div>
    <p class="card-price" id="card-price"></p>
    <a class="btn-purchase" id="card-btn" href="#" target="_blank" rel="noopener">購入ページへ</a>
  </div>

  <!-- 接客カード -->
  <div id="staff-card">
    <div class="sc-header">
      <div class="sc-title">
        <img class="sc-avatar" id="sc-avatar" src="" alt="">
        <div class="sc-names">
          <p class="sc-name" id="sc-name"></p>
          <p class="sc-role" id="sc-role"></p>
        </div>
      </div>
      <button class="sc-close" id="sc-close">&#x2715;</button>
    </div>
    <p class="sc-line" id="sc-line"></p>
    <a class="btn-staff" id="sc-btn" href="#" target="_blank" rel="noopener"></a>
    <a class="btn-room" id="sc-room-btn" href="#" style="display:none;"></a>

    <!-- チャットUI -->
    <div id="chat-area">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <textarea id="chat-input" rows="1" placeholder="メッセージを入力..." maxlength="200"></textarea>
        <button id="chat-send" aria-label="送信">&#x27A4;</button>
      </div>
    </div>
  </div>

  <!-- フォールバック -->
  <div id="fallback">
    <h2>3D表示に対応していない環境のため、通常表示しています。</h2>
    <div class="fallback-grid" id="fallback-grid"></div>
  </div>

  <!-- ===== チャット機能（非モジュール・WebGLフォールバック時も動作） ===== -->
  <script>
    var chatHistories = {};
    var chatTurnCount = {};
    var CHAT_MAX_TURNS = 10;
    var CHAT_HISTORY_MAX = 8;
    var currentChatStaffId = null;
    var isChatSending = false;

    function getFallbackLines(staffId) {
      var staff = (window.SHOWROOM_STAFF || []).find(function(s){ return s.id === staffId; });
      return (staff && staff.lines) ? staff.lines : ['少々お待ちください。'];
    }

    function initChat(staffId) {
      currentChatStaffId = staffId;
      isChatSending = false;
      var area = document.getElementById('chat-area');
      if (!area) return;
      area.classList.remove('chat-closed');
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-input').value = '';
      var sendBtn = document.getElementById('chat-send');
      if (sendBtn) sendBtn.disabled = false;
      var turns = chatTurnCount[staffId] || 0;
      if (turns >= CHAT_MAX_TURNS) { showChatLimit(); }
    }

    function appendStaffMsg(text, isFallback) {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-msg staff';
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble' + (isFallback ? ' fallback-notice' : '');
      bubble.textContent = text + (isFallback ? '\n（AIスタッフは席を外しています）' : '');
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function appendUserMsg(text) {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-msg user';
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.textContent = text;
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function showTyping() {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.id = 'typing-indicator';
      div.className = 'chat-typing';
      div.textContent = '…';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function hideTyping() {
      var el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function showChatLimit() {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-limit-msg';
      div.textContent = 'ありがとうございます。続きはぜひ実物でお会いしましょう。';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      var area = document.getElementById('chat-area');
      if (area) area.classList.add('chat-closed');
    }

    function sendChat() {
      if (isChatSending) return;
      var input = document.getElementById('chat-input');
      var sendBtn = document.getElementById('chat-send');
      var text = input ? input.value.trim() : '';
      if (!text || !currentChatStaffId) return;
      if (text.length > 200) return;

      var staffId = currentChatStaffId;
      var turns = chatTurnCount[staffId] || 0;
      if (turns >= CHAT_MAX_TURNS) { showChatLimit(); return; }

      isChatSending = true;
      if (sendBtn) sendBtn.disabled = true;
      if (input) input.value = '';

      appendUserMsg(text);
      if (!chatHistories[staffId]) chatHistories[staffId] = [];
      chatHistories[staffId].push({ role: 'user', text: text });

      showTyping();

      var apiUrl = (window.SHOWROOM_CONFIG && window.SHOWROOM_CONFIG.chatApi) || '';
      var historySlice = chatHistories[staffId].slice(-CHAT_HISTORY_MAX - 1, -1);

      if (apiUrl) {
        var payload = JSON.stringify({ staffId: staffId, message: text, history: historySlice });
        fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: payload })
          .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
          .then(function(data) {
            hideTyping();
            var reply, isFallback;
            if (data.fallback || !data.reply) {
              var lines = getFallbackLines(staffId);
              reply = lines[Math.floor(Math.random() * lines.length)]; isFallback = true;
            } else { reply = data.reply; isFallback = false; }
            appendStaffMsg(reply, isFallback);
            chatHistories[staffId].push({ role: 'model', text: reply });
            chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
            if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) showChatLimit();
            isChatSending = false;
            var area = document.getElementById('chat-area');
            if (area && !area.classList.contains('chat-closed')) {
              if (sendBtn) sendBtn.disabled = false;
              if (input) input.focus();
            }
          }).catch(function() {
            hideTyping();
            var lines = getFallbackLines(staffId);
            var reply = lines[Math.floor(Math.random() * lines.length)];
            appendStaffMsg(reply, true);
            chatHistories[staffId].push({ role: 'model', text: reply });
            chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
            if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) showChatLimit();
            isChatSending = false;
            if (sendBtn) sendBtn.disabled = false;
          });
      } else {
        hideTyping();
        var lines = getFallbackLines(staffId);
        var reply = lines[Math.floor(Math.random() * lines.length)];
        appendStaffMsg(reply, true);
        chatHistories[staffId].push({ role: 'model', text: reply });
        chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
        if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) showChatLimit();
        isChatSending = false;
        if (sendBtn) sendBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var sendBtn = document.getElementById('chat-send');
      if (sendBtn) sendBtn.addEventListener('click', sendChat);
      var chatInput = document.getElementById('chat-input');
      if (chatInput) {
        chatInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
        });
      }
    });
  </script>

    function isWebGLAvailable() {

    // ============================================================

    const C_FLOOR_IVORY  = 0xf2efe9;   // アイボリーホワイト床

    const CAM_ZONE = { yOff: 2.2, zOff: 7.0 };                   // ゾーンフォーカス時

    // ============================================================
    // Three.js 初期化
    // ============================================================
    let renderer, scene, camera, controls;
    let raycaster, mouse;

    try {

      renderer.shadowMap.enabled = false;

      // ---- 背景: 淡い空グラデーション ----

        ctx.strokeStyle = '#3a3530';
        ctx.lineWidth   = 6;
        ctx.strokeRect(BORDER_OUTER, BORDER_OUTER, CW - BORDER_OUTER*2, CH - BORDER_OUTER*2);
        ctx.lineWidth = 3;
        ctx.strokeRect(BORDER_INNER, BORDER_INNER, CW - BORDER_INNER*2, CH - BORDER_INNER*2);

      // 天井に大判発光パネル（4×3の格子）

      const pillarPositions = [
        // コーナー4本
        [-PAV_W/2,  PAV_D/2], [ PAV_W/2,  PAV_D/2],
        [-PAV_W/2, -PAV_D/2], [ PAV_W/2, -PAV_D/2],
        // 南北壁中間
        [-PAV_W/4,  PAV_D/2], [0,  PAV_D/2], [ PAV_W/4,  PAV_D/2],
        [-PAV_W/4, -PAV_D/2], [0, -PAV_D/2], [ PAV_W/4, -PAV_D/2],
        // 東西壁中間
        [ PAV_W/2, -PAV_D/4], [ PAV_W/2, PAV_D/4],
        [-PAV_W/2, -PAV_D/4], [-PAV_W/2, PAV_D/4]
      ];

      // ============================================================
      // 床インレイライン・ゾーンサイン: 削除済み（改修1）
      // SHOWROOM_API互換のため doorMeshes 配列は空のまま維持
      // ============================================================

      // ============================================================
      // ヘルパー: テキスト折り返し
      // ============================================================
      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split('');
        let line = '', curY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n];
          if (ctx.measureText(testLine).width > maxWidth && line !== '') {
            ctx.fillText(line, x, curY);
            line = words[n]; curY += lineHeight;
          } else { line = testLine; }
        }
        ctx.fillText(line, x, curY);
      }

      // ============================================================
      // ヘルパー: ゴールド枠（額縁）
      // ============================================================
      function addGoldFrame(pos, w, h) {
        const ft = 0.04, fd = 0.04;
        const fw = w + ft*2, fh = h + ft*2;
        const ry = pos.ry || 0;
        const c = Math.cos(ry), s = Math.sin(ry);
        [
          [new THREE.BoxGeometry(fw, ft, fd), [0,  fh/2 - ft/2, 0]],
          [new THREE.BoxGeometry(fw, ft, fd), [0, -fh/2 + ft/2, 0]],
          [new THREE.BoxGeometry(ft, fh, fd), [-fw/2 + ft/2, 0, 0]],
          [new THREE.BoxGeometry(ft, fh, fd), [ fw/2 - ft/2, 0, 0]]
        ].forEach(([geo,[ox,oy,oz]]) => {
          const b = new THREE.Mesh(geo, goldFrameMat);
          // パネルのY回転に合わせてローカルオフセット(ox, oz)を回転してから加算
          const wx = ox * c + (oz + 0.02) * s;
          const wz = -ox * s + (oz + 0.02) * c;
          b.position.set(pos.x + wx, pos.y + oy, pos.z + wz);
          b.rotation.y = ry;
          scene.add(b);
        });
      }

      // ============================================================
      // ヘルパー: リンクパネルテクスチャ生成（白ガラス調）
      // ============================================================
      function makeLinkTex(link) {
        const lc = document.createElement('canvas');
        lc.width = 512; lc.height = 256;
        const ctx = lc.getContext('2d');
        ctx.fillStyle = 'rgba(250,247,242,0.95)';
        ctx.fillRect(0, 0, 512, 256);
        ctx.strokeStyle = 'rgba(201,169,106,0.75)';
        ctx.lineWidth = 4;
        ctx.strokeRect(6, 6, 500, 244);
        ctx.fillStyle = '#c9a96a';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(link.name, 256, 62);
        ctx.fillStyle = 'rgba(60,45,30,0.75)';
        ctx.font = '17px sans-serif';
        wrapText(ctx, link.lead, 256, 108, 460, 26);
        ctx.fillStyle = 'rgba(201,169,106,0.92)';
        ctx.roundRect ? ctx.roundRect(120, 188, 272, 42, 8) : ctx.fillRect(120, 188, 272, 42);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 19px sans-serif';
        ctx.fillText(link.btnLabel, 256, 215);
        const t = new THREE.CanvasTexture(lc);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      // ============================================================
      // ショーケース（台座=明るい木目調・ガラス+ゴールドエッジ維持）
      // ============================================================
      const SC_W = 1.0, SC_D = 0.85, SC_BASE_H = 0.55, SC_GLASS_H = 0.9;

      // ショーケース配置（ワールド座標）
      const SHOWCASE_WORLD_POS = {

      function buildShowcase(worldX, worldZ, item) {
        const group = new THREE.Group();
        group.position.set(worldX, 0, worldZ);

        // 台座（明るい木目調アイボリー）
        const base = new THREE.Mesh(new THREE.BoxGeometry(SC_W, SC_BASE_H, SC_D), pedestalMat);
        base.position.y = SC_BASE_H / 2;
        group.add(base);

        // 台座上ゴールドエッジライン（4辺）
        const edgeY = SC_BASE_H + 0.008;
        const hw = SC_W/2, hd = SC_D/2;
        [
          { gx: SC_W + 0.01, gz: 0.025, px: 0,   pz:  hd },
          { gx: SC_W + 0.01, gz: 0.025, px: 0,   pz: -hd },
          { gx: 0.025, gz: SC_D + 0.01, px:  hw, pz:  0  },
          { gx: 0.025, gz: SC_D + 0.01, px: -hw, pz:  0  }
        ].forEach(e => {
          const em = new THREE.Mesh(new THREE.BoxGeometry(e.gx, 0.015, e.gz), inlayMat);
          em.position.set(e.px, edgeY, e.pz);
          group.add(em);
        });

        // ガラス4側面
        const glassY = SC_BASE_H + SC_GLASS_H / 2;
        const glassGeos = [
          { geo: new THREE.PlaneGeometry(SC_W, SC_GLASS_H), pos: [0, glassY,  hd + 0.005], ry: Math.PI },
          { geo: new THREE.PlaneGeometry(SC_W, SC_GLASS_H), pos: [0, glassY, -hd - 0.005], ry: 0       },
          { geo: new THREE.PlaneGeometry(SC_D, SC_GLASS_H), pos: [ hw + 0.005, glassY, 0], ry: -Math.PI/2 },
          { geo: new THREE.PlaneGeometry(SC_D, SC_GLASS_H), pos: [-hw - 0.005, glassY, 0], ry:  Math.PI/2 }
        ];
        glassGeos.forEach(g => {
          const gm = new THREE.Mesh(g.geo, scGlassMat);
          gm.position.set(...g.pos);
          gm.rotation.y = g.ry;
          group.add(gm);
        });

        // 天板ガラス
        const topGlass = new THREE.Mesh(new THREE.PlaneGeometry(SC_W, SC_D), scGlassMat);
        topGlass.rotation.x = -Math.PI / 2;
        topGlass.position.y = SC_BASE_H + SC_GLASS_H + 0.005;
        group.add(topGlass);

        // ガラス枠ゴールド縦柱（4本）
        const pillarH = SC_GLASS_H + 0.02;
        [[ hw, hd], [-hw, hd], [ hw,-hd], [-hw,-hd]].forEach(([px,pz]) => {
          const p = new THREE.Mesh(new THREE.BoxGeometry(0.025, pillarH, 0.025), goldFrameMat);
          p.position.set(px, SC_BASE_H + pillarH/2, pz);
          group.add(p);
        });

        // 商品プレート（回転）
        const plateMat = new THREE.MeshStandardMaterial({ color: 0x8a6640, roughness: 0.55 });
        loader.load(item.image, tex => {
          tex.colorSpace = THREE.SRGBColorSpace;
          plateMat.map = tex; plateMat.color.set(0xffffff); plateMat.needsUpdate = true;
        }, undefined, () => {});

        const plateW = SC_W * 0.72, plateH = plateW * 0.72;
        const plateMesh = new THREE.Mesh(new THREE.PlaneGeometry(plateW, plateH), plateMat);
        plateMesh.position.y = SC_BASE_H + SC_GLASS_H * 0.45;
        plateMesh.userData.item = item;
        group.add(plateMesh);
        group.userData.item = item;
        scene.add(group);

        panels.push({ mesh: plateMesh, item });
        group.children.forEach(child => {
          if (child.material === scGlassMat) panels.push({ mesh: child, item });
        });
        showcasePlates.push({ mesh: plateMesh });
        return group;
      }

      // ショーケース設置
      const roomsData = window.SHOWROOM_ROOMS || [];
      Object.entries(SHOWCASE_WORLD_POS).forEach(([roomId, positions]) => {
        const room = roomsData.find(r => r.id === roomId);
        if (!room) return;
        const items = room.items || [];
        positions.forEach((pos, i) => {
          const item = items[i] || null;
          if (!item) return;
          buildShowcase(pos.x, pos.z, item);
        });
      });

      // ============================================================
      // リンクパネル（各ゾーン・自立ガラスパーティション風）

      // ゾーンごとのリンクパネル配置（自立サイン: 背中合わせ配置）
      const LINK_PANEL_ZONES = {

      roomsData.forEach(room => {

          panels.push({ mesh: lMesh, item: { ...link, isLink: true } });
          addGoldFrame({ x: lpos.x, y: lpos.y, z: lpos.z, ry: lpos.ry }, 1.6, 0.8);
        });
      });

      // ============================================================

      // ============================================================
      // 幕僚肖像画: 4壁面に大判均等配置
      // ============================================================
      (function buildGalleryPortraits() {
        const PW = 1.7, PH = 2.1;
        // 壁面内側オフセット（ガラスカーテンウォールと重ならないよう0.06下げる）
        const WALL_OFF = 0.06;
        // 北壁 z=-12, 壁面はz=-PAV_D/2=-12, 肖像画はやや内側
        // 南壁 z=+12, 東壁 x=+16, 西壁 x=-16
        // 柱位置（南北: x=-8,0,+8 / 東西: z=-6,+6）を避けて間隔を取る
        // 北壁3枚（中間柱x=0の間）: x=-8, 0, +8 → 柱と同位置だが横間隔2.5以上確保
        // 実際には柱はx方向で同じでも肖像画は前面配置なので干渉しない
        const portraitPositions = [
          // ===== 北壁（z=-12付近, ry=0: 南向き） 3枚 =====
          // x=-8, 0, +8 に等間隔（柱間のスパン8単位の中央）
          { x: -8.0, y: 3.0, z: -(PAV_D/2 - WALL_OFF), ry: 0 },
          { x:  0.0, y: 3.0, z: -(PAV_D/2 - WALL_OFF), ry: 0 },
          { x:  8.0, y: 3.0, z: -(PAV_D/2 - WALL_OFF), ry: 0 },
          // ===== 南壁（z=+12付近, ry=π: 北向き） 3枚 =====
          { x: -8.0, y: 3.0, z:  (PAV_D/2 - WALL_OFF), ry: Math.PI },
          { x:  0.0, y: 3.0, z:  (PAV_D/2 - WALL_OFF), ry: Math.PI },
          { x:  8.0, y: 3.0, z:  (PAV_D/2 - WALL_OFF), ry: Math.PI },
          // ===== 東壁（x=+16付近, ry=-π/2: 西向き） 2枚 =====
          // 東西壁中間柱 z=-6, +6 を避けて z=-4, +4 に配置
          { x:  (PAV_W/2 - WALL_OFF), y: 3.0, z: -4.0, ry: -Math.PI/2 },
          { x:  (PAV_W/2 - WALL_OFF), y: 3.0, z:  4.0, ry: -Math.PI/2 },
          // ===== 西壁（x=-16付近, ry=+π/2: 東向き） 2枚 =====
          { x: -(PAV_W/2 - WALL_OFF), y: 3.0, z: -4.0, ry: Math.PI/2 },
          { x: -(PAV_W/2 - WALL_OFF), y: 3.0, z:  4.0, ry: Math.PI/2 }
        ];

        // 幕僚を壁面順に並べる
        // 北壁: kojinjigyonusi, sakusen, hannbai
        // 南壁: kanri, jinji, kouhou_room
        // 東壁: kyouiku, kouhou
        // 西壁: digital, hozen
        const PORTRAIT_ORDER = [
          'kojinjigyonusi', 'sakusen', 'hannbai',
          'kanri', 'jinji', 'kouhou_room',
          'kyouiku', 'kouhou',
          'digital', 'hozen'
        ];
        const allStaff = window.SHOWROOM_STAFF || [];

        PORTRAIT_ORDER.forEach((staffId, idx) => {
          if (idx >= portraitPositions.length) return;
          const staff = allStaff.find(s => s.id === staffId);
          if (!staff) return;
          const pos = portraitPositions[idx];
          const pMat = new THREE.MeshStandardMaterial({ color: 0xede0cb, roughness: 0.6 });
          loader.load(staff.image, tex => {
            tex.colorSpace = THREE.SRGBColorSpace;
            pMat.map = tex; pMat.color.set(0xffffff); pMat.needsUpdate = true;
          }, undefined, () => {});
          const pMesh = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), pMat);
          pMesh.position.set(pos.x, pos.y, pos.z);
          pMesh.rotation.y = pos.ry;
          pMesh.userData.portraitStaffId = staff.id;
          scene.add(pMesh);
          panels.push({ mesh: pMesh, item: { isPortrait: true, staffId: staff.id } });
          addGoldFrame(pos, PW, PH);

          // キャプションプレート（白地×ゴールド文字）
          const cc = document.createElement('canvas');
          cc.width = 512; cc.height = 48;
          const cctx = cc.getContext('2d');
          cctx.fillStyle = 'rgba(250,247,242,0.95)'; cctx.fillRect(0,0,512,48);
          cctx.fillStyle = '#c9a96a'; cctx.font = 'bold 18px sans-serif';
          cctx.textAlign = 'center'; cctx.textBaseline = 'middle';
          cctx.fillText(staff.name + '  ' + staff.role, 256, 24);
          const ctex = new THREE.CanvasTexture(cc); ctex.colorSpace = THREE.SRGBColorSpace;
          const capMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(PW + 0.1, 0.16),
            new THREE.MeshBasicMaterial({ map: ctex, transparent: true, depthWrite: false })
          );
          const c2 = Math.cos(pos.ry), s2 = Math.sin(pos.ry);
          const capOffZ = 0.02;
          capMesh.position.set(
            pos.x + capOffZ * s2,
            pos.y - PH/2 - 0.12,
            pos.z + capOffZ * c2
          );
          capMesh.rotation.y = pos.ry;
          scene.add(capMesh);
        });
      })();

      // ============================================================
      // 幕僚 StaffActor（立て看板アクター）
      // ============================================================
      class StaffActor {
        constructor(staff) {
          this.staff   = staff;
          this.roomId  = staff.room;
          // staffData.js は既にワールド座標なのでオフセット加算不要
          this.waypoints = (staff.waypoints || [[0,0]]).map(([wx, wz]) => ({ x: wx, z: wz }));
          this.wpIdx    = 0;
          this.waitTime = 0;
          this.speed    = 0.35 + Math.random() * 0.15;
          this.paused   = false;
          this.isGlbLoaded = false;
          this._glbLoadStarted = false;
          this._lastMoveAngle = 0;
          this.visual = this._buildVisual(staff);
        }

        triggerGlbLoad() {
          if (!this.staff.model || this._glbLoadStarted) return;
          this._glbLoadStarted = true;
          this._loadGlbModel(this.staff);
        }

        _buildVisual(staff) {
          const group = new THREE.Group();
          const spriteH = 1.4;
          const spriteMat = new THREE.MeshBasicMaterial({
            color: 0xFFFFFF, transparent: true, alphaTest: 0.05,
            side: THREE.DoubleSide, depthWrite: false
          });
          const mascotPath = `assets/mascot/${staff.id}.png`;
          loader.load(mascotPath, tex => {
            tex.colorSpace = THREE.SRGBColorSpace;
            spriteMat.map = tex; spriteMat.needsUpdate = true;
          }, undefined, () => {
            loader.load(staff.image, tex2 => {
              tex2.colorSpace = THREE.SRGBColorSpace;
              spriteMat.map = tex2; spriteMat.needsUpdate = true;
            }, undefined, () => {});
          });

          const pMesh = new THREE.Mesh(new THREE.PlaneGeometry(spriteH, spriteH), spriteMat);
          pMesh.position.set(0, spriteH/2, 0);
          pMesh.userData.staffActor = this;
          group.add(pMesh);
          this.panelMesh = pMesh;

          // 足元影（薄め・明るい床に合わせて）
          const shadowMat = new THREE.MeshBasicMaterial({ color: 0x4a3a2a, transparent: true, opacity: 0.10, depthWrite: false });
          const shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(0.28, 24), shadowMat);
          shadowMesh.rotation.x = -Math.PI/2; shadowMesh.position.set(0, 0.01, 0);
          group.add(shadowMesh);
          this._shadowMesh = shadowMesh;

          // 名前プレート（白地×ゴールド）
          const nc = document.createElement('canvas');
          nc.width = 256; nc.height = 48;
          const nctx = nc.getContext('2d');
          nctx.clearRect(0,0,256,48);
          nctx.fillStyle = 'rgba(250,247,242,0.92)';
          const rx2 = 8;
          nctx.beginPath();
          nctx.moveTo(rx2,0); nctx.lineTo(256-rx2,0); nctx.quadraticCurveTo(256,0,256,rx2);
          nctx.lineTo(256,48-rx2); nctx.quadraticCurveTo(256,48,256-rx2,48);
          nctx.lineTo(rx2,48); nctx.quadraticCurveTo(0,48,0,48-rx2);
          nctx.lineTo(0,rx2); nctx.quadraticCurveTo(0,0,rx2,0);
          nctx.closePath(); nctx.fill();
          nctx.strokeStyle = 'rgba(201,169,106,0.60)';
          nctx.lineWidth = 1.5;
          nctx.stroke();
          nctx.fillStyle = '#c9a96a'; nctx.font = 'bold 18px sans-serif';
          nctx.textAlign = 'center'; nctx.textBaseline = 'middle';
          nctx.fillText(staff.name, 128, 16);
          nctx.fillStyle = 'rgba(60,45,30,0.65)'; nctx.font = '13px sans-serif';
          nctx.fillText(staff.role, 128, 33);
          const ntex = new THREE.CanvasTexture(nc); ntex.colorSpace = THREE.SRGBColorSpace;
          const nMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(0.85, 0.16),
            new THREE.MeshBasicMaterial({ map: ntex, transparent: true, depthWrite: false })
          );
          nMesh.position.set(0, spriteH + 0.12, 0);
          group.add(nMesh);
          this.nameMesh = nMesh;

          const wp0 = this.waypoints[0];
          group.position.set(wp0.x, 0, wp0.z);
          scene.add(group);
          return group;
        }

        _loadGlbModel(staff) {
          const TARGET_HEIGHT = 1.4;
          gltfLoader.load(staff.model, (gltf) => {
            try {
              const modelScene = gltf.scene;
              const box = new THREE.Box3().setFromObject(modelScene);
              const size = new THREE.Vector3(); box.getSize(size);
              if (size.y > 0) modelScene.scale.setScalar(TARGET_HEIGHT / size.y);
              const box2 = new THREE.Box3().setFromObject(modelScene);
              modelScene.position.y = -box2.min.y;
              modelScene.traverse(child => {
                if (child.isMesh) {
                  child.castShadow = false;
                  child.userData.staffActor = this;
                }
              });
              this.panelMesh.visible = false;
              this.nameMesh.position.set(0, TARGET_HEIGHT + 0.12, 0);
              this.visual.add(modelScene);
              this._glbScene = modelScene;
              modelScene.traverse(child => {
                if (child.isMesh) staffPanels.push({ mesh: child, staffActor: this });
              });
              this.isGlbLoaded = true;
              this.visual.rotation.y = this._lastMoveAngle;
              // キューから次の1体をロード開始
              triggerNextGlbLoad();
            } catch(e) { console.warn('[GLB] 組み込みエラー:', e); triggerNextGlbLoad(); }
          }, undefined, (err) => { console.warn('[GLB] ロード失敗:', err); triggerNextGlbLoad(); });
        }

        update(dt) {
          if (this.paused) return;
          if (this.waitTime > 0) {
            this.waitTime -= dt;
            this.visual.position.y = Math.sin(Date.now() * 0.002) * 0.015;
            return;
          }
          const target = this.waypoints[this.wpIdx];
          const curX = this.visual.position.x, curZ = this.visual.position.z;
          const dx = target.x - curX, dz = target.z - curZ;
          const dist = Math.sqrt(dx*dx + dz*dz);
          if (dist < 0.05) {
            this.visual.position.x = target.x;
            this.visual.position.z = target.z;
            this.wpIdx = (this.wpIdx + 1) % this.waypoints.length;
            this.waitTime = 2 + Math.random() * 3;
          } else {
            const step = Math.min(this.speed * dt, dist);
            this.visual.position.x += (dx/dist) * step;
            this.visual.position.z += (dz/dist) * step;
            const targetAngle = Math.atan2(dx, dz);
            this._lastMoveAngle = targetAngle;
            const curAngle = this.visual.rotation.y;
            let dAngle = targetAngle - curAngle;
            while (dAngle >  Math.PI) dAngle -= Math.PI*2;
            while (dAngle < -Math.PI) dAngle += Math.PI*2;
            this.visual.rotation.y += dAngle * Math.min(dt*4, 1);
            this.visual.position.y = Math.sin(Date.now() * 0.005) * 0.03;
          }
          if (!this.isGlbLoaded) {
            const camDir = new THREE.Vector3();
            camDir.subVectors(camera.position, this.visual.position);
            camDir.y = 0;
            if (camDir.lengthSq() > 0.001) this.visual.rotation.y = Math.atan2(camDir.x, camDir.z);
          }
        }

        pauseFor() { this.paused = true; }
        resume()   { this.paused = false; }
      }

      // ============================================================
      // GLB 順次ロード（キュー方式: 1体完了 → 次の1体）
      // ============================================================
      let glbQueue = [];      // ロード待ちの staffActor
      let glbLoading = false; // ロード中フラグ

      function enqueueGlb(actor) {
        if (!actor.staff.model) return;
        glbQueue.push(actor);
      }

      function triggerNextGlbLoad() {
        glbLoading = false;
        if (glbQueue.length === 0) return;
        const next = glbQueue.shift();
        if (next._glbLoadStarted) { triggerNextGlbLoad(); return; } // スキップ
        glbLoading = true;
        next.triggerGlbLoad();
      }

      // 全10体をキューに追加（ホールの2体を先頭に）
      const staffActors = (window.SHOWROOM_STAFF || []).map(s => new StaffActor(s));
      staffActors.forEach(actor => {
        staffPanels.push({ mesh: actor.panelMesh, staffActor: actor });
      });
      // ホール優先でキューを並べ替え
      const hallActors  = staffActors.filter(a => a.roomId === 'hall');
      const otherActors = staffActors.filter(a => a.roomId !== 'hall');
      [...hallActors, ...otherActors].forEach(a => enqueueGlb(a));
      // キュー起動
      triggerNextGlbLoad();

      // ============================================================
      // カメラ遷移（gotoRoom: SHOWROOM_API互換維持）
      // ============================================================
      function gotoRoom(roomId) {
        if (isTransitioning) return;
        const zone = ZONE_CENTERS[roomId];
        if (!zone) { console.warn('SHOWROOM_API: 不明なroomId:', roomId); return; }
        isTransitioning = true;
        closeAllCards();
        const fromPos    = camera.position.clone();
        const fromTarget = controls.target.clone();

        // ゾーンフォーカス: ゾーン中心をやや引いてカメラを配置
        let toPos, toTarget;
        if (roomId === 'hall') {
          toPos    = new THREE.Vector3(0, 4.5, 14);
          toTarget = new THREE.Vector3(0, 1.5, 0);
        } else {
          // ゾーン中心から手前側（z+方向）にオフセット
          const dz = zone.z >= 0 ? CAM_ZONE.zOff : -CAM_ZONE.zOff;
          const dx = zone.x >= 0 && Math.abs(zone.x) > Math.abs(zone.z) ?  CAM_ZONE.zOff : 0;
          const finalDx = Math.abs(zone.x) > Math.abs(zone.z) ? (zone.x > 0 ? CAM_ZONE.zOff : -CAM_ZONE.zOff) : 0;
          const finalDz = Math.abs(zone.z) >= Math.abs(zone.x) ? (zone.z >= 0 ? CAM_ZONE.zOff : -CAM_ZONE.zOff) : 0;
          toPos    = new THREE.Vector3(zone.x + finalDx, CAM_ZONE.yOff, zone.z + finalDz);
          toTarget = new THREE.Vector3(zone.x, 1.5, zone.z);
        }

        camAnim = {
          fromPos, toPos, fromTarget, toTarget, t: 0, duration: 1.0,
          onDone: () => {
            currentRoomId = roomId; isTransitioning = false;
            updateRoomUI(roomId);
            controls.target.copy(toTarget); controls.update();
          }
        };
      }

      function updateRoomUI(roomId) {
        const roomNames = {
          hall:       '中央ホール',
          techo:      'システム手帳の間',
          katakamuna: 'カタカムナの間',
          koubou:     '工房の間',
          gallery:    '幕僚ギャラリー'
        };
        document.getElementById('room-indicator').textContent = roomNames[roomId] || roomId;
        document.querySelectorAll('#room-menu button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.room === roomId);
        });
        document.getElementById('btn-back-hall').style.display = (roomId === 'hall') ? 'none' : 'block';
        gtag('event', 'room_enter', { room_id: roomId });
      }

      // ============================================================
      // Raycaster & クリック
      // ============================================================
      function getIntersected(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        let cx, cy;
        if (event.touches && event.touches.length > 0) {
          cx = event.touches[0].clientX; cy = event.touches[0].clientY;
        } else if (event.changedTouches && event.changedTouches.length > 0) {
          cx = event.changedTouches[0].clientX; cy = event.changedTouches[0].clientY;
        } else {
          cx = event.clientX; cy = event.clientY;
        }
        mouse.x =  ((cx - rect.left) / rect.width)  * 2 - 1;
        mouse.y = -((cy - rect.top)  / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const meshes = [
          ...panels.map(p => p.mesh),
          ...staffPanels.map(p => p.mesh),
          ...doorMeshes.map(d => d.mesh)
        ];
        return raycaster.intersectObjects(meshes, true);
      }

      renderer.domElement.addEventListener('mousemove', e => {
        const hits = getIntersected(e);
        if (hits.length > 0) {
          const mesh = hits[0].object;
          const sMesh = findStaffPanelMesh(mesh);
          const target = sMesh || mesh;
          if (hoveredMesh !== target) {
            if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.emissiveIntensity !== undefined)
              hoveredMesh.material.emissiveIntensity = 0;
            hoveredMesh = target;
            if (hoveredMesh.material) {
              hoveredMesh.material.emissive && hoveredMesh.material.emissive.set(C_GOLD);
              hoveredMesh.material.emissiveIntensity = 0.20;
            }
            renderer.domElement.style.cursor = 'pointer';
          }
        } else {
          if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.emissiveIntensity !== undefined)
            hoveredMesh.material.emissiveIntensity = 0;
          hoveredMesh = null;
          renderer.domElement.style.cursor = 'grab';
        }
      });

      function findStaffPanelMesh(mesh) {
        const found = staffPanels.find(p => p.mesh === mesh);
        return found ? found.mesh : null;
      }

      function findStaffActorFromMesh(mesh) {
        const direct = staffPanels.find(p => p.mesh === mesh);
        if (direct) return direct.staffActor;
        if (mesh.userData && mesh.userData.staffActor) return mesh.userData.staffActor;
        return null;
      }

      let pointerDownTime = 0;
      renderer.domElement.addEventListener('pointerdown', () => { pointerDownTime = Date.now(); });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Date.now() - pointerDownTime > 200) return;
        handleClick(e);
      });
      let touchStartX, touchStartY;
      renderer.domElement.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', e => {
        const ddx = Math.abs(e.changedTouches[0].clientX - touchStartX);
        const ddy = Math.abs(e.changedTouches[0].clientY - touchStartY);
        if (ddx < 8 && ddy < 8) handleClick(e);
      }, { passive: true });

      function handleClick(e) {
        if (isTransitioning) return;
        const hits = getIntersected(e);
        if (hits.length === 0) return;
        const mesh = hits[0].object;

        const dEntry = doorMeshes.find(d => d.mesh === mesh);
        if (dEntry) { gotoRoom(dEntry.toRoom); return; }

        const pEntry = panels.find(p => p.mesh === mesh);
        if (pEntry) {
          if (pEntry.item.isPortrait) {
            // 肖像画は幕僚室へ直リンク（会話は巡回キャラのみ）
            const sData = (window.SHOWROOM_STAFF || []).find(s => s.id === pEntry.item.staffId);
            if (sData && sData.roomUrl) {
              window.location.href = sData.roomUrl;
            }
          } else if (pEntry.item.isLink) { showLinkCard(pEntry.item); }
          else { showCard(pEntry.item, mesh); }
          return;
        }

        const sActor = findStaffActorFromMesh(mesh);
        if (sActor) { sActor.pauseFor(); showStaffCard(sActor.staff, mesh, sActor); }
      }

      // ============================================================
      // カード表示
      // ============================================================
      let activeStaffActor = null;

      function closeAllCards() { hideCard(); hideStaffCard(); }

      function showCard(item, mesh) {
        document.getElementById('staff-card').classList.remove('visible');
        document.getElementById('card-name').textContent     = item.name;
        document.getElementById('card-lead').textContent     = item.lead || '';
        document.getElementById('card-material').textContent = item.material || '';
        document.getElementById('card-price').textContent    = item.price || '';
        const btn = document.getElementById('card-btn');
        if (item.url && item.url.trim() !== '') {
          btn.href = item.url; btn.textContent = '購入ページへ';
          btn.classList.remove('disabled');
          btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        } else {
          btn.href = '#'; btn.textContent = '準備中';
          btn.classList.add('disabled');
        }
        document.getElementById('info-card').classList.add('visible');
        selectMesh(mesh, C_GOLD);
      }

      function showLinkCard(link) {
        document.getElementById('staff-card').classList.remove('visible');
        document.getElementById('card-name').textContent     = link.name;
        document.getElementById('card-lead').textContent     = link.lead || '';
        document.getElementById('card-material').textContent = '';
        document.getElementById('card-price').textContent    = '';
        const btn = document.getElementById('card-btn');
        btn.href = link.url; btn.textContent = link.btnLabel;
        btn.classList.remove('disabled');
        btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        document.getElementById('info-card').classList.add('visible');
      }

      function hideCard() {
        document.getElementById('info-card').classList.remove('visible');
        deselectMesh();
      }

      function showStaffCard(staff, mesh, actor) {
        hideCard();
        activeStaffActor = actor || null;
        const line = staff.lines[Math.floor(Math.random() * staff.lines.length)];
        document.getElementById('sc-name').textContent = staff.name;
        document.getElementById('sc-role').textContent = staff.role;
        document.getElementById('sc-line').textContent = line;
        const av = document.getElementById('sc-avatar');
        av.onerror = () => { av.onerror = null; av.src = staff.image; };
        av.src = `assets/mascot/${staff.id}.png`; av.alt = staff.name;
        const btn = document.getElementById('sc-btn');
        btn.href = staff.btnUrl; btn.textContent = staff.btnLabel;
        if (staff.btnUrl.startsWith('http')) {
          btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        } else {
          btn.removeAttribute('target'); btn.removeAttribute('rel');
        }
        // 幕僚室リンクボタン
        const roomBtn = document.getElementById('sc-room-btn');
        if (staff.roomUrl && staff.roomLabel) {
          roomBtn.href = staff.roomUrl;
          roomBtn.textContent = staff.roomLabel + ' へ';
          roomBtn.removeAttribute('target'); roomBtn.removeAttribute('rel');
          roomBtn.style.display = 'block';
        } else {
          roomBtn.style.display = 'none';
        }
        document.getElementById('staff-card').classList.add('visible');
        selectMesh(mesh, C_GOLD);
        if (typeof initChat === 'function') initChat(staff.id);
      }

      function hideStaffCard() {
        document.getElementById('staff-card').classList.remove('visible');
        deselectMesh();
        if (activeStaffActor) { activeStaffActor.resume(); activeStaffActor = null; }
      }

      function selectMesh(mesh, color) {
        if (selectedMesh && selectedMesh !== mesh && selectedMesh.material)
          selectedMesh.material.emissiveIntensity = 0;
        selectedMesh = mesh;
        if (mesh && mesh.material) {
          mesh.material.emissive && mesh.material.emissive.set(color);
          mesh.material.emissiveIntensity = 0.30;
        }
      }
      function deselectMesh() {
        if (selectedMesh && selectedMesh.material) selectedMesh.material.emissiveIntensity = 0;
        selectedMesh = null;
      }

      document.getElementById('card-close').addEventListener('click', hideCard);
      document.getElementById('sc-close').addEventListener('click',   hideStaffCard);

      // ============================================================
      // リサイズ
      // ============================================================
      function onResize() {
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w / h; camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', onResize);

      // ============================================================
      // アニメーションループ
      // ============================================================
      function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4-2*t)*t; }
      const PLATE_ROT_SPEED = 0.3;

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // カメラアニメーション
        if (camAnim) {
          camAnim.t += dt / camAnim.duration;
          if (camAnim.t >= 1) {
            camAnim.t = 1;
            camera.position.copy(camAnim.toPos);
            controls.target.copy(camAnim.toTarget);
            controls.update();
            const done = camAnim.onDone;
            camAnim = null;
            done && done();
          } else {
            const e = easeInOut(camAnim.t);
            camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
            controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, e);
            controls.update();
          }
        } else {
          controls.update();
        }

        // ショーケースプレート回転
        showcasePlates.forEach(sp => {
          sp.mesh.rotation.y += PLATE_ROT_SPEED * dt;
        });

        // フクロウブロンズ像 Y軸回転（0.15 rad/s）
        if (owlMonument) {
          owlMonument.rotation.y += 0.15 * dt;
        }

        // 幕僚巡回
        staffActors.forEach(actor => actor.update(dt));

        renderer.render(scene, camera);
      }
      animate();

      // ============================================================
      // SHOWROOM_API（恒久・削除しない）
      // ============================================================
      window.SHOWROOM_API = {
        gotoRoom(id) { gotoRoom(id); },
        getRoom()    { return currentRoomId; },
        staffActors
      };

    } catch(err) {
      console.error('Three.js initialization failed:', err);
      showFallback();
    }

    // ============================================================
    // UI イベント
    // ============================================================
    // ゾーンメニュー・ハンバーガー・ホールへ戻るボタンは非表示のためイベント登録なし
    // SHOWROOM_API.gotoRoom は外部呼び出し互換のため維持
    const overlay = document.getElementById('guide-overlay');
    function dismissOverlay() {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.4s';
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
    }
    overlay.addEventListener('click',    dismissOverlay);
    overlay.addEventListener('touchend', dismissOverlay, { passive: true });

  </script>
</body>
</html>
