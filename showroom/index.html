<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N's factory SHOWROOM | Web 3D ショールーム</title>
  <meta name="description" content="N's factory の革工房をバーチャルで体験。5つの部屋でレザークラフト製品・カタカムナグッズ・工房の世界をご覧いただけます。">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ND1T7H067Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ND1T7H067Y');
  </script>

  <!-- Three.js importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three/addons/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/libs/meshopt_decoder.module.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/meshopt_decoder.module.js"
    }
  }
  </script>

  <!-- データファイル -->
  <script src="data/showroomData.js"></script>
  <script src="data/staffData.js"></script>
  <script src="data/config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1D1D1F;
      --accent: #d4af6a;
      --accent-dark: #A0785A;
      --bg: #111113;
      --card-bg: #1a1a1c;
      --card-bg-light: #232326;
      --text: #e8e8ec;
      --text-sub: #8a8a92;
      --border: rgba(212,175,106,0.28);
      --font: -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }

    /* ===== ヘッダー ===== */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(10,10,12,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    #header a.back {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      opacity: 0.65;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #header a.back:hover { opacity: 1; }
    #header .title {
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    /* ===== 部屋メニュー ===== */
    #room-menu {
      position: fixed;
      top: 52px; right: 0;
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 8px;
      background: rgba(10,10,12,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom-left-radius: 14px;
      min-width: 130px;
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    #room-menu .menu-title {
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0 6px 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    #room-menu button {
      background: none;
      border: none;
      color: rgba(232,232,236,0.72);
      font-size: 12px;
      font-family: var(--font);
      text-align: left;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    #room-menu button:hover,
    #room-menu button.active {
      background: rgba(212,175,106,0.15);
      color: var(--accent);
    }
    /* スマホ: ハンバーガー収納 */
    #menu-toggle {
      display: none;
      position: fixed;
      top: 58px; right: 8px;
      z-index: 120;
      background: rgba(10,10,12,0.9);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 20px;
      width: 38px; height: 38px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    @media (max-width: 540px) {
      #menu-toggle { display: flex; }
      #room-menu {
        transform: translateX(110%);
        transition: transform 0.25s ease;
        top: 52px;
        border-radius: 0 0 0 14px;
      }
      #room-menu.open {
        transform: translateX(0);
      }
    }

    /* ===== 現在部屋インジケーター ===== */
    #room-indicator {
      position: fixed;
      bottom: 72px; left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,12,0.82);
      color: var(--accent);
      font-size: 11px;
      padding: 5px 16px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 110;
      letter-spacing: 0.1em;
      white-space: nowrap;
      border: 1px solid var(--border);
      transition: opacity 0.3s;
    }

    /* ===== 戻るボタン（ホール以外で表示） ===== */
    #btn-back-hall {
      position: fixed;
      bottom: 72px; left: 16px;
      background: rgba(10,10,12,0.88);
      color: var(--accent);
      border: 1px solid var(--border);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 110;
      display: none;
      transition: background 0.2s;
    }
    #btn-back-hall:hover { background: rgba(212,175,106,0.2); }

    /* ===== 3Dキャンバス ===== */
    #canvas-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
    }
    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== 操作ガイドオーバーレイ ===== */
    #guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      cursor: pointer;
    }
    #guide-overlay .guide-box {
      background: rgba(26,26,28,0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 40px;
      text-align: center;
      color: var(--text);
      backdrop-filter: blur(12px);
      max-width: 340px;
    }
    #guide-overlay .guide-box h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    #guide-overlay .guide-box .guide-sub {
      font-size: 11px;
      color: var(--text-sub);
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    #guide-overlay .guide-box .room-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 18px;
    }
    #guide-overlay .guide-box .room-chip {
      background: rgba(212,175,106,0.12);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
    }
    #guide-overlay .guide-box ul {
      list-style: none;
      font-size: 13px;
      line-height: 2;
      opacity: 0.75;
      margin-bottom: 4px;
    }
    #guide-overlay .guide-box .tap-hint {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.45;
    }

    /* ===== 商品情報カード ===== */
    #info-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--border);
      padding: 24px 24px 32px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 150;
      box-shadow: 0 -4px 32px rgba(0,0,0,0.5);
      max-height: 60vh;
      overflow-y: auto;
    }
    #info-card.visible { transform: translateY(0); }
    #info-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    #info-card .card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      line-height: 1.4;
    }
    #info-card .card-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px;
      line-height: 1;
    }
    #info-card .card-lead {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    #info-card .card-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    #info-card .card-meta span { font-size: 13px; color: var(--text-sub); }
    #info-card .card-meta strong { color: var(--text); }
    #info-card .card-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
    }
    #info-card .btn-purchase {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #111;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #info-card .btn-purchase:hover { background: #e0c07a; }
    #info-card .btn-purchase.disabled {
      background: #3a3a3e;
      color: var(--text-sub);
      cursor: default;
      pointer-events: none;
    }

    /* ===== 接客カード ===== */
    #staff-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--border);
      padding: 24px 24px 32px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 151;
      box-shadow: 0 -4px 32px rgba(0,0,0,0.5);
      max-height: 60vh;
      overflow-y: auto;
    }
    #staff-card.visible { transform: translateY(0); }
    #staff-card .sc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    #staff-card .sc-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    #staff-card .sc-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2px solid var(--accent);
      background: #2a2a2e;
      flex-shrink: 0;
    }
    #staff-card .sc-names { display: flex; flex-direction: column; gap: 2px; }
    #staff-card .sc-name { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3; }
    #staff-card .sc-role { font-size: 12px; color: var(--text-sub); }
    #staff-card .sc-close {
      background: none; border: none;
      font-size: 22px; cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px; line-height: 1;
    }
    #staff-card .sc-line {
      font-size: 15px;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 20px;
      padding: 14px 16px;
      background: var(--card-bg-light);
      border-radius: 12px;
      border-left: 3px solid var(--accent);
    }
    #staff-card .sc-line::before { content: '\300C'; }
    #staff-card .sc-line::after  { content: '\300D'; }
    #staff-card .btn-staff {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #111;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #staff-card .btn-staff:hover { background: #e0c07a; }

    /* ===== チャットUI ===== */
    #chat-area {
      margin-top: 14px;
      border-top: 1px solid rgba(212,175,106,0.18);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #chat-area.chat-closed {
      opacity: 0.5;
      pointer-events: none;
    }
    #chat-messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px 2px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 88%;
    }
    .chat-msg.user { align-self: flex-end; align-items: flex-end; }
    .chat-msg.staff { align-self: flex-start; align-items: flex-start; }
    .chat-bubble {
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
    }
    .chat-msg.user .chat-bubble {
      background: var(--accent);
      color: #111;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.staff .chat-bubble {
      background: var(--card-bg-light);
      color: var(--text);
      border-bottom-left-radius: 4px;
      border-left: 2px solid var(--accent);
    }
    .chat-bubble.fallback-notice {
      font-size: 11px;
      color: var(--text-sub);
      background: #2a2010;
      border-left: 2px solid var(--accent);
    }
    .chat-typing {
      align-self: flex-start;
      background: var(--card-bg-light);
      padding: 8px 14px;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      font-size: 16px;
      letter-spacing: 4px;
      color: var(--text-sub);
      border-left: 2px solid var(--accent);
    }
    #chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid rgba(212,175,106,0.28);
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 80px;
      overflow-y: auto;
      transition: border-color 0.2s;
      background: var(--card-bg-light);
      color: var(--text);
    }
    #chat-input:focus { border-color: var(--accent); }
    #chat-send {
      flex-shrink: 0;
      width: 40px; height: 40px;
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      line-height: 1;
    }
    #chat-send:hover { background: #e0c07a; }
    #chat-send:disabled { background: #3a3a3e; cursor: default; }
    .chat-limit-msg {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      padding: 6px 0;
      font-style: italic;
    }
    @media (max-height: 500px) {
      #staff-card { max-height: 90vh; }
      #chat-messages { max-height: 100px; }
    }

    /* ===== フォールバック（ダーク×ゴールド） ===== */
    #fallback {
      display: none;
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: 24px 16px 40px;
      background: var(--bg);
    }
    #fallback h2 {
      font-size: 14px; color: var(--text-sub);
      margin-bottom: 20px; text-align: center;
    }
    .fallback-section-title {
      font-size: 12px; color: var(--accent);
      margin: 24px 0 12px; text-align: center;
      font-weight: 600; letter-spacing: 0.1em;
      grid-column: 1 / -1;
    }
    .fallback-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .fallback-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .fallback-card img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover; background: #2a2a2e;
    }
    .fallback-card .fc-body { padding: 12px; }
    .fallback-card .fc-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .fallback-card .fc-price { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    .fallback-card a {
      display: block; text-align: center;
      padding: 8px; background: var(--accent);
      color: #111; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: 700;
    }
    .fallback-card a.disabled { background: #3a3a3e; color: var(--text-sub); pointer-events: none; }
    .fallback-staff-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .fallback-staff-card img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; object-position: top; background: #2a2a2e;
    }
    .fallback-staff-card .fc-body { padding: 10px 12px 12px; }
    .fallback-staff-card .fc-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 2px; }
    .fallback-staff-card .fc-role { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }
    .fallback-staff-card a {
      display: block; text-align: center; padding: 8px;
      background: var(--accent); color: #111; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: 700;
    }
    .fallback-link-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      padding: 14px;
    }
    .fallback-link-card .fc-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .fallback-link-card .fc-lead { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; line-height: 1.5; }
    .fallback-link-card a {
      display: block; text-align: center; padding: 8px;
      background: var(--accent); color: #111; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: 700;
    }

    @media (max-width: 480px) {
      #info-card { padding: 20px 16px 28px; }
      #info-card .card-name { font-size: 15px; }
      #staff-card { padding: 20px 16px 28px; }
      #staff-card .sc-name { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header id="header">
    <a class="back" href="../index.html">&#8592; トップ</a>
    <span class="title">N's factory SHOWROOM</span>
    <span style="width:60px"></span>
  </header>

  <!-- ハンバーガーボタン（スマホ） -->
  <button id="menu-toggle" aria-label="部屋メニュー">&#9776;</button>

  <!-- 部屋メニュー -->
  <nav id="room-menu">
    <div class="menu-title">ROOMS</div>
    <button data-room="hall"       class="active">ホール</button>
    <button data-room="techo"             >手帳の間</button>
    <button data-room="katakamuna"        >カタカムナの間</button>
    <button data-room="koubou"            >工房の間</button>
    <button data-room="gallery"           >幕僚ギャラリー</button>
  </nav>

  <!-- 現在部屋 -->
  <div id="room-indicator">エントランスホール</div>

  <!-- ホールへ戻るボタン -->
  <button id="btn-back-hall">&#8592; ホールへ戻る</button>

  <!-- 操作ガイド -->
  <div id="guide-overlay">
    <div class="guide-box">
      <h2>N's factory SHOWROOM</h2>
      <p class="guide-sub">LEATHER CRAFT &amp; NEAR FUTURE ATELIER</p>
      <div class="room-list">
        <span class="room-chip">ホール</span>
        <span class="room-chip">手帳の間</span>
        <span class="room-chip">カタカムナの間</span>
        <span class="room-chip">工房の間</span>
        <span class="room-chip">幕僚ギャラリー</span>
      </div>
      <ul>
        <li>ドラッグ / スワイプで見回す</li>
        <li>ホイール / ピンチでズーム</li>
        <li>ドアをクリックで入室</li>
        <li>ショーケースをタップで詳細表示</li>
      </ul>
      <p class="tap-hint">画面をタップして入場</p>
    </div>
  </div>

  <!-- 3Dキャンバス -->
  <div id="canvas-container"></div>

  <!-- 商品情報カード -->
  <div id="info-card">
    <div class="card-header">
      <p class="card-name" id="card-name"></p>
      <button class="card-close" id="card-close">&#x2715;</button>
    </div>
    <p class="card-lead" id="card-lead"></p>
    <div class="card-meta">
      <span><strong>素材</strong>: <span id="card-material"></span></span>
    </div>
    <p class="card-price" id="card-price"></p>
    <a class="btn-purchase" id="card-btn" href="#" target="_blank" rel="noopener">購入ページへ</a>
  </div>

  <!-- フォールバック -->
  <div id="fallback">

  <!-- ===== チャット機能（非モジュール・WebGLフォールバック時も動作） ===== -->
  <script>
    var chatHistories = {};
    var chatTurnCount = {};
    var CHAT_MAX_TURNS = 10;
    var CHAT_HISTORY_MAX = 8;
    var currentChatStaffId = null;
    var isChatSending = false;

    function getFallbackLines(staffId) {
      var staff = (window.SHOWROOM_STAFF || []).find(function(s){ return s.id === staffId; });
      return (staff && staff.lines) ? staff.lines : ['少々お待ちください。'];
    }

    function initChat(staffId) {
      currentChatStaffId = staffId;
      isChatSending = false;
      var area = document.getElementById('chat-area');
      if (!area) return;
      area.classList.remove('chat-closed');
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-input').value = '';
      var sendBtn = document.getElementById('chat-send');
      if (sendBtn) sendBtn.disabled = false;
      var turns = chatTurnCount[staffId] || 0;
      if (turns >= CHAT_MAX_TURNS) { showChatLimit(); }
    }

    function appendStaffMsg(text, isFallback) {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-msg staff';
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble' + (isFallback ? ' fallback-notice' : '');
      bubble.textContent = text + (isFallback ? '\n（AIスタッフは席を外しています）' : '');
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function appendUserMsg(text) {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-msg user';
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.textContent = text;
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function showTyping() {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.id = 'typing-indicator';
      div.className = 'chat-typing';
      div.textContent = '…';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function hideTyping() {
      var el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function showChatLimit() {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-limit-msg';
      div.textContent = 'ありがとうございます。続きはぜひ実物でお会いしましょう。';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      var area = document.getElementById('chat-area');
      if (area) area.classList.add('chat-closed');
    }

    function sendChat() {
      if (isChatSending) return;
      var input = document.getElementById('chat-input');
      var sendBtn = document.getElementById('chat-send');
      var text = input ? input.value.trim() : '';
      if (!text || !currentChatStaffId) return;
      if (text.length > 200) return;

      var staffId = currentChatStaffId;
      var turns = chatTurnCount[staffId] || 0;
      if (turns >= CHAT_MAX_TURNS) { showChatLimit(); return; }

      isChatSending = true;
      if (sendBtn) sendBtn.disabled = true;
      if (input) input.value = '';

      appendUserMsg(text);
      if (!chatHistories[staffId]) chatHistories[staffId] = [];
      chatHistories[staffId].push({ role: 'user', text: text });

      showTyping();

      var apiUrl = (window.SHOWROOM_CONFIG && window.SHOWROOM_CONFIG.chatApi) || '';
      var historySlice = chatHistories[staffId].slice(-CHAT_HISTORY_MAX - 1, -1);

      if (apiUrl) {
        var payload = JSON.stringify({ staffId: staffId, message: text, history: historySlice });
        fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: payload })
          .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
          .then(function(data) {
            hideTyping();
            var reply, isFallback;
            if (data.fallback || !data.reply) {
              var lines = getFallbackLines(staffId);
              reply = lines[Math.floor(Math.random() * lines.length)]; isFallback = true;
            } else { reply = data.reply; isFallback = false; }
            appendStaffMsg(reply, isFallback);
            chatHistories[staffId].push({ role: 'model', text: reply });
            chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
            if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) showChatLimit();
            isChatSending = false;
            var area = document.getElementById('chat-area');
            if (area && !area.classList.contains('chat-closed')) {
              if (sendBtn) sendBtn.disabled = false;
              if (input) input.focus();
            }
          }).catch(function() {
            hideTyping();
            var lines = getFallbackLines(staffId);
            var reply = lines[Math.floor(Math.random() * lines.length)];
            appendStaffMsg(reply, true);
            chatHistories[staffId].push({ role: 'model', text: reply });
            chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
            if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) showChatLimit();
            isChatSending = false;
            if (sendBtn) sendBtn.disabled = false;
          });
      } else {
        hideTyping();
        var lines = getFallbackLines(staffId);
        var reply = lines[Math.floor(Math.random() * lines.length)];
        appendStaffMsg(reply, true);
        chatHistories[staffId].push({ role: 'model', text: reply });
        chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
        if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) showChatLimit();
        isChatSending = false;
        if (sendBtn) sendBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var sendBtn = document.getElementById('chat-send');
      if (sendBtn) sendBtn.addEventListener('click', sendChat);
      var chatInput = document.getElementById('chat-input');
      if (chatInput) {
        chatInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
        });
      }
    });
  </script>

  <!-- ===== メインスクリプト ===== -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // ============================================================
    // フォールバック（WebGL非対応時）
    // ============================================================
    function showFallback() {
      document.getElementById('canvas-container').style.display = 'none';
      document.getElementById('guide-overlay').style.display   = 'none';
      document.getElementById('room-menu').style.display       = 'none';
      document.getElementById('room-indicator').style.display  = 'none';
      document.getElementById('btn-back-hall').style.display   = 'none';
      document.getElementById('menu-toggle').style.display     = 'none';
      const fb   = document.getElementById('fallback');
      const grid = document.getElementById('fallback-grid');
      fb.style.display = 'block';

      const rooms = window.SHOWROOM_ROOMS || [];
      let html = '';
      rooms.forEach(room => {
        if (room.items.length === 0 && room.links.length === 0) return;
        html += `<div class="fallback-section-title" style="grid-column:1/-1">— ${room.name} —</div>`;
        room.items.forEach(item => {
          const hasUrl = item.url && item.url.trim() !== '';
          html += `
            <div class="fallback-card">
              <img src="${item.image}" alt="${item.name}" loading="lazy"
                   onerror="this.style.background='#2a2a2e';this.removeAttribute('src')">
              <div class="fc-body">
                <p class="fc-name">${item.name}</p>
                <p class="fc-price">${item.price || '準備中'}</p>
                <a href="${hasUrl ? item.url : '#'}" class="${hasUrl ? '' : 'disabled'}"
                   ${hasUrl ? 'target="_blank" rel="noopener"' : ''}>
                  ${hasUrl ? '購入ページへ' : '準備中'}
                </a>
              </div>
            </div>`;
        });
        room.links.forEach(link => {
          html += `
            <div class="fallback-link-card">
              <p class="fc-name">${link.name}</p>
              <p class="fc-lead">${link.lead}</p>
              <a href="${link.url}" target="_blank" rel="noopener">${link.btnLabel}</a>
            </div>`;
        });
      });

      const staffList = window.SHOWROOM_STAFF || [];
      if (staffList.length > 0) {
        html += `<div class="fallback-section-title" style="grid-column:1/-1">— スタッフ紹介 —</div>`;
        html += staffList.map(s => `
          <div class="fallback-staff-card" data-staff-id="${s.id}">
            <img src="assets/mascot/${s.id}.png" alt="${s.name}" loading="lazy"
                 onerror="this.src='${s.image}'"
                 style="object-fit:contain;background:#1a1a1c;">
            <div class="fc-body">
              <p class="fc-name">${s.name}</p>
              <p class="fc-role">${s.role}</p>
              <a href="${s.btnUrl}" target="_blank" rel="noopener">${s.btnLabel}</a>
              <button class="fallback-chat-btn" data-staff-id="${s.id}"
                style="margin-top:6px;display:block;width:100%;padding:7px;background:#232326;border:1px solid rgba(212,175,106,0.28);border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;color:#d4af6a;">
                話しかける
              </button>
            </div>
          </div>`).join('');
      }
      grid.innerHTML = html;

      grid.querySelectorAll('.fallback-chat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sid = btn.dataset.staffId;
          const staffData = (window.SHOWROOM_STAFF || []).find(s => s.id === sid);
          if (!staffData) return;
          const line = staffData.lines[Math.floor(Math.random() * staffData.lines.length)];
          document.getElementById('sc-name').textContent = staffData.name;
          document.getElementById('sc-role').textContent = staffData.role;
          document.getElementById('sc-line').textContent = line;
          const av = document.getElementById('sc-avatar');
          av.onerror = () => { av.onerror = null; av.src = staffData.image; };
          av.src = `assets/mascot/${staffData.id}.png`; av.alt = staffData.name;
          const scBtn = document.getElementById('sc-btn');
          scBtn.href = staffData.btnUrl; scBtn.textContent = staffData.btnLabel;
          if (staffData.btnUrl.startsWith('http')) {
            scBtn.setAttribute('target','_blank'); scBtn.setAttribute('rel','noopener');
          } else {
            scBtn.removeAttribute('target'); scBtn.removeAttribute('rel');
          }
          document.getElementById('staff-card').classList.add('visible');
          document.getElementById('staff-card').style.zIndex = '300';
          if (typeof initChat === 'function') initChat(staffData.id);
        });
      });
    }

    function isWebGLAvailable() {
      try {
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch(e) { return false; }
    }
    if (!isWebGLAvailable()) { showFallback(); throw new Error('WebGL not supported'); }

    // ============================================================
    // カラー定数（近未来 ダーク×シャンパンゴールド）
    // ============================================================
    const C_FLOOR      = 0x1a1a1c;   // ダークチャコール
    const C_WALL_UPPER = 0x1c1c1f;   // 上部壁 ダーク
    const C_WALL_LOWER = 0xA0785A;   // 腰壁 レザータン
    const C_CEIL       = 0x141416;   // 天井 ダーク
    const C_GOLD       = 0xd4af6a;   // シャンパンゴールド（発光ライン・フレーム）
    const C_DOOR_GLOW  = 0xd4af6a;
    const C_EXIT_GLOW  = 0x80c0e0;
    const C_PEDESTAL   = 0x2e1e12;   // ショーケース台座（ダークブラウン）
    const ROOM_SIZE    = 10;
    const ROOM_H       = 4.0;
    const CORRIDOR     = 14;

    const ROOM_OFFSETS = {
      hall:       { x:  0,        z:  0        },
      techo:      { x:  0,        z: -CORRIDOR },
      katakamuna: { x:  0,        z:  CORRIDOR },
      koubou:     { x: -CORRIDOR, z:  0        },
      gallery:    { x:  CORRIDOR, z:  0        }
    };

    const HALL_DOORS = [
      { toRoom: 'techo',      label: 'システム手帳の間',   dx:  0, dz: -1, wx:  0,                  wz: -(ROOM_SIZE/2 - 0.12) },
      { toRoom: 'katakamuna', label: 'カタカムナ・教育の間', dx:  0, dz:  1, wx:  0,                  wz:  (ROOM_SIZE/2 - 0.12) },
      { toRoom: 'koubou',     label: '工房の間',            dx: -1, dz:  0, wx: -(ROOM_SIZE/2 - 0.12), wz:  0                   },
      { toRoom: 'gallery',    label: '幕僚ギャラリー',       dx:  1, dz:  0, wx:  (ROOM_SIZE/2 - 0.12), wz:  0                   }
    ];

    const CAM_IN_ROOM = { camY: 1.8, camZ: 3.8, targetY: 1.6 };

    // ============================================================
    // Three.js 初期化
    // ============================================================
    let renderer, scene, camera, controls;
    let raycaster, mouse;
    let panels      = [];
    let staffPanels = [];
    let doorMeshes  = [];
    let showcasePlates = []; // {mesh, item} ショーケース内回転プレート
    let hoveredMesh  = null;
    let selectedMesh = null;
    let currentRoomId = 'hall';
    let isTransitioning = false;
    let camAnim = null;

    const clock      = new THREE.Clock();
    const loader     = new THREE.TextureLoader();
    const gltfLoader = new GLTFLoader();
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    try {
      const container = document.getElementById('canvas-container');

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = false; // スマホ向けシャドウ無効
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;
      container.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d0d0f);
      scene.fog = new THREE.FogExp2(0x0d0d0f, 0.038);

      camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 80);
      camera.position.set(0, CAM_IN_ROOM.camY, CAM_IN_ROOM.camZ);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, CAM_IN_ROOM.targetY, 0);
      controls.enablePan   = false;
      controls.minDistance = 1.5;
      controls.maxDistance = 8;
      controls.maxPolarAngle = Math.PI * 0.74;
      controls.minPolarAngle = Math.PI * 0.08;
      controls.update();

      raycaster = new THREE.Raycaster();
      mouse     = new THREE.Vector2();

      // ============================================================
      // 共有マテリアル（draw call削減のため部屋間で使い回し）
      // ============================================================
      const floorMat = new THREE.MeshStandardMaterial({
        color: C_FLOOR, roughness: 0.25, metalness: 0.4
      });
      const wallUpperMat = new THREE.MeshStandardMaterial({
        color: C_WALL_UPPER, roughness: 0.78
      });
      const wallLowerMat = new THREE.MeshStandardMaterial({
        color: C_WALL_LOWER, roughness: 0.82
      });
      const ceilMat = new THREE.MeshStandardMaterial({
        color: C_CEIL, roughness: 0.9
      });
      // 発光ライン（ゴールド） — emissiveのみ。全部屋共有
      const glowLineMat = new THREE.MeshStandardMaterial({
        color: C_GOLD,
        emissive: new THREE.Color(C_GOLD),
        emissiveIntensity: 0.85,
        roughness: 0.3, metalness: 0.6
      });
      // ショーケース台座
      const pedestalMat = new THREE.MeshStandardMaterial({
        color: C_PEDESTAL, roughness: 0.7, metalness: 0.15
      });
      // ガラスパネル（MeshPhysicalMaterial。transmissionは使わない）
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xaaddff,
        transparent: true,
        opacity: 0.15,
        roughness: 0.04,
        metalness: 0.0,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      // 額縁（ゴールド）
      const goldFrameMat = new THREE.MeshStandardMaterial({
        color: C_GOLD, roughness: 0.35, metalness: 0.7,
        emissive: new THREE.Color(C_GOLD), emissiveIntensity: 0.18
      });
      // 縫い目ライン（ダーク細線）
      const stitchMat = new THREE.MeshStandardMaterial({
        color: 0x3a1f0f, roughness: 0.9
      });
      // リンクパネル（ダークガラス調＋ゴールド発光）
      const linkPanelBaseMat = new THREE.MeshStandardMaterial({
        color: 0x0a0a10, roughness: 0.5,
        emissive: new THREE.Color(C_GOLD), emissiveIntensity: 0.22
      });

      // ============================================================
      // ライティング（全体: Hemisphere+Directional各1のみ）
      // ============================================================
      const hemi = new THREE.HemisphereLight(0x1a1a30, 0x050508, 0.55);
      scene.add(hemi);
      const dirLight = new THREE.DirectionalLight(0xfff5e0, 0.9);
      dirLight.position.set(6, 12, 8);
      scene.add(dirLight);

      // ============================================================
      // 全部屋の空間ジオメトリ構築
      // ============================================================
      const roomIds = ['hall','techo','katakamuna','koubou','gallery'];

      roomIds.forEach(roomId => {
        const off = ROOM_OFFSETS[roomId];
        const rx = off.x, rz = off.z;
        const hs = ROOM_SIZE / 2;

        // --- 床（ダークチャコール磨き） ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(rx, 0, rz);
        scene.add(floor);

        // --- 天井（暗色） ---
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.set(rx, ROOM_H, rz);
        scene.add(ceil);

        // --- 壁: 上部ダーク + 腰壁レザータン（分割配置） ---
        const lowerH = 1.2; // 腰壁高さ
        const upperH = ROOM_H - lowerH;
        const wallDirs = [
          { pos: [rx, 0, rz - hs], ry: 0             },
          { pos: [rx, 0, rz + hs], ry: Math.PI       },
          { pos: [rx - hs, 0, rz], ry:  Math.PI/2    },
          { pos: [rx + hs, 0, rz], ry: -Math.PI/2    }
        ];
        wallDirs.forEach(w => {
          // 上部
          const mU = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, upperH), wallUpperMat);
          mU.position.set(w.pos[0], lowerH + upperH/2, w.pos[2]);
          mU.rotation.y = w.ry;
          scene.add(mU);
          // 腰壁（革パネル）
          const mL = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, lowerH), wallLowerMat);
          mL.position.set(w.pos[0], lowerH/2, w.pos[2]);
          mL.rotation.y = w.ry;
          scene.add(mL);
          // 腰壁上端の区切りライン（ゴールド細線）
          const divLine = new THREE.Mesh(new THREE.BoxGeometry(ROOM_SIZE, 0.03, 0.03), glowLineMat);
          divLine.position.set(w.pos[0], lowerH + 0.015, w.pos[2]);
          divLine.rotation.y = w.ry;
          scene.add(divLine);
        });

        // --- 腰壁の縫い目ライン（水平2本）---
        // 各壁のzオフセット方向に細いBoxGeomを水平に走らせる
        const stitchYs = [0.35, 0.75];
        const stitchDirs = [
          { axis:'z', sign:-1, posX: rx, posZ: rz - hs + 0.015 },
          { axis:'z', sign: 1, posX: rx, posZ: rz + hs - 0.015 },
          { axis:'x', sign:-1, posX: rx - hs + 0.015, posZ: rz },
          { axis:'x', sign: 1, posX: rx + hs - 0.015, posZ: rz }
        ];
        stitchDirs.forEach(sd => {
          stitchYs.forEach(sy => {
            const sGeo = sd.axis === 'z'
              ? new THREE.BoxGeometry(ROOM_SIZE * 0.92, 0.012, 0.01)
              : new THREE.BoxGeometry(0.01, 0.012, ROOM_SIZE * 0.92);
            const sm = new THREE.Mesh(sGeo, stitchMat);
            sm.position.set(sd.posX, sy, sd.posZ);
            scene.add(sm);
          });
        });

        // --- 床外周 ゴールド発光ライン ---
        const lineW = 0.04, lineOff = 0.25;
        // 4辺
        [
          // 奥
          { gx: ROOM_SIZE - lineOff*2, gz: lineW, px: rx, py: 0.008, pz: rz - hs + lineOff },
          // 手前
          { gx: ROOM_SIZE - lineOff*2, gz: lineW, px: rx, py: 0.008, pz: rz + hs - lineOff },
          // 左
          { gx: lineW, gz: ROOM_SIZE - lineOff*2, px: rx - hs + lineOff, py: 0.008, pz: rz },
          // 右
          { gx: lineW, gz: ROOM_SIZE - lineOff*2, px: rx + hs - lineOff, py: 0.008, pz: rz }
        ].forEach(l => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(l.gx, 0.015, l.gz), glowLineMat);
          m.position.set(l.px, l.py, l.pz);
          scene.add(m);
        });

        // --- 天井 格子状発光ライン（3×3格子） ---
        const gridStep = ROOM_SIZE / 4;
        for (let gi = 1; gi < 4; gi++) {
          // X方向（横線）
          const mx = new THREE.Mesh(new THREE.BoxGeometry(ROOM_SIZE, 0.015, 0.03), glowLineMat);
          mx.position.set(rx, ROOM_H - 0.02, rz - hs + gi * gridStep);
          scene.add(mx);
          // Z方向（縦線）
          const mz = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.015, ROOM_SIZE), glowLineMat);

      // ============================================================
      // ホールのドアパネル
      // ============================================================
      function makeRoomLabelTex(text, color) {
        const lc = document.createElement('canvas');
        lc.width = 512; lc.height = 80;
        const ctx = lc.getContext('2d');
        ctx.clearRect(0, 0, 512, 80);

        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        return t;

      HALL_DOORS.forEach(door => {
        const off = ROOM_OFFSETS['hall'];
        const wx = off.x + door.wx;
        const wz = off.z + door.wz;
        const ry = Math.atan2(door.dx, door.dz);

        const dMat = new THREE.MeshStandardMaterial({
          color: 0x0a0a12, roughness: 0.4, metalness: 0.3,

        });

        // ドア枠（ゴールド）
        const dfW = 1.2, dfH = 2.0, ft = 0.06;
        [[new THREE.BoxGeometry(dfW + ft*2, ft, ft), [0,  dfH/2 + ft/2, 0]],
         [new THREE.BoxGeometry(dfW + ft*2, ft, ft), [0, -dfH/2 - ft/2, 0]],
         [new THREE.BoxGeometry(ft, dfH + ft*2, ft), [-dfW/2 - ft/2, 0, 0]],
         [new THREE.BoxGeometry(ft, dfH + ft*2, ft), [ dfW/2 + ft/2, 0, 0]]
        ].forEach(([geo, [ox,oy,oz]]) => {
          const b = new THREE.Mesh(geo, goldFrameMat);
          b.position.set(wx + ox, 1.0 + oy, wz + oz);
          b.rotation.y = ry;
          scene.add(b);
        });

        // ラベル
        const lMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.4, 0.22),
          new THREE.MeshBasicMaterial({ map: makeRoomLabelTex(door.label), transparent: true, depthWrite: false })
        );
        lMesh.position.set(wx, 2.22, wz);
        lMesh.rotation.y = ry;
        scene.add(lMesh);
      });

      // 各部屋の出口ドア
      ['techo','katakamuna','koubou','gallery'].forEach(roomId => {
        const rOff = ROOM_OFFSETS[roomId];
        const hOff = ROOM_OFFSETS['hall'];
        const dx = Math.sign(hOff.x - rOff.x);
        const dz = Math.sign(hOff.z - rOff.z);
        const wx = rOff.x + dx * (ROOM_SIZE/2 - 0.12);
        const wz = rOff.z + dz * (ROOM_SIZE/2 - 0.12);

        const exMat = new THREE.MeshStandardMaterial({

        exMesh.position.set(wx, 1.0, wz);

        scene.add(exMesh);
        doorMeshes.push({ mesh: exMesh, toRoom: 'hall', label: 'ホールへ戻る' });

        // 出口枠（ゴールド薄め）
        const dfW = 1.2, dfH = 2.0, ft = 0.05;

        ].forEach(([geo,[ox,oy,oz]]) => {

      // ============================================================
      // ヘルパー: テキスト折り返し
      // ============================================================
      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split('');
        let line = '', curY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n];
          if (ctx.measureText(testLine).width > maxWidth && line !== '') {
            ctx.fillText(line, x, curY);
            line = words[n]; curY += lineHeight;
          } else { line = testLine; }
        }
        ctx.fillText(line, x, curY);
      }

      // ============================================================
      // ヘルパー: ゴールド枠（額縁）
      // ============================================================
      function addGoldFrame(pos, w, h) {
        const ft = 0.04, fd = 0.04;
        const fw = w + ft*2, fh = h + ft*2;
        [
          [new THREE.BoxGeometry(fw, ft, fd), [0,  fh/2 - ft/2, 0]],
          [new THREE.BoxGeometry(fw, ft, fd), [0, -fh/2 + ft/2, 0]],
          [new THREE.BoxGeometry(ft, fh, fd), [-fw/2 + ft/2, 0, 0]],
          [new THREE.BoxGeometry(ft, fh, fd), [ fw/2 - ft/2, 0, 0]]
        ].forEach(([geo,[ox,oy,oz]]) => {
          const b = new THREE.Mesh(geo, goldFrameMat);
          b.position.set(pos.x + ox, pos.y + oy, pos.z + oz + 0.02);
          b.rotation.y = pos.ry;
          scene.add(b);
        });
      }

      // ============================================================
      // ヘルパー: リンクパネルテクスチャ生成
      // ============================================================
      function makeLinkTex(link) {
        const lc = document.createElement('canvas');
        lc.width = 512; lc.height = 256;
        const ctx = lc.getContext('2d');
        ctx.fillStyle = '#0a0a12';
        ctx.fillRect(0, 0, 512, 256);
        // ゴールド枠線
        ctx.strokeStyle = 'rgba(212,175,106,0.7)';
        ctx.lineWidth = 4;
        ctx.strokeRect(6, 6, 500, 244);
        ctx.fillStyle = '#d4af6a';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(link.name, 256, 62);
        ctx.fillStyle = 'rgba(232,232,236,0.72)';
        ctx.font = '17px sans-serif';
        wrapText(ctx, link.lead, 256, 108, 460, 26);
        ctx.fillStyle = 'rgba(212,175,106,0.9)';
        ctx.roundRect ? ctx.roundRect(120, 188, 272, 42, 8) : ctx.fillRect(120, 188, 272, 42);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.font = 'bold 19px sans-serif';
        ctx.fillText(link.btnLabel, 256, 215);
        const t = new THREE.CanvasTexture(lc);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      // ============================================================
      // 島型ガラスショーケース設置（各部屋）
      // ============================================================
      /*
        ショーケース1基 = 台座 + ガラス4面 + 天板ガラス + 発光フレーム(底辺) + 商品プレート(回転)
        サイズ: W=1.0 D=0.85 台座H=0.55 ガラスH=0.9 → 全高1.45
      */
      const SC_W = 1.0, SC_D = 0.85, SC_BASE_H = 0.55, SC_GLASS_H = 0.9;

      // ショーケース配置座標（部屋ごと）
      const SHOWCASE_POSITIONS = {
        hall:       [],  // ホールは商品なし・ドア前通路確保
        techo:      [
          { x: -1.5, z: 0.0 },
          { x:  1.5, z: 0.0 },
          { x:  0.0, z:-1.5 }
        ],
        katakamuna: [
          { x: -1.5, z: 0.5 },
          { x:  1.5, z: 0.5 },
          { x:  0.0, z:-1.2 }
        ],
        koubou: [
          { x:  1.8, z:-1.2 },
          { x:  1.8, z: 1.2 }
        ],
        gallery: []  // ギャラリーはポートレート展示のみ
      };

      function buildShowcase(worldX, worldZ, item) {
        const group = new THREE.Group();
        group.position.set(worldX, 0, worldZ);

        // 台座
        const base = new THREE.Mesh(new THREE.BoxGeometry(SC_W, SC_BASE_H, SC_D), pedestalMat);
        base.position.y = SC_BASE_H / 2;
        group.add(base);

        // 台座上のゴールド発光ライン（4辺）
        const edgeY = SC_BASE_H + 0.008;
        const hw = SC_W/2, hd = SC_D/2;
        [
          { gx: SC_W + 0.01, gz: 0.025, px: 0,    pz:  hd   },
          { gx: SC_W + 0.01, gz: 0.025, px: 0,    pz: -hd   },
          { gx: 0.025, gz: SC_D + 0.01, px:  hw,  pz:  0    },
          { gx: 0.025, gz: SC_D + 0.01, px: -hw,  pz:  0    }
        ].forEach(e => {
          const em = new THREE.Mesh(new THREE.BoxGeometry(e.gx, 0.015, e.gz), glowLineMat);
          em.position.set(e.px, edgeY, e.pz);
          group.add(em);
        });

        // ガラス4側面（薄いplane）
        const glassY = SC_BASE_H + SC_GLASS_H / 2;
        const glassGeos = [
          { geo: new THREE.PlaneGeometry(SC_W, SC_GLASS_H), pos: [0, glassY,  hd + 0.005], ry: Math.PI },
          { geo: new THREE.PlaneGeometry(SC_W, SC_GLASS_H), pos: [0, glassY, -hd - 0.005], ry: 0       },
          { geo: new THREE.PlaneGeometry(SC_D, SC_GLASS_H), pos: [ hw + 0.005, glassY, 0], ry: -Math.PI/2 },
          { geo: new THREE.PlaneGeometry(SC_D, SC_GLASS_H), pos: [-hw - 0.005, glassY, 0], ry:  Math.PI/2 }
        ];
        glassGeos.forEach(g => {
          // 個別マテリアル（shared glassMat はtransparentなのでclone不要・使い回し）
          const gm = new THREE.Mesh(g.geo, glassMat);
          gm.position.set(...g.pos);
          gm.rotation.y = g.ry;
          group.add(gm);
        });

        // 天板ガラス
        const topGlass = new THREE.Mesh(new THREE.PlaneGeometry(SC_W, SC_D), glassMat);
        topGlass.rotation.x = -Math.PI / 2;
        topGlass.position.y = SC_BASE_H + SC_GLASS_H + 0.005;
        group.add(topGlass);

        // ガラス枠（ゴールド4本縦）
        const pillarH = SC_GLASS_H + 0.02;
        [
          [ hw,  hd], [-hw,  hd],
          [ hw, -hd], [-hw, -hd]
        ].forEach(([px, pz]) => {
          const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.025, pillarH, 0.025), goldFrameMat);
          pillar.position.set(px, SC_BASE_H + pillarH/2, pz);
          group.add(pillar);
        });

        // ケース内商品プレート（回転）
        const plateMat = new THREE.MeshStandardMaterial({
          color: 0x8a6640, roughness: 0.55
        });
        loader.load(item.image, tex => {
          tex.colorSpace = THREE.SRGBColorSpace;
          plateMat.map = tex; plateMat.color.set(0xffffff); plateMat.needsUpdate = true;
        }, undefined, () => {});

        const plateW = SC_W * 0.72, plateH = plateW * 0.72;
        const plateMesh = new THREE.Mesh(new THREE.PlaneGeometry(plateW, plateH), plateMat);
        plateMesh.position.y = SC_BASE_H + SC_GLASS_H * 0.45;
        plateMesh.userData.item = item;
        group.add(plateMesh);

        // グループに item を紐付け（raycast用）
        group.userData.item = item;
        scene.add(group);

        // raycast 対象に台座・ガラスパネル・商品プレートを登録
        panels.push({ mesh: plateMesh, item });
        // ガラス面もクリック可能（panelとして登録）
        glassGeos.forEach((_, i) => {
          const gMesh = group.children.find((c, ci) => {
            return c.geometry && c.geometry.type === 'PlaneGeometry'
              && c.material === glassMat
              && ci > 0 && ci <= 4;
          });
        });
        // ガラス4面+天板をpanelとして登録
        group.children.forEach(child => {
          if (child.material === glassMat) {
            panels.push({ mesh: child, item });
          }
        });

        showcasePlates.push({ mesh: plateMesh });
        return group;
      }

      // 全部屋にショーケース設置
      const roomsData = window.SHOWROOM_ROOMS || [];
      roomIds.forEach(roomId => {
        const room = roomsData.find(r => r.id === roomId);
        if (!room) return;
        const scPositions = SHOWCASE_POSITIONS[roomId] || [];
        const items = room.items || [];

        scPositions.forEach((pos, i) => {
          const item = items[i] || null;
          if (!item) return;
          const off = ROOM_OFFSETS[roomId];
          buildShowcase(off.x + pos.x, off.z + pos.z, item);
        });

        // リンクパネルは壁掛けのまま（ダークガラス調＋ゴールド枠）
        const links = room.links || [];
        links.forEach((link, i) => {
          const lpos = buildLinkPanelPosition(i, links.length, ROOM_OFFSETS[roomId]);
          const lMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a12, roughness: 0.5,
            emissive: new THREE.Color(C_GOLD), emissiveIntensity: 0.22
          });
          lMat.map = makeLinkTex(link);
          lMat.needsUpdate = true;
          const lMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), lMat);
          lMesh.position.set(lpos.x, lpos.y, lpos.z);
          lMesh.rotation.y = lpos.ry;
          lMesh.userData.link = link;
          scene.add(lMesh);
          panels.push({ mesh: lMesh, item: { ...link, isLink: true } });
          addGoldFrame(lpos, 1.6, 0.8);
        });
      });

      function buildLinkPanelPosition(i, total, off) {
        const hs = ROOM_SIZE / 2;
        const positions = [
          { x: off.x + hs - 0.08, y: 2.0, z: off.z + 0.0, ry: -Math.PI/2 },
          { x: off.x + hs - 0.08, y: 2.0, z: off.z + 2.0, ry: -Math.PI/2 },
          { x: off.x + hs - 0.08, y: 2.0, z: off.z - 2.0, ry: -Math.PI/2 },
          { x: off.x - hs + 0.08, y: 2.0, z: off.z - 2.5, ry:  Math.PI/2 }
        ];
        return positions[i % positions.length];
      }

      // ============================================================
      // ホールのリンクパネル
      // ============================================================
      (function() {
        const off = ROOM_OFFSETS['hall'];
        const halls = roomsData.find(r => r.id === 'hall');
        if (!halls) return;
        halls.links.forEach((link, i) => {
          const lpos = buildLinkPanelPosition(i, halls.links.length, off);

            color: 0x0a0a12, roughness: 0.5,
            emissive: new THREE.Color(C_GOLD), emissiveIntensity: 0.22
          });
          lMat.map = makeLinkTex(link);
          lMat.needsUpdate = true;
          const lMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), lMat);
          lMesh.position.set(lpos.x, lpos.y, lpos.z);
          lMesh.rotation.y = lpos.ry;
          lMesh.userData.link = link;
          scene.add(lMesh);
          panels.push({ mesh: lMesh, item: { ...link, isLink: true } });
          addGoldFrame(lpos, 1.6, 0.8);
        });
      })();

      // ============================================================

        [-0.05, 0.05].forEach(dy => {
          const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.012, 14), spoolDiscMat);
          disc.position.set(cx + 0.6, 0.975 + dy, cz + 0.65);
          scene.add(disc);
        });

        // ペンダントライト風発光球
        const pendantMat = new THREE.MeshStandardMaterial({
          color: 0xfff5d0,
          emissive: new THREE.Color(0xffe8a0),
          emissiveIntensity: 1.2
        });
        const pendant = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), pendantMat);
        pendant.position.set(cx, ROOM_H - 0.45, cz + 0.8);
        scene.add(pendant);

        // ペンダントコード（細いシリンダー）
        const cordMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0 });
        const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, ROOM_H - 0.6, 6), cordMat);
        cord.position.set(cx, (ROOM_H - 0.45 + ROOM_H) / 2 - 0.3, cz + 0.8);
        scene.add(cord);

        // ペンダントライトのPointLight（工房は部屋PointLightをこれに割り当て済みのため上書き不要。別途追加せず）
        // ※ roomIdsループで koubou に PointLight を設置済み → 上方に配置済みのためここでは省略
      })();

      // ============================================================
      // 幕僚 立て看板アクター（StaffActor）
      // ============================================================
      class StaffActor {
        constructor(staff) {
          this.staff   = staff;
          this.roomId  = staff.room;
          this.rOff    = ROOM_OFFSETS[staff.room];
          this.waypoints = (staff.waypoints || [[0,0]]).map(([lx, lz]) => ({
            x: this.rOff.x + lx,
            z: this.rOff.z + lz
          }));
          this.wpIdx    = 0;
          this.waitTime = 0;
          this.speed    = 0.35 + Math.random() * 0.15;
          this.paused   = false;
          this.isGlbLoaded = false;
          this._glbLoadStarted = false;
          this._lastMoveAngle = 0;
          this.visual = this._buildVisual(staff);
        }

        triggerGlbLoad() {
          if (!this.staff.model || this._glbLoadStarted) return;
          this._glbLoadStarted = true;
          this._loadGlbModel(this.staff);
        }

        _buildVisual(staff) {
          const group = new THREE.Group();
          const spriteH = 1.4;
          const spriteMat = new THREE.MeshBasicMaterial({
            color: 0xFFFFFF, transparent: true, alphaTest: 0.05,
            side: THREE.DoubleSide, depthWrite: false
          });
          const mascotPath = `assets/mascot/${staff.id}.png`;
          loader.load(mascotPath, tex => {
            tex.colorSpace = THREE.SRGBColorSpace;
            spriteMat.map = tex; spriteMat.needsUpdate = true;
          }, undefined, () => {
            loader.load(staff.image, tex2 => {
              tex2.colorSpace = THREE.SRGBColorSpace;
              spriteMat.map = tex2; spriteMat.needsUpdate = true;
            }, undefined, () => {});
          });

          const pMesh = new THREE.Mesh(new THREE.PlaneGeometry(spriteH, spriteH), spriteMat);
          pMesh.position.set(0, spriteH/2, 0);
          pMesh.userData.staffActor = this;
          group.add(pMesh);
          this.panelMesh = pMesh;

          // 足元影
          const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false });
          const shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(0.28, 24), shadowMat);
          shadowMesh.rotation.x = -Math.PI/2; shadowMesh.position.set(0, 0.01, 0);
          group.add(shadowMesh);
          this._shadowMesh = shadowMesh;

          // 名前プレート（ゴールドカラー）
          const nc = document.createElement('canvas');
          nc.width = 256; nc.height = 48;
          const nctx = nc.getContext('2d');
          nctx.clearRect(0,0,256,48);
          nctx.fillStyle = 'rgba(10,10,18,0.82)';
          const rx2 = 8;
          nctx.beginPath();
          nctx.moveTo(rx2,0); nctx.lineTo(256-rx2,0); nctx.quadraticCurveTo(256,0,256,rx2);
          nctx.lineTo(256,48-rx2); nctx.quadraticCurveTo(256,48,256-rx2,48);
          nctx.lineTo(rx2,48); nctx.quadraticCurveTo(0,48,0,48-rx2);
          nctx.lineTo(0,rx2); nctx.quadraticCurveTo(0,0,rx2,0);
          nctx.closePath(); nctx.fill();
          nctx.fillStyle = '#d4af6a'; nctx.font = 'bold 18px sans-serif';
          nctx.textAlign = 'center'; nctx.textBaseline = 'middle';
          nctx.fillText(staff.name, 128, 16);
          nctx.fillStyle = 'rgba(232,232,236,0.65)'; nctx.font = '13px sans-serif';
          nctx.fillText(staff.role, 128, 33);
          const ntex = new THREE.CanvasTexture(nc); ntex.colorSpace = THREE.SRGBColorSpace;
          const nMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(0.85, 0.16),
            new THREE.MeshBasicMaterial({ map: ntex, transparent: true, depthWrite: false })
          );
          nMesh.position.set(0, spriteH + 0.12, 0);
          group.add(nMesh);
          this.nameMesh = nMesh;

          const wp0 = this.waypoints[0];
          group.position.set(wp0.x, 0, wp0.z);
          scene.add(group);
          return group;
        }

        _loadGlbModel(staff) {
          const TARGET_HEIGHT = 1.4;
          gltfLoader.load(staff.model, (gltf) => {
            try {
              const modelScene = gltf.scene;
              const box = new THREE.Box3().setFromObject(modelScene);
              const size = new THREE.Vector3(); box.getSize(size);
              if (size.y > 0) modelScene.scale.setScalar(TARGET_HEIGHT / size.y);
              const box2 = new THREE.Box3().setFromObject(modelScene);
              modelScene.position.y = -box2.min.y;
              modelScene.traverse(child => {
                if (child.isMesh) {
                  child.castShadow = false;
                  child.userData.staffActor = this;
                }
              });
              this.panelMesh.visible = false;
              this.nameMesh.position.set(0, TARGET_HEIGHT + 0.12, 0);
              this.visual.add(modelScene);
              this._glbScene = modelScene;
              modelScene.traverse(child => {
                if (child.isMesh) staffPanels.push({ mesh: child, staffActor: this });
              });
              this.isGlbLoaded = true;
              this.visual.rotation.y = this._lastMoveAngle;
            } catch(e) { console.warn('[GLB] 組み込みエラー:', e); }
          }, undefined, (err) => { console.warn('[GLB] ロード失敗:', err); });
        }

        update(dt) {
          if (this.paused) return;
          if (this.waitTime > 0) {
            this.waitTime -= dt;
            this.visual.position.y = Math.sin(Date.now() * 0.002) * 0.015;
            return;
          }
          const target = this.waypoints[this.wpIdx];
          const curX = this.visual.position.x, curZ = this.visual.position.z;
          const dx = target.x - curX, dz = target.z - curZ;
          const dist = Math.sqrt(dx*dx + dz*dz);
          if (dist < 0.05) {
            this.visual.position.x = target.x;
            this.visual.position.z = target.z;
            this.wpIdx = (this.wpIdx + 1) % this.waypoints.length;
            this.waitTime = 2 + Math.random() * 3;
          } else {
            const step = Math.min(this.speed * dt, dist);
            this.visual.position.x += (dx/dist) * step;
            this.visual.position.z += (dz/dist) * step;
            const targetAngle = Math.atan2(dx, dz);
            this._lastMoveAngle = targetAngle;
            const curAngle = this.visual.rotation.y;
            let dAngle = targetAngle - curAngle;
            while (dAngle >  Math.PI) dAngle -= Math.PI*2;
            while (dAngle < -Math.PI) dAngle += Math.PI*2;
            this.visual.rotation.y += dAngle * Math.min(dt*4, 1);
            this.visual.position.y = Math.sin(Date.now() * 0.005) * 0.03;
          }
          if (!this.isGlbLoaded) {
            const camDir = new THREE.Vector3();
            camDir.subVectors(camera.position, this.visual.position);
            camDir.y = 0;
            if (camDir.lengthSq() > 0.001) this.visual.rotation.y = Math.atan2(camDir.x, camDir.z);
          }
        }

        pauseFor() { this.paused = true; }
        resume()   { this.paused = false; }
      }

      const staffActors = (window.SHOWROOM_STAFF || []).map(s => new StaffActor(s));
      staffActors.forEach(actor => {
        staffPanels.push({ mesh: actor.panelMesh, staffActor: actor });
      });
      staffActors.forEach(actor => {
        if (actor.roomId === 'hall') actor.triggerGlbLoad();
      });

      // ============================================================
      // カメラ遷移
      // ============================================================
      function gotoRoom(roomId) {
        if (isTransitioning) return;
        const off = ROOM_OFFSETS[roomId];
        if (!off) { console.warn('SHOWROOM_API: 不明なroomId:', roomId); return; }
        isTransitioning = true;
        closeAllCards();
        const fromPos    = camera.position.clone();
        const fromTarget = controls.target.clone();
        let entryDz = 0, entryDx = 0;
        if (roomId === 'hall') {
          entryDz = CAM_IN_ROOM.camZ;
        } else {
          const hallOff = ROOM_OFFSETS['hall'];
          const dirX = off.x - hallOff.x, dirZ = off.z - hallOff.z;
          const len  = Math.sqrt(dirX*dirX + dirZ*dirZ);
          entryDx = -(dirX/len) * CAM_IN_ROOM.camZ;
          entryDz = -(dirZ/len) * CAM_IN_ROOM.camZ;
        }
        const toPos    = new THREE.Vector3(off.x + entryDx, CAM_IN_ROOM.camY, off.z + entryDz);
        const toTarget = new THREE.Vector3(off.x,           CAM_IN_ROOM.targetY, off.z);
        staffActors.forEach(actor => {
          if (actor.roomId === roomId) actor.triggerGlbLoad();
        });
        camAnim = {
          fromPos, toPos, fromTarget, toTarget, t: 0, duration: 1.0,
          onDone: () => {
            currentRoomId = roomId; isTransitioning = false;
            updateRoomUI(roomId);
            controls.target.copy(toTarget); controls.update();
          }
        };
      }

      function updateRoomUI(roomId) {
        const room = (window.SHOWROOM_ROOMS || []).find(r => r.id === roomId);
        const name = room ? room.name : roomId;
        document.getElementById('room-indicator').textContent = name;
        document.querySelectorAll('#room-menu button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.room === roomId);
        });
        document.getElementById('btn-back-hall').style.display = (roomId === 'hall') ? 'none' : 'block';
        gtag('event', 'room_enter', { room_id: roomId });
      }

      // ============================================================
      // Raycaster & クリック
      // ============================================================
      function getIntersected(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        let cx, cy;
        if (event.touches && event.touches.length > 0) {
          cx = event.touches[0].clientX; cy = event.touches[0].clientY;
        } else if (event.changedTouches && event.changedTouches.length > 0) {
          cx = event.changedTouches[0].clientX; cy = event.changedTouches[0].clientY;
        } else {
          cx = event.clientX; cy = event.clientY;
        }
        mouse.x =  ((cx - rect.left) / rect.width)  * 2 - 1;
        mouse.y = -((cy - rect.top)  / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const meshes = [
          ...panels.map(p => p.mesh),
          ...staffPanels.map(p => p.mesh),
          ...doorMeshes.map(d => d.mesh)
        ];
        return raycaster.intersectObjects(meshes, true);
      }

      renderer.domElement.addEventListener('mousemove', e => {
        const hits = getIntersected(e);
        if (hits.length > 0) {
          const mesh = hits[0].object;
          const sMesh = findStaffPanelMesh(mesh);
          const target = sMesh || mesh;
          if (hoveredMesh !== target) {
            if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.emissiveIntensity !== undefined)
              hoveredMesh.material.emissiveIntensity = 0;
            hoveredMesh = target;
            if (hoveredMesh.material) {
              hoveredMesh.material.emissive && hoveredMesh.material.emissive.set(C_GOLD);
              hoveredMesh.material.emissiveIntensity = 0.22;
            }
            renderer.domElement.style.cursor = 'pointer';
          }
        } else {
          if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.emissiveIntensity !== undefined)
            hoveredMesh.material.emissiveIntensity = 0;
          hoveredMesh = null;
          renderer.domElement.style.cursor = 'grab';
        }
      });

      function findStaffPanelMesh(mesh) {
        const found = staffPanels.find(p => p.mesh === mesh);
        return found ? found.mesh : null;
      }

      function findStaffActorFromMesh(mesh) {
        const direct = staffPanels.find(p => p.mesh === mesh);
        if (direct) return direct.staffActor;
        if (mesh.userData && mesh.userData.staffActor) return mesh.userData.staffActor;
        return null;
      }

      let pointerDownTime = 0;
      renderer.domElement.addEventListener('pointerdown', () => { pointerDownTime = Date.now(); });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Date.now() - pointerDownTime > 200) return;
        handleClick(e);
      });
      let touchStartX, touchStartY;
      renderer.domElement.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', e => {
        const ddx = Math.abs(e.changedTouches[0].clientX - touchStartX);
        const ddy = Math.abs(e.changedTouches[0].clientY - touchStartY);
        if (ddx < 8 && ddy < 8) handleClick(e);
      }, { passive: true });

      function handleClick(e) {
        if (isTransitioning) return;
        const hits = getIntersected(e);
        if (hits.length === 0) return;
        const mesh = hits[0].object;

        const dEntry = doorMeshes.find(d => d.mesh === mesh);
        if (dEntry) { gotoRoom(dEntry.toRoom); return; }

        const pEntry = panels.find(p => p.mesh === mesh);
        if (pEntry) {
          if (pEntry.item.isPortrait) {
            const sData = (window.SHOWROOM_STAFF || []).find(s => s.id === pEntry.item.staffId);
            if (sData) {
              const actor = staffActors.find(a => a.staff.id === sData.id) || null;
              if (actor) actor.pauseFor();
              showStaffCard(sData, mesh, actor);
            }
          } else if (pEntry.item.isLink) { showLinkCard(pEntry.item); }
          else { showCard(pEntry.item, mesh); }
          return;
        }

        const sActor = findStaffActorFromMesh(mesh);
        if (sActor) { sActor.pauseFor(); showStaffCard(sActor.staff, mesh, sActor); }
      }

      // ============================================================
      // カード表示
      // ============================================================
      let activeStaffActor = null;

      function closeAllCards() { hideCard(); hideStaffCard(); }

      function showCard(item, mesh) {
        document.getElementById('staff-card').classList.remove('visible');
        document.getElementById('card-name').textContent     = item.name;
        document.getElementById('card-lead').textContent     = item.lead || '';
        document.getElementById('card-material').textContent = item.material || '';
        document.getElementById('card-price').textContent    = item.price || '';
        const btn = document.getElementById('card-btn');
        if (item.url && item.url.trim() !== '') {
          btn.href = item.url; btn.textContent = '購入ページへ';
          btn.classList.remove('disabled');
          btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        } else {
          btn.href = '#'; btn.textContent = '準備中';
          btn.classList.add('disabled');
        }
        document.getElementById('info-card').classList.add('visible');
        selectMesh(mesh, C_GOLD);
      }

      function showLinkCard(link) {
        document.getElementById('staff-card').classList.remove('visible');
        document.getElementById('card-name').textContent     = link.name;
        document.getElementById('card-lead').textContent     = link.lead || '';
        document.getElementById('card-material').textContent = '';
        document.getElementById('card-price').textContent    = '';
        const btn = document.getElementById('card-btn');
        btn.href = link.url; btn.textContent = link.btnLabel;
        btn.classList.remove('disabled');
        btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        document.getElementById('info-card').classList.add('visible');
      }

      function hideCard() {
        document.getElementById('info-card').classList.remove('visible');
        deselectMesh();
      }

      function showStaffCard(staff, mesh, actor) {
        hideCard();
        activeStaffActor = actor || null;
        const line = staff.lines[Math.floor(Math.random() * staff.lines.length)];
        document.getElementById('sc-name').textContent = staff.name;
        document.getElementById('sc-role').textContent = staff.role;
        document.getElementById('sc-line').textContent = line;
        const av = document.getElementById('sc-avatar');
        av.onerror = () => { av.onerror = null; av.src = staff.image; };
        av.src = `assets/mascot/${staff.id}.png`; av.alt = staff.name;
        const btn = document.getElementById('sc-btn');
        btn.href = staff.btnUrl; btn.textContent = staff.btnLabel;
        if (staff.btnUrl.startsWith('http')) {
          btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        } else {
          btn.removeAttribute('target'); btn.removeAttribute('rel');
        }
        document.getElementById('staff-card').classList.add('visible');
        selectMesh(mesh, C_GOLD);
        if (typeof initChat === 'function') initChat(staff.id);
      }

      function hideStaffCard() {
        document.getElementById('staff-card').classList.remove('visible');
        deselectMesh();
        if (activeStaffActor) { activeStaffActor.resume(); activeStaffActor = null; }
      }

      function selectMesh(mesh, color) {
        if (selectedMesh && selectedMesh !== mesh && selectedMesh.material)
          selectedMesh.material.emissiveIntensity = 0;
        selectedMesh = mesh;
        if (mesh && mesh.material) {
          mesh.material.emissive && mesh.material.emissive.set(color);
          mesh.material.emissiveIntensity = 0.32;
        }
      }
      function deselectMesh() {
        if (selectedMesh && selectedMesh.material) selectedMesh.material.emissiveIntensity = 0;
        selectedMesh = null;
      }

      document.getElementById('card-close').addEventListener('click', hideCard);
      document.getElementById('sc-close').addEventListener('click',   hideStaffCard);

      // ============================================================
      // リサイズ
      // ============================================================
      function onResize() {
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w / h; camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', onResize);

      // ============================================================
      // アニメーションループ
      // ============================================================
      function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4-2*t)*t; }
      const PLATE_ROT_SPEED = 0.3; // rad/s

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // カメラアニメーション
        if (camAnim) {
          camAnim.t += dt / camAnim.duration;
          if (camAnim.t >= 1) {
            camAnim.t = 1;
            camera.position.copy(camAnim.toPos);
            controls.target.copy(camAnim.toTarget);
            controls.update();
            const done = camAnim.onDone;
            camAnim = null;
            done && done();
          } else {
            const e = easeInOut(camAnim.t);
            camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
            controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, e);
            controls.update();
          }
        } else {
          controls.update();
        }

        // ショーケース内プレート回転
        showcasePlates.forEach(sp => {
          sp.mesh.rotation.y += PLATE_ROT_SPEED * dt;
        });

        // 幕僚巡回更新
        staffActors.forEach(actor => actor.update(dt));

        renderer.render(scene, camera);
      }
      animate();

      // ============================================================
      // SHOWROOM_API（恒久・削除しない）
      // ============================================================
      window.SHOWROOM_API = {
        gotoRoom(id) { gotoRoom(id); },
        getRoom()    { return currentRoomId; },
        staffActors
      };

    } catch(err) {
      console.error('Three.js initialization failed:', err);
      showFallback();
    }

    // ============================================================
    // UI イベント
    // ============================================================
    document.querySelectorAll('#room-menu button').forEach(btn => {
      btn.addEventListener('click', () => {
        const roomId = btn.dataset.room;
        if (window.SHOWROOM_API) window.SHOWROOM_API.gotoRoom(roomId);
        document.getElementById('room-menu').classList.remove('open');
      });
    });
    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('room-menu').classList.toggle('open');
    });
    document.getElementById('btn-back-hall').addEventListener('click', () => {
      if (window.SHOWROOM_API) window.SHOWROOM_API.gotoRoom('hall');
    });
    const overlay = document.getElementById('guide-overlay');
    function dismissOverlay() {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.4s';
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
    }
    overlay.addEventListener('click',    dismissOverlay);
    overlay.addEventListener('touchend', dismissOverlay, { passive: true });

  </script>
