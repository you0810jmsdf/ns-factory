<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N's factory SHOWROOM | Web 3D ショールーム</title>
  <meta name="description" content="N's factory の革工房をバーチャルで体験。5つの部屋でレザークラフト製品・カタカムナグッズ・工房の世界をご覧いただけます。">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ND1T7H067Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ND1T7H067Y');
  </script>

  <!-- Three.js importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three/addons/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/libs/meshopt_decoder.module.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/meshopt_decoder.module.js"
    }
  }
  </script>

  <!-- データファイル -->
  <script src="data/showroomData.js"></script>
  <script src="data/staffData.js"></script>
  <script src="data/config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1D1D1F;
      --accent: #A0785A;
      --bg: #F5F5F7;
      --card-bg: #FFFFFF;
      --text-sub: #6E6E73;
      --font: -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--primary);
      font-family: var(--font);
      overflow: hidden;
    }

    /* ===== ヘッダー ===== */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(29,29,31,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      gap: 8px;
    }
    #header a.back {
      color: #F5F5F7;
      text-decoration: none;
      font-size: 13px;
      opacity: 0.75;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #header a.back:hover { opacity: 1; }
    #header .title {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    /* ===== 部屋メニュー ===== */
    #room-menu {
      position: fixed;
      top: 52px; right: 0;
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 8px;
      background: rgba(29,29,31,0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom-left-radius: 14px;
      min-width: 120px;
    }
    #room-menu .menu-title {
      color: rgba(255,255,255,0.45);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0 6px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 2px;
    }
    #room-menu button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      font-family: var(--font);
      text-align: left;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    #room-menu button:hover,
    #room-menu button.active {
      background: rgba(160,120,90,0.35);
      color: #FFFFFF;
    }
    /* スマホ: ハンバーガー収納 */
    #menu-toggle {
      display: none;
      position: fixed;
      top: 58px; right: 8px;
      z-index: 120;
      background: rgba(29,29,31,0.85);
      border: none;
      color: #FFF;
      font-size: 20px;
      width: 38px; height: 38px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    @media (max-width: 540px) {
      #menu-toggle { display: flex; }
      #room-menu {
        transform: translateX(110%);
        transition: transform 0.25s ease;
        top: 52px;
        border-radius: 0 0 0 14px;
      }
      #room-menu.open {
        transform: translateX(0);
      }
    }

    /* ===== 現在部屋インジケーター ===== */
    #room-indicator {
      position: fixed;
      bottom: 72px; left: 50%;
      transform: translateX(-50%);
      background: rgba(29,29,31,0.72);
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 110;
      letter-spacing: 0.06em;
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    /* ===== 戻るボタン（ホール以外で表示） ===== */
    #btn-back-hall {
      position: fixed;
      bottom: 72px; left: 16px;
      background: rgba(29,29,31,0.82);
      color: rgba(255,255,255,0.85);
      border: none;
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 110;
      display: none;
      transition: background 0.2s;
    }
    #btn-back-hall:hover { background: rgba(160,120,90,0.7); }

    /* ===== 3Dキャンバス ===== */
    #canvas-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
    }
    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== 操作ガイドオーバーレイ ===== */
    #guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      cursor: pointer;
    }
    #guide-overlay .guide-box {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 18px;
      padding: 32px 40px;
      text-align: center;
      color: #fff;
      backdrop-filter: blur(10px);
      max-width: 340px;
    }
    #guide-overlay .guide-box h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.06em;
    }
    #guide-overlay .guide-box .room-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }
    #guide-overlay .guide-box .room-chip {
      background: rgba(160,120,90,0.3);
      border: 1px solid rgba(160,120,90,0.5);
      color: rgba(255,255,255,0.9);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
    }
    #guide-overlay .guide-box ul {
      list-style: none;
      font-size: 13px;
      line-height: 2;
      opacity: 0.85;
      margin-bottom: 4px;
    }
    #guide-overlay .guide-box .tap-hint {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.55;
    }

    /* ===== 商品情報カード ===== */
    #info-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 24px 32px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 150;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
      max-height: 60vh;
      overflow-y: auto;
    }
    #info-card.visible { transform: translateY(0); }
    #info-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    #info-card .card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      flex: 1;
      line-height: 1.4;
    }
    #info-card .card-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px;
      line-height: 1;
    }
    #info-card .card-lead {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    #info-card .card-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    #info-card .card-meta span { font-size: 13px; color: var(--text-sub); }
    #info-card .card-meta strong { color: var(--primary); }
    #info-card .card-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
    }
    #info-card .btn-purchase {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #info-card .btn-purchase:hover { background: #3a3a3c; }
    #info-card .btn-purchase.disabled {
      background: #C7C7CC;
      cursor: default;
      pointer-events: none;
    }

    /* ===== 接客カード ===== */
    #staff-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 24px 32px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 151;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
      max-height: 60vh;
      overflow-y: auto;
    }
    #staff-card.visible { transform: translateY(0); }
    #staff-card .sc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    #staff-card .sc-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    #staff-card .sc-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2px solid var(--accent);
      background: #e5e5ea;
      flex-shrink: 0;
    }
    #staff-card .sc-names { display: flex; flex-direction: column; gap: 2px; }
    #staff-card .sc-name { font-size: 17px; font-weight: 700; color: var(--primary); line-height: 1.3; }
    #staff-card .sc-role { font-size: 12px; color: var(--text-sub); }
    #staff-card .sc-close {
      background: none; border: none;
      font-size: 22px; cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px; line-height: 1;
    }
    #staff-card .sc-line {
      font-size: 15px;
      color: var(--primary);
      line-height: 1.7;
      margin-bottom: 20px;
      padding: 14px 16px;
      background: #F5F5F7;
      border-radius: 12px;
      border-left: 3px solid var(--accent);
    }
    #staff-card .sc-line::before { content: '\300C'; }
    #staff-card .sc-line::after  { content: '\300D'; }
    #staff-card .btn-staff {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #staff-card .btn-staff:hover { background: #8a6449; }

    /* ===== チャットUI ===== */
    #chat-area {
      margin-top: 14px;
      border-top: 1px solid #E5E5EA;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #chat-area.chat-closed {
      opacity: 0.5;
      pointer-events: none;
    }
    #chat-messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px 2px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 88%;
    }
    .chat-msg.user { align-self: flex-end; align-items: flex-end; }
    .chat-msg.staff { align-self: flex-start; align-items: flex-start; }
    .chat-bubble {
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
    }
    .chat-msg.user .chat-bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.staff .chat-bubble {
      background: #F5F5F7;
      color: var(--primary);
      border-bottom-left-radius: 4px;
      border-left: 2px solid var(--accent);
    }
    .chat-bubble.fallback-notice {
      font-size: 11px;
      color: var(--text-sub);
      background: #FFF3CD;
      border-left: 2px solid #FFC107;
    }
    .chat-typing {
      align-self: flex-start;
      background: #F5F5F7;
      padding: 8px 14px;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      font-size: 16px;
      letter-spacing: 4px;
      color: var(--text-sub);
      border-left: 2px solid var(--accent);
    }
    #chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #D1D1D6;
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 80px;
      overflow-y: auto;
      transition: border-color 0.2s;
      background: #FAFAFA;
    }
    #chat-input:focus { border-color: var(--accent); background: #fff; }
    #chat-send {
      flex-shrink: 0;
      width: 40px; height: 40px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      line-height: 1;
    }
    #chat-send:hover { background: #8a6449; }
    #chat-send:disabled { background: #C7C7CC; cursor: default; }
    .chat-limit-msg {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      padding: 6px 0;
      font-style: italic;
    }
    /* スマホキーボード表示時のカード崩れ防止 */
    @media (max-height: 500px) {
      #staff-card { max-height: 90vh; }
      #chat-messages { max-height: 100px; }
    }

    /* ===== フォールバック ===== */
    #fallback {
      display: none;
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: 24px 16px 40px;
      background: var(--bg);
    }
    #fallback h2 {
      font-size: 15px; color: var(--text-sub);
      margin-bottom: 20px; text-align: center;
    }
    .fallback-section-title {
      font-size: 13px; color: var(--text-sub);
      margin: 24px 0 12px; text-align: center;
      font-weight: 600; letter-spacing: 0.06em;
      grid-column: 1 / -1;
    }
    .fallback-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .fallback-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .fallback-card img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover; background: #e5e5ea;
    }
    .fallback-card .fc-body { padding: 12px; }
    .fallback-card .fc-name { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
    .fallback-card .fc-price { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    .fallback-card a {
      display: block; text-align: center;
      padding: 8px; background: var(--primary);
      color: #fff; border-radius: 8px; font-size: 12px; text-decoration: none;
    }
    .fallback-card a.disabled { background: #C7C7CC; pointer-events: none; }
    .fallback-staff-card {
      background: var(--card-bg);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .fallback-staff-card img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; object-position: top; background: #e5e5ea;
    }
    .fallback-staff-card .fc-body { padding: 10px 12px 12px; }
    .fallback-staff-card .fc-name { font-size: 13px; font-weight: 700; line-height: 1.4; margin-bottom: 2px; }
    .fallback-staff-card .fc-role { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }
    .fallback-staff-card a {
      display: block; text-align: center; padding: 8px;
      background: var(--accent); color: #fff; border-radius: 8px; font-size: 12px; text-decoration: none;
    }
    .fallback-link-card {
      background: var(--card-bg);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 14px;
    }
    .fallback-link-card .fc-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .fallback-link-card .fc-lead { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; line-height: 1.5; }
    .fallback-link-card a {
      display: block; text-align: center; padding: 8px;
      background: var(--accent); color: #fff; border-radius: 8px; font-size: 12px; text-decoration: none;
    }

    @media (max-width: 480px) {
      #info-card { padding: 20px 16px 28px; }
      #info-card .card-name { font-size: 15px; }
      #staff-card { padding: 20px 16px 28px; }
      #staff-card .sc-name { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header id="header">
    <a class="back" href="../index.html">&#8592; トップ</a>
    <span class="title">N's factory SHOWROOM</span>
    <span style="width:60px"></span>
  </header>

  <!-- ハンバーガーボタン（スマホ） -->
  <button id="menu-toggle" aria-label="部屋メニュー">&#9776;</button>

  <!-- 部屋メニュー -->
  <nav id="room-menu">
    <div class="menu-title">ROOMS</div>
    <button data-room="hall"       class="active">ホール</button>
    <button data-room="techo"             >手帳の間</button>
    <button data-room="katakamuna"        >カタカムナの間</button>
    <button data-room="koubou"            >工房の間</button>
    <button data-room="gallery"           >幕僚ギャラリー</button>
  </nav>

  <!-- 現在部屋 -->
  <div id="room-indicator">エントランスホール</div>

  <!-- ホールへ戻るボタン -->
  <button id="btn-back-hall">&#8592; ホールへ戻る</button>

  <!-- 操作ガイド -->
  <div id="guide-overlay">
    <div class="guide-box">
      <h2>Web 3D ショールーム</h2>
      <div class="room-list">
        <span class="room-chip">ホール</span>
        <span class="room-chip">手帳の間</span>
        <span class="room-chip">カタカムナの間</span>
        <span class="room-chip">工房の間</span>
        <span class="room-chip">幕僚ギャラリー</span>
      </div>
      <ul>
        <li>ドラッグ / スワイプで見回す</li>
        <li>ホイール / ピンチでズーム</li>
        <li>ドアをクリックで入室</li>
        <li>商品・幕僚をタップで詳細表示</li>
      </ul>
      <p class="tap-hint">画面をタップして入場</p>
    </div>
  </div>

  <!-- 3Dキャンバス -->
  <div id="canvas-container"></div>

  <!-- 商品情報カード -->
  <div id="info-card">
    <div class="card-header">
      <p class="card-name" id="card-name"></p>
      <button class="card-close" id="card-close">&#x2715;</button>
    </div>
    <p class="card-lead" id="card-lead"></p>
    <div class="card-meta">
      <span><strong>素材</strong>: <span id="card-material"></span></span>
    </div>
    <p class="card-price" id="card-price"></p>
    <a class="btn-purchase" id="card-btn" href="#" target="_blank" rel="noopener">購入ページへ</a>
  </div>

  <!-- 接客カード -->
  <div id="staff-card">
    <div class="sc-header">
      <div class="sc-title">
        <img class="sc-avatar" id="sc-avatar" src="" alt="">
        <div class="sc-names">
          <p class="sc-name" id="sc-name"></p>
          <p class="sc-role" id="sc-role"></p>
        </div>
      </div>
      <button class="sc-close" id="sc-close">&#x2715;</button>
    </div>
    <p class="sc-line" id="sc-line"></p>
    <a class="btn-staff" id="sc-btn" href="#" target="_blank" rel="noopener"></a>

    <!-- チャットUI -->
    <div id="chat-area">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <textarea id="chat-input" rows="1" placeholder="メッセージを入力..." maxlength="200"></textarea>
        <button id="chat-send" aria-label="送信">&#x27A4;</button>
      </div>
    </div>
  </div>

  <!-- フォールバック -->
  <div id="fallback">
    <h2>3D表示に対応していない環境のため、通常表示しています。</h2>
    <div class="fallback-grid" id="fallback-grid"></div>
  </div>

  <!-- ===== チャット機能（非モジュール・WebGLフォールバック時も動作） ===== -->
  <script>
    // 幕僚ごとの会話履歴 { staffId: [{role,text}] }
    var chatHistories = {};
    // 幕僚ごとの往復カウント { staffId: number }
    var chatTurnCount = {};
    var CHAT_MAX_TURNS = 10;
    var CHAT_HISTORY_MAX = 8;
    var currentChatStaffId = null;
    var isChatSending = false;

    function getFallbackLines(staffId) {
      var staff = (window.SHOWROOM_STAFF || []).find(function(s){ return s.id === staffId; });
      return (staff && staff.lines) ? staff.lines : ['少々お待ちください。'];
    }

    function initChat(staffId) {
      currentChatStaffId = staffId;
      isChatSending = false;
      var area = document.getElementById('chat-area');
      if (!area) return;
      area.classList.remove('chat-closed');
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-input').value = '';
      var sendBtn = document.getElementById('chat-send');
      if (sendBtn) sendBtn.disabled = false;
      var turns = chatTurnCount[staffId] || 0;
      if (turns >= CHAT_MAX_TURNS) { showChatLimit(); }
    }

    function appendStaffMsg(text, isFallback) {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-msg staff';
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble' + (isFallback ? ' fallback-notice' : '');
      bubble.textContent = text + (isFallback ? '\n（AIスタッフは席を外しています）' : '');
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function appendUserMsg(text) {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-msg user';
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.textContent = text;
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function showTyping() {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.id = 'typing-indicator';
      div.className = 'chat-typing';
      div.textContent = '…';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function hideTyping() {
      var el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function showChatLimit() {
      var msgs = document.getElementById('chat-messages');
      if (!msgs) return;
      var div = document.createElement('div');
      div.className = 'chat-limit-msg';
      div.textContent = 'ありがとうございます。続きはぜひ実物でお会いしましょう。';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      var area = document.getElementById('chat-area');
      if (area) area.classList.add('chat-closed');
    }

    function sendChat() {
      if (isChatSending) return;
      var input = document.getElementById('chat-input');
      var sendBtn = document.getElementById('chat-send');
      var text = input ? input.value.trim() : '';
      if (!text || !currentChatStaffId) return;
      if (text.length > 200) return;

      var staffId = currentChatStaffId;
      var turns = chatTurnCount[staffId] || 0;
      if (turns >= CHAT_MAX_TURNS) { showChatLimit(); return; }

      isChatSending = true;
      if (sendBtn) sendBtn.disabled = true;
      if (input) input.value = '';

      appendUserMsg(text);
      if (!chatHistories[staffId]) chatHistories[staffId] = [];
      chatHistories[staffId].push({ role: 'user', text: text });

      showTyping();

      var apiUrl = (window.SHOWROOM_CONFIG && window.SHOWROOM_CONFIG.chatApi) || '';
      var historySlice = chatHistories[staffId].slice(-CHAT_HISTORY_MAX - 1, -1);

      if (apiUrl) {
        var payload = JSON.stringify({
          staffId: staffId,
          message: text,
          history: historySlice
        });
        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: payload
        }).then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function(data) {
          hideTyping();
          var reply, isFallback;
          if (data.fallback || !data.reply) {
            var lines = getFallbackLines(staffId);
            reply = lines[Math.floor(Math.random() * lines.length)];
            isFallback = true;
          } else {
            reply = data.reply;
            isFallback = false;
          }
          appendStaffMsg(reply, isFallback);
          chatHistories[staffId].push({ role: 'model', text: reply });
          chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
          if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) {
            showChatLimit();
          }
          isChatSending = false;
          var area = document.getElementById('chat-area');
          if (area && !area.classList.contains('chat-closed')) {
            if (sendBtn) sendBtn.disabled = false;
            if (input) input.focus();
          }
        }).catch(function(err) {
          hideTyping();
          var lines = getFallbackLines(staffId);
          var reply = lines[Math.floor(Math.random() * lines.length)];
          appendStaffMsg(reply, true);
          chatHistories[staffId].push({ role: 'model', text: reply });
          chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
          if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) { showChatLimit(); }
          isChatSending = false;
          if (sendBtn) sendBtn.disabled = false;
        });
      } else {
        // APIキー未設定 → フォールバック即時
        hideTyping();
        var lines = getFallbackLines(staffId);
        var reply = lines[Math.floor(Math.random() * lines.length)];
        appendStaffMsg(reply, true);
        chatHistories[staffId].push({ role: 'model', text: reply });
        chatTurnCount[staffId] = (chatTurnCount[staffId] || 0) + 1;
        if (chatTurnCount[staffId] >= CHAT_MAX_TURNS) { showChatLimit(); }
        isChatSending = false;
        if (sendBtn) sendBtn.disabled = false;
      }
    }

    // DOMContentLoaded後にイベントリスナーを登録
    document.addEventListener('DOMContentLoaded', function() {
      var sendBtn = document.getElementById('chat-send');
      if (sendBtn) sendBtn.addEventListener('click', sendChat);
      var chatInput = document.getElementById('chat-input');
      if (chatInput) {
        chatInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat();
          }
        });
      }
    });
  </script>

  <!-- ===== メインスクリプト ===== -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // ============================================================
    // フォールバック（WebGL非対応時）
    // ============================================================
    function showFallback() {
      document.getElementById('canvas-container').style.display = 'none';
      document.getElementById('guide-overlay').style.display   = 'none';
      document.getElementById('room-menu').style.display       = 'none';
      document.getElementById('room-indicator').style.display  = 'none';
      document.getElementById('btn-back-hall').style.display   = 'none';
      document.getElementById('menu-toggle').style.display     = 'none';
      const fb   = document.getElementById('fallback');
      const grid = document.getElementById('fallback-grid');
      fb.style.display = 'block';

      const rooms = window.SHOWROOM_ROOMS || [];
      let html = '';
      rooms.forEach(room => {
        if (room.items.length === 0 && room.links.length === 0) return;
        html += `<div class="fallback-section-title" style="grid-column:1/-1">— ${room.name} —</div>`;
        room.items.forEach(item => {
          const hasUrl = item.url && item.url.trim() !== '';
          html += `
            <div class="fallback-card">
              <img src="${item.image}" alt="${item.name}" loading="lazy"
                   onerror="this.style.background='#e5e5ea';this.removeAttribute('src')">
              <div class="fc-body">
                <p class="fc-name">${item.name}</p>
                <p class="fc-price">${item.price || '準備中'}</p>
                <a href="${hasUrl ? item.url : '#'}" class="${hasUrl ? '' : 'disabled'}"
                   ${hasUrl ? 'target="_blank" rel="noopener"' : ''}>
                  ${hasUrl ? '購入ページへ' : '準備中'}
                </a>
              </div>
            </div>`;
        });
        room.links.forEach(link => {
          html += `
            <div class="fallback-link-card">
              <p class="fc-name">${link.name}</p>
              <p class="fc-lead">${link.lead}</p>
              <a href="${link.url}" target="_blank" rel="noopener">${link.btnLabel}</a>
            </div>`;
        });
      });

      // スタッフカード
      const staffList = window.SHOWROOM_STAFF || [];
      if (staffList.length > 0) {
        html += `<div class="fallback-section-title" style="grid-column:1/-1">— スタッフ紹介 —</div>`;
        html += staffList.map(s => `
          <div class="fallback-staff-card" data-staff-id="${s.id}">
            <img src="assets/mascot/${s.id}.png" alt="${s.name}" loading="lazy"
                 onerror="this.src='${s.image}'"
                 style="object-fit:contain;background:#F5F5F7;">
            <div class="fc-body">
              <p class="fc-name">${s.name}</p>
              <p class="fc-role">${s.role}</p>
              <a href="${s.btnUrl}" target="_blank" rel="noopener">${s.btnLabel}</a>
              <button class="fallback-chat-btn" data-staff-id="${s.id}"
                style="margin-top:6px;display:block;width:100%;padding:7px;background:#F5F5F7;border:1px solid #D1D1D6;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;">
                話しかける
              </button>
            </div>
          </div>`).join('');
      }
      grid.innerHTML = html;

      // フォールバック側チャット起動
      grid.querySelectorAll('.fallback-chat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sid = btn.dataset.staffId;
          const staffData = (window.SHOWROOM_STAFF || []).find(s => s.id === sid);
          if (!staffData) return;
          // 3DのstaffCardをポップアップとして流用
          const line = staffData.lines[Math.floor(Math.random() * staffData.lines.length)];
          document.getElementById('sc-name').textContent = staffData.name;
          document.getElementById('sc-role').textContent = staffData.role;
          document.getElementById('sc-line').textContent = line;
          const av = document.getElementById('sc-avatar');
          av.onerror = () => { av.onerror = null; av.src = staffData.image; };
          av.src = `assets/mascot/${staffData.id}.png`; av.alt = staffData.name;
          const scBtn = document.getElementById('sc-btn');
          scBtn.href = staffData.btnUrl; scBtn.textContent = staffData.btnLabel;
          if (staffData.btnUrl.startsWith('http')) {
            scBtn.setAttribute('target','_blank'); scBtn.setAttribute('rel','noopener');
          } else {
            scBtn.removeAttribute('target'); scBtn.removeAttribute('rel');
          }
          document.getElementById('staff-card').classList.add('visible');
          document.getElementById('staff-card').style.zIndex = '300';
          if (typeof initChat === 'function') initChat(staffData.id);
        });
      });
    }

    function isWebGLAvailable() {
      try {
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch(e) { return false; }
    }
    if (!isWebGLAvailable()) { showFallback(); throw new Error('WebGL not supported'); }

    // ============================================================
    // 定数
    // ============================================================
    const ACCENT      = 0xA0785A;
    const FLOOR_COLOR = 0xC49A6C;
    const WALL_COLOR  = 0xEDE0D4;
    const CEIL_COLOR  = 0xF5F0EB;
    const DOOR_GLOW   = 0xFFD080;
    const ROOM_SIZE   = 10;   // 各部屋 10×10
    const ROOM_H      = 4.0;
    const CORRIDOR    = 14;   // 部屋間距離（中心間）

    // 部屋の配置（×字型）
    // hall=中央, techo=北, katakamuna=南, koubou=西, gallery=東
    const ROOM_OFFSETS = {
      hall:       { x:  0,         z:  0         },
      techo:      { x:  0,         z: -CORRIDOR  },
      katakamuna: { x:  0,         z:  CORRIDOR  },
      koubou:     { x: -CORRIDOR,  z:  0         },
      gallery:    { x:  CORRIDOR,  z:  0         }
    };

    // ドア定義: ホール→各部屋の方向
    const HALL_DOORS = [
      { toRoom: 'techo',      label: 'システム手帳の間', dx:  0,   dz: -1, wx:  0,         wz: -(ROOM_SIZE/2 - 0.12) },
      { toRoom: 'katakamuna', label: 'カタカムナ・教育の間', dx:  0,   dz:  1, wx:  0,         wz:  (ROOM_SIZE/2 - 0.12) },
      { toRoom: 'koubou',     label: '工房の間',          dx: -1,   dz:  0, wx: -(ROOM_SIZE/2 - 0.12), wz:  0 },
      { toRoom: 'gallery',    label: '幕僚ギャラリー',     dx:  1,   dz:  0, wx:  (ROOM_SIZE/2 - 0.12), wz:  0 }
    ];

    // カメラの部屋内デフォルト位置（部屋原点からのオフセット）
    const CAM_IN_ROOM = { camY: 1.8, camZ: 3.8, targetY: 1.6 };

    // ============================================================
    // Three.js 初期化
    // ============================================================
    let renderer, scene, camera, controls;
    let raycaster, mouse;
    let panels     = [];   // [{mesh, item}]
    let staffPanels= [];   // [{mesh, staffActor}] — staffActorは巡回管理オブジェクト
    let doorMeshes = [];   // [{mesh, toRoom, label}]
    let hoveredMesh  = null;
    let selectedMesh = null;
    let currentRoomId = 'hall';
    let isTransitioning = false;

    // カメラアニメーション状態
    let camAnim = null; // {fromPos, toPos, fromTarget, toTarget, t, duration, onDone}

    const clock = new THREE.Clock();
    const loader = new THREE.TextureLoader();
    const gltfLoader = new GLTFLoader();
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    try {
      const container = document.getElementById('canvas-container');

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1A1210);
      scene.fog = new THREE.FogExp2(0x1A1210, 0.04);

      camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 80);
      // 初期位置: ホール中央手前
      camera.position.set(0, CAM_IN_ROOM.camY, CAM_IN_ROOM.camZ);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, CAM_IN_ROOM.targetY, 0);
      controls.enablePan   = false;
      controls.minDistance = 1.5;
      controls.maxDistance = 8;
      controls.maxPolarAngle = Math.PI * 0.74;
      controls.minPolarAngle = Math.PI * 0.08;
      controls.update();

      raycaster = new THREE.Raycaster();
      mouse     = new THREE.Vector2();

      // ==============================================================
      // 全部屋のジオメトリ構築
      // ==============================================================
      const wallMat  = new THREE.MeshStandardMaterial({ color: WALL_COLOR, roughness: 0.82 });
      const floorMat = new THREE.MeshStandardMaterial({ color: FLOOR_COLOR, roughness: 0.85 });
      const ceilMat  = new THREE.MeshStandardMaterial({ color: CEIL_COLOR,  roughness: 0.9  });
      const moldMat  = new THREE.MeshStandardMaterial({ color: 0x7A5C40,    roughness: 0.6  });
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x5C3D1E,    roughness: 0.5, metalness: 0.15 });
      const sFrameMat= new THREE.MeshStandardMaterial({ color: 0x8B6914,    roughness: 0.45, metalness: 0.4  });

      const roomIds = ['hall','techo','katakamuna','koubou','gallery'];

      roomIds.forEach(roomId => {
        const off = ROOM_OFFSETS[roomId];
        const rx = off.x, rz = off.z;
        const hs = ROOM_SIZE / 2;

        // 床
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE, 10, 10), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(rx, 0, rz);
        floor.receiveShadow = true;
        scene.add(floor);

        // 天井
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.set(rx, ROOM_H, rz);
        scene.add(ceil);

        // 壁4面（開口部分は視覚的に省略・廊下との境界は霧で隠れる）
        const wallGeoms = [
          { geo: new THREE.PlaneGeometry(ROOM_SIZE, ROOM_H), pos: [rx, ROOM_H/2, rz - hs], ry: 0             }, // 奥
          { geo: new THREE.PlaneGeometry(ROOM_SIZE, ROOM_H), pos: [rx, ROOM_H/2, rz + hs], ry: Math.PI       }, // 手前
          { geo: new THREE.PlaneGeometry(ROOM_SIZE, ROOM_H), pos: [rx - hs, ROOM_H/2, rz], ry:  Math.PI/2   }, // 左
          { geo: new THREE.PlaneGeometry(ROOM_SIZE, ROOM_H), pos: [rx + hs, ROOM_H/2, rz], ry: -Math.PI/2   }  // 右
        ];
        wallGeoms.forEach(w => {
          const m = new THREE.Mesh(w.geo, wallMat);
          m.position.set(...w.pos);
          m.rotation.y = w.ry;
          m.receiveShadow = true;
          scene.add(m);
        });

        // 巾木モールディング（奥壁下）
        const mold = new THREE.Mesh(new THREE.BoxGeometry(ROOM_SIZE, 0.1, 0.07), moldMat);
        mold.position.set(rx, 0.05, rz - hs + 0.035);
        scene.add(mold);

        // 照明
        const spot = new THREE.SpotLight(0xFFF8F0, 2.2, 18, Math.PI * 0.38, 0.4, 1.6);
        spot.position.set(rx, ROOM_H - 0.2, rz);
        spot.target.position.set(rx, 0, rz - 1);
        spot.castShadow = true;
        spot.shadow.mapSize.set(512, 512);
        scene.add(spot);
        scene.add(spot.target);

        const ptL = new THREE.PointLight(0xFFE0B0, 0.7, 8, 2);
        ptL.position.set(rx - 3, 3, rz);
        scene.add(ptL);
        const ptR = new THREE.PointLight(0xFFE0B0, 0.7, 8, 2);
        ptR.position.set(rx + 3, 3, rz);
        scene.add(ptR);
      });

      // 環境光（全体）
      scene.add(new THREE.AmbientLight(0xFFF5E6, 0.45));

      // ==============================================================
      // ホールのドアパネル設置
      // ==============================================================
      const doorGlowMat = new THREE.MeshStandardMaterial({
        color: 0x3A2510, roughness: 0.5, metalness: 0.3,
        emissive: new THREE.Color(DOOR_GLOW), emissiveIntensity: 0.6
      });
      const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x5C3D1E, roughness: 0.5, metalness: 0.2 });
      const labelCanvas = document.createElement('canvas');
      labelCanvas.width = 256; labelCanvas.height = 64;

      HALL_DOORS.forEach(door => {
        const off = ROOM_OFFSETS['hall'];
        const wx = off.x + door.wx;
        const wz = off.z + door.wz;
        const ry = Math.atan2(door.dx, door.dz); // カメラ方向に面を向ける

        // 発光パネル（ドア本体）
        const dMat = new THREE.MeshStandardMaterial({
          color: 0x1A0E05, roughness: 0.45, metalness: 0.2,
          emissive: new THREE.Color(DOOR_GLOW), emissiveIntensity: 0.45
        });
        const dMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.0), dMat);
        dMesh.position.set(wx, 1.0, wz);
        dMesh.rotation.y = ry;
        dMesh.userData.door    = true;
        dMesh.userData.toRoom  = door.toRoom;
        dMesh.userData.label   = door.label;
        scene.add(dMesh);
        doorMeshes.push({ mesh: dMesh, toRoom: door.toRoom, label: door.label });

        // ドア枠
        const dfW = 1.2, dfH = 2.0, ft = 0.06;
        [[new THREE.BoxGeometry(dfW + ft*2, ft, ft), [0, dfH/2 + ft/2, 0]],
         [new THREE.BoxGeometry(dfW + ft*2, ft, ft), [0,-dfH/2 - ft/2, 0]],
         [new THREE.BoxGeometry(ft, dfH + ft*2, ft), [-dfW/2 - ft/2, 0, 0]],
         [new THREE.BoxGeometry(ft, dfH + ft*2, ft), [ dfW/2 + ft/2, 0, 0]]
        ].forEach(([geo, [ox,oy,oz]]) => {
          const b = new THREE.Mesh(geo, doorFrameMat);
          b.position.set(wx + ox, 1.0 + oy, wz + oz);
          b.rotation.y = ry;
          scene.add(b);
        });

        // ラベルテクスチャ（部屋名）
        const lc = document.createElement('canvas');
        lc.width = 512; lc.height = 80;
        const ctx = lc.getContext('2d');
        ctx.clearRect(0, 0, 512, 80);
        ctx.fillStyle = 'rgba(255,208,128,0.92)';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(door.label, 256, 40);
        const ltex = new THREE.CanvasTexture(lc);
        ltex.colorSpace = THREE.SRGBColorSpace;
        const lMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.4, 0.22),
          new THREE.MeshBasicMaterial({ map: ltex, transparent: true, depthWrite: false })
        );
        lMesh.position.set(wx, 2.22, wz);
        lMesh.rotation.y = ry;
        scene.add(lMesh);
      });

      // ==============================================================
      // 各部屋の出口ドア（ホール方向）
      // ==============================================================
      ['techo','katakamuna','koubou','gallery'].forEach(roomId => {
        const rOff = ROOM_OFFSETS[roomId];
        const hOff = ROOM_OFFSETS['hall'];
        // ホール方向の壁面中央
        const dx = Math.sign(hOff.x - rOff.x);
        const dz = Math.sign(hOff.z - rOff.z);
        const wx = rOff.x + dx * (ROOM_SIZE/2 - 0.12);
        const wz = rOff.z + dz * (ROOM_SIZE/2 - 0.12);
        const ry = Math.atan2(dx, dz);

        const exMat = new THREE.MeshStandardMaterial({
          color: 0x050F1A, roughness: 0.45, metalness: 0.2,
          emissive: new THREE.Color(0x80C0FF), emissiveIntensity: 0.3
        });
        const exMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.0), exMat);
        exMesh.position.set(wx, 1.0, wz);

        ctx.textAlign = 'center';

        const ltex = new THREE.CanvasTexture(lc);
        ltex.colorSpace = THREE.SRGBColorSpace;

          new THREE.PlaneGeometry(1.1, 0.18),
          new THREE.MeshBasicMaterial({ map: ltex, transparent: true, depthWrite: false })
        );

        lMesh.rotation.y = ry;

      });

      // ==============================================================
      // 商品パネル設置（部屋別）
      // ==============================================================
      function placeItemPanels(roomId) {
        const rooms  = window.SHOWROOM_ROOMS || [];

        const items = room.items;

        // パネル配置（奥壁・左壁・右壁に分散）
        const positions = buildPanelPositions(items.length, off);
        items.forEach((item, i) => {
          if (i >= positions.length) return;

          const placeholderColors = [0xC49A6C,0x8B7355,0xA0785A,0xD4B896,0x7A5C40,0xBE9B7B];

            color: placeholderColors[i % placeholderColors.length],
            roughness: 0.55,
            emissive: new THREE.Color(0x000000),

          });
          loader.load(item.image, tex => {
            tex.colorSpace = THREE.SRGBColorSpace;
            pMat.map = tex; pMat.color.set(0xFFFFFF); pMat.needsUpdate = true;
          }, undefined, () => {});

          const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.0), pMat);
          panel.position.set(pos.x, pos.y, pos.z);
          panel.rotation.y = pos.ry;
          panel.userData.item = item;
          scene.add(panel);
          panels.push({ mesh: panel, item });

          // 額縁
          addFrame(pos, 1.4, 1.0, frameMat);
        });

        // リンクパネル配置
        const links = room.links || [];
        links.forEach((link, i) => {
          const lpos = buildLinkPanelPosition(i, links.length, off);
          const lMat = new THREE.MeshStandardMaterial({
            color: 0x2A1A0A, roughness: 0.6,
            emissive: new THREE.Color(0xA0785A), emissiveIntensity: 0.25
          });
          // ラベルテクスチャ
          const lc = document.createElement('canvas');
          lc.width = 512; lc.height = 256;
          const ctx = lc.getContext('2d');
          ctx.fillStyle = '#1D1108';
          ctx.fillRect(0, 0, 512, 256);
          ctx.fillStyle = '#FFD080';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(link.name, 256, 60);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.font = '18px sans-serif';
          wrapText(ctx, link.lead, 256, 110, 450, 26);
          ctx.fillStyle = '#A0785A';
          ctx.fillRect(130, 190, 252, 40);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 20px sans-serif';
          ctx.fillText(link.btnLabel, 256, 215);
          const ltex = new THREE.CanvasTexture(lc);
          ltex.colorSpace = THREE.SRGBColorSpace;
          lMat.map = ltex; lMat.needsUpdate = true;

          const lMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), lMat);
          lMesh.position.set(lpos.x, lpos.y, lpos.z);
          lMesh.rotation.y = lpos.ry;
          lMesh.userData.link = link;
          scene.add(lMesh);
          panels.push({ mesh: lMesh, item: { ...link, isLink: true } });
          addFrame(lpos, 1.6, 0.8, frameMat);
        });
      }

      // パネル配置計算（部屋サイズ10×10、奥壁・左壁・右壁）
      function buildPanelPositions(count, off) {
        const hs = ROOM_SIZE / 2;
        const base = [
          // 奥壁 3枚
          { x: off.x - 2.8, y: 2.0, z: off.z - hs + 0.08, ry: 0         },
          { x: off.x + 0.0, y: 2.0, z: off.z - hs + 0.08, ry: 0         },
          { x: off.x + 2.8, y: 2.0, z: off.z - hs + 0.08, ry: 0         },
          // 左壁 2枚
          { x: off.x - hs + 0.08, y: 2.0, z: off.z - 1.5, ry:  Math.PI/2 },
          { x: off.x - hs + 0.08, y: 2.0, z: off.z + 1.5, ry:  Math.PI/2 },
          // 右壁 1枚
          { x: off.x + hs - 0.08, y: 2.0, z: off.z - 1.5, ry: -Math.PI/2 }
        ];
        return base.slice(0, count);
      }

      function buildLinkPanelPosition(i, total, off) {
        const hs = ROOM_SIZE / 2;
        const positions = [
          { x: off.x + hs - 0.08, y: 2.0, z: off.z + 0.0, ry: -Math.PI/2 },
          { x: off.x + hs - 0.08, y: 2.0, z: off.z + 2.0, ry: -Math.PI/2 },
          { x: off.x + hs - 0.08, y: 2.0, z: off.z - 2.0, ry: -Math.PI/2 },
          { x: off.x - hs + 0.08, y: 2.0, z: off.z - 2.5, ry:  Math.PI/2 }
        ];
        return positions[i % positions.length];
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split('');
        let line = '';
        let curY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n];
          if (ctx.measureText(testLine).width > maxWidth && line !== '') {
            ctx.fillText(line, x, curY);
            line = words[n];
            curY += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, curY);
      }

      function addFrame(pos, w, h, mat) {
        const ft = 0.04, fd = 0.04;
        const fw = w + ft*2, fh = h + ft*2;
        [
          [new THREE.BoxGeometry(fw, ft, fd), [0,  fh/2 - ft/2, 0]],
          [new THREE.BoxGeometry(fw, ft, fd), [0, -fh/2 + ft/2, 0]],
          [new THREE.BoxGeometry(ft, fh, fd), [-fw/2 + ft/2, 0, 0]],
          [new THREE.BoxGeometry(ft, fh, fd), [ fw/2 - ft/2, 0, 0]]
        ].forEach(([geo, [ox,oy,oz]]) => {
          const b = new THREE.Mesh(geo, mat);
          b.position.set(pos.x + ox, pos.y + oy, pos.z + oz + 0.02);
          b.rotation.y = pos.ry;
          scene.add(b);
        });
      }

      // 全部屋のパネルを事前構築（遅延テクスチャロードで軽量維持）
      ['techo','katakamuna','koubou','gallery'].forEach(placeItemPanels);

      // ==============================================================
      // 幕僚ギャラリー: リアル調ポートレートを額装展示（壁面10枚）
      // Y=2.8 上段配置でリンクパネル(Y=2.0)と干渉回避
      // クリックで当該幕僚の接客カードを開く
      // ==============================================================

        const portraitPositions = [

      // ホールのリンクパネル
      (function() {

      // ==============================================================
      // 幕僚 立て看板アクター
      // ==============================================================
      // StaffActor: ビジュアル（看板メッシュ）と巡回ロジックを分離したオブジェクト
      class StaffActor {
        constructor(staff) {
          this.staff   = staff;
          this.roomId  = staff.room;
          this.rOff    = ROOM_OFFSETS[staff.room];

          // ウェイポイントをワールド座標に変換
          this.waypoints = (staff.waypoints || [[0,0]]).map(([lx, lz]) => ({
            x: this.rOff.x + lx,
            z: this.rOff.z + lz
          }));
          this.wpIdx    = 0;
          this.waitTime = 0;       // 停止残り時間(秒)
          this.speed    = 0.35 + Math.random() * 0.15; // 0.35〜0.5
          this.paused   = false;   // クリック停止中
          this.isGlbLoaded = false;    // GLBロード完了フラグ
          this._glbLoadStarted = false; // 二重ロード防止フラグ
          this._lastMoveAngle = 0;      // GLBモデル用: 最後の進行方向角度

          // ビジュアル — 立て看板（画像パネル＋台座）
          // 後日GLBに差し替える前提: this.visual だけ差し替えればよい
          this.visual = this._buildVisual(staff);

          // GLBロードは呼び出し元（gotoRoom / 初期化時）から triggerGlbLoad() で行う
          // ここでは即時ロードしない（部屋単位遅延ロード方式）
        }

        // 遅延ロード用メソッド: 初回呼び出し時のみGLBをロードする
        triggerGlbLoad() {
          if (!this.staff.model || this._glbLoadStarted) return;
          this._glbLoadStarted = true;
          this._loadGlbModel(this.staff);
        }

        _buildVisual(staff) {
          const group = new THREE.Group();

          // --- マスコット透過スプライト (PlaneGeometry + alphaTest) ---
          // キャラクター高さ 1.4、足元Y=0 基準
          const spriteH = 1.4;
          const spriteW = spriteH * 1.0; // 1:1画像なのでそのまま

          const spriteMat = new THREE.MeshBasicMaterial({
            color: 0xFFFFFF,
            transparent: true,
            alphaTest: 0.05,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          // マスコット画像パスを assets/mascot/{id}.png に向ける
          const mascotPath = `assets/mascot/${staff.id}.png`;
          loader.load(mascotPath, tex => {
            tex.colorSpace = THREE.SRGBColorSpace;
            spriteMat.map = tex;
            spriteMat.needsUpdate = true;
          }, undefined, () => {
            // フォールバック: staff.image をそのまま使用
            loader.load(staff.image, tex2 => {
              tex2.colorSpace = THREE.SRGBColorSpace;
              spriteMat.map = tex2;
              spriteMat.needsUpdate = true;
            }, undefined, () => {});
          });

          const pGeo = new THREE.PlaneGeometry(spriteW, spriteH);
          const pMesh = new THREE.Mesh(pGeo, spriteMat);
          // 足元がY=0になるようcentroid調整: Y=spriteH/2
          pMesh.position.set(0, spriteH / 2, 0);
          pMesh.userData.staffActor = this; // クリック用
          group.add(pMesh);
          this.panelMesh = pMesh;

          // --- 足元の薄い丸影 ---
          const shadowGeo = new THREE.CircleGeometry(0.28, 24);
          const shadowMat = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.18,
            depthWrite: false
          });
          const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
          shadowMesh.rotation.x = -Math.PI / 2;
          shadowMesh.position.set(0, 0.01, 0);
          group.add(shadowMesh);
          this._shadowMesh = shadowMesh;

          // --- 名前プレート（キャラ頭上） ---
          const nc = document.createElement('canvas');
          nc.width = 256; nc.height = 48;
          const nctx = nc.getContext('2d');
          nctx.clearRect(0, 0, 256, 48);
          nctx.fillStyle = 'rgba(29,8,0,0.72)';
          // 角丸背景
          const rx = 8;
          nctx.beginPath();
          nctx.moveTo(rx, 0); nctx.lineTo(256-rx, 0);
          nctx.quadraticCurveTo(256, 0, 256, rx);
          nctx.lineTo(256, 48-rx); nctx.quadraticCurveTo(256, 48, 256-rx, 48);
          nctx.lineTo(rx, 48); nctx.quadraticCurveTo(0, 48, 0, 48-rx);
          nctx.lineTo(0, rx); nctx.quadraticCurveTo(0, 0, rx, 0);
          nctx.closePath(); nctx.fill();
          nctx.fillStyle = '#FFD080'; nctx.font = 'bold 18px sans-serif';
          nctx.textAlign = 'center'; nctx.textBaseline = 'middle';
          nctx.fillText(staff.name, 128, 16);
          nctx.fillStyle = 'rgba(255,255,255,0.65)'; nctx.font = '13px sans-serif';
          nctx.fillText(staff.role, 128, 33);
          const ntex = new THREE.CanvasTexture(nc); ntex.colorSpace = THREE.SRGBColorSpace;
          const nMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(0.85, 0.16),
            new THREE.MeshBasicMaterial({ map: ntex, transparent: true, depthWrite: false })
          );
          // キャラ頭上に配置
          nMesh.position.set(0, spriteH + 0.12, 0);
          group.add(nMesh);
          this.nameMesh = nMesh;

          // 初期位置
          const wp0 = this.waypoints[0];
          group.position.set(wp0.x, 0, wp0.z);
          scene.add(group);
          return group;
        }

        // GLBモデルの非同期ロードと差し替え
        _loadGlbModel(staff) {
          const TARGET_HEIGHT = 1.4; // 正規化目標高さ (units)
          gltfLoader.load(
            staff.model,
            (gltf) => {
              try {
                const modelScene = gltf.scene;

                // --- スケール正規化: 全高を TARGET_HEIGHT に ---
                const box = new THREE.Box3().setFromObject(modelScene);
                const size = new THREE.Vector3();
                box.getSize(size);
                const modelHeight = size.y;
                if (modelHeight > 0) {
                  const scale = TARGET_HEIGHT / modelHeight;
                  modelScene.scale.setScalar(scale);
                }

                // --- 足元をY=0に接地 ---
                const box2 = new THREE.Box3().setFromObject(modelScene);
                const minY = box2.min.y;
                modelScene.position.y = -minY; // 足元オフセット補正

                // --- 影設定 ---
                modelScene.traverse(child => {
                  if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = false;
                    // クリック判定用: userData.staffActor をセット
                    child.userData.staffActor = this;
                  }
                });

                // --- スプライトを非表示にしてGLBに差し替え ---
                this.panelMesh.visible = false;
                this.nameMesh.position.set(0, TARGET_HEIGHT + 0.12, 0);
                this.visual.add(modelScene);
                this._glbScene = modelScene;

                // --- raycaster対象に子メッシュを登録 ---
                modelScene.traverse(child => {
                  if (child.isMesh) {
                    staffPanels.push({ mesh: child, staffActor: this });
                  }
                });

                this.isGlbLoaded = true;
                // 初期向きを保持
                this.visual.rotation.y = this._lastMoveAngle;
                console.log(`[GLB] ${this.staff.name} モデルロード完了`);
              } catch (e) {
                console.warn('[GLB] モデル組み込みエラー（スプライトで継続）:', e);
              }
            },
            undefined,
            (err) => {
              // ロード失敗時: 既存スプライトのまま動作継続（フォールバック）
              console.warn('[GLB] モデルロード失敗（スプライトで継続）:', err);
            }
          );
        }

        // 毎フレーム呼ぶ巡回更新（ビジュアルと独立したロジック）
        update(dt) {
          if (this.paused) return;

          if (this.waitTime > 0) {
            this.waitTime -= dt;
            // 軽い上下ボブ（停止中もゆらゆら）
            this.visual.position.y = Math.sin(Date.now() * 0.002) * 0.015;
            return;
          }

          const target = this.waypoints[this.wpIdx];
          const curX = this.visual.position.x;
          const curZ = this.visual.position.z;
          const dx = target.x - curX;
          const dz = target.z - curZ;
          const dist = Math.sqrt(dx*dx + dz*dz);

          if (dist < 0.05) {
            // ウェイポイント到達 → 停止
            this.visual.position.x = target.x;
            this.visual.position.z = target.z;
            this.wpIdx = (this.wpIdx + 1) % this.waypoints.length;
            this.waitTime = 2 + Math.random() * 3; // 2〜5秒
          } else {
            // 移動
            const step = Math.min(this.speed * dt, dist);
            this.visual.position.x += (dx / dist) * step;
            this.visual.position.z += (dz / dist) * step;

            // 進行方向へ向く（Y軸のみ）
            const targetAngle = Math.atan2(dx, dz);
            this._lastMoveAngle = targetAngle; // GLBモデル用に保持
            const curAngle = this.visual.rotation.y;
            let dAngle = targetAngle - curAngle;
            while (dAngle >  Math.PI) dAngle -= Math.PI * 2;
            while (dAngle < -Math.PI) dAngle += Math.PI * 2;
            this.visual.rotation.y += dAngle * Math.min(dt * 4, 1);

            // ボブ（歩行感）
            this.visual.position.y = Math.sin(Date.now() * 0.005) * 0.03;
          }

          // Billboard: GLBロード済みの場合は無効化（3Dモデルは実背面を持つため進行方向を保持）
          // スプライトの場合のみカメラ追従ビルボードを適用
          if (!this.isGlbLoaded) {
            const camDir = new THREE.Vector3();
            camDir.subVectors(camera.position, this.visual.position);
            camDir.y = 0;
            if (camDir.lengthSq() > 0.001) {
              this.visual.rotation.y = Math.atan2(camDir.x, camDir.z);
            }
          }
        }

        pauseFor(staff) {
          this.paused = true;
        }
        resume() {
          this.paused = false;
        }
      }

      // スタッフアクター生成
      const staffActors = (window.SHOWROOM_STAFF || []).map(s => new StaffActor(s));
      // staffPanels に登録（raycaster用）
      staffActors.forEach(actor => {
        staffPanels.push({ mesh: actor.panelMesh, staffActor: actor });
      });
      // 初期部屋（hall）のアクターはページロード直後にGLBをロード開始
      staffActors.forEach(actor => {
        if (actor.roomId === 'hall') actor.triggerGlbLoad();
      });

      // ==============================================================
      // カメラ遷移
      // ==============================================================
      function gotoRoom(roomId) {
        if (isTransitioning) return;
        const off = ROOM_OFFSETS[roomId];
        if (!off) { console.warn('SHOWROOM_API: 不明なroomId:', roomId); return; }

        isTransitioning = true;
        closeAllCards();

        const fromPos    = camera.position.clone();
        const fromTarget = controls.target.clone();
        // ホールに向かう方向から入室するよう入場位置を計算
        let entryDz = 0, entryDx = 0;
        if (roomId === 'hall') {
          entryDz = CAM_IN_ROOM.camZ;
        } else {
          // ホールからの方向の逆がカメラの位置
          const hallOff = ROOM_OFFSETS['hall'];
          const dirX = off.x - hallOff.x;
          const dirZ = off.z - hallOff.z;
          const len  = Math.sqrt(dirX*dirX + dirZ*dirZ);
          entryDx =-(dirX/len) * CAM_IN_ROOM.camZ;
          entryDz =-(dirZ/len) * CAM_IN_ROOM.camZ;
        }

        const toPos    = new THREE.Vector3(off.x + entryDx, CAM_IN_ROOM.camY, off.z + entryDz);
        const toTarget = new THREE.Vector3(off.x,           CAM_IN_ROOM.targetY, off.z);

        camAnim = {
          fromPos, toPos, fromTarget, toTarget,
          t: 0, duration: 1.0,
          onDone: () => {
            currentRoomId = roomId;
            isTransitioning = false;
            updateRoomUI(roomId);
            controls.target.copy(toTarget);
            controls.update();
            // 入室した部屋のアクターのGLBを遅延ロード（初回入室時のみ実行）
            staffActors.forEach(actor => {
              if (actor.roomId === roomId) actor.triggerGlbLoad();
            });
          }
        };
      }

      function updateRoomUI(roomId) {
        const rooms = window.SHOWROOM_ROOMS || [];
        const room  = rooms.find(r => r.id === roomId);
        const name  = room ? room.name : roomId;
        document.getElementById('room-indicator').textContent = name;
        document.querySelectorAll('#room-menu button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.room === roomId);
        });
        const backBtn = document.getElementById('btn-back-hall');
        backBtn.style.display = (roomId === 'hall') ? 'none' : 'block';
        gtag('event', 'room_enter', { room_id: roomId });
      }

      // ==============================================================
      // Raycaster & クリック
      // ==============================================================
      function getIntersected(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        let cx, cy;
        if (event.touches && event.touches.length > 0) {
          cx = event.touches[0].clientX; cy = event.touches[0].clientY;
        } else if (event.changedTouches && event.changedTouches.length > 0) {
          cx = event.changedTouches[0].clientX; cy = event.changedTouches[0].clientY;
        } else {
          cx = event.clientX; cy = event.clientY;
        }
        mouse.x =  ((cx - rect.left) / rect.width)  * 2 - 1;
        mouse.y = -((cy - rect.top)  / rect.height)  * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const meshes = [
          ...panels.map(p => p.mesh),
          ...staffPanels.map(p => p.mesh),
          ...doorMeshes.map(d => d.mesh)
        ];
        return raycaster.intersectObjects(meshes, true);
      }

      // ホバー
      renderer.domElement.addEventListener('mousemove', e => {
        const hits = getIntersected(e);
        if (hits.length > 0) {
          const mesh = hits[0].object;
          // staffActor配下メッシュを探す
          const sMesh = findStaffPanelMesh(mesh);
          const target = sMesh || mesh;
          if (hoveredMesh !== target) {
            if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.emissiveIntensity !== undefined)
              hoveredMesh.material.emissiveIntensity = 0;
            hoveredMesh = target;
            if (hoveredMesh.material) {
              hoveredMesh.material.emissive && hoveredMesh.material.emissive.set(0xA0785A);
              hoveredMesh.material.emissiveIntensity = 0.2;
            }
            renderer.domElement.style.cursor = 'pointer';
          }
        } else {
          if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.emissiveIntensity !== undefined)
            hoveredMesh.material.emissiveIntensity = 0;
          hoveredMesh = null;
          renderer.domElement.style.cursor = 'grab';
        }
      });

      function findStaffPanelMesh(mesh) {
        const found = staffPanels.find(p => p.mesh === mesh);
        return found ? found.mesh : null;
      }

      // GLBモデルの子メッシュからStaffActorを辿るヘルパー
      function findStaffActorFromMesh(mesh) {
        // 直接登録されている場合
        const direct = staffPanels.find(p => p.mesh === mesh);
        if (direct) return direct.staffActor;
        // userData.staffActor が付与されている場合（GLB子メッシュ）
        if (mesh.userData && mesh.userData.staffActor) return mesh.userData.staffActor;
        return null;
      }

      let pointerDownTime = 0;
      renderer.domElement.addEventListener('pointerdown', () => { pointerDownTime = Date.now(); });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Date.now() - pointerDownTime > 200) return;
        handleClick(e);
      });

      let touchStartX, touchStartY;
      renderer.domElement.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', e => {
        const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
        const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
        if (dx < 8 && dy < 8) handleClick(e);
      }, { passive: true });

      function handleClick(e) {
        if (isTransitioning) return;
        const hits = getIntersected(e);
        if (hits.length === 0) return;
        const mesh = hits[0].object;

        // ドアクリック
        const dEntry = doorMeshes.find(d => d.mesh === mesh);
        if (dEntry) { gotoRoom(dEntry.toRoom); return; }

        // 商品・リンクパネル（ポートレート含む）
        const pEntry = panels.find(p => p.mesh === mesh);
        if (pEntry) {
          if (pEntry.item.isPortrait) {
            // ギャラリーのリアルポートレートをクリック→幕僚接客カードを開く
            const sData = (window.SHOWROOM_STAFF || []).find(s => s.id === pEntry.item.staffId);
            if (sData) {
              // 巡回中のアクターを探して停止
              const actor = staffActors.find(a => a.staff.id === sData.id) || null;
              if (actor) actor.pauseFor(actor.staff);
              showStaffCard(sData, mesh, actor);
            }
          } else if (pEntry.item.isLink) { showLinkCard(pEntry.item); }
          else { showCard(pEntry.item, mesh); }
          return;
        }

        // スタッフ看板（GLBモデルの子メッシュにも対応）
        const sActor = findStaffActorFromMesh(mesh);
        if (sActor) {
          sActor.pauseFor(sActor.staff);
          showStaffCard(sActor.staff, mesh, sActor);
        }
      }

      // ==============================================================
      // カード表示
      // ==============================================================
      let activeStaffActor = null;

      function closeAllCards() {
        hideCard();
        hideStaffCard();
      }

      function showCard(item, mesh) {
        document.getElementById('staff-card').classList.remove('visible');
        document.getElementById('card-name').textContent    = item.name;
        document.getElementById('card-lead').textContent    = item.lead || '';
        document.getElementById('card-material').textContent= item.material || '';
        document.getElementById('card-price').textContent   = item.price || '';
        const btn = document.getElementById('card-btn');
        if (item.url && item.url.trim() !== '') {
          btn.href = item.url; btn.textContent = '購入ページへ';
          btn.classList.remove('disabled');
          btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        } else {
          btn.href = '#'; btn.textContent = '準備中';
          btn.classList.add('disabled');
        }
        document.getElementById('info-card').classList.add('visible');
        selectMesh(mesh, 0xA0785A);
      }

      function showLinkCard(link) {
        document.getElementById('staff-card').classList.remove('visible');
        document.getElementById('card-name').textContent     = link.name;
        document.getElementById('card-lead').textContent     = link.lead || '';
        document.getElementById('card-material').textContent = '';
        document.getElementById('card-price').textContent    = '';
        const btn = document.getElementById('card-btn');
        btn.href = link.url; btn.textContent = link.btnLabel;
        btn.classList.remove('disabled');
        btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        document.getElementById('info-card').classList.add('visible');
      }

      function hideCard() {
        document.getElementById('info-card').classList.remove('visible');
        deselectMesh();
      }

      function showStaffCard(staff, mesh, actor) {
        hideCard();
        activeStaffActor = actor || null;
        const line = staff.lines[Math.floor(Math.random() * staff.lines.length)];
        document.getElementById('sc-name').textContent = staff.name;
        document.getElementById('sc-role').textContent = staff.role;
        document.getElementById('sc-line').textContent = line;
        const av = document.getElementById('sc-avatar');
        // マスコット透過版を優先。読み込み失敗時は元画像にフォールバック
        av.onerror = () => { av.onerror = null; av.src = staff.image; };
        av.src = `assets/mascot/${staff.id}.png`; av.alt = staff.name;
        const btn = document.getElementById('sc-btn');
        btn.href = staff.btnUrl; btn.textContent = staff.btnLabel;
        if (staff.btnUrl.startsWith('http')) {
          btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener');
        } else {
          btn.removeAttribute('target'); btn.removeAttribute('rel');
        }
        document.getElementById('staff-card').classList.add('visible');
        selectMesh(mesh, 0xD4A853);
        // チャット初期化（APIキー未設定でも壊れない）
        if (typeof initChat === 'function') initChat(staff.id);
      }

      function hideStaffCard() {
        document.getElementById('staff-card').classList.remove('visible');
        deselectMesh();
        if (activeStaffActor) { activeStaffActor.resume(); activeStaffActor = null; }
      }

      function selectMesh(mesh, color) {
        if (selectedMesh && selectedMesh !== mesh && selectedMesh.material)
          selectedMesh.material.emissiveIntensity = 0;
        selectedMesh = mesh;
        if (mesh && mesh.material) {
          mesh.material.emissive && mesh.material.emissive.set(color);
          mesh.material.emissiveIntensity = 0.3;
        }
      }
      function deselectMesh() {
        if (selectedMesh && selectedMesh.material)
          selectedMesh.material.emissiveIntensity = 0;
        selectedMesh = null;
      }

      document.getElementById('card-close').addEventListener('click',   hideCard);
      document.getElementById('sc-close').addEventListener('click',     hideStaffCard);

      // ==============================================================
      // リサイズ
      // ==============================================================
      function onResize() {
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', onResize);

      // ==============================================================
      // アニメーションループ
      // ==============================================================
      function easeInOut(t) {
        return t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // カメラアニメーション
        if (camAnim) {
          camAnim.t += dt / camAnim.duration;
          if (camAnim.t >= 1) {
            camAnim.t = 1;
            camera.position.copy(camAnim.toPos);
            controls.target.copy(camAnim.toTarget);
            controls.update();
            const done = camAnim.onDone;
            camAnim = null;
            done && done();
          } else {
            const e = easeInOut(camAnim.t);
            camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
            controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, e);
            controls.update();
          }
        } else {
          controls.update();
        }

        // 幕僚巡回更新
        staffActors.forEach(actor => actor.update(dt));

        renderer.render(scene, camera);
      }
      animate();

      // ==============================================================
      // SHOWROOM_API（恒久・削除しない）
      // ==============================================================
      window.SHOWROOM_API = {
        /**
         * 指定部屋にカメラ遷移
         * @param {string} id — 'hall' | 'techo' | 'katakamuna' | 'koubou' | 'gallery'
         */
        gotoRoom(id) { gotoRoom(id); },

        /** 現在の部屋IDを返す */
        getRoom()    { return currentRoomId; },

        /** 全幕僚アクター配列（ビジュアル差し替え用）
         *  actor.visual: Three.Group
         *  actor.panelMesh: 画像PlaneGeometry
         *  actor.waypoints: [{x,z}]
         *  actor.paused: boolean
         */
        staffActors
      };

    } catch(err) {
      console.error('Three.js initialization failed:', err);
      showFallback();
    }

    // ==============================================================
    // UI イベント
    // ==============================================================
    // 部屋メニュー
    document.querySelectorAll('#room-menu button').forEach(btn => {
      btn.addEventListener('click', () => {
        const roomId = btn.dataset.room;
        if (window.SHOWROOM_API) window.SHOWROOM_API.gotoRoom(roomId);
        // スマホはメニューを閉じる
        document.getElementById('room-menu').classList.remove('open');
      });
    });

    // ハンバーガートグル
    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('room-menu').classList.toggle('open');
    });

    // ホールへ戻るボタン
    document.getElementById('btn-back-hall').addEventListener('click', () => {
      if (window.SHOWROOM_API) window.SHOWROOM_API.gotoRoom('hall');
    });

    // 操作ガイド閉じる
    const overlay = document.getElementById('guide-overlay');
    function dismissOverlay() {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.4s';
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
    }
    overlay.addEventListener('click',    dismissOverlay);
    overlay.addEventListener('touchend', dismissOverlay, { passive: true });

  </script>
</body>
</html>
