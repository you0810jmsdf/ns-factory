<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N's factory SHOWROOM | Web 3D ショールーム</title>
  <meta name="description" content="N's factory の革工房をバーチャルで体験。レザークラフト製品を3D空間でご覧いただけます。">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ND1T7H067Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ND1T7H067Y');
  </script>

  <!-- Three.js importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- 商品データ -->
  <script src="data/showroomData.js"></script>
  <!-- スタッフデータ -->
  <script src="data/staffData.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1D1D1F;
      --accent: #A0785A;
      --bg: #F5F5F7;
      --card-bg: #FFFFFF;
      --text-sub: #6E6E73;
      --font: -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--primary);
      font-family: var(--font);
      overflow: hidden;
    }

    /* ===== ヘッダー ===== */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(29,29,31,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }
    #header a.back {
      color: #F5F5F7;
      text-decoration: none;
      font-size: 13px;
      opacity: 0.75;
      transition: opacity 0.2s;
    }
    #header a.back:hover { opacity: 1; }
    #header .title {
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    #header .spacer { width: 80px; }

    /* ===== 3Dキャンバス ===== */
    #canvas-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
    }
    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== 操作ガイドオーバーレイ ===== */
    #guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      cursor: pointer;
    }
    #guide-overlay .guide-box {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      color: #fff;
      backdrop-filter: blur(8px);
      max-width: 320px;
    }
    #guide-overlay .guide-box h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    #guide-overlay .guide-box ul {
      list-style: none;
      font-size: 14px;
      line-height: 2;
      opacity: 0.9;
    }
    #guide-overlay .guide-box .tap-hint {
      margin-top: 24px;
      font-size: 12px;
      opacity: 0.6;
    }

    /* ===== 商品情報カード ===== */
    #info-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 24px 32px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 150;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
      max-height: 60vh;
      overflow-y: auto;
    }
    #info-card.visible {
      transform: translateY(0);
    }
    #info-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    #info-card .card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      flex: 1;
      line-height: 1.4;
    }
    #info-card .card-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px;
      line-height: 1;
    }
    #info-card .card-lead {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    #info-card .card-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    #info-card .card-meta span {
      font-size: 13px;
      color: var(--text-sub);
    }
    #info-card .card-meta strong {
      color: var(--primary);
    }
    #info-card .card-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
    }
    #info-card .btn-purchase {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #info-card .btn-purchase:hover {
      background: #3a3a3c;
    }
    #info-card .btn-purchase.disabled {
      background: #C7C7CC;
      cursor: default;
      pointer-events: none;
    }

    /* ===== フォールバック: カードグリッド ===== */
    #fallback {
      display: none;
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: 24px 16px 40px;
      background: var(--bg);
    }
    #fallback h2 {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 20px;
      text-align: center;
    }
    .fallback-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    .fallback-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .fallback-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #e5e5ea;
    }
    .fallback-card .fc-body {
      padding: 12px;
    }
    .fallback-card .fc-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .fallback-card .fc-price {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .fallback-card a {
      display: block;
      text-align: center;
      padding: 8px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      text-decoration: none;
    }
    .fallback-card a.disabled {
      background: #C7C7CC;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      #info-card { padding: 20px 16px 28px; }
      #info-card .card-name { font-size: 15px; }
    }

    /* ===== 接客カード（スタッフ用） ===== */
    #staff-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 24px 32px;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.34, 1.12, 0.64, 1);
      z-index: 151;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
      max-height: 60vh;
      overflow-y: auto;
    }
    #staff-card.visible {
      transform: translateY(0);
    }
    #staff-card .sc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    #staff-card .sc-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    #staff-card .sc-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2px solid var(--accent);
      background: #e5e5ea;
      flex-shrink: 0;
    }
    #staff-card .sc-names {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #staff-card .sc-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }
    #staff-card .sc-role {
      font-size: 12px;
      color: var(--text-sub);
    }
    #staff-card .sc-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-sub);
      padding: 0 0 0 12px;
      line-height: 1;
    }
    #staff-card .sc-line {
      font-size: 15px;
      color: var(--primary);
      line-height: 1.7;
      margin-bottom: 20px;
      padding: 14px 16px;
      background: #F5F5F7;
      border-radius: 12px;
      border-left: 3px solid var(--accent);
    }
    #staff-card .sc-line::before {
      content: '「';
    }
    #staff-card .sc-line::after {
      content: '」';
    }
    #staff-card .btn-staff {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    #staff-card .btn-staff:hover {
      background: #8a6449;
    }

    /* ===== フォールバック: スタッフカードグリッド ===== */
    .fallback-section-title {
      font-size: 13px;
      color: var(--text-sub);
      margin: 24px 0 12px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .fallback-staff-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .fallback-staff-card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: top;
      background: #e5e5ea;
    }
    .fallback-staff-card .fc-body {
      padding: 10px 12px 12px;
    }
    .fallback-staff-card .fc-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 2px;
    }
    .fallback-staff-card .fc-role {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .fallback-staff-card a {
      display: block;
      text-align: center;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      #staff-card { padding: 20px 16px 28px; }
      #staff-card .sc-name { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header id="header">
    <a class="back" href="../index.html">&#8592; トップへ</a>
    <span class="title">N's factory SHOWROOM</span>
    <span class="spacer"></span>
  </header>

  <!-- 操作ガイド -->
  <div id="guide-overlay">
    <div class="guide-box">
      <h2>Web 3D ショールーム</h2>
      <ul>
        <li>ドラッグ / スワイプで見回す</li>
        <li>ホイール / ピンチでズーム</li>
        <li>商品パネルをタップで詳細表示</li>
        <li>スタッフをタップで接客案内</li>
      </ul>
      <p class="tap-hint">画面をタップして入場</p>
    </div>
  </div>

  <!-- 3Dキャンバス -->
  <div id="canvas-container"></div>

  <!-- 商品情報カード -->
  <div id="info-card">
    <div class="card-header">
      <p class="card-name" id="card-name"></p>
      <button class="card-close" id="card-close">&#x2715;</button>
    </div>
    <p class="card-lead" id="card-lead"></p>
    <div class="card-meta">
      <span><strong>素材</strong>: <span id="card-material"></span></span>
    </div>
    <p class="card-price" id="card-price"></p>
    <a class="btn-purchase" id="card-btn" href="#" target="_blank" rel="noopener">購入ページへ</a>
  </div>

  <!-- 接客カード（スタッフ用） -->
  <div id="staff-card">
    <div class="sc-header">
      <div class="sc-title">
        <img class="sc-avatar" id="sc-avatar" src="" alt="">
        <div class="sc-names">
          <p class="sc-name" id="sc-name"></p>
          <p class="sc-role" id="sc-role"></p>
        </div>
      </div>
      <button class="sc-close" id="sc-close">&#x2715;</button>
    </div>
    <p class="sc-line" id="sc-line"></p>
    <a class="btn-staff" id="sc-btn" href="#" target="_blank" rel="noopener"></a>
  </div>

  <!-- フォールバック -->
  <div id="fallback">
    <h2>3D表示に対応していない環境のため、通常表示しています。</h2>
    <div class="fallback-grid" id="fallback-grid"></div>
  </div>

  <!-- メインスクリプト -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ======================================================
    // フォールバック表示（WebGL非対応時 or エラー時）
    // ======================================================
    function showFallback() {
      document.getElementById('canvas-container').style.display = 'none';
      document.getElementById('guide-overlay').style.display = 'none';
      const fb = document.getElementById('fallback');
      fb.style.display = 'block';
      const grid = document.getElementById('fallback-grid');

      // 商品カード
      const items = window.SHOWROOM_ITEMS || [];
      let html = items.map(item => {
        const hasUrl = item.url && item.url.trim() !== '';
        return `
          <div class="fallback-card">
            <img src="${item.image}" alt="${item.name}" loading="lazy"
                 onerror="this.style.background='#e5e5ea';this.removeAttribute('src')">
            <div class="fc-body">
              <p class="fc-name">${item.name}</p>
              <p class="fc-price">${item.price || '準備中'}</p>
              <a href="${hasUrl ? item.url : '#'}" class="${hasUrl ? '' : 'disabled'}"
                 ${hasUrl ? 'target="_blank" rel="noopener"' : ''}>
                ${hasUrl ? '購入ページへ' : '準備中'}
              </a>
            </div>
          </div>`;
      }).join('');

      // スタッフカード
      const staffList = window.SHOWROOM_STAFF || [];
      if (staffList.length > 0) {
        html += `<div class="fallback-section-title" style="grid-column:1/-1">— スタッフ紹介 —</div>`;
        html += staffList.map(s => `
          <div class="fallback-staff-card">
            <img src="${s.image}" alt="${s.name}" loading="lazy"
                 onerror="this.style.background='#e5e5ea';this.removeAttribute('src')">
            <div class="fc-body">
              <p class="fc-name">${s.name}</p>
              <p class="fc-role">${s.role}</p>
              <a href="${s.btnUrl}" target="_blank" rel="noopener">${s.btnLabel}</a>
            </div>
          </div>`).join('');
      }

      grid.innerHTML = html;
    }

    // WebGL サポート確認
    function isWebGLAvailable() {
      try {
        const canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext &&
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch(e) { return false; }
    }

    if (!isWebGLAvailable()) { showFallback(); throw new Error('WebGL not supported'); }

    // ======================================================
    // Three.js 初期化
    // ======================================================
    let renderer, scene, camera, controls;
    let raycaster, mouse;
    let panels = [];        // クリック対象メッシュ [{mesh, item}]
    let staffPanels = [];   // スタッフパネル [{mesh, staff}]
    let hoveredMesh = null;
    let selectedMesh = null;

    const ACCENT = 0xA0785A;
    const FLOOR_COLOR = 0xC49A6C;
    const WALL_COLOR = 0xEDE0D4;
    const CEIL_COLOR = 0xF5F0EB;

    try {
      const container = document.getElementById('canvas-container');

      // レンダラー
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // シーン・カメラ
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2A1F1A);
      scene.fog = new THREE.Fog(0x2A1F1A, 12, 28);

      camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 50);
      camera.position.set(0, 1.6, 5.5);

      // OrbitControls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.6, 0);
      controls.enablePan = false;
      controls.minDistance = 2;
      controls.maxDistance = 9;
      controls.maxPolarAngle = Math.PI * 0.72;
      controls.minPolarAngle = Math.PI * 0.1;
      controls.autoRotate = false;
      controls.update();

      // ======================================================
      // 部屋の構造
      // ======================================================
      const roomW = 14, roomH = 4.5, roomD = 14;

      // 床
      const floorGeo = new THREE.PlaneGeometry(roomW, roomD, 20, 20);
      const floorMat = new THREE.MeshStandardMaterial({
        color: FLOOR_COLOR,
        roughness: 0.85,
        metalness: 0.0
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // 天井
      const ceilGeo = new THREE.PlaneGeometry(roomW, roomD);
      const ceilMat = new THREE.MeshStandardMaterial({ color: CEIL_COLOR, roughness: 0.9 });
      const ceil = new THREE.Mesh(ceilGeo, ceilMat);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.y = roomH;
      scene.add(ceil);

      // 壁（奥・左・右）
      const wallMat = new THREE.MeshStandardMaterial({ color: WALL_COLOR, roughness: 0.82 });

      // 奥壁
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomH), wallMat);
      backWall.position.set(0, roomH / 2, -roomD / 2);
      backWall.receiveShadow = true;
      scene.add(backWall);

      // 左壁
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomD, roomH), wallMat);
      leftWall.position.set(-roomW / 2, roomH / 2, 0);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.receiveShadow = true;
      scene.add(leftWall);

      // 右壁
      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomD, roomH), wallMat);
      rightWall.position.set(roomW / 2, roomH / 2, 0);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.receiveShadow = true;
      scene.add(rightWall);

      // 木製モールディング（床と壁の境目）
      const moldingGeo = new THREE.BoxGeometry(roomW, 0.12, 0.08);
      const moldingMat = new THREE.MeshStandardMaterial({ color: 0x7A5C40, roughness: 0.6 });
      const mBack = new THREE.Mesh(moldingGeo, moldingMat);
      mBack.position.set(0, 0.06, -roomD / 2 + 0.04);
      scene.add(mBack);

      // ======================================================
      // 照明
      // ======================================================
      // 環境光
      const ambientLight = new THREE.AmbientLight(0xFFF5E6, 0.55);
      scene.add(ambientLight);

      // メインスポット（天井中央）
      const mainSpot = new THREE.SpotLight(0xFFF8F0, 2.5, 20, Math.PI * 0.35, 0.35, 1.5);
      mainSpot.position.set(0, roomH - 0.2, 0);
      mainSpot.target.position.set(0, 0, -2);
      mainSpot.castShadow = true;
      mainSpot.shadow.mapSize.set(1024, 1024);
      scene.add(mainSpot);
      scene.add(mainSpot.target);

      // 補助ポイントライト（左右）
      const pointL = new THREE.PointLight(0xFFE0B0, 0.9, 10, 2);
      pointL.position.set(-4, 3.5, 0);
      scene.add(pointL);

      const pointR = new THREE.PointLight(0xFFE0B0, 0.9, 10, 2);
      pointR.position.set(4, 3.5, 0);
      scene.add(pointR);

      // ======================================================
      // 商品パネルの配置
      // ======================================================
      const items = window.SHOWROOM_ITEMS || [];

      // パネル配置定義: 奥壁3枚 + 左壁2枚 + 右壁1枚
      const panelPositions = [
        // 奥壁 (z = -roomD/2 + 0.05, 回転なし)
        { x: -3.8, y: 2.0, z: -roomD / 2 + 0.06, ry: 0 },
        { x:  0.0, y: 2.0, z: -roomD / 2 + 0.06, ry: 0 },
        { x:  3.8, y: 2.0, z: -roomD / 2 + 0.06, ry: 0 },
        // 左壁
        { x: -roomW / 2 + 0.06, y: 2.0, z: -2.0, ry:  Math.PI / 2 },
        { x: -roomW / 2 + 0.06, y: 2.0, z:  2.0, ry:  Math.PI / 2 },
        // 右壁
        { x:  roomW / 2 - 0.06, y: 2.0, z: -2.0, ry: -Math.PI / 2 },
      ];

      // 額縁マテリアル
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x5C3D1E, roughness: 0.5, metalness: 0.15 });

      const loader = new THREE.TextureLoader();

      items.forEach((item, i) => {
        if (i >= panelPositions.length) return;
        const pos = panelPositions[i];

        // 画像テクスチャ読み込み（失敗時はプレースホルダ色）
        const placeholderColor = [0xC49A6C, 0x8B7355, 0xA0785A, 0xD4B896, 0x7A5C40, 0xBE9B7B][i % 6];
        const panelMat = new THREE.MeshStandardMaterial({
          color: placeholderColor,
          roughness: 0.55,
          metalness: 0.0,
          emissive: new THREE.Color(0x000000),
          emissiveIntensity: 0
        });

        loader.load(
          item.image,
          (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            panelMat.map = tex;
            panelMat.color.set(0xFFFFFF);
            panelMat.needsUpdate = true;
          },
          undefined,
          () => { /* テクスチャ読み込み失敗 → プレースホルダ色のまま表示 */ }
        );

        // パネル本体
        const panelGeo = new THREE.PlaneGeometry(1.5, 1.1);
        const panel = new THREE.Mesh(panelGeo, panelMat);
        panel.position.set(pos.x, pos.y, pos.z);
        panel.rotation.y = pos.ry;
        panel.castShadow = false;
        panel.receiveShadow = false;
        panel.userData.item = item;
        scene.add(panel);
        panels.push({ mesh: panel, item });

        // 額縁（4辺）
        const frameThick = 0.04;
        const frameDepth = 0.04;
        const fW = 1.5 + frameThick * 2;
        const fH = 1.1 + frameThick * 2;
        const borders = [
          new THREE.BoxGeometry(fW, frameThick, frameDepth), // 上
          new THREE.BoxGeometry(fW, frameThick, frameDepth), // 下
          new THREE.BoxGeometry(frameThick, fH, frameDepth), // 左
          new THREE.BoxGeometry(frameThick, fH, frameDepth), // 右
        ];
        const offsets = [
          [0,  fH / 2 - frameThick / 2, 0],
          [0, -fH / 2 + frameThick / 2, 0],
          [-fW / 2 + frameThick / 2, 0, 0],
          [ fW / 2 - frameThick / 2, 0, 0],
        ];
        borders.forEach((geo, bi) => {
          const b = new THREE.Mesh(geo, frameMat);
          b.position.set(
            pos.x + offsets[bi][0],
            pos.y + offsets[bi][1],
            pos.z + offsets[bi][2] + 0.02
          );
          b.rotation.y = pos.ry;
          scene.add(b);
        });
      });

      // ======================================================
      // スタッフパネルの配置
      // ======================================================
      // 部屋サイズ: roomW=14, roomD=14
      // 商品壁: 奥壁(z=-7)・左壁(x=-7)・右壁(x=7)
      // スタッフ配置:
      //   入口側（手前）壁 z=+7: 中央に総司令官+左右に4名
      //   右壁(x=7)の奥エリア z=-4〜+4: 3名（商品と干渉しない z=+4）
      //   左壁(x=-7)の奥エリア z=+4: 2名

      const staffList = window.SHOWROOM_STAFF || [];

      // 配置定義: [x, y, z, ry]
      // 入口側壁(z=+7, 内向き ry=Math.PI): 総司令官中央 + 左右4名
      // 入口壁は中心間隔2.2（パネル幅0.9）で重なりなし・総司令官が中央
      const staffPositions = [
        // 総司令官: 入口正面中央 (index 0 = kojinjigyonusi)
        { x:  0.0, y: 2.2, z:  roomD / 2 - 0.06, ry: Math.PI },
        // 作戦幕僚: 入口壁 左1
        { x: -2.2, y: 2.2, z:  roomD / 2 - 0.06, ry: Math.PI },
        // 販売幕僚: 入口壁 右1
        { x:  2.2, y: 2.2, z:  roomD / 2 - 0.06, ry: Math.PI },
        // 監理幕僚: 入口壁 左2
        { x: -4.4, y: 2.2, z:  roomD / 2 - 0.06, ry: Math.PI },
        // 広報幕僚: 入口壁 右2
        { x:  4.4, y: 2.2, z:  roomD / 2 - 0.06, ry: Math.PI },
        // 後方幕僚: 右壁 手前エリア
        { x:  roomW / 2 - 0.06, y: 2.2, z:  3.5, ry: -Math.PI / 2 },
        // 保全幕僚: 右壁 中エリア
        { x:  roomW / 2 - 0.06, y: 2.2, z:  0.0, ry: -Math.PI / 2 },
        // デジタル幕僚: 左壁 手前エリア
        { x: -roomW / 2 + 0.06, y: 2.2, z:  3.5, ry:  Math.PI / 2 },
        // 人事幕僚: 左壁 中エリア
        { x: -roomW / 2 + 0.06, y: 2.2, z:  0.0, ry:  Math.PI / 2 },
        // 教育幕僚: 入口壁 左3（端）
        { x: -6.4, y: 2.2, z:  roomD / 2 - 0.06, ry: Math.PI },
      ];

      // スタッフパネルサイズ（縦長ポートレート比 0.75:1 = 0.9:1.2）
      const sPW = 0.9;
      const sPH = 1.2;
      const sFrameThick = 0.04;
      const sFrameDepth = 0.04;

      // 額縁マテリアル（ゴールド調）
      const sFrameMat = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.45, metalness: 0.4 });

      staffList.forEach((staff, i) => {
        if (i >= staffPositions.length) return;
        const pos = staffPositions[i];

        const sMat = new THREE.MeshStandardMaterial({
          color: 0x8B7355,
          roughness: 0.55,
          metalness: 0.0,
          emissive: new THREE.Color(0x000000),
          emissiveIntensity: 0
        });

        loader.load(
          staff.image,
          (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            sMat.map = tex;
            sMat.color.set(0xFFFFFF);
            sMat.needsUpdate = true;
          },
          undefined,
          () => {}
        );

        const sGeo = new THREE.PlaneGeometry(sPW, sPH);
        const sPanel = new THREE.Mesh(sGeo, sMat);
        sPanel.position.set(pos.x, pos.y, pos.z);
        sPanel.rotation.y = pos.ry;
        sPanel.userData.staff = staff;
        scene.add(sPanel);
        staffPanels.push({ mesh: sPanel, staff });

        // 額縁
        const sfW = sPW + sFrameThick * 2;
        const sfH = sPH + sFrameThick * 2;
        const sBorders = [
          new THREE.BoxGeometry(sfW, sFrameThick, sFrameDepth),
          new THREE.BoxGeometry(sfW, sFrameThick, sFrameDepth),
          new THREE.BoxGeometry(sFrameThick, sfH, sFrameDepth),
          new THREE.BoxGeometry(sFrameThick, sfH, sFrameDepth),
        ];
        const sOffsets = [
          [0,  sfH / 2 - sFrameThick / 2, 0],
          [0, -sfH / 2 + sFrameThick / 2, 0],
          [-sfW / 2 + sFrameThick / 2, 0, 0],
          [ sfW / 2 - sFrameThick / 2, 0, 0],
        ];
        sBorders.forEach((geo, bi) => {
          const b = new THREE.Mesh(geo, sFrameMat);
          b.position.set(
            pos.x + sOffsets[bi][0],
            pos.y + sOffsets[bi][1],
            pos.z + sOffsets[bi][2] + 0.02
          );
          b.rotation.y = pos.ry;
          scene.add(b);
        });
      });

      // ======================================================
      // Raycaster
      // ======================================================
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      function getIntersected(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        let clientX, clientY;
        if (event.touches && event.touches.length > 0) {
          clientX = event.touches[0].clientX;
          clientY = event.touches[0].clientY;
        } else {
          clientX = event.clientX;
          clientY = event.clientY;
        }
        mouse.x = ((clientX - rect.left) / rect.width)  * 2 - 1;
        mouse.y = -((clientY - rect.top)  / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const meshes = [
          ...panels.map(p => p.mesh),
          ...staffPanels.map(p => p.mesh)
        ];
        return raycaster.intersectObjects(meshes);
      }

      // ホバー
      renderer.domElement.addEventListener('mousemove', (e) => {
        const hits = getIntersected(e);
        if (hits.length > 0) {
          const mesh = hits[0].object;
          if (hoveredMesh !== mesh) {
            if (hoveredMesh) hoveredMesh.material.emissiveIntensity = 0;
            hoveredMesh = mesh;
            hoveredMesh.material.emissive.set(0xA0785A);
            hoveredMesh.material.emissiveIntensity = 0.18;
            renderer.domElement.style.cursor = 'pointer';
          }
        } else {
          if (hoveredMesh) {
            hoveredMesh.material.emissiveIntensity = 0;
            hoveredMesh = null;
          }
          renderer.domElement.style.cursor = 'grab';
        }
      });

      // クリック
      let pointerDownTime = 0;
      renderer.domElement.addEventListener('pointerdown', () => { pointerDownTime = Date.now(); });
      renderer.domElement.addEventListener('pointerup', (e) => {
        if (Date.now() - pointerDownTime > 200) return; // ドラッグ除外
        const hits = getIntersected(e);
        if (hits.length > 0) {
          const mesh = hits[0].object;
          const entry = panels.find(p => p.mesh === mesh);
          if (entry) { showCard(entry.item, mesh); return; }
          const sEntry = staffPanels.find(p => p.mesh === mesh);
          if (sEntry) showStaffCard(sEntry.staff, mesh);
        }
      });

      // タッチタップ
      let touchStartX, touchStartY;
      renderer.domElement.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', (e) => {
        const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
        const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
        if (dx < 8 && dy < 8) {
          const hits = getIntersected(e);
          if (hits.length > 0) {
            const mesh = hits[0].object;
            const entry = panels.find(p => p.mesh === mesh);
            if (entry) { showCard(entry.item, mesh); return; }
            const sEntry = staffPanels.find(p => p.mesh === mesh);
            if (sEntry) showStaffCard(sEntry.staff, mesh);
          }
        }
      }, { passive: true });

      // ======================================================
      // 商品カード表示
      // ======================================================
      function showCard(item, mesh) {
        // スタッフカードが開いていれば閉じる
        document.getElementById('staff-card').classList.remove('visible');

        document.getElementById('card-name').textContent = item.name;
        document.getElementById('card-lead').textContent = item.lead;
        document.getElementById('card-material').textContent = item.material;
        document.getElementById('card-price').textContent = item.price || '';

        const btn = document.getElementById('card-btn');
        if (item.url && item.url.trim() !== '') {
          btn.href = item.url;
          btn.textContent = '購入ページへ';
          btn.classList.remove('disabled');
        } else {
          btn.href = '#';
          btn.textContent = '準備中';
          btn.classList.add('disabled');
        }
        document.getElementById('info-card').classList.add('visible');

        // 選択中パネルの発光
        if (selectedMesh && selectedMesh !== mesh) {
          selectedMesh.material.emissiveIntensity = 0;
        }
        selectedMesh = mesh;
        mesh.material.emissive.set(0xA0785A);
        mesh.material.emissiveIntensity = 0.3;
      }

      function hideCard() {
        document.getElementById('info-card').classList.remove('visible');
        if (selectedMesh) {
          selectedMesh.material.emissiveIntensity = 0;
          selectedMesh = null;
        }
      }

      document.getElementById('card-close').addEventListener('click', hideCard);

      // ======================================================
      // 接客カード表示（スタッフ用）
      // ======================================================
      function showStaffCard(staff, mesh) {
        // 商品カードが開いていれば閉じる
        hideCard();

        // ランダムセリフ
        const line = staff.lines[Math.floor(Math.random() * staff.lines.length)];

        document.getElementById('sc-name').textContent = staff.name;
        document.getElementById('sc-role').textContent = staff.role;
        document.getElementById('sc-line').textContent = line;

        const avatar = document.getElementById('sc-avatar');
        avatar.src = staff.image;
        avatar.alt = staff.name;

        const btn = document.getElementById('sc-btn');
        btn.href = staff.btnUrl;
        btn.textContent = staff.btnLabel;
        // 外部URLは新タブ、内部は同タブ
        if (staff.btnUrl.startsWith('http')) {
          btn.setAttribute('target', '_blank');
          btn.setAttribute('rel', 'noopener');
        } else {
          btn.removeAttribute('target');
          btn.removeAttribute('rel');
        }

        document.getElementById('staff-card').classList.add('visible');

        // 選択中パネルの発光
        if (selectedMesh && selectedMesh !== mesh) {
          selectedMesh.material.emissiveIntensity = 0;
        }
        selectedMesh = mesh;
        mesh.material.emissive.set(0xD4A853);
        mesh.material.emissiveIntensity = 0.3;
      }

      function hideStaffCard() {
        document.getElementById('staff-card').classList.remove('visible');
        if (selectedMesh) {
          selectedMesh.material.emissiveIntensity = 0;
          selectedMesh = null;
        }
      }

      document.getElementById('sc-close').addEventListener('click', hideStaffCard);

      // ======================================================
      // リサイズ対応
      // ======================================================
      function onResize() {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', onResize);

      // ======================================================
      // アニメーションループ
      // ======================================================
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

    } catch(err) {
      console.error('Three.js initialization failed:', err);
      showFallback();
    }

    // ======================================================
    // 操作ガイドオーバーレイ
    // ======================================================
    const overlay = document.getElementById('guide-overlay');
    overlay.addEventListener('click', () => {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.4s';
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
    });
    overlay.addEventListener('touchend', () => {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.4s';
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
    }, { passive: true });

  </script>
</body>
</html>
