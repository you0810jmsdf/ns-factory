<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>接客ログ一覧 | N's factory</title>
<style>
/* ダーク管制室テーマ（staff-monitor.html と統一）。文字コントラスト4.5:1以上 */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
  background:#0d1117;color:#e6edf3;
  min-height:100vh;
}
.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid #30363d;background:#161b22;
}
.topbar h1{margin:0;font-size:17px;letter-spacing:.04em}
.srcs{display:flex;gap:6px}
.src-btn{
  font-size:12px;font-weight:bold;padding:6px 14px;border-radius:999px;cursor:pointer;
  background:#21262d;color:#9aa4af;border:1px solid #30363d;
}
.src-btn:hover{border-color:#58a6ff;color:#e6edf3}
.src-btn.active{background:#1f6feb;color:#fff;border-color:#388bfd}
.updated{margin-left:auto;font-size:12px;color:#9aa4af;text-align:right;line-height:1.5}

.main{padding:16px 20px;max-width:1600px;margin:0 auto}

.filters{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 16px;margin-bottom:14px;
}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11px;color:#9aa4af}
.f input,.f select{
  border:1px solid #30363d;border-radius:8px;padding:7px 10px;font-size:13px;
  background:#0d1117;color:#e6edf3;outline:none;font-family:inherit;
}
.f input:focus,.f select:focus{border-color:#58a6ff}
.f input[type=search]{min-width:220px}
.btn{
  font-size:13px;font-weight:bold;padding:8px 16px;border-radius:8px;cursor:pointer;
  background:#1f6feb;color:#fff;border:1px solid #388bfd;
}
.btn:hover{background:#388bfd}
.btn.sub{background:#21262d;color:#c9d1d9;border-color:#30363d}
.btn.sub:hover{border-color:#58a6ff;color:#e6edf3}
.btn:disabled{opacity:.5;cursor:default}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick .btn{padding:6px 12px;font-size:12px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 16px}
.kpi .label{font-size:12px;color:#9aa4af}
.kpi .value{font-size:32px;font-weight:bold;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:13px;font-weight:normal;color:#9aa4af;margin-left:2px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}

.panel{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:14px;color:#c9d1d9;letter-spacing:.03em}
.panel h2 .sub{font-size:11px;color:#9aa4af;font-weight:normal;margin-left:8px}

.breakdown{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;
  background:#0d1117;color:#c9d1d9;border:1px solid #30363d;
}
.chip:hover{border-color:#58a6ff}
.chip.active{background:#0d2438;color:#79c0ff;border-color:#1f6feb}
.chip b{font-variant-numeric:tabular-nums;color:#e6edf3}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  color:#9aa4af;font-size:11px;text-align:left;padding:6px 10px;font-weight:normal;
  border-bottom:1px solid #30363d;white-space:nowrap;position:sticky;top:0;background:#161b22;
}
td{padding:8px 10px;border-bottom:1px solid #21262d;vertical-align:top;line-height:1.6}
td.dt{white-space:nowrap;color:#9aa4af;font-variant-numeric:tabular-nums;font-family:Consolas,monospace;font-size:12px}
td.who{white-space:nowrap}
td.q{color:#e6edf3;min-width:180px;word-break:break-word}
td.a{color:#9aa4af;word-break:break-word}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:#9aa4af;white-space:nowrap}
tr:hover td{background:#1c2128}
.badge{
  font-size:11px;font-weight:bold;padding:2px 9px;border-radius:999px;white-space:nowrap;
  background:#0d2438;color:#79c0ff;border:1px solid #1f6feb;
}
.badge.visitor{background:#12331f;color:#4ade80;border-color:#2ea043}
.badge.bot{background:#3a2d10;color:#e3b341;border-color:#9e6a03}
.badge.owner{background:#2d1b3d;color:#d2a8ff;border-color:#8957e5}
.mojibake{
  font-size:11px;padding:1px 7px;border-radius:6px;margin-left:6px;
  background:#3d1214;color:#ff9d9d;border:1px solid #f85149;
}
.more{
  background:none;border:none;color:#58a6ff;cursor:pointer;font-size:12px;padding:0;margin-left:4px;
  font-family:inherit;
}
.more:hover{text-decoration:underline}
.empty{color:#6e7681;font-size:13px;padding:24px 0;text-align:center}
.err{
  margin:0 0 12px;padding:10px 14px;font-size:13px;border-radius:8px;line-height:1.7;
  background:#3d1214;color:#ff9d9d;border:1px solid #f85149;display:none;
}
.note{font-size:12px;color:#6e7681;line-height:1.7;margin:10px 0 0}

.auth-overlay{
  position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(1,4,9,.8);backdrop-filter:blur(4px);
}
.auth-card{
  width:min(420px,100%);background:#161b22;border:1px solid #30363d;border-radius:18px;
  padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.5);
}
.auth-card h2{margin:0 0 8px;font-size:20px;color:#e6edf3}
.auth-card p{margin:0 0 14px;font-size:13px;color:#9aa4af;line-height:1.6}
.auth-card input{
  width:100%;border:1px solid #30363d;border-radius:8px;padding:10px 12px;font-size:14px;
  margin-bottom:10px;outline:none;background:#0d1117;color:#e6edf3;
}
.auth-card input:focus{border-color:#58a6ff}
.auth-btn{
  width:100%;padding:10px;background:#1f6feb;color:#fff;border:none;border-radius:8px;
  font-size:14px;font-weight:bold;cursor:pointer;
}
.auth-btn:hover{background:#388bfd}
.auth-error{min-height:18px;margin:6px 0 0;font-size:12px;color:#ff9d9d}
.auth-locked{overflow:hidden}

/* 指摘（ナレッジ学習ループ 2026-08-05） */
.fb-btn{
  background:#21262d;border:1px solid #30363d;color:#e3b341;border-radius:6px;
  font-size:11px;padding:3px 8px;cursor:pointer;white-space:nowrap;
}
.fb-btn:hover{border-color:#e3b341}
.fb-overlay{
  position:fixed;inset:0;z-index:1100;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(1,4,9,.8);backdrop-filter:blur(4px);
}
.fb-overlay.on{display:flex}
.fb-card{
  width:min(640px,100%);background:#161b22;border:1px solid #30363d;border-radius:18px;
  padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto;
}
.fb-card h2{margin:0 0 6px;font-size:17px;color:#e6edf3}
.fb-card .fb-sub{font-size:12px;color:#9aa4af;line-height:1.7;margin-bottom:12px}
.fb-quote{
  background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:10px 12px;
  font-size:12.5px;line-height:1.7;margin-bottom:12px;max-height:180px;overflow-y:auto;
}
.fb-quote .q{color:#e6edf3}
.fb-quote .a{color:#9aa4af;margin-top:6px}
.fb-card textarea{
  width:100%;min-height:110px;border:1px solid #30363d;border-radius:8px;padding:10px 12px;
  font-size:13.5px;background:#0d1117;color:#e6edf3;outline:none;font-family:inherit;line-height:1.7;resize:vertical;
}
.fb-card textarea:focus{border-color:#58a6ff}
.fb-actions{display:flex;gap:8px;margin-top:12px;align-items:center}
.fb-status{font-size:12px;color:#9aa4af;line-height:1.6}
.fb-status.ok{color:#4ade80}
.fb-status.err{color:#ff9d9d}
/* ✅指摘済バッジ・折りたたみ行・🗑削除ボタン（2026-08-07） */
.badge-done{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#12331f;color:#4ade80;border:1px solid #2ea043;white-space:nowrap}
/* 接客が外れたまま終わった相談の印（2026-08-31） */
.badge-issue{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#3a2408;color:#f0b429;border:1px solid #8a5a10;white-space:nowrap;margin-right:4px}
.issue-bar{margin:0 0 10px;padding:10px 12px;border-radius:8px;background:#3a2408;border:1px solid #8a5a10;color:#f0b429;font-size:13px;line-height:1.6}
.issue-bar b{color:#ffd479}
.issue-bar .sub{display:block;color:#c9a96e;font-size:11.5px;margin-top:3px}
/* 当月の相談件数としきい値（2026-09-04）。AI費用の増加に気づくため */
.quota-bar{margin:0 0 10px;padding:10px 12px;border-radius:8px;border:1px solid #30363d;background:#161b22;font-size:13px;line-height:1.7}
.quota-bar.over{background:#3a1010;border-color:#8a2020;color:#ff9b9b}
.quota-bar b{font-size:15px}
.quota-bar .meter{display:block;height:6px;border-radius:3px;background:#30363d;margin:6px 0 4px;overflow:hidden}
.quota-bar .meter span{display:block;height:100%;background:#2ea043;border-radius:3px}
.quota-bar.over .meter span{background:#f85149}
.quota-bar .sub{color:#8b949e;font-size:11.5px}
.quota-bar input{width:70px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 8px;font-size:13px}
.quota-bar button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.quota-bar button:hover{background:#30363d}
.badge-done[data-fbview]{cursor:pointer;text-decoration:underline dotted}
.badge-done[data-fbview]:hover{background:#1a4a2c}
tr.folded td{color:#9aa4af;font-size:12px;background:#0d1117}
.del-btn{background:none;border:1px solid #30363d;color:#ff9d9d;border-radius:8px;padding:4px 8px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.del-btn:hover{border-color:#f85149}
</style>
</head>
<body class="auth-locked">
<div class="topbar">
  <h1>💬 接客ログ一覧</h1>
  <div class="srcs" role="tablist">
    <!-- 2026-08-04 導線一本化に合わせ、主役のオーダー相談を先頭・初期表示に -->
    <button class="src-btn active" type="button" data-src="hearing" role="tab">🧵 オーダー相談</button>
    <button class="src-btn" type="button" data-src="orders" role="tab">📋 発注・相談受付</button>
    <button class="src-btn" type="button" data-src="ai" role="tab">🤖 幕僚キャラ接客</button>
    <button class="src-btn" type="button" data-src="visitor" role="tab">👥 みんなのチャット</button>
    <button class="src-btn" type="button" data-src="archive" role="tab">📦 月次アーカイブ</button>
  </div>
  <span class="updated" id="updatedAt">読み込み前</span>
</div>

<div class="main">
  <p class="err" id="loadErr"></p>

  <div class="filters">
    <div class="f live-only"><label for="fFrom">開始日</label><input type="date" id="fFrom"></div>
    <div class="f live-only"><label for="fTo">終了日</label><input type="date" id="fTo"></div>
    <div class="f live-only">
      <label>期間プリセット</label>
      <div class="quick">
        <button class="btn sub" type="button" data-range="thisMonth">今月</button>
        <button class="btn sub" type="button" data-range="lastMonth">先月</button>
        <button class="btn sub" type="button" data-range="all">全期間</button>
      </div>
    </div>
    <div class="f archive-only" style="display:none"><label for="fMonth">保存済みの月</label><select id="fMonth"></select></div>
    <div class="f archive-only" style="display:none">
      <label for="fArcSrc">系統</label>
      <select id="fArcSrc">
        <option value="ai">🤖 幕僚キャラ接客</option>
        <option value="visitor">👥 みんなのチャット</option>
        <option value="hearing">🧵 オーダー相談AI</option>
      </select>
    </div>
    <!-- autocomplete/name無指定だとブラウザがメールアドレス等を自動入力し、意図せず0件表示になる -->
    <div class="f"><label for="fWord">本文検索</label><input type="search" id="fWord" placeholder="質問・応答を絞り込み" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="f"><label>&nbsp;</label><button class="btn" type="button" id="reloadBtn">🔄 読み込み</button></div>
    <div class="f"><label>&nbsp;</label><button class="btn sub" type="button" id="csvBtn">⬇ CSV</button></div>
    <!-- 指摘済みの行を1行に畳んで一覧をすっきりさせる（オーダー相談・幕僚キャラ接客タブのみ） -->
    <div class="f live-only"><label>&nbsp;</label><button class="btn sub" type="button" id="fbFoldBtn">✅ 指摘済みを畳む: ON</button></div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="label">発言件数</div><div class="value" id="kpiCount">–<span class="unit">件</span></div></div>
    <div class="kpi"><div class="label">稼働日数</div><div class="value" id="kpiDays">–<span class="unit">日</span></div></div>
    <div class="kpi"><div class="label" id="kpiAvgLabel">平均応答文字数</div><div class="value" id="kpiAvg">–<span class="unit">字</span></div></div>
    <div class="kpi"><div class="label" id="kpiTopLabel">最多の担当</div><div class="value" id="kpiTop" style="font-size:20px">–</div></div>
  </div>

  <div class="panel">
    <h2 id="bdTitle">👥 担当別内訳 <span class="sub">クリックで絞り込み／もう一度で解除</span></h2>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <div class="panel">
    <h2>📋 発言一覧 <span class="sub" id="listSub">新しい順</span></h2>
    <div id="quotaBar" style="display:none"></div>
    <div id="issueBar" style="display:none"></div>
    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"><tr><td class="empty" colspan="5">読み込み中…（ログインすると今月分が自動で表示されます）</td></tr></tbody>
      </table>
    </div>
    <p class="note" id="footNote"></p>
  </div>
</div>

<!-- 指摘モーダル（ナレッジ学習ループ）: 会話チェック→指摘→ナレッジへ蓄積 -->
<div class="fb-overlay" id="fbOverlay">
  <div class="fb-card">
    <h2>✏️ この回答への指摘</h2>
    <p class="fb-sub" id="fbSub"></p>
    <div class="fb-quote" id="fbQuote"></div>
    <textarea id="fbText" placeholder="何が違うか・正しくはどう答えるべきかを書いてください。&#10;例: リングサポーターの現行色はダークブラウンのみ。他の色はフルオーダーで対応可能と案内する。"></textarea>
    <div class="fb-actions">
      <button class="btn" type="button" id="fbSave">保存してナレッジへ反映</button>
      <button class="btn sub" type="button" id="fbCancel">キャンセル</button>
      <span class="fb-status" id="fbStatus"></span>
    </div>
  </div>
</div>

<!-- ✅指摘済バッジのクリックで、その発言に対する指摘内容を表示（2026-08-07） -->
<div class="fb-overlay" id="fbViewOverlay">
  <div class="fb-card">
    <h2>✅ この回答への指摘内容</h2>
    <p class="fb-sub" id="fbViewSub"></p>
    <div class="fb-quote" id="fbViewBody"></div>
    <div class="fb-actions">
      <button class="btn sub" type="button" id="fbViewClose">閉じる</button>
    </div>
  </div>
</div>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>N's Factory</h2>
    <p>接客ログ一覧<br>サイト管理者パスワードを入力してください。</p>
    <input type="password" id="authPassword" placeholder="パスワード" onkeydown="if(event.key==='Enter')submitAuth()">
    <button class="auth-btn" onclick="submitAuth()">ログイン</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

function sha256(text) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then((buf) =>
    Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('')
  );

}
function unlockAuth() {

  // 保存済みログイン情報のユーザー名（メールアドレス）を本文検索欄へ自動入力して

}
function submitAuth() {
  const input = document.getElementById('authPassword');
  const errEl = document.getElementById('authError');
  sha256(input.value).then((hex) => {
    if (hex === ADMIN_PASS_HASH) {
      try {
        sessionStorage.setItem(SESSION_KEY, 'ok');
        sessionStorage.setItem(KEY_STORE, input.value);
      } catch (e) {}
      unlockAuth();
    } else {
      errEl.textContent = 'パスワードが違います';
    }
  }).catch(() => { errEl.textContent = '照合に失敗しました（https環境で開いてください）'; });

// オーダー相談AI（recentlog）の応答を他系統と同じ形へ揃える。
// t は 'yyyy-MM-dd HH:mm'（新）または 'MM-dd HH:mm'（旧・年なし）。
// 旧形式は年が不明なので、期間を指定している場合だけ除外する。
function normalizeHearingLog(log, from, to) {
  droppedLegacy = 0;
  const out = [];
  log.forEach((o) => {
    const t = String(o.t || '');
    const hasYear = /^\d{4}-/.test(t);
    if (!hasYear && (from || to)) { droppedLegacy++; return; }
    if (hasYear) {
      const day = t.substring(0, 10);
      if (from && day < from) return;
      if (to   && day > to)   return;
    }
    out.push({
      datetime: t,
      staffId: '',
      question: String(o.q || ''),
      reply: o.legacy ? '（旧形式のため応答本文は未保存）' : String(o.r || ''),
      replyLen: Number(o.rlen || 0),
      img: Number(o.img || 0),
      sid: String(o.sid || ''),      // 相談1件を通しで追う識別子（2026-08-31以降のログのみ）
      miss: !!o.miss || MISS_PATTERNS_VIEW.test(String(o.q || '')),  // GASの印を優先し、古いログはここで判定
      legacy: !!o.legacy
    });
  });
  // recentlog は古い順に積まれるため、他系統と同じ「新しい順」に揃える
  return out.reverse();
}

/* 相談を1件ずつに束ねて、接客が外れたまま終わったものに印を付ける（2026-08-31）。
   8/08に同じお客様が4回言い直していたのに、ログが1発言ずつバラバラで気付けなかった。
   sid はGASが記録し始めた2026-08-31以降のログにしか無いため、
   sidが無い過去ログは「前の発言から30分以内なら同じ相談」とみなして束ねる。 */
/* ⛔ この正規表現は Apps Script/hearing_ai_proxy/Code.js の MISS_PATTERNS と同じ内容を保つこと。
   GASが miss を記録し始めたのは2026-08-31から。それより古いログには印が無いため、
   ここでも同じ条件で判定して過去分も拾えるようにしている。 */
const MISS_PATTERNS_VIEW = /(だけなん|だけです|ではありません|じゃありません|ではなく|じゃなく|そうでは|そうじゃ|違います|ちがいます|見にくい|見づらい|みにくい|小さくて|見つかりま|みつかりま|分かりにく|わかりにく|もう一度|さっきの|同じこと|伝わ)/;
const HEARING_CLOSING = /(ありがとう|よろしくお願い|検討します|また(来|き)ます|また(伺|うかが)|以上です|注文します|お願いします)/;
function markHearingIssues(list) {
  const asc = list.slice().reverse();          // listは新しい順なので古い順に直す
  const groups = [];
  let cur = null, prevTime = null;
  asc.forEach((r) => {
    const tm = Date.parse(String(r.datetime).replace(/-/g, '/'));
    const sameBySid  = cur && r.sid && cur.sid === r.sid;
    const sameByTime = cur && !r.sid && !cur.sid && prevTime && (tm - prevTime) <= 30 * 60 * 1000;
    if (!cur || !(sameBySid || sameByTime)) { cur = { sid: r.sid || '', items: [] }; groups.push(cur); }
    cur.items.push(r);
    prevTime = tm;
  });
  let flagged = 0;
  groups.forEach((g) => {
    const miss = g.items.filter((x) => x.miss).length;
    const last = g.items[g.items.length - 1];
    const closed = HEARING_CLOSING.test(String(last.question || ''));
    const tags = [];
    if (miss) tags.push('⚠️ 言い直し' + (miss > 1 ? '×' + miss : ''));
    if (g.items.length >= 6) tags.push('🔁 やりとり' + g.items.length + '回');   // 通常のヒアリングも4往復程度はあるため6回から
    if (g.items.length >= 3 && !closed) tags.push('🚪 途中で終了');
    g.items.forEach((x) => { x.issueTags = null; });
    if (tags.length) { last.issueTags = tags; flagged++; }   // 表示は新しい順なので最新の行に出す
  });
  return { groups: groups.length, flagged: flagged };
}

// 文字化け（CP932崩れ）の疑いを検出する。U+FFFD や CJK互換外の記号が連続する行を印付けする
function looksMojibake(text) {
  if (!text) return false;
  const bad = (text.match(/[� -¿†-›]/g) || []).length;
  return bad >= 3 && bad / text.length > 0.25;
}
function whoOf(r) { return currentSrc === 'ai' ? r.staffId : currentSrc === 'visitor' ? r.role : ''; }
function whoName(v) {
  return currentSrc === 'ai' ? (STAFF_NAMES[v] || v || '(不明)') : (ROLE_NAMES[v] || v || '(不明)');
}
// venue（会話の場所）。2026-08-03より前の行は記録がないため空
function venueName(v) {
  return v === 'showroom' ? '🏛 ショールーム' : v === 'site' ? '🌐 サイト' : '－';
}
function badgeClass(v) {
  if (currentSrc === 'ai') return '';
  return v === 'visitor' ? 'visitor' : v === 'chiemi' ? 'bot' : v === 'owner' ? 'owner' : '';
}

function setRange(kind) {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  let from = '', to = '';
  if (kind === 'thisMonth') {
    from = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
    to   = fmt(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  } else if (kind === 'lastMonth') {
    from = fmt(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    to   = fmt(new Date(now.getFullYear(), now.getMonth(), 0));
  }
  document.getElementById('fFrom').value = from;
  document.getElementById('fTo').value = to;
}

function applySrcUI() {
  const isArchive = currentSrc === 'archive';
  document.querySelectorAll('.live-only').forEach(el => { el.style.display = isArchive ? 'none' : ''; });
  document.querySelectorAll('.archive-only').forEach(el => { el.style.display = isArchive ? '' : 'none'; });
}

// 月次アーカイブ: 保存済みの月一覧を取り、選択中の月・系統の中身を表示する
async function loadArchive() {
  const src = SOURCES.archive;
  const sel = document.getElementById('fMonth');
  const arcSrc = document.getElementById('fArcSrc').value;

  const listRes = await fetch(src.url + '?action=archives&key=' + encodeURIComponent(getKey()));
  const listText = await listRes.text();
  if (!listText.trim().startsWith('{')) throw new Error('gas_unavailable');
  const list = JSON.parse(listText);
  if (list.status !== 'ok') throw new Error(list.error || '不明なエラー');

  const months = (list.months || []).map(m => m.month);
  const keep = sel.value;
  sel.innerHTML = months.length
    ? months.map(m => '<option value="' + m + '">' + m + '</option>').join('')
    : '<option value="">（まだありません）</option>';
  if (months.indexOf(keep) !== -1) sel.value = keep;

  archiveTable = { head: [], rows: [] };
  if (!sel.value) {
    document.getElementById('updatedAt').innerHTML = '保存済みのアーカイブはまだありません';
    document.getElementById('footNote').textContent = src.note;
    return;
  }

  const res = await fetch(src.url + '?action=archive&key=' + encodeURIComponent(getKey())
    + '&month=' + encodeURIComponent(sel.value) + '&src=' + encodeURIComponent(arcSrc));
  const text = await res.text();
  if (!text.trim().startsWith('{')) throw new Error('gas_unavailable');
  const data = JSON.parse(text);
  if (data.status !== 'ok') {
    // その月にその系統が保存されていないだけのこともある
    archiveTable = { head: [], rows: [], missing: data.error === 'not archived' };
  } else {
    archiveTable = { head: data.head || [], rows: data.rows || [] };
  }
  const found = (list.months || []).find(m => m.month === sel.value) || { files: {} };
  document.getElementById('updatedAt').innerHTML =
    sel.value + ' のアーカイブ<br>'
    + ['ai', 'visitor', 'hearing'].map(k => k + ':' + (found.files[k] ? found.files[k].rows : '−')).join(' / ');
  document.getElementById('footNote').textContent = src.note;
}

// 発注・相談受付一覧（進捗シート由来）。archiveと同じく専用の状態・描画を持つ
let ordersRows = [];

async function loadOrders() {
  const src = SOURCES.orders;
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  const qs = new URLSearchParams({ action: src.action, key: getKey() });
  if (from) qs.set('from', from);
  if (to)   qs.set('to', to);
  const res = await fetch(src.url + '?' + qs.toString());
  const text = await res.text();
  if (!text.trim().startsWith('{')) throw new Error('gas_unavailable');
  const data = JSON.parse(text);
  if (data.status !== 'ok') throw new Error(data.error === 'unauthorized' ? 'unauthorized' : (data.error || '不明なエラー'));
  ordersRows = data.rows || [];
  document.getElementById('updatedAt').innerHTML =
    new Date().toLocaleString('ja-JP') + ' 時点<br>' + src.label + '：全' + (data.total || 0) + '件';
  document.getElementById('footNote').textContent = src.note;
}

async function load() {
  const errEl = document.getElementById('loadErr');
  const btn = document.getElementById('reloadBtn');
  errEl.style.display = 'none';
  btn.disabled = true;
  applySrcUI();
  renderMonthlyQuota();   // 当月件数のアラートはログ取得を待たずに出す（GASが遅い日でも見えるように）
  document.getElementById('tbody').innerHTML = '<tr><td class="empty" colspan="5">読み込み中…</td></tr>';

  if (currentSrc === 'orders') {
    try {
      await loadOrders();
      render();
    } catch (e) {
      showLoadError(String(e.message || e));
    } finally {
      btn.disabled = false;
    }
    return;
  }

  if (currentSrc === 'archive') {
    try {
      await loadArchive();
      rows = [];
      whoFilter = '';
      render();
    } catch (e) {
      showLoadError(String(e.message || e));
    } finally {
      btn.disabled = false;
    }
    return;
  }

  const src = SOURCES[currentSrc];
  // droppedLegacy はオーダー相談（normalizeHearingLog）専用のカウンタ。リセットせずに
  // タブを切り替えると、みんなのチャット等の脚注に前タブの件数が混入する（2026-08-07修正）
  droppedLegacy = 0;
  const qs = new URLSearchParams({ action: src.action || 'chatlog', key: getKey() });
  const from = document.getElementById('fFrom').value;
  const to   = document.getElementById('fTo').value;
  // オーダー相談AI（recentlog）は期間パラメータを受け付けないため、絞り込みは取得後に行う
  if (!src.action) {
    if (from) qs.set('from', from);
    if (to)   qs.set('to', to);
  }

  try {
    // GETのみ・Content-Typeを付けないことで CORS プリフライトを回避（GAS定石）
    const res = await fetch(src.url + '?' + qs.toString());
    const text = await res.text();
    // GASが一時的に応答できないときはHTML（エラーページ）が返る。JSONとして読めない場合はその旨を出す
    if (!text.trim().startsWith('{')) throw new Error('gas_unavailable');
    const data = JSON.parse(text);
    if (data.status !== 'ok') throw new Error(data.error === 'unauthorized' ? 'unauthorized' : (data.error || '不明なエラー'));
    rows = src.action === 'recentlog' ? normalizeHearingLog(data.log || [], from, to) : (data.rows || []);
    whoFilter = '';
    document.getElementById('updatedAt').innerHTML =
      new Date().toLocaleString('ja-JP') + ' 時点<br>' + src.label + '：全'
      + (src.action === 'recentlog' ? (data.count || 0) : (data.total || 0)) + '件';
    document.getElementById('footNote').textContent =
      src.note
      + (data.truncated ? '（表示上限に達したため一部のみ表示しています）' : '')
      + (droppedLegacy ? '　※旧形式の' + droppedLegacy + '件は日付に年が入っていないため、期間を指定すると除外されます（全期間なら表示されます）。' : '');
    render();
  } catch (e) {
    showLoadError(String(e.message || e));
  } finally {
    btn.disabled = false;
  }
}

function showLoadError(msg) {
  const errEl = document.getElementById('loadErr');
  {
    errEl.style.display = 'block';
    errEl.innerHTML = msg === 'unauthorized'
      ? 'このGASは管理者キーを受け付けませんでした。パスワードが変更された可能性があります。'
      : msg === 'gas_unavailable'
      // GAS側の一時的な不調（デプロイ直後などに数十秒だけ発生する）。時間をおけば戻る
      ? 'Google Apps Script が一時的に応答できませんでした（データではなくエラーページが返りました）。<br>'
        + '数十秒ほど待ってから「🔄 読み込み」をもう一度押してください。ログ自体は失われていません。'
      : (currentSrc === 'visitor'
          ? '発言ログの取得に失敗しました（' + esc(msg) + '）。<br>'
            + 'nsfactory-visitor-chat は手動貼り付け運用のため、<b>ログ閲覧APIを追加した visitor-chat.gs をGASエディタへ貼り付け・デプロイ更新するまでこのタブは動作しません。</b>'
          : 'ログの取得に失敗しました（' + esc(msg) + '）');
    document.getElementById('tbody').innerHTML = '<tr><td class="empty" colspan="5">取得できませんでした</td></tr>';
    rows = [];
    archiveTable = { head: [], rows: [] };
    renderKpis([]);
    document.getElementById('breakdown').innerHTML = '';
  }
}

function filtered() {
  const word = document.getElementById('fWord').value.trim().toLowerCase();
  return rows.filter(r => {
    if (whoFilter && whoOf(r) !== whoFilter) return false;
    if (!word) return true;
    const hay = currentSrc === 'visitor' ? r.text : (r.question + ' ' + r.reply);
    return String(hay).toLowerCase().indexOf(word) !== -1;
  });

function renderKpis(list) {

  document.getElementById('kpiDays').innerHTML = days.size + '<span class="unit">日</span>';

function renderBreakdown(list) {
  const cnt = {};
  list.forEach(r => { const w = whoOf(r); cnt[w] = (cnt[w] || 0) + 1; });

    ? entries.map(([k, v]) =>
        '<button class="chip' + (whoFilter === k ? ' active' : '') + '" type="button" data-who="' + esc(k) + '">'
        + esc(whoName(k)) + ' <b>' + v + '</b></button>').join('')
    : '<span class="empty">該当なし</span>';
}

function cellText(text, id) {
  const t = String(text || '');

  return '<span data-full="' + esc(t) + '" id="' + id + '">' + esc(t.slice(0, 90)) + '…</span>'
       + '<button class="more" type="button" data-more="' + id + '">全文</button>' + mb;
}

function downloadCsv() {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  if (currentSrc === 'archive') {
    if (!(archiveTable.rows || []).length) { alert('出力対象がありません'); return; }
    const csv = [ (archiveTable.head || []).map(q).join(',') ]
      .concat(archiveTable.rows.map(r => r.map(q).join(','))).join('\r\n');
    saveCsvFile(csv, 'chatlog_' + document.getElementById('fMonth').value
      + '_' + document.getElementById('fArcSrc').value + '.csv');
    return;
  }
  if (currentSrc === 'orders') {
    const word = document.getElementById('fWord').value.trim().toLowerCase();
    const list = word
      ? ordersRows.filter(r => (String(r.item) + String(r.client) + String(r.hearingContent) + String(r.orderNo)).toLowerCase().indexOf(word) !== -1)
      : ordersRows;
    if (!list.length) { alert('出力対象がありません'); return; }
    const head = ['受付日', '受付番号', '連絡先あり', '品名', 'ステータス', '内容', '登録日時'];
    const body = list.map(r => [r.receivedDate, r.orderNo, r.hasContact ? 'あり' : '未記入', r.item, r.status, r.hearingContent, r.registeredAt].map(q).join(','));
    saveCsvFile([head.map(q).join(',')].concat(body).join('\r\n'),
      'chatlog_orders_' + (document.getElementById('fFrom').value || 'all') + '_' + (document.getElementById('fTo').value || 'all') + '.csv');
    return;
  }
  const list = filtered();
  if (!list.length) { alert('出力対象がありません'); return; }
  const head = currentSrc === 'ai'
    ? ['日時', 'staffId', '担当幕僚', 'venue', '会話の場所', '質問', '応答', '応答字数']
    : currentSrc === 'hearing'
    ? ['日時', '相談', '応答', '応答字数', '画像枚数']
    : ['日時', 'id', 'role', '発言者', '表示名', '発言'];
  const body = list.map(r => currentSrc === 'ai'
    ? [r.datetime, r.staffId, whoName(r.staffId), r.venue, venueName(r.venue), r.question, r.reply, r.replyLen].map(q).join(',')
    : currentSrc === 'hearing'
    ? [r.datetime, r.question, r.reply, r.replyLen, r.img || 0].map(q).join(',')
    : [r.datetime, r.id, r.role, whoName(r.role), r.name, r.text].map(q).join(','));
  saveCsvFile([head.map(q).join(',')].concat(body).join('\r\n'),
    'chatlog_' + currentSrc + '_'
    + (document.getElementById('fFrom').value || 'all') + '_'
    + (document.getElementById('fTo').value || 'all') + '.csv');
}

// Excelでの文字化けを防ぐためBOM付きUTF-8で出力する
function saveCsvFile(csv, filename) {
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// GET系のGAS呼び出し（HTMLエラーページが返ることがあるため再試行つき）
/* 当月の相談件数としきい値（2026-09-04 事業主要望）。
   AIをSonnetに上げて単価が約3倍になったため、件数が増えたことに気づけるようにする。
   ⛔ メール通知は使わない（Gmailの権限が失効すると気づけないまま止まるため・事業主指示）。
   しきい値はこの画面から変更できる（GAS ScriptProperties の MONTHLY_ALERT_THRESHOLD）。 */
async function renderMonthlyQuota(flash) {
  const box = document.getElementById('quotaBar');
  if (!box) return;
  if (currentSrc !== 'hearing') { box.style.display = 'none'; return; }
  let d = null;
  try {
    d = await fetchJsonRetry(SOURCES.hearing.url + '?action=monthlystats&key=' + encodeURIComponent(getKey()));
  } catch (e) { d = null; }
  if (!d || d.error) { box.style.display = 'none'; return; }   // 未対応のGASでも画面を壊さない
  const pct = Math.min(100, Math.round(d.count / Math.max(1, d.threshold) * 100));
  const ym = String(d.month || '');
  const label = ym.length === 6 ? (ym.slice(0, 4) + '年' + Number(ym.slice(4)) + '月') : ym;
  box.style.display = '';
  box.className = 'quota-bar' + (d.over ? ' over' : '');
  box.innerHTML =
    (d.over ? '⚠️ ' : '📊 ') + label + 'の相談 <b>' + d.count + '件</b> / 目安 ' + d.threshold + '件'
    + (d.over ? '　<b>目安を超えています</b>' : '')
    + '<span class="meter"><span style="width:' + pct + '%"></span></span>'
    + '<span class="sub">応答モデル: ' + esc(String(d.model || '—')) + '／1日の上限 ' + d.limitPerDay + '件'
    + '／相談があった日数 ' + d.activeDays + '日</span>'
    + '<div style="margin-top:6px">目安の件数 '
    + '<input id="quotaThresholdInput" type="number" min="1" max="100000" value="' + d.threshold + '"> 件 '
    + '<button type="button" id="quotaThresholdSave">保存</button> '
    + '<span id="quotaThresholdMsg" class="sub"></span></div>';
  if (flash) document.getElementById('quotaThresholdMsg').textContent = flash;
  const saveBtn = document.getElementById('quotaThresholdSave');
  saveBtn.addEventListener('click', async () => {
    const n = parseInt(document.getElementById('quotaThresholdInput').value, 10);
    const msg = document.getElementById('quotaThresholdMsg');
    if (!(n > 0)) { msg.textContent = '1以上の数値を入れてください'; return; }
    // GASの応答は数秒かかる。押しっぱなしの二重送信を防ぐ
    saveBtn.disabled = true;
    msg.textContent = '保存中…（数秒かかります）';
    try {
      const r = await fetchJsonRetry(SOURCES.hearing.url + '?action=setalert&key=' + encodeURIComponent(getKey()) + '&n=' + n);
      if (r && r.status === 'ok') {
        renderMonthlyQuota('✓ 目安を ' + r.threshold + ' 件に変更しました');   // 再描画するので結果は引数で渡す
      } else {
        saveBtn.disabled = false;
        msg.textContent = '⚠️ ' + ((r && r.error) || '保存できませんでした');
      }
    } catch (e) {
      saveBtn.disabled = false;
      msg.textContent = '⚠️ 通信に失敗しました。少し待って再度お試しください';
    }
  });
}


async function fetchJsonRetry(url) {
  let last = '';
  for (let i = 1; i <= 3; i++) {
    try {
      const res = await fetch(url);
      const t = await res.text();
      if (t.trim().startsWith('{')) return JSON.parse(t);
      last = 'GASが一時的に応答できませんでした';
    } catch (e) { last = String(e.message || e); }
    await new Promise(r => setTimeout(r, 1500 * i));
  }
  throw new Error(last);
}

// テスト会話の削除。ai=logシートの行削除／hearing=直近ログ（プロパティ）＋日次退避先の両方から削除
async function deleteRow(i) {
  const r = fbList[i];
  if (!r) return;
  if (!confirm('この会話をログから削除します（元に戻せません）。\n\n🙂 ' + String(r.question || r.text || '').slice(0, 80))) return;
  const enc = encodeURIComponent;
  try {
    if (currentSrc === 'visitor') {
      // みんなのチャット: visitor-chat GASのlogシートから1行削除（日時秒まで＋発言者id＋本文先頭40字で特定）
      const res = await fetchJsonRetry(SOURCES.visitor.url + '?action=deletelog&key=' + enc(getKey())
        + '&t=' + enc(r.datetime) + '&id=' + enc(r.id || '') + '&q=' + enc(String(r.text || '').slice(0, 40)));
      if (res.status !== 'ok') throw new Error(res.error || '削除に失敗しました');
      if (!res.deleted) throw new Error('対象の行が見つかりませんでした（すでに削除済みの可能性）');
    } else if (currentSrc === 'ai') {
      const res = await fetchJsonRetry(SOURCES.ai.url + '?action=deletelog&src=ai&key=' + enc(getKey())
        + '&t=' + enc(r.datetime) + '&q=' + enc(String(r.question || '').slice(0, 40)));
      if (res.status !== 'ok') throw new Error(res.error || '削除に失敗しました');
      if (!res.deleted) throw new Error('対象の行が見つかりませんでした（すでに削除済みの可能性）');
    } else {
      // ①直近ログ（hearing proxyのプロパティ）から削除
      const res = await fetchJsonRetry(SOURCES.hearing.url + '?action=dellog&key=' + enc(getKey())
        + '&t=' + enc(r.datetime) + '&q=' + enc(String(r.question || '').slice(0, 40)));
      if (res.error) throw new Error(res.error);
      // ②日次退避先（月別シート）からも削除。失敗しても①は成立しているため続行
      try {
        await fetchJsonRetry(SOURCES.ai.url + '?action=deletelog&src=hearing&key=' + enc(getKey())
          + '&t=' + enc(r.datetime) + '&q=' + enc(String(r.question || '').slice(0, 120)));
      } catch (e2) { /* 月次アーカイブ側は次回の手動削除で対応可能 */ }
      if (!res.deleted) throw new Error('直近ログに対象が見つかりませんでした（すでに削除済みの可能性）');
    }
    rows = rows.filter(x => x !== r);
    render();
  } catch (e) {
    alert('削除できませんでした: ' + String(e.message || e));
  }
}
const KB_REPO_PATH = 'order_estimate/hearing-kb.json';
const KB_API = 'https://api.github.com/repos/you0810jmsdf/ns-factory/contents/' + KB_REPO_PATH;

function openFeedback(i) {
  const r = fbList[i];
  if (!r) return;
  fbTarget = { src: currentSrc, row: r };
  fbRequestId = 'fb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  document.getElementById('fbSub').textContent = currentSrc === 'ai'
    ? '反映先: 幕僚キャラ接客の追加知識（保存すると次の会話から全幕僚に効きます）＋指摘台帳'
    : '反映先: オーダー相談のナレッジ（hearing-kb.json）＋指摘台帳';
  document.getElementById('fbQuote').innerHTML =
    '<div class="q">🙂 ' + esc(r.question || '') + '</div>'
    + '<div class="a">🤖 ' + esc(r.reply || '') + '</div>';
  document.getElementById('fbText').value = '';
  document.getElementById('fbStatus').textContent = '';
  document.getElementById('fbStatus').className = 'fb-status';
  document.getElementById('fbSave').disabled = false;
  document.getElementById('fbOverlay').classList.add('on');
  document.getElementById('fbText').focus();
}

// GAS応答が一時的にHTMLになることがあるため、requestId冪等化を前提にリトライする
async function fbPostGas(body) {
  let last = '';
  for (let i = 1; i <= 4; i++) {
    try {
      const res = await fetch(FB_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
      const t = await res.text();
      if (t.trim().startsWith('{')) return JSON.parse(t);
      last = 'GASが一時的に応答できませんでした';
    } catch (e) { last = String(e.message || e); }
    await new Promise(r => setTimeout(r, 2000 * i));
  }
  throw new Error(last);
}

// hearing-kb.json の extraKnowledge へ追記して GitHub へ保存（管理画面と同じContents API）
async function fbAppendToHearingKb(feedback) {
  const token = (window.NSFGitHubToken && NSFGitHubToken.get()) || '';
  if (!token) throw new Error('GitHubトークン未設定（管理画面の「GitHubトークン設定」で保存してください）');
  const headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' };
  const getRes = await fetch(KB_API, { headers });
  if (!getRes.ok) throw new Error('kb取得に失敗 HTTP ' + getRes.status);
  const meta = await getRes.json();
  const kb = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(meta.content.replace(/\n/g, '')), c => c.charCodeAt(0))));
  // toISOString()はUTCのため日本の午前中は前日になる。JSTへ+9hして日付を取る
  const stamp = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  kb.extraKnowledge = ((kb.extraKnowledge || '').trim() + '\n■' + stamp + '指摘: ' + feedback).trim();
  const json = JSON.stringify(kb, null, 2) + '\n';
  const b64 = btoa(Array.from(new TextEncoder().encode(json), b => String.fromCharCode(b)).join(''));
  const putRes = await fetch(KB_API, {
    method: 'PUT', headers,
    body: JSON.stringify({ message: '指摘をナレッジへ反映（chatlog 履歴管理より）', content: b64, sha: meta.sha })
  });
  if (!putRes.ok) throw new Error('kb保存に失敗 HTTP ' + putRes.status);
}

async function saveFeedback() {
  const text = document.getElementById('fbText').value.trim();
  const st = document.getElementById('fbStatus');
  if (!text) { st.textContent = '指摘内容を入力してください'; st.className = 'fb-status err'; return; }
  const btn = document.getElementById('fbSave');
  btn.disabled = true;
  st.textContent = '保存中…'; st.className = 'fb-status';
  const r = fbTarget.row;
  try {
    // ①台帳記録＋（ai系は）知識への即反映
    const gas = await fbPostGas({
      action: 'feedback', key: getKey(), requestId: fbRequestId,
      src: fbTarget.src, targetDatetime: r.datetime, staffId: r.staffId || '',
      question: r.question || '', reply: r.reply || '', feedback: text
    });
    if (gas.status !== 'ok') throw new Error(gas.message || gas.error || '保存に失敗しました');
    // ②hearing系はナレッジ本体（hearing-kb.json）へも反映
    if (fbTarget.src === 'hearing') await fbAppendToHearingKb(text);
    st.textContent = '✅ 反映しました（' + gas.applied + '）。GitHub Pagesの反映には1〜2分かかります。';
    st.className = 'fb-status ok';
    // ✅指摘済バッジを即時反映（畳む設定ONなら折りたたまれる）
    const doneKey = fbKeyOf(fbTarget.src, r.datetime, r.staffId || '');
    if (!fbInfo.has(doneKey)) fbInfo.set(doneKey, []);
    fbInfo.get(doneKey).push({ at: new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 16).replace('T', ' '), fb: text, applied: gas.applied || '' });
    setTimeout(() => { document.getElementById('fbOverlay').classList.remove('on'); render(); }, 1800);
  } catch (e) {
    st.textContent = '⚠️ ' + String(e.message || e) + '（同じ保存ボタンで再試行できます。二重反映はされません）';
    st.className = 'fb-status err';
    btn.disabled = false;
  }
}
document.getElementById('fbSave').addEventListener('click', saveFeedback);
document.getElementById('fbCancel').addEventListener('click', () => document.getElementById('fbOverlay').classList.remove('on'));
document.getElementById('fbViewClose').addEventListener('click', () => document.getElementById('fbViewOverlay').classList.remove('on'));

document.getElementById('tbody').addEventListener('click', (ev) => {
  const fb = ev.target.closest('[data-fb]');
  if (fb) { openFeedback(Number(fb.dataset.fb)); return; }
  const del = ev.target.closest('[data-del]');
  if (del) { deleteRow(Number(del.dataset.del)); return; }
  const fv = ev.target.closest('[data-fbview]');
  if (fv) { openFbView(fv.dataset.fbview); return; }
  const uf = ev.target.closest('[data-unfold]');
  if (uf) { unfolded.add(uf.dataset.unfold); render(); return; }
  if (ev.target.id === 'clearFilters') {
    whoFilter = '';
    document.getElementById('fWord').value = '';
    fWordUser = '';
    render();
    return;
  }
  const btn = ev.target.closest('[data-more]');
  if (!btn) return;
  const span = document.getElementById(btn.dataset.more);
  if (span) { span.textContent = span.dataset.full; btn.remove(); }
});

if (checkSession()) unlockAuth();
else document.getElementById('authPassword').focus();
