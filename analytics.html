<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アクセス解析 | N's factory</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ND1T7H067Y"></script>

  function gtag(){dataLayer.push(arguments);}

<style>
:root {
  --bg:       #1D1D1F;
  --bg-card:  #2C2C2E;
  --bg-row:   #3A3A3C;
  --accent:   #A0785A;
  --text:     #F5F5F7;
  --text-sub: #AEAEB2;
  --border:   #48484A;
  --green:    #30D158;
  --red:      #FF453A;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Hiragino Sans", sans-serif;
  min-height: 100vh;
  padding: 24px 16px 48px;
}
h1 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 24px;
  letter-spacing: .04em;
}

/* 認証 */
#auth-screen {
  max-width: 360px;
  margin: 80px auto;
  background: var(--bg-card);
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
}
#auth-screen h2 { font-size: 1.1rem; margin-bottom: 24px; color: var(--text-sub); }
#auth-screen input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-row);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 1rem;
  margin-bottom: 16px;
  outline: none;
}
#auth-screen input:focus { border-color: var(--accent); }
#auth-screen button {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
#auth-error { color: var(--red); font-size: .85rem; margin-top: 12px; min-height: 20px; }

/* メイン */
#main { display: none; max-width: 800px; margin: 0 auto; }

/* 期間切替 */
.period-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.period-btn {
  padding: 8px 20px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-sub);
  font-size: .9rem;
  cursor: pointer;
  transition: .15s;
}
.period-btn:hover { border-color: var(--accent); color: var(--text); }
.period-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

/* サマリーカード */
.summary-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.card {
  background: var(--bg-card);
  border-radius: 14px;
  padding: 20px;
}
.card .label { font-size: .8rem; color: var(--text-sub); margin-bottom: 8px; }
.card .value { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }
.card .value.green { color: var(--green); }
.card .value.accent { color: var(--accent); }

/* テーブル */
.table-wrap {
  background: var(--bg-card);
  border-radius: 14px;
  overflow: hidden;
}
.table-header {
  padding: 16px 20px 8px;
  font-size: .85rem;
  color: var(--text-sub);
  font-weight: 600;
  letter-spacing: .05em;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 12px 20px;
  text-align: left;
  font-size: .9rem;
  border-bottom: 1px solid var(--border);
}
th {
  color: var(--text-sub);
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .06em;
  background: var(--bg-row);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.03); }

.page-path {
  font-family: "SF Mono", "Menlo", monospace;
  font-size: .82rem;
  color: var(--text);
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar-wrap { width: 120px; }
.bar-bg {
  background: var(--bg-row);
  border-radius: 4px;
  height: 6px;
  overflow: hidden;
}
.bar-fill {
  background: var(--accent);
  height: 100%;
  border-radius: 4px;
  transition: width .4s ease;
}
.num { text-align: right; font-weight: 600; }
.users { color: var(--text-sub); text-align: right; font-size: .85rem; }

/* ローディング */
#loading {
  text-align: center;
  padding: 60px;
  color: var(--text-sub);
  display: none;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

#error-msg { color: var(--red); text-align: center; padding: 32px; display: none; font-size: .9rem; }

/* note KPI */
.kpi-section { margin-top: 48px; }
.kpi-section h2 { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; letter-spacing: .04em; }
.kpi-month-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.kpi-month-row select {
  padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text); font-size: .9rem; cursor: pointer;
}
.kpi-save-btn {
  padding: 7px 18px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; font-size: .85rem; font-weight: 700; cursor: pointer;
}
.kpi-save-btn:hover { opacity: .85; }
.kpi-clear-btn {
  font-size: .78rem; color: var(--text-sub); background: none; border: none;
  cursor: pointer; text-decoration: underline;
}
.kpi-saved-msg { font-size: .8rem; color: var(--green); font-weight: 700; opacity: 0; transition: opacity .4s; }
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.kpi-card {
  background: var(--bg-card); border-radius: 12px; padding: 16px 14px 12px;
  border: 1px solid var(--border);
}
.kpi-card .kl { font-size: .72rem; font-weight: 700; color: var(--text-sub); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 6px; }
.kpi-card .kt { font-size: .75rem; color: var(--text-sub); margin-bottom: 8px; }
.kpi-card .ka { display: flex; align-items: center; gap: 6px; }
.kpi-card input {
  width: 76px; padding: 4px 8px;
  background: var(--bg-row); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 1.1rem; font-weight: 700; text-align: right;
}
.kpi-card input:focus { outline: none; border-color: var(--accent); }
.kpi-card .ku { font-size: .75rem; color: var(--text-sub); }
.kpi-rate { font-size: .7rem; font-weight: 700; margin-top: 6px; padding: 2px 7px; border-radius: 999px; display: inline-block; }
.kpi-rate.good { background: rgba(48,209,88,.15); color: var(--green); }
.kpi-rate.warn { background: rgba(255,214,10,.12); color: #FFD60A; }
.kpi-rate.ng   { background: rgba(255,69,58,.15);  color: var(--red); }
.kpi-rate.empty{ background: var(--bg-row); color: var(--text-sub); }
.kpi-log-wrap { background: var(--bg-card); border-radius: 14px; overflow: hidden; }
.kpi-log-wrap .table-header { padding: 14px 20px 6px; font-size: .8rem; color: var(--text-sub); font-weight: 600; letter-spacing: .05em; }
</style>
</head>
<body>

<!-- 認証画面 -->
<div id="auth-screen">
  <h2>アクセス解析</h2>
  <input type="password" id="pw-input" placeholder="パスワード" />
  <button onclick="login()">ログイン</button>
  <div id="auth-error"></div>
</div>

<!-- メイン -->
<div id="main">
  <h1>アクセス解析ダッシュボード</h1>

  <div class="period-bar">
    <button class="period-btn" onclick="load(7)"  data-days="7">7日</button>
    <button class="period-btn active" onclick="load(30)" data-days="30">30日</button>
    <button class="period-btn" onclick="load(90)" data-days="90">90日</button>
  </div>

  <div class="summary-cards">
    <div class="card">
      <div class="label">ページビュー</div>
      <div class="value accent" id="total-views">—</div>
    </div>
    <div class="card">
      <div class="label">ユニークユーザー</div>
      <div class="value green" id="total-users">—</div>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    データ取得中…
  </div>
  <div id="error-msg"></div>

  <div class="table-wrap" id="table-wrap">
    <div class="table-header">ページ別アクセス</div>
    <table>
      <thead>
        <tr>
          <th>ページ</th>
          <th></th>
          <th class="num">PV</th>
          <th class="users">ユーザー</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <!-- note KPI -->
  <div class="kpi-section">
    <h2>note 運用 月次KPI</h2>
    <div class="kpi-month-row">
      <select id="kpi-month-sel"></select>
      <button class="kpi-save-btn" onclick="kpiSave()">保存</button>
      <span id="kpi-saved-msg" class="kpi-saved-msg">✓ 保存</span>
      <button class="kpi-clear-btn" onclick="kpiClearMonth()">この月を削除</button>
    </div>
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="kpi-log-wrap">
      <div class="table-header">月次実績ログ</div>
      <table>
        <thead>
          <tr>
            <th>月</th><th>無料記事</th><th>有料記事</th><th>PV</th>
            <th>購読者増</th><th>PDF販売</th><th>収益(円)</th><th>API費(円)</th>
          </tr>
        </thead>
        <tbody id="kpi-log-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// GAS WebアプリURL（デプロイ後に更新）
var GAS_URL = "https://script.google.com/macros/s/AKfycbw-ghhuzw8WYH7w4Png96Qt3s5EYbVaK_P32UJvqvhr28Ck2mxQJkedbAimogVHExeouw/exec";
var ADMIN_KEY = "";
var currentDays = 30;

// ページ名マッピング
var PAGE_NAMES = {
  "/":                              "トップ",
  "/ns-factory/":                   "トップ",
  "/ns-factory/index.html":         "トップ",
  "/ns-factory/works.html":         "作品一覧",
  "/ns-factory/profile.html":       "プロフィール",
  "/ns-factory/links.html":         "リンク集",
  "/ns-factory/orderprogress.html": "注文進捗",
  "/ns-factory/JHCS.html":          "JHCS",
  "/ns-factory/password-note.html": "パスワード管理（LP）",
  "/ns-factory/password-note/":     "パスワード管理（アプリ）",
  "/ns-factory/password-note/index.html": "パスワード管理（アプリ）",
  "/ns-factory/カラーシミュレーター/simulator.html": "カラーシミュレーター",
  "/ns-factory/order_estimate/leather-order-estimate-v2.html": "見積もりツール",
  "/ns-factory/order_estimate/admin.html":                     "管理画面",
  "/ns-factory/weekly-block/":      "週間ブロック印刷",
  "/ns-factory/weekly-block/index.html": "週間ブロック印刷",
  "/ns-factory/a6-print-tool/":     "A6印刷ツール",
  "/ns-factory/a6-print-tool/daily_block.html": "A6印刷ツール",
  "/ns-factory/a6-print-tool/weekly_block.html": "A6週間ブロック",
};

function login() {
  var pw = document.getElementById("pw-input").value;
  if (!pw) return;
  ADMIN_KEY = pw;
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("main").style.display = "block";
  load(30);
}

document.getElementById("pw-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});

function load(days) {
  currentDays = days;
  document.querySelectorAll(".period-btn").forEach(function(b) {
    b.classList.toggle("active", parseInt(b.dataset.days) === days);
  });

  document.getElementById("loading").style.display = "block";
  document.getElementById("table-wrap").style.display = "none";
  document.getElementById("error-msg").style.display = "none";
  document.getElementById("total-views").textContent = "—";
  document.getElementById("total-users").textContent = "—";

  var cbName = "ga4cb" + Date.now();
  var script = document.createElement("script");
  script.src = GAS_URL + "?api=analytics&key=" + encodeURIComponent(ADMIN_KEY)
             + "&days=" + days + "&callback=" + cbName;

  window[cbName] = function(data) {
    delete window[cbName];
    document.body.removeChild(script);
    document.getElementById("loading").style.display = "none";

    if (data.error) {
      var em = document.getElementById("error-msg");
      em.textContent = data.error === "unauthorized" ? "パスワードが違います" : "エラー: " + data.error;
      em.style.display = "block";
      return;
    }

    document.getElementById("total-views").textContent = (data.totals.views || 0).toLocaleString();
    document.getElementById("total-users").textContent = (data.totals.users || 0).toLocaleString();

    var maxViews = data.rows.length ? data.rows[0].views : 1;
    var tbody = document.getElementById("table-body");
    tbody.innerHTML = "";
    data.rows.forEach(function(row) {
      var name = PAGE_NAMES[row.page] || row.page;
      var pct  = Math.round(row.views / maxViews * 100);
      var tr = document.createElement("tr");
      tr.innerHTML = '<td><span class="page-path" title="' + row.page + '">' + name + '</span></td>'
        + '<td class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%"></div></div></td>'
        + '<td class="num">' + row.views.toLocaleString() + '</td>'
        + '<td class="users">' + row.users.toLocaleString() + '</td>';
      tbody.appendChild(tr);
    });

    if (!data.rows.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-sub);padding:32px">データなし</td></tr>';
    }
    document.getElementById("table-wrap").style.display = "block";
  };

  script.onerror = function() {
    document.getElementById("loading").style.display = "none";
    var em = document.getElementById("error-msg");
    em.textContent = "GAS URLが設定されていません。analytics.html内のGAS_URLを更新してください。";
    em.style.display = "block";
  };

  document.body.appendChild(script);
}

/* ===== note KPI ===== */
var KPI_DEFS = [
  {key:'free', label:'無料記事数',  unit:'本', target:12},
  {key:'paid', label:'有料記事数',  unit:'本', target:3},
  {key:'pv',   label:'月間PV',      unit:'PV', target:3000},
  {key:'subs', label:'購読者純増',  unit:'名', target:5},
  {key:'pdf',  label:'PDF販売数',   unit:'本', target:10},
  {key:'rev',  label:'月間収益',    unit:'円', target:null},
  {key:'api',  label:'API費用',     unit:'円', target:100},
];
var KPI_STORE = 'nsfactory_note_kpi';

function kpiMonths() {
  var list = [], now = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    list.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  return list;
}
function kpiLoad() { try { return JSON.parse(localStorage.getItem(KPI_STORE)) || {}; } catch(e) { return {}; } }
function kpiRateClass(v, t) {
  if (v === '' || isNaN(v) || t === null) return 'empty';
  var r = v / t;
  return r >= 1 ? 'good' : r >= 0.7 ? 'warn' : 'ng';
}
function kpiRateLabel(v, t) {
  if (v === '' || isNaN(Number(v))) return '未入力';
  if (t === null) return '—';
  return '達成率 ' + Math.round(Number(v)/t*100) + '%';
}
function kpiRenderGrid(month) {
  var rec = (kpiLoad()[month] || {});
  document.getElementById('kpi-grid').innerHTML = KPI_DEFS.map(function(d) {
    var val = rec[d.key] !== undefined ? rec[d.key] : '';
    var rc = kpiRateClass(Number(val), d.target);
    var rl = kpiRateLabel(val, d.target);
    var tstr = d.target !== null ? '目標: ' + d.target.toLocaleString() + ' ' + d.unit : '目標: —';
    return '<div class="kpi-card">'
      + '<div class="kl">'+d.label+'</div>'
      + '<div class="kt">'+tstr+'</div>'
      + '<div class="ka">'
      + '<input id="kpi-'+d.key+'" type="number" min="0" value="'+val+'" placeholder="—">'
      + '<span class="ku">'+d.unit+'</span>'
      + '</div>'
      + '<span class="kpi-rate '+rc+'" id="kpi-rate-'+d.key+'">'+rl+'</span>'
      + '</div>';
  }).join('');
  KPI_DEFS.forEach(function(d) {
    var inp = document.getElementById('kpi-'+d.key);
    if (!inp) return;
    inp.addEventListener('input', function() {
      var span = document.getElementById('kpi-rate-'+d.key);
      span.className = 'kpi-rate ' + kpiRateClass(Number(inp.value), d.target);
      span.textContent = kpiRateLabel(inp.value, d.target);
    });
  });
}
function kpiSave() {
  var month = document.getElementById('kpi-month-sel').value;
  var data = kpiLoad(), rec = {};
  KPI_DEFS.forEach(function(d) {
    var inp = document.getElementById('kpi-'+d.key);
    rec[d.key] = inp ? inp.value : '';
  });
  data[month] = rec;
  localStorage.setItem(KPI_STORE, JSON.stringify(data));
  kpiRenderLog();
  var msg = document.getElementById('kpi-saved-msg');
  msg.style.opacity = '1';
  setTimeout(function(){ msg.style.opacity = '0'; }, 2000);
}
function kpiClearMonth() {
  var month = document.getElementById('kpi-month-sel').value;
  if (!confirm(month + ' のデータを削除しますか？')) return;
  var data = kpiLoad();
  delete data[month];
  localStorage.setItem(KPI_STORE, JSON.stringify(data));
  kpiRenderGrid(month);
  kpiRenderLog();
}
function kpiRenderLog() {
  var data = kpiLoad();
  var months = Object.keys(data).sort().reverse();
  var tbody = document.getElementById('kpi-log-body');
  if (!months.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-sub);padding:24px">実績データなし</td></tr>';
    return;
  }
  tbody.innerHTML = months.map(function(m) {
    var r = data[m];
    function v(k){ return (r[k] !== '' && r[k] !== undefined) ? Number(r[k]).toLocaleString() : '—'; }
    return '<tr><td style="font-weight:700">'+m+'</td>'
      +'<td>'+v('free')+'</td><td>'+v('paid')+'</td><td>'+v('pv')+'</td>'
      +'<td>'+v('subs')+'</td><td>'+v('pdf')+'</td><td>'+v('rev')+'</td><td>'+v('api')+'</td></tr>';
  }).join('');
}
function kpiInit() {
  var sel = document.getElementById('kpi-month-sel');
  var months = kpiMonths();
  months.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function(){ kpiRenderGrid(sel.value); });
  kpiRenderGrid(months[0]);
  kpiRenderLog();
}
/* KPIはログイン後のみ初期化 */
var _origLogin = login;
login = function() { _origLogin(); kpiInit(); };
</script>
</body>
</html>
