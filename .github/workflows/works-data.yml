name: 作品集フォールバックデータ更新

# works-data.json は作品集（works.html）の静的フォールバック。
# GAS WebApp が断続的に落ちる（2026-08-04実測: 失敗率6/8・最悪164秒）ため、
# 同じ商品データをリポジトリにも置いて即表示できるようにしている。
# ここが古いままだと、GAS障害中に新商品が作品集へ出ない。

on:
  schedule:
    # 3時間おき（UTC）。商品登録の反映が半日遅れないように
    - cron: "10 */3 * * *"
  workflow_dispatch:
  # register.html が登録・更新完了時に発火する（2026-08-12追加）。
  # これが動けば作品集への反映は数分。スケジュールはGAS障害時の保険として残す。
  # ※ fine-grained PAT（Contents: RW）で叩けるのは repository_dispatch。
  #    workflow_dispatch は actions: write が必要なので使わない。
  repository_dispatch:
    types: [product-registered]

permissions:
  contents: write

concurrency:
  group: works-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build works-data.json
        run: node tools/build_works_data.js

      # SNSに1作品を名指しで貼るためのOGP付き案内ページ（works/<商品ID>.html）。
      # works-data.json を入力にするので必ずこの順で実行する。
      - name: Build per-work share pages
        run: node tools/build_work_pages.js

      - name: Commit updated data
        run: |
          if git diff --quiet -- works-data.json works/; then
            echo "変更なし。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works-data.json works/
          git commit -m "auto: 作品集フォールバックデータと作品ページを更新"
          git push
