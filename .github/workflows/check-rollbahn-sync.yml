name: check-rollbahn-sync

# リフィルメーカーと N's CAD で、ロルバーン L・M の用紙・穴の数値が食い違っていないかを調べる（tools/check_rollbahn_sync.cjs）。
# 実測して片方だけ直したときに、食い違いに気づけるようにするためのもの。
on:
  push:
    branches: [main]
    paths:
      - 'refill-maker/**'
      - 'nscad/data/binder/**'
      - 'nscad/data/library.json'
      - 'tools/check_rollbahn_sync.cjs'
  pull_request:
    paths:
      - 'refill-maker/**'
      - 'nscad/data/binder/**'
      - 'nscad/data/library.json'
      - 'tools/check_rollbahn_sync.cjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check_rollbahn_sync.cjs
