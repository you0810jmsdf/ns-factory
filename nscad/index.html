      "title": "作図と座標",
      "body": "内部座標は x 右・y 下、mm。円弧・回転は時計回りが正。C 面は両辺を指定距離で切り取り、丸め (R) は接円弧を作ります。オフセットは閉図形と円では外が正、開経路は画面で進行方向の左が正。円弧は半径増加が正。\n円弧は作図オプションの「円弧の描き方」で選べます。「中心と半径」は、中心から始点へドラッグ→終点方向をクリック。半径欄に数値（mm）を入れておくと半径がその値に固定され、中心をクリック→始点方向をクリック→終点方向をクリックで描けます。「3点」は始点→通過点→終点の順にクリックすると、3点を通る円弧を作ります（一直線上の3点は作れません・Esc で中止）。\n端点・中心の磁石：作図ツールでは、他の図形の端点と、円・円弧の中心に、スナップのチェックと関係なく吸い付きます（円・円弧の中心は作図ツール中だけ薄い十字で自動表示）。吸い付く距離は作図オプションの「端点・中心の吸着距離 (px)」で変えられます（既定10・0で磁石を切る・設定は保存されます）。中点・交点・格子は従来どおりスナップのチェックに従います。直線・折れ線の各辺・ベジェや曲線（ペン）の各区間の中点と両端、円弧の中点（弧の真ん中）と両端、円の上下左右と斜め45度の8か所、目打ちの縫い穴と目印の中心（画面に見えている穴）にも、同じ距離で吸い付きます（定規で穴の間隔を測るときに使えます）（これらはスナップのチェックと関係なく効きます。曲線の中点は長さの真ん中です）。作図ツールでポインタがこれらの点に近づく（約40px以内）と、その点が小さなひし形の印で出ます。\n丸め (R)・面取り (C) は、端点を共有する2本の直線を順にクリックするほか、折れ線（矩形など）を1回クリックして使えます。折れ線の角の近くをクリックするとその角だけ、辺の途中をクリックすると全部の角を、入力した半径（C 寸法）で丸め（切り取り）ます。結果は直線と円弧の連なりになり、元に戻すで一度に戻せます。半径が大きく隣の角と重なる場合や、開いた折れ線の端は作れません。縫い穴付きの図形は先に穴を取り除いてください。\n矩形：ツールバーの「矩形」で、対角の2点をドラッグ（またはクリック→クリック）すると、閉じた折れ線（4点）の四角形を描きます。Shift を押すと正方形になります。入力欄では、1点目に「x,y」、2点目に「@幅,高さ」と打てます。幅か高さが0のときは作りません。\nオフセット：先に作図オプションで「オフセット距離」と「向き」（外側／内側）を決めておきます。図形をクリックすると、他の図形との交点から交点までの区間を選び（橙色で表示）、ダブルクリックするとつながった図形全体（閉じていれば閉じた図形）を選びます。Enter か「選んだ範囲をオフセット」で実行します。つながった線は結合点をまたいで1つとして扱います。閉じた図形は外側と内側、開いた線は進行方向の左（外側）と右（内側）。結果は黄色の点線で、色と線種は情報カードで変えられます。"
