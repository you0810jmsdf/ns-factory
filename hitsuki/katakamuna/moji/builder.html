<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カタカムナ 文字ビルダー — N's factory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', sans-serif; background: #0d0d1a; color: #e0e0e0; min-height: 100vh; }

    .site-header {
      background: #0a0a16; border-bottom: 1px solid #2a2a3e;
      padding: 0.7rem 1.2rem; display: flex; align-items: center; gap: 1rem;
    }
    .site-logo { color: #f0c040; font-size: 0.95rem; font-weight: bold; text-decoration: none; }
    .nav-sep { color: #444; }
    .nav-link { color: #aaa; font-size: 0.85rem; text-decoration: none; }
    .nav-link:hover { color: #f0c040; }

    .page-title {
      text-align: center; padding: 1.5rem 1rem 1rem;
      background: linear-gradient(to bottom, #0a0a16, #0d0d1a);
    }
    .page-title h1 { font-size: 1.5rem; color: #f0c040; margin-bottom: 0.3rem; }
    .page-title p  { font-size: 0.8rem; color: #888; }

    /* ─── メインレイアウト ─── */
    .builder-wrap {
      max-width: 1100px; margin: 0 auto; padding: 1rem;
      display: grid;
      grid-template-columns: 200px 1fr 200px;
      grid-template-rows: auto auto;
      gap: 12px;
    }

    /* ─── 左: パーツパネル ─── */
    .parts-panel {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px;
      padding: 10px; grid-row: 1 / 3;
    }
    .parts-panel h3 {
      font-size: 0.75rem; color: #f0c040; margin-bottom: 8px;
      border-bottom: 1px solid #2a2a3e; padding-bottom: 4px;
    }
    .cat-label { font-size: 0.65rem; color: #666; margin: 8px 0 4px; letter-spacing: 0.05em; }
    .parts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 4px; }
    .part-btn {
      background: #1a1a3a; border: 1px solid #333; border-radius: 5px;
      padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 2px; transition: border-color 0.15s, background 0.15s;
    }
    .part-btn:hover { background: #252550; border-color: #f0c040; }
    .part-btn svg { width: 36px; height: 36px; }
    .part-btn span { font-size: 0.5rem; color: #aaa; text-align: center; line-height: 1.1; }

    /* 絃び線モード */
    .chord-section { margin-top: 10px; }
    .chord-btn {
      width: 100%; padding: 7px; border-radius: 6px; border: 1px solid #555;
      background: #1a1a3a; color: #ccc; cursor: pointer; font-size: 0.75rem;
      transition: background 0.15s;
    }
    .chord-btn.active { background: #2a1a00; border-color: #f0c040; color: #f0c040; }

    /* ─── 中央: キャンバスエリア ─── */
    .canvas-area {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px;
      padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .canvas-toolbar {
      display: flex; gap: 6px; width: 100%; flex-wrap: wrap;
    }
    .tb-btn {
      padding: 5px 12px; border-radius: 5px; border: 1px solid #444;
      background: #1a1a3a; color: #ccc; cursor: pointer; font-size: 0.75rem;
    }
    .tb-btn:hover { border-color: #f0c040; color: #f0c040; }
    .tb-btn.danger { border-color: #7a3a3a; color: #ff8080; background: #3a1a1a; }
    .tb-btn.danger:hover { background: #5a2a2a; }

    .svg-canvas-wrap {
      position: relative; background: #0a0a0a; border-radius: 6px;
      border: 2px solid #2a2a3e;
    }
    .svg-canvas-wrap.chord-mode { border-color: #f0c040; cursor: crosshair; }
    #main-svg { display: block; }

    /* グリッド点（絃び線用） */
    .chord-grid-dot {
      position: absolute; width: 14px; height: 14px;
      border-radius: 50%; background: rgba(240,192,64,0.35);
      border: 1px solid #f0c040; transform: translate(-50%, -50%);
      cursor: crosshair; transition: background 0.1s;
      pointer-events: all;
    }
    .chord-grid-dot:hover { background: rgba(240,192,64,0.7); }
    .chord-grid-dot.selected { background: #f0c040; }

    .chord-hint { font-size: 0.72rem; color: #f0c040; }

    /* ─── 右: レイヤーパネル ─── */
    .layer-panel {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px;
      padding: 10px; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 8px;
    }
    .layer-panel h3 {
      font-size: 0.75rem; color: #f0c040;
      border-bottom: 1px solid #2a2a3e; padding-bottom: 4px; margin-bottom: 2px;
    }
    #layer-list { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; max-height: 400px; }
    .layer-item {
      background: #1a1a3a; border: 1px solid #333; border-radius: 5px;
      padding: 6px 8px; cursor: pointer; transition: border-color 0.15s;
    }
    .layer-item.active { border-color: #f0c040; background: #1e1e3a; }
    .layer-item-top {
      display: flex; align-items: center; gap: 5px; margin-bottom: 4px;
    }
    .layer-color { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; cursor: pointer; }
    .layer-name { font-size: 0.72rem; color: #ddd; flex: 1; }
    .layer-actions { display: flex; gap: 3px; }
    .layer-vis-btn, .layer-del-btn {
      font-size: 0.65rem; padding: 2px 5px; border-radius: 3px;
      border: 1px solid #444; background: #12122a; color: #aaa; cursor: pointer;
    }
    .layer-vis-btn:hover { color: #f0c040; }
    .layer-del-btn:hover { color: #ff8080; border-color: #7a3a3a; }
    .layer-parts { font-size: 0.6rem; color: #666; }

    .add-layer-btn {
      width: 100%; padding: 7px; border-radius: 6px; border: 1px dashed #444;
      background: transparent; color: #888; cursor: pointer; font-size: 0.75rem;
    }
    .add-layer-btn:hover { border-color: #f0c040; color: #f0c040; }

    /* カラーピッカー */
    .color-picker-wrap { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .color-chip {
      width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.1s;
    }
    .color-chip:hover, .color-chip.sel { border-color: #fff; }

    /* ─── 下部: 出力エリア ─── */
    .output-area {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px;
      padding: 10px; grid-column: 2; display: flex; flex-direction: column; gap: 8px;
    }
    .output-area h3 { font-size: 0.75rem; color: #f0c040; margin-bottom: 4px; }
    .output-preview-wrap { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    #merge-canvas-wrap {
      background: #fff; border-radius: 4px; padding: 6px; display: inline-block;
    }
    .dl-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dl-btn {
      padding: 7px 16px; border-radius: 6px; border: none;
      font-size: 0.82rem; font-weight: bold; cursor: pointer;
    }
    .dl-btn.gold { background: #f0c040; color: #0d0d1a; }
    .dl-btn.sub  { background: #2a2a3e; color: #ccc; border: 1px solid #555; }
    .dl-btn:hover { opacity: 0.85; }
    .bg-select-wrap { font-size: 0.75rem; color: #aaa; display: flex; align-items: center; gap: 6px; }
    .bg-select-wrap select {
      background: #1a1a2e; color: #ccc; border: 1px solid #444;
      border-radius: 4px; padding: 3px 6px;
    }
    .stroke-wrap { font-size: 0.75rem; color: #aaa; display: flex; align-items: center; gap: 6px; }
    .stroke-wrap input { width: 60px; }

    /* 履歴リスト */
    #parts-list { flex: 1; overflow-y: auto; max-height: 150px; }
    .parts-list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 6px; border-radius: 3px; font-size: 0.65rem; color: #ccc;
      background: #1a1a3a; margin-bottom: 3px;
    }
    .parts-list-item button {
      background: none; border: none; color: #ff8080; cursor: pointer; font-size: 0.7rem;
      padding: 0 2px;
    }
    .parts-list-title { font-size: 0.65rem; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>

<header class="site-header">
  <a class="site-logo" href="/ns-factory/">● N's factory</a>
  <span class="nav-sep">/</span>
  <a class="nav-link" href="/ns-factory/hitsuki/katakamuna/">カタカムナ</a>
  <span class="nav-sep">/</span>
  <a class="nav-link" href="/ns-factory/hitsuki/katakamuna/moji/">48音表</a>
  <span class="nav-sep">/</span>
  <span style="color:#e0e0e0; font-size:0.85rem;">文字ビルダー</span>
</header>

<div class="page-title">
  <h1>カタカムナ 文字ビルダー</h1>
  <p>大丸・小丸・直線・絃び線を組み合わせてカタカムナ文字を作成。複数レイヤーで重ね合わせも可能。</p>
</div>

<div class="builder-wrap">

  <!-- ─── 左: パーツパネル ─── -->
  <div class="parts-panel" id="parts-panel">
    <h3>パーツ</h3>
    <!-- JS で生成 -->
  </div>

  <!-- ─── 中央: キャンバス ─── -->
  <div class="canvas-area">
    <div class="canvas-toolbar">
      <button class="tb-btn" onclick="undo()">↩ 元に戻す</button>
      <button class="tb-btn danger" onclick="clearLayer()">🗑 このレイヤー消去</button>
      <span style="font-size:0.72rem; color:#666; margin-left:4px;" id="chord-hint-top"></span>
    </div>
    <div class="svg-canvas-wrap" id="canvas-wrap">
      <svg id="main-svg" width="300" height="300" xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 300 300">
        <!-- JS で描画 -->
      </svg>
    </div>
    <div id="parts-list-wrap" style="width:300px;">
      <div class="parts-list-title">現在のレイヤーのパーツ</div>
      <div id="parts-list"></div>
    </div>
  </div>

  <!-- ─── 右: レイヤーパネル ─── -->
  <div class="layer-panel">
    <h3>レイヤー（重ね合わせ）</h3>
    <div id="layer-list"></div>
    <button class="add-layer-btn" onclick="addLayer()">＋ レイヤー追加</button>
    <div style="font-size:0.65rem; color:#555; margin-top:4px;">
      レイヤーをクリックして選択<br>色●をクリックして色変更
    </div>
    <div style="border-top:1px solid #2a2a3e; padding-top:8px; margin-top:4px;">
      <div style="font-size:0.65rem; color:#888; margin-bottom:6px;">ストローク幅</div>
      <div class="stroke-wrap">
        <input type="range" id="stroke-width" min="2" max="20" value="8" oninput="onStrokeChange()">
        <span id="stroke-val">8</span>px
      </div>
    </div>
  </div>

  <!-- ─── 下部: 出力 ─── -->
  <div class="output-area">
    <h3>プレビュー / 出力</h3>
    <div class="output-preview-wrap">
      <div id="merge-canvas-wrap">
        <canvas id="merge-canvas" width="300" height="300"></canvas>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="bg-select-wrap">
          背景:
          <select id="bg-sel" onchange="renderMerge()">
            <option value="white">白</option>
            <option value="#0d0d1a">黒（サイト背景）</option>
            <option value="transparent">透明</option>
          </select>
        </div>
        <div class="dl-btns">
          <button class="dl-btn gold" onclick="downloadPNG()">📥 PNG保存</button>
          <button class="dl-btn sub"  onclick="downloadSVG()">📄 SVG保存</button>
          <button class="dl-btn sub"  onclick="copyCanvas()">📋 コピー</button>
        </div>
        <div style="font-size:0.65rem; color:#555;">
          出力サイズ: 300×300px<br>
          透明背景PNGで書き出すと重ね合わせに使いやすい
        </div>
      </div>
    </div>
  </div>

</div><!-- .builder-wrap -->

<div style="text-align:center; font-size:0.7rem; color:#444; padding: 1.5rem 0;">
  カタカムナ文字ビルダー / N's factory
</div>

<script>
// ═══════════════════════════════════════════════════
// パーツ定義
// 座標系: 300×300、中心(150,150)、大円r=100
// ═══════════════════════════════════════════════════
const CX = 150, CY = 150, R = 100, SR = 14;

function arc(x1,y1,x2,y2,rx,ry,large,sweep){
  return `M ${x1},${y1} A ${rx},${ry} 0 ${large} ${sweep} ${x2},${y2}`;
}

const PRESET_PARTS = [
  // --- 大丸 ---
  { cat:'大丸', id:'circle',      label:'全円',
    d:`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none"/>` },
  { cat:'大丸', id:'arc_top',     label:'上半円',
    d:`<path d="${arc(CX-R,CY, CX+R,CY, R,R, 0,0)}" fill="none"/>` },
  { cat:'大丸', id:'arc_bottom',  label:'下半円',
    d:`<path d="${arc(CX-R,CY, CX+R,CY, R,R, 0,1)}" fill="none"/>` },
  { cat:'大丸', id:'arc_right',   label:'右半円',
    d:`<path d="${arc(CX,CY-R, CX,CY+R, R,R, 0,1)}" fill="none"/>` },
  { cat:'大丸', id:'arc_left',    label:'左半円',
    d:`<path d="${arc(CX,CY-R, CX,CY+R, R,R, 0,0)}" fill="none"/>` },
  { cat:'大丸', id:'arc_tr',      label:'右上1/4',
    d:`<path d="${arc(CX,CY-R, CX+R,CY, R,R, 0,1)}" fill="none"/>` },
  { cat:'大丸', id:'arc_br',      label:'右下1/4',
    d:`<path d="${arc(CX+R,CY, CX,CY+R, R,R, 0,1)}" fill="none"/>` },
  { cat:'大丸', id:'arc_bl',      label:'左下1/4',
    d:`<path d="${arc(CX,CY+R, CX-R,CY, R,R, 0,1)}" fill="none"/>` },
  { cat:'大丸', id:'arc_tl',      label:'左上1/4',
    d:`<path d="${arc(CX-R,CY, CX,CY-R, R,R, 0,1)}" fill="none"/>` },
  // --- 直線 ---
  { cat:'直線', id:'line_v',      label:'縦(全)',
    d:`<line x1="${CX}" y1="${CY-R}" x2="${CX}" y2="${CY+R}"/>` },
  { cat:'直線', id:'line_v_top',  label:'縦(上)',
    d:`<line x1="${CX}" y1="${CY-R}" x2="${CX}" y2="${CY}"/>` },
  { cat:'直線', id:'line_v_bot',  label:'縦(下)',
    d:`<line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY+R}"/>` },
  { cat:'直線', id:'line_h',      label:'横(全)',
    d:`<line x1="${CX-R}" y1="${CY}" x2="${CX+R}" y2="${CY}"/>` },
  { cat:'直線', id:'line_h_left', label:'横(左)',
    d:`<line x1="${CX-R}" y1="${CY}" x2="${CX}" y2="${CY}"/>` },
  { cat:'直線', id:'line_h_right',label:'横(右)',
    d:`<line x1="${CX}" y1="${CY}" x2="${CX+R}" y2="${CY}"/>` },
  { cat:'直線', id:'line_d1',     label:'斜め↘(全)',
    d:`<line x1="${CX-R}" y1="${CY-R}" x2="${CX+R}" y2="${CY+R}"/>` },
  { cat:'直線', id:'line_d1_top', label:'斜め↘(上)',
    d:`<line x1="${CX-R}" y1="${CY-R}" x2="${CX}" y2="${CY}"/>` },
  { cat:'直線', id:'line_d1_bot', label:'斜め↘(下)',
    d:`<line x1="${CX}" y1="${CY}" x2="${CX+R}" y2="${CY+R}"/>` },
  { cat:'直線', id:'line_d2',     label:'斜め↗(全)',
    d:`<line x1="${CX-R}" y1="${CY+R}" x2="${CX+R}" y2="${CY-R}"/>` },
  { cat:'直線', id:'line_d2_top', label:'斜め↗(上)',
    d:`<line x1="${CX}" y1="${CY}" x2="${CX+R}" y2="${CY-R}"/>` },
  { cat:'直線', id:'line_d2_bot', label:'斜め↗(下)',
    d:`<line x1="${CX-R}" y1="${CY+R}" x2="${CX}" y2="${CY}"/>` },
  // --- 小丸 ---
  { cat:'小丸', id:'dot_c',       label:'中心',
    d:`<circle cx="${CX}" cy="${CY}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_top',     label:'上',
    d:`<circle cx="${CX}" cy="${CY-R}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_bot',     label:'下',
    d:`<circle cx="${CX}" cy="${CY+R}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_left',    label:'左',
    d:`<circle cx="${CX-R}" cy="${CY}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_right',   label:'右',
    d:`<circle cx="${CX+R}" cy="${CY}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_tr',      label:'右上',
    d:`<circle cx="${CX+R}" cy="${CY-R}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_tl',      label:'左上',
    d:`<circle cx="${CX-R}" cy="${CY-R}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_br',      label:'右下',
    d:`<circle cx="${CX+R}" cy="${CY+R}" r="${SR}"/>` },
  { cat:'小丸', id:'dot_bl',      label:'左下',
    d:`<circle cx="${CX-R}" cy="${CY+R}" r="${SR}"/>` },
];

const COLORS = ['#f0c040','#ffffff','#ff8080','#80ff80','#80c0ff','#c080ff','#ffaa40','#40ffcc'];

// ═══════════════════════════════════════════════════
// 状態
// ═══════════════════════════════════════════════════
let layers = [];
let currentLayerIdx = 0;
let chordMode = false;
let chordStart = null;
let strokeWidth = 8;
let undoStack = [];  // [{layerIdx, snapshot}]

function curLayer() { return layers[currentLayerIdx]; }

// ═══════════════════════════════════════════════════
// レイヤー管理
// ═══════════════════════════════════════════════════
let layerCounter = 1;
function addLayer() {
  const color = COLORS[(layers.length) % COLORS.length];
  layers.push({ id: Date.now(), name: '文字' + (layerCounter++), color, visible: true, parts: [] });
  currentLayerIdx = layers.length - 1;
  renderAll();
}

function selectLayer(idx) {
  currentLayerIdx = idx;
  renderAll();
}

function toggleLayerVis(idx, e) {
  e.stopPropagation();
  layers[idx].visible = !layers[idx].visible;
  renderAll();
}

function deleteLayer(idx, e) {
  e.stopPropagation();
  if (layers.length <= 1) { alert('最後のレイヤーは削除できません'); return; }
  layers.splice(idx, 1);
  currentLayerIdx = Math.min(currentLayerIdx, layers.length - 1);
  renderAll();
}

function setLayerColor(idx, color) {
  layers[idx].color = color;
  renderAll();
}

// ═══════════════════════════════════════════════════
// パーツ追加
// ═══════════════════════════════════════════════════
function addPresetPart(id) {
  const p = PRESET_PARTS.find(x => x.id === id);
  if (!p) return;
  pushUndo();
  curLayer().parts.push({ type:'preset', id, label: p.label, d: p.d });
  renderAll();
}

function removePart(partIdx) {
  pushUndo();
  curLayer().parts.splice(partIdx, 1);
  renderAll();
}

// ═══════════════════════════════════════════════════
// 絃び線モード
// ═══════════════════════════════════════════════════
// グリッド: 5×5点
const GRID_POINTS = [];
for (let gy = 0; gy <= 4; gy++) {
  for (let gx = 0; gx <= 4; gx++) {
    GRID_POINTS.push({ x: 50 + gx * 50, y: 50 + gy * 50 });
  }
}

function toggleChordMode() {
  chordMode = !chordMode;
  chordStart = null;
  document.getElementById('canvas-wrap').classList.toggle('chord-mode', chordMode);
  document.querySelector('.chord-btn').classList.toggle('active', chordMode);
  document.getElementById('chord-hint-top').textContent =
    chordMode ? '絃び線モード: グリッドの点をクリックして起点→終点を指定' : '';
  renderGridDots();
}

function renderGridDots() {
  // 既存のグリッド点を削除
  document.querySelectorAll('.chord-grid-dot').forEach(el => el.remove());
  if (!chordMode) return;
  const wrap = document.getElementById('canvas-wrap');
  GRID_POINTS.forEach((pt, i) => {
    const dot = document.createElement('div');
    dot.className = 'chord-grid-dot';
    dot.style.left = pt.x + 'px';
    dot.style.top  = pt.y + 'px';
    if (chordStart && chordStart.x === pt.x && chordStart.y === pt.y) {
      dot.classList.add('selected');
    }
    dot.addEventListener('click', () => onGridClick(pt));
    wrap.appendChild(dot);
  });
}

function onGridClick(pt) {
  if (!chordStart) {
    chordStart = pt;
    renderGridDots();
  } else {
    if (chordStart.x !== pt.x || chordStart.y !== pt.y) {
      pushUndo();
      const lbl = `絃び線(${chordStart.x},${chordStart.y})→(${pt.x},${pt.y})`;
      curLayer().parts.push({
        type: 'chord', label: lbl,
        d: `<line x1="${chordStart.x}" y1="${chordStart.y}" x2="${pt.x}" y2="${pt.y}"/>`
      });
    }
    chordStart = null;
    renderGridDots();
    renderAll();
  }
}

// ═══════════════════════════════════════════════════
// Undo
// ═══════════════════════════════════════════════════
function pushUndo() {
  undoStack.push(JSON.parse(JSON.stringify({ layers, currentLayerIdx })));
  if (undoStack.length > 30) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  const snap = undoStack.pop();
  layers = snap.layers;
  currentLayerIdx = snap.currentLayerIdx;
  renderAll();
}

function clearLayer() {
  pushUndo();
  curLayer().parts = [];
  renderAll();
}

function onStrokeChange() {
  strokeWidth = parseInt(document.getElementById('stroke-width').value);
  document.getElementById('stroke-val').textContent = strokeWidth;
  renderAll();
}

// ═══════════════════════════════════════════════════
// SVG描画
// ═══════════════════════════════════════════════════
function buildSVGContent(forExport = false) {
  let html = '';
  layers.forEach(layer => {
    if (!layer.visible) return;
    html += `<g stroke="${layer.color}" fill="${layer.color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">`;
    layer.parts.forEach(part => {
      html += part.d;
    });
    html += '</g>';
  });
  return html;
}

function renderSVG() {
  document.getElementById('main-svg').innerHTML = buildSVGContent();
}

function renderLayerPanel() {
  const list = document.getElementById('layer-list');
  list.innerHTML = '';
  layers.forEach((layer, idx) => {
    const div = document.createElement('div');
    div.className = 'layer-item' + (idx === currentLayerIdx ? ' active' : '');
    div.onclick = () => selectLayer(idx);
    div.innerHTML = `
      <div class="layer-item-top">
        <div class="layer-color" style="background:${layer.color};" onclick="openColorPicker(${idx},event)"></div>
        <span class="layer-name">${layer.name}</span>
        <div class="layer-actions">
          <button class="layer-vis-btn" onclick="toggleLayerVis(${idx},event)">${layer.visible ? '👁' : '🚫'}</button>
          <button class="layer-del-btn" onclick="deleteLayer(${idx},event)">✕</button>
        </div>
      </div>
      <div class="layer-parts">${layer.parts.length}パーツ</div>
    `;
    list.appendChild(div);
  });
}

function renderPartsList() {
  const list = document.getElementById('parts-list');
  list.innerHTML = '';
  if (!layers.length) return;
  curLayer().parts.forEach((part, i) => {
    const item = document.createElement('div');
    item.className = 'parts-list-item';
    item.innerHTML = `<span>${part.label}</span><button onclick="removePart(${i})">✕</button>`;
    list.appendChild(item);
  });
}

function renderAll() {
  renderSVG();
  renderLayerPanel();
  renderPartsList();
  renderMerge();
}

// ═══════════════════════════════════════════════════
// 色ピッカー
// ═══════════════════════════════════════════════════
let colorPickerTarget = -1;
function openColorPicker(idx, e) {
  e.stopPropagation();
  // 既存のピッカーを削除
  document.querySelectorAll('.cp-popup').forEach(el => el.remove());
  colorPickerTarget = idx;
  const popup = document.createElement('div');
  popup.className = 'cp-popup';
  popup.style.cssText = `position:absolute;background:#1a1a3a;border:1px solid #444;
    border-radius:6px;padding:8px;z-index:100;display:flex;flex-wrap:wrap;gap:5px;width:130px;`;
  COLORS.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'color-chip' + (layers[idx].color === c ? ' sel' : '');
    chip.style.background = c;
    chip.onclick = (ev) => { ev.stopPropagation(); setLayerColor(idx, c); popup.remove(); };
    popup.appendChild(chip);
  });
  // カスタムカラー
  const custom = document.createElement('input');
  custom.type = 'color'; custom.value = layers[idx].color;
  custom.style.cssText = 'width:100%;margin-top:4px;cursor:pointer;';
  custom.oninput = () => { setLayerColor(idx, custom.value); };
  popup.appendChild(custom);
  e.currentTarget.parentElement.appendChild(popup);
  setTimeout(() => document.addEventListener('click', () => popup.remove(), { once: true }), 50);
}

// ═══════════════════════════════════════════════════
// 出力
// ═══════════════════════════════════════════════════
function renderMerge() {
  const canvas = document.getElementById('merge-canvas');
  const ctx = canvas.getContext('2d');
  const bg = document.getElementById('bg-sel').value;
  if (bg === 'transparent') {
    ctx.clearRect(0, 0, 300, 300);
  } else {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 300, 300);
  }
  const svgStr =
    `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">`
    + buildSVGContent() + `</svg>`;
  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => { ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url); };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

function makeSVGString() {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">`
    + buildSVGContent(true) + `</svg>`;
}

function downloadPNG() {
  const canvas = document.getElementById('merge-canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'katakamuna_' + Date.now() + '.png';
  a.click();
}

function downloadSVG() {
  const str = makeSVGString();
  const blob = new Blob([str], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'katakamuna_' + Date.now() + '.svg';
  a.click();
}

async function copyCanvas() {
  const canvas = document.getElementById('merge-canvas');
  try {
    canvas.toBlob(async blob => {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      alert('クリップボードにコピーしました');
    });
  } catch(e) { alert('コピーに失敗しました'); }
}

// ═══════════════════════════════════════════════════
// パーツパネル生成
// ═══════════════════════════════════════════════════
function buildPartsPanel() {
  const panel = document.getElementById('parts-panel');
  panel.innerHTML = '<h3>パーツ</h3>';
  const cats = [...new Set(PRESET_PARTS.map(p => p.cat))];
  cats.forEach(cat => {
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = '── ' + cat + ' ──';
    panel.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'parts-grid';
    PRESET_PARTS.filter(p => p.cat === cat).forEach(part => {
      const btn = document.createElement('button');
      btn.className = 'part-btn';
      btn.title = part.label;
      btn.onclick = () => addPresetPart(part.id);

      // アイコン: 小さいSVGでプレビュー
      const iconSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      iconSvg.setAttribute('viewBox', '0 0 300 300');
      iconSvg.setAttribute('width', '36'); iconSvg.setAttribute('height', '36');
      iconSvg.innerHTML = `<g stroke="#f0c040" fill="#f0c040" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">${part.d}</g>`;
      btn.appendChild(iconSvg);

      const lbl = document.createElement('span');
      lbl.textContent = part.label;
      btn.appendChild(lbl);
      grid.appendChild(btn);
    });
    panel.appendChild(grid);
  });

  // 絃び線セクション
  const cs = document.createElement('div');
  cs.className = 'chord-section';
  cs.innerHTML = `
    <div class="cat-label">── 絃び線 ──</div>
    <button class="chord-btn" onclick="toggleChordMode()">✏ 絃び線モード</button>
    <div style="font-size:0.6rem; color:#555; margin-top:4px; line-height:1.4;">
      ONにするとキャンバスに格子点が表示されます。<br>
      点を2回クリックして直線を引いてください。
    </div>
  `;
  panel.appendChild(cs);
}

// ═══════════════════════════════════════════════════
// 初期化
// ═══════════════════════════════════════════════════
buildPartsPanel();
addLayer();  // デフォルト1レイヤー
</script>
