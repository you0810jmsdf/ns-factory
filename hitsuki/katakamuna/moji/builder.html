<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カタカムナ 文字ビルダー — N's factory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', sans-serif; background: #0d0d1a; color: #e0e0e0; min-height: 100vh; }

    .site-header {
      background: #0a0a16; border-bottom: 1px solid #2a2a3e;
      padding: 0.7rem 1.2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .site-logo { color: #f0c040; font-size: 0.95rem; font-weight: bold; text-decoration: none; }
    .nav-sep { color: #444; }
    .nav-link { color: #aaa; font-size: 0.85rem; text-decoration: none; }
    .nav-link:hover { color: #f0c040; }

    .page-title { text-align: center; padding: 1.2rem 1rem 0.8rem; }
    .page-title h1 { font-size: 1.4rem; color: #f0c040; margin-bottom: 0.25rem; }
    .page-title p  { font-size: 0.78rem; color: #777; }

    /* ─── メインレイアウト ─── */
    .main-wrap {
      max-width: 960px; margin: 0.8rem auto; padding: 0 0.8rem;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 12px;
    }
    .left-col { display: flex; flex-direction: column; gap: 10px; }
    .right-col { display: flex; flex-direction: column; gap: 10px; }

    /* ─── パーツ選択パネル ─── */
    .parts-panel {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px; padding: 10px;
    }
    .parts-panel h3 { font-size: 0.75rem; color: #f0c040; margin-bottom: 8px; }
    .cat-row { margin-bottom: 8px; }
    .cat-label { font-size: 0.62rem; color: #555; margin-bottom: 4px; letter-spacing: 0.06em; }
    .parts-grid {
      display: flex; flex-wrap: wrap; gap: 5px;
    }
    .part-btn {
      background: #1a1a3a; border: 1.5px solid #333; border-radius: 5px;
      padding: 3px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 1px; transition: all 0.12s; min-width: 48px;
    }
    .part-btn:hover { border-color: #f0c040; background: #22224a; }
    .part-btn.active {
      border-color: #f0c040; background: #2a2a00;
      box-shadow: 0 0 6px rgba(240,192,64,0.4);
    }
    .part-btn svg { width: 40px; height: 40px; }
    .part-btn span { font-size: 0.52rem; color: #999; text-align: center; line-height: 1.1; white-space: nowrap; }
    .part-btn.active span { color: #f0c040; }

    /* ─── キャンバスエリア ─── */
    .canvas-area {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px;
      padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .canvas-toolbar { display: flex; gap: 6px; width: 100%; flex-wrap: wrap; }
    .tb-btn {
      padding: 5px 12px; border-radius: 5px; border: 1px solid #444;
      background: #1a1a3a; color: #ccc; cursor: pointer; font-size: 0.75rem;
      transition: border-color 0.12s;
    }
    .tb-btn:hover { border-color: #f0c040; color: #f0c040; }
    .tb-btn.danger { border-color: #7a3a3a; color: #ff8080; background: #3a1a1a; }
    .tb-btn.danger:hover { background: #5a2a2a; }

    #main-svg-wrap {
      background: #080818; border-radius: 6px; border: 2px solid #2a2a3e;
    }

    /* ─── 右: レイヤー + 出力 ─── */
    .layer-panel {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px;
      padding: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .layer-panel h3 { font-size: 0.75rem; color: #f0c040; padding-bottom: 4px; border-bottom: 1px solid #2a2a3e; }
    #layer-list { display: flex; flex-direction: column; gap: 5px; max-height: 320px; overflow-y: auto; }
    .layer-item {
      background: #1a1a3a; border: 1.5px solid #333; border-radius: 5px;
      padding: 6px 8px; cursor: pointer; transition: border-color 0.12s;
    }
    .layer-item.active { border-color: #f0c040; }
    .layer-top { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .layer-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.2); }
    .layer-name-input {
      flex: 1; background: transparent; border: none; color: #ddd;
      font-size: 0.72rem; outline: none; min-width: 0;
    }
    .layer-vis-btn, .layer-del-btn {
      background: none; border: 1px solid #444; border-radius: 3px;
      color: #888; cursor: pointer; font-size: 0.65rem; padding: 1px 4px;
    }
    .layer-vis-btn:hover { color: #f0c040; }
    .layer-del-btn:hover { color: #ff8080; }
    .layer-count { font-size: 0.6rem; color: #555; }
    .add-layer-btn {
      width: 100%; padding: 6px; border-radius: 5px; border: 1px dashed #444;
      background: transparent; color: #777; cursor: pointer; font-size: 0.72rem;
    }
    .add-layer-btn:hover { border-color: #f0c040; color: #f0c040; }

    /* 色選択 */
    .color-strip { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .color-chip {
      width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.1s;
    }
    .color-chip:hover, .color-chip.sel { border-color: #fff; }

    /* ストローク */
    .stroke-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #aaa; }
    .stroke-row input[type=range] { flex: 1; }

    /* 出力パネル */
    .output-panel {
      background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px;
      padding: 10px;
    }
    .output-panel h3 { font-size: 0.75rem; color: #f0c040; margin-bottom: 8px; }
    #merge-canvas { border-radius: 4px; display: block; }
    .bg-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #aaa; margin: 6px 0; }
    .bg-row select { background: #1a1a2e; color: #ccc; border: 1px solid #444; border-radius: 3px; padding: 2px 5px; font-size: 0.72rem; }
    .dl-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .dl-btn {
      padding: 6px 14px; border-radius: 5px; border: none;
      font-size: 0.78rem; font-weight: bold; cursor: pointer;
    }
    .dl-btn.gold { background: #f0c040; color: #0d0d1a; }
    .dl-btn.sub  { background: #2a2a3e; color: #ccc; border: 1px solid #555; }
    .dl-btn:hover { opacity: 0.85; }

    .credit { text-align: center; font-size: 0.65rem; color: #444; padding: 1.5rem 0; }

    @media (max-width: 700px) {
      .main-wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="site-logo" href="/ns-factory/">● N's factory</a>
  <span class="nav-sep">/</span>
  <a class="nav-link" href="/ns-factory/hitsuki/katakamuna/">カタカムナ</a>
  <span class="nav-sep">/</span>
  <a class="nav-link" href="/ns-factory/hitsuki/katakamuna/moji/">48音表</a>
  <span class="nav-sep">/</span>
  <span style="color:#e0e0e0;font-size:0.85rem;">文字ビルダー</span>
</header>

<div class="page-title">
  <h1>カタカムナ 文字ビルダー</h1>
  <p>ベースグリッドのパーツをON/OFFするだけでカタカムナ文字を構成。複数レイヤーで重ね合わせ可能。</p>
</div>

<div class="main-wrap">
  <div class="left-col">

    <!-- パーツ選択 -->
    <div class="parts-panel" id="parts-panel"></div>

    <!-- キャンバス -->
    <div class="canvas-area">
      <div class="canvas-toolbar">
        <button class="tb-btn" onclick="undo()">↩ 元に戻す</button>
        <button class="tb-btn danger" onclick="clearCurrentLayer()">🗑 消去</button>
        <button class="tb-btn" onclick="selectAll()">全ON</button>
        <button class="tb-btn" onclick="clearAll()">全OFF</button>
      </div>
      <div id="main-svg-wrap">
        <svg id="main-svg" width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        </svg>
      </div>
    </div>

  </div><!-- .left-col -->

  <div class="right-col">

    <!-- レイヤー -->
    <div class="layer-panel">
      <h3>レイヤー（重ね合わせ）</h3>
      <div id="layer-list"></div>
      <button class="add-layer-btn" onclick="addLayer()">＋ レイヤー追加</button>
      <div style="border-top:1px solid #2a2a3e; margin-top:4px; padding-top:8px;">
        <div class="stroke-row">
          太さ:
          <input type="range" id="stroke-w" min="2" max="20" value="8" oninput="onStroke()">
          <span id="stroke-v">8</span>px
        </div>
      </div>
    </div>

    <!-- 出力 -->
    <div class="output-panel">
      <h3>出力</h3>
      <canvas id="merge-canvas" width="300" height="300"></canvas>
      <div class="bg-row">
        背景:
        <select id="bg-sel" onchange="renderMerge()">
          <option value="white">白</option>
          <option value="#0d0d1a">黒</option>
          <option value="transparent">透明</option>
        </select>
      </div>
      <div class="dl-btns">
        <button class="dl-btn gold" onclick="downloadPNG()">📥 PNG</button>
        <button class="dl-btn sub"  onclick="downloadSVG()">📄 SVG</button>
        <button class="dl-btn sub"  onclick="copyPNG()">📋 コピー</button>
      </div>
    </div>

  </div><!-- .right-col -->
</div><!-- .main-wrap -->

<div class="credit">カタカムナ文字ビルダー / N's factory ─ ベース: katakamuna_base.svg (LeatherCraftCAD)</div>

<script>
// ════════════════════════════════════════════════════════════
// パーツ定義
// katakamuna_base.svg を 300×300 (中心150,150 大円r=100) に正規化
// ════════════════════════════════════════════════════════════
const CX = 150, CY = 150, R = 100;
// 外周8点の座標
const P8 = [0,45,90,135,180,225,270,315].map(deg => ({
  x: CX + R * Math.sin(deg * Math.PI/180),
  y: CY - R * Math.cos(deg * Math.PI/180)
}));
// 内側グリッド (元のr/2=50, 外端=r*sin60°≈86.6)
const INNER = 50, INNER_HALF = 86.6;
// 内側4交点
const IP = [
  { x: CX+INNER, y: CY-INNER }, // 右上
  { x: CX+INNER, y: CY+INNER }, // 右下
  { x: CX-INNER, y: CY+INNER }, // 左下
  { x: CX-INNER, y: CY-INNER }, // 左上
];

function fmtN(n) { return Math.round(n * 10) / 10; }
function arcPath(x1,y1,x2,y2,r,large,sweep) {
  return `M ${fmtN(x1)},${fmtN(y1)} A ${r},${r} 0 ${large} ${sweep} ${fmtN(x2)},${fmtN(y2)}`;
}

// パーツカテゴリ別定義
const PART_DEFS = [
  // ─── 大円系 ───
  { cat:'大円', id:'circle_full',   label:'全円',
    d: `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none"/>` },
  { cat:'大円', id:'arc_top',       label:'上半円',
    d: `<path d="${arcPath(CX-R,CY, CX+R,CY, R,0,0)}" fill="none"/>` },
  { cat:'大円', id:'arc_bottom',    label:'下半円',
    d: `<path d="${arcPath(CX-R,CY, CX+R,CY, R,0,1)}" fill="none"/>` },
  { cat:'大円', id:'arc_right',     label:'右半円',
    d: `<path d="${arcPath(CX,CY-R, CX,CY+R, R,0,1)}" fill="none"/>` },
  { cat:'大円', id:'arc_left',      label:'左半円',
    d: `<path d="${arcPath(CX,CY-R, CX,CY+R, R,0,0)}" fill="none"/>` },
  { cat:'大円', id:'arc_tr',        label:'右上1/4',
    d: `<path d="${arcPath(CX,CY-R, CX+R,CY, R,0,1)}" fill="none"/>` },
  { cat:'大円', id:'arc_br',        label:'右下1/4',
    d: `<path d="${arcPath(CX+R,CY, CX,CY+R, R,0,1)}" fill="none"/>` },
  { cat:'大円', id:'arc_bl',        label:'左下1/4',
    d: `<path d="${arcPath(CX,CY+R, CX-R,CY, R,0,1)}" fill="none"/>` },
  { cat:'大円', id:'arc_tl',        label:'左上1/4',
    d: `<path d="${arcPath(CX-R,CY, CX,CY-R, R,0,1)}" fill="none"/>` },

  // ─── 主軸線 ───
  { cat:'主軸', id:'line_v',        label:'縦(全)',
    d: `<line x1="${CX}" y1="${CY-R}" x2="${CX}" y2="${CY+R}"/>` },
  { cat:'主軸', id:'line_v_top',    label:'縦(上)',
    d: `<line x1="${CX}" y1="${CY-R}" x2="${CX}" y2="${CY}"/>` },
  { cat:'主軸', id:'line_v_bot',    label:'縦(下)',
    d: `<line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY+R}"/>` },
  { cat:'主軸', id:'line_h',        label:'横(全)',
    d: `<line x1="${CX-R}" y1="${CY}" x2="${CX+R}" y2="${CY}"/>` },
  { cat:'主軸', id:'line_h_left',   label:'横(左)',
    d: `<line x1="${CX-R}" y1="${CY}" x2="${CX}" y2="${CY}"/>` },
  { cat:'主軸', id:'line_h_right',  label:'横(右)',
    d: `<line x1="${CX}" y1="${CY}" x2="${CX+R}" y2="${CY}"/>` },

  // ─── 内側グリッド線 (katakamuna_base.svg 準拠) ───
  { cat:'内線', id:'inner_h_top',   label:'内横(上)',
    d: `<line x1="${fmtN(CX-INNER_HALF)}" y1="${CY-INNER}" x2="${fmtN(CX+INNER_HALF)}" y2="${CY-INNER}"/>` },
  { cat:'内線', id:'inner_h_bot',   label:'内横(下)',
    d: `<line x1="${fmtN(CX-INNER_HALF)}" y1="${CY+INNER}" x2="${fmtN(CX+INNER_HALF)}" y2="${CY+INNER}"/>` },
  { cat:'内線', id:'inner_v_right', label:'内縦(右)',
    d: `<line x1="${CX+INNER}" y1="${fmtN(CY-INNER_HALF)}" x2="${CX+INNER}" y2="${fmtN(CY+INNER_HALF)}"/>` },
  { cat:'内線', id:'inner_v_left',  label:'内縦(左)',
    d: `<line x1="${CX-INNER}" y1="${fmtN(CY-INNER_HALF)}" x2="${CX-INNER}" y2="${fmtN(CY+INNER_HALF)}"/>` },

  // ─── 外周点 (大円上の8点) ───
  { cat:'外周点', id:'dot_0',   label:'上(0°)',    d: `<circle cx="${fmtN(P8[0].x)}" cy="${fmtN(P8[0].y)}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'外周点', id:'dot_45',  label:'右上(45°)', d: `<circle cx="${fmtN(P8[1].x)}" cy="${fmtN(P8[1].y)}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'外周点', id:'dot_90',  label:'右(90°)',   d: `<circle cx="${fmtN(P8[2].x)}" cy="${fmtN(P8[2].y)}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'外周点', id:'dot_135', label:'右下(135°)',d: `<circle cx="${fmtN(P8[3].x)}" cy="${fmtN(P8[3].y)}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'外周点', id:'dot_180', label:'下(180°)',  d: `<circle cx="${fmtN(P8[4].x)}" cy="${fmtN(P8[4].y)}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'外周点', id:'dot_225', label:'左下(225°)',d: `<circle cx="${fmtN(P8[5].x)}" cy="${fmtN(P8[5].y)}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'外周点', id:'dot_270', label:'左(270°)',  d: `<circle cx="${fmtN(P8[6].x)}" cy="${fmtN(P8[6].y)}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'外周点', id:'dot_315', label:'左上(315°)',d: `<circle cx="${fmtN(P8[7].x)}" cy="${fmtN(P8[7].y)}" r="8" fill="currentColor" stroke="none"/>` },

  // ─── 内側交点 ───
  { cat:'内側点', id:'idot_tr', label:'内右上', d: `<circle cx="${IP[0].x}" cy="${IP[0].y}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'内側点', id:'idot_br', label:'内右下', d: `<circle cx="${IP[1].x}" cy="${IP[1].y}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'内側点', id:'idot_bl', label:'内左下', d: `<circle cx="${IP[2].x}" cy="${IP[2].y}" r="8" fill="currentColor" stroke="none"/>` },
  { cat:'内側点', id:'idot_tl', label:'内左上', d: `<circle cx="${IP[3].x}" cy="${IP[3].y}" r="8" fill="currentColor" stroke="none"/>` },
];

// ベースグリッド（ガイド）: 全パーツを薄い色で表示するSVG文字列
function buildGuideG() {
  return PART_DEFS.map(p => {
    const d = p.d.replace(/fill="currentColor"/g, 'fill="#334"').replace(/fill="none"/g,'fill="none"');
    return `<g stroke="#223" fill="#223" stroke-width="1.5" stroke-linecap="round">${d}</g>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════
// 状態
// ════════════════════════════════════════════════════════════
const COLORS = ['#f0c040','#80c8ff','#ff8080','#80ff80','#d080ff','#ffaa40','#40ffdd','#ffffff'];
let layers = [];
let currentIdx = 0;
let strokeW = 8;
let undoStack = [];
let layerSeq = 1;

function cur() { return layers[currentIdx]; }

// ════════════════════════════════════════════════════════════
// レイヤー管理
// ════════════════════════════════════════════════════════════
function addLayer(name) {
  const color = COLORS[layers.length % COLORS.length];
  layers.push({
    name: name || ('レイヤー' + layerSeq++),
    color, visible: true,
    active: new Set()  // ON になっているパーツIDのSet
  });
  currentIdx = layers.length - 1;
  renderAll();
}

function selectLayer(idx) {
  currentIdx = idx;
  renderAll();
}

function toggleVis(idx, e) {
  e.stopPropagation();
  layers[idx].visible = !layers[idx].visible;
  renderAll();
}

function delLayer(idx, e) {
  e.stopPropagation();
  if (layers.length <= 1) return;
  layers.splice(idx, 1);
  currentIdx = Math.min(currentIdx, layers.length - 1);
  renderAll();
}

function setColor(idx, c) {
  layers[idx].color = c;
  renderAll();
}

// ════════════════════════════════════════════════════════════
// パーツ ON/OFF
// ════════════════════════════════════════════════════════════
function togglePart(id) {
  pushUndo();
  const s = cur().active;
  if (s.has(id)) s.delete(id); else s.add(id);
  renderAll();
}

function selectAll()   { pushUndo(); PART_DEFS.forEach(p => cur().active.add(p.id)); renderAll(); }
function clearAll()    { pushUndo(); cur().active.clear(); renderAll(); }
function clearCurrentLayer() { pushUndo(); cur().active.clear(); renderAll(); }

// ════════════════════════════════════════════════════════════
// Undo
// ════════════════════════════════════════════════════════════
function pushUndo() {
  undoStack.push(JSON.stringify({ layers: layers.map(l => ({...l, active:[...l.active]})), currentIdx }));
  if (undoStack.length > 30) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  const snap = JSON.parse(undoStack.pop());
  layers = snap.layers.map(l => ({...l, active: new Set(l.active)}));
  currentIdx = snap.currentIdx;
  renderAll();
}

// ════════════════════════════════════════════════════════════
// SVG 描画
// ════════════════════════════════════════════════════════════
function buildLayerSVG(layer) {
  if (!layer.active.size) return '';
  const parts = PART_DEFS.filter(p => layer.active.has(p.id));
  const paths = parts.map(p => p.d).join('');
  return `<g stroke="${layer.color}" fill="${layer.color}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round">${paths}</g>`;
}

function buildAllSVG() {
  return layers.filter(l => l.visible).map(buildLayerSVG).join('');
}

function renderMainSVG() {
  const guide = buildGuideG();
  const content = buildAllSVG();
  document.getElementById('main-svg').innerHTML = guide + content;
}

function renderLayerPanel() {
  const list = document.getElementById('layer-list');
  list.innerHTML = '';
  layers.forEach((layer, idx) => {
    const div = document.createElement('div');
    div.className = 'layer-item' + (idx === currentIdx ? ' active' : '');
    div.onclick = () => selectLayer(idx);

    // 色ストリップ
    const colorStrip = COLORS.map(c =>
      `<div class="color-chip${layer.color===c?' sel':''}" style="background:${c};" onclick="setColor(${idx},'${c}');event.stopPropagation()"></div>`
    ).join('');

    div.innerHTML = `
      <div class="layer-top">
        <div class="layer-dot" style="background:${layer.color}"></div>
        <input class="layer-name-input" value="${layer.name}" onclick="event.stopPropagation()"
          onchange="layers[${idx}].name=this.value" title="名前を変更">
        <button class="layer-vis-btn" onclick="toggleVis(${idx},event)">${layer.visible?'👁':'🚫'}</button>
        ${layers.length>1?`<button class="layer-del-btn" onclick="delLayer(${idx},event)">✕</button>`:''}
      </div>
      <div class="color-strip">${colorStrip}</div>
      <div class="layer-count">${layer.active.size}パーツ ON</div>
    `;
    list.appendChild(div);
  });
}

function renderPartsPanel() {
  const panel = document.getElementById('parts-panel');
  const cats = [...new Set(PART_DEFS.map(p => p.cat))];
  const activeSet = cur().active;

  let html = '<h3>パーツ（クリックでON/OFF）</h3>';
  cats.forEach(cat => {
    const parts = PART_DEFS.filter(p => p.cat === cat);
    html += `<div class="cat-row"><div class="cat-label">── ${cat} ──</div><div class="parts-grid">`;
    parts.forEach(part => {
      const isOn = activeSet.has(part.id);
      // アイコンSVG（パーツを小さく表示）
      const iconD = part.d.replace(/fill="currentColor"/g, `fill="${isOn?'#f0c040':'#445'}"`)
                          .replace(/fill="none"/g, 'fill="none"');
      const iconSvg = `<svg viewBox="0 0 300 300" width="40" height="40">
        <g stroke="${isOn?'#f0c040':'#445'}" fill="${isOn?'#f0c040':'#445'}" stroke-width="12" stroke-linecap="round">${iconD}</g>
      </svg>`;
      html += `<button class="part-btn${isOn?' active':''}" onclick="togglePart('${part.id}')" title="${part.label}">
        ${iconSvg}<span>${part.label}</span>
      </button>`;
    });
    html += '</div></div>';
  });
  panel.innerHTML = html;
}

function renderAll() {
  renderMainSVG();
  renderLayerPanel();
  renderPartsPanel();
  renderMerge();
}

// ════════════════════════════════════════════════════════════
// ストローク幅
// ════════════════════════════════════════════════════════════
function onStroke() {
  strokeW = parseInt(document.getElementById('stroke-w').value);
  document.getElementById('stroke-v').textContent = strokeW;
  renderAll();
}

// ════════════════════════════════════════════════════════════
// 出力
// ════════════════════════════════════════════════════════════
function makeSVGStr(bg) {
  const bgEl = (bg && bg !== 'transparent') ? `<rect width="300" height="300" fill="${bg}"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">${bgEl}${buildAllSVG()}</svg>`;
}

function renderMerge() {
  const canvas = document.getElementById('merge-canvas');
  const ctx = canvas.getContext('2d');
  const bg = document.getElementById('bg-sel').value;
  if (bg === 'transparent') { ctx.clearRect(0, 0, 300, 300); }
  else { ctx.fillStyle = bg; ctx.fillRect(0, 0, 300, 300); }

  const svgStr = makeSVGStr(null);
  const blob = new Blob([svgStr], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => { ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url); };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

function downloadPNG() {
  renderMerge();
  setTimeout(() => {
    const a = document.createElement('a');
    a.href = document.getElementById('merge-canvas').toDataURL('image/png');
    a.download = 'katakamuna_' + Date.now() + '.png';
    a.click();
  }, 200);
}

function downloadSVG() {
  const bg = document.getElementById('bg-sel').value;
  const blob = new Blob([makeSVGStr(bg === 'transparent' ? null : bg)], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'katakamuna_' + Date.now() + '.svg'; a.click();
}

async function copyPNG() {
  renderMerge();
  setTimeout(() => {
    document.getElementById('merge-canvas').toBlob(async blob => {
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        alert('クリップボードにコピーしました');
      } catch(e) { alert('コピーに失敗しました'); }
    });
  }, 200);
}

addLayer('文字1');
</script>
