<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="nsfactory-estimate-url" content="./leather-order-estimate-v2.html">
<title>オーダー相談AI｜N's factory システム手帳フルオーダー</title>
<meta name="description" content="システム手帳のフルオーダーメイドを、AIが順番にヒアリング。用途を伝えるだけで、サイズ・リング・仕様・革色・ステッチ・名入れをプロの視点で提案し、発注票を自動作成します。">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
  background:#f5f0eb;color:#2c1a0e;font-size:14px;line-height:1.6;
}
.app{display:flex;min-height:100vh;flex-direction:column;max-width:760px;margin:0 auto;background:#faf7f4;box-shadow:0 0 30px rgba(0,0,0,.06)}
.topbar{
  background:linear-gradient(135deg,#3d1a08 0%,#6b3a1f 100%);
  color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.25);
}
.topbar .avatar{width:38px;height:38px;border-radius:50%;background:#e8c9a8;color:#3d1a08;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.topbar-title{flex:1;min-width:0}
.topbar h1{font-size:15px;font-weight:700;letter-spacing:.04em}
.topbar p{font-size:11px;opacity:.8;margin-top:1px}
.topbar .modebtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.topbar .modebtn:hover{background:rgba(255,255,255,.28)}

/* chat area */
.chat{flex:1;padding:18px 14px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:100%;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .ic{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.msg.bot .ic{background:#6b3a1f;color:#fff}
.msg.user{flex-direction:row-reverse}
.msg.user .ic{background:#d9c3ac;color:#3d1a08}
.bubble{padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.65;max-width:calc(100% - 46px);white-space:pre-wrap;word-break:break-word}
.msg.bot .bubble{background:#fff;border:1px solid #ede0d4;border-top-left-radius:4px}
.msg.user .bubble{background:#6b3a1f;color:#fff;border-top-right-radius:4px}
.bubble .tip{display:block;margin-top:6px;font-size:11.5px;color:#8a6a4f;background:#fdf6ef;border-left:3px solid #d4b896;padding:6px 9px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.msg.bot .bubble b{color:#6b3a1f}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;padding:2px 14px 6px 52px}
.quick button{background:#fff;border:1.5px solid #d4b896;color:#6b3a1f;border-radius:20px;
  padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;font-family:inherit}
.quick button:hover{background:#6b3a1f;color:#fff;border-color:#6b3a1f}
.quick button .sub{display:block;font-size:10.5px;font-weight:400;opacity:.7;margin-top:1px}
.quick button:hover .sub{opacity:.9}
/* 革スワッチ（写真付きチップ） */
.quick button.img-chip{
  width:104px;padding:6px 6px 8px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
}
.quick button.img-chip img{
  width:100%;height:64px;object-fit:cover;border-radius:8px;display:block;background:#eee;
}
.quick button.img-chip .img-label{font-size:11px;line-height:1.25;word-break:break-word}
.quick button.img-chip:hover img{opacity:.9}

/* input */
.inputbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #ede0d4;background:#fff;position:sticky;bottom:0}
.inputbar input{flex:1;border:1.5px solid #ede0d4;border-radius:22px;padding:10px 15px;font-size:14px;
  background:#faf7f4;outline:none;font-family:inherit}
.inputbar input:focus{border-color:#b5895a;background:#fff}
.inputbar button{background:#6b3a1f;color:#fff;border:none;border-radius:50%;width:42px;height:42px;
  font-size:18px;cursor:pointer;flex-shrink:0}
.inputbar button:disabled{opacity:.4;cursor:default}

/* order sheet card */
.sheet{background:#fff;border:1px solid #e8d4c0;border-radius:12px;padding:16px;margin:2px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sheet h3{font-size:14px;color:#6b3a1f;border-bottom:2px solid #e8d4c0;padding-bottom:7px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sheet table{width:100%;border-collapse:collapse;font-size:12.5px}
.sheet td{padding:6px 4px;border-bottom:1px dashed #eaddce;vertical-align:top}
.sheet td.k{color:#8a6a4f;width:40%;font-weight:600}
.sheet td.v{color:#2c1a0e}
.sheet .range{margin-top:10px;background:#fdf6ef;border-radius:8px;padding:9px 11px;font-size:12px;color:#6b3a1f}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-actions a,.sheet-actions button{flex:1;min-width:120px;text-align:center;text-decoration:none;
  border-radius:8px;padding:10px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit}
.btn-primary{background:#6b3a1f;color:#fff}
.btn-ghost{background:#fdf0e5;color:#6b3a1f;border:1.5px solid #e8c9a8 !important}

/* テクスチャシミュレーター導線・フルスクリーンオーバーレイ */
.sim-entry{padding:2px 14px 10px 52px;min-height:1px}
.sim-entry button{background:#fdf0e5;border:1.5px solid #e8c9a8;color:#6b3a1f;border-radius:20px;
  padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.sim-entry button:hover{background:#6b3a1f;color:#fff;border-color:#6b3a1f}
.sim-entry .sim-pending{font-size:11.5px;color:#a08a76}
.sim-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:200;flex-direction:column}
.sim-overlay.on{display:flex}
.sim-overlay-bar{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:#3d1a08;color:#fff;flex-shrink:0}
.sim-overlay-bar h3{font-size:13px;font-weight:700}
.sim-overlay-bar button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.sim-overlay-bar button:hover{background:rgba(255,255,255,.28)}
.sim-overlay iframe{flex:1;border:none;width:100%;background:#fff}
.typing{display:inline-flex;gap:3px;padding:4px 2px}
.typing span{width:6px;height:6px;border-radius:50%;background:#c4a98c;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.foot{text-align:center;font-size:10.5px;color:#b0a090;padding:8px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="avatar">🧵</div>
    <div class="topbar-title">
      <h1>オーダー相談AI</h1>
      <p>N's factory｜システム手帳フルオーダー ヒアリング</p>
    </div>
    <button class="modebtn" id="modeBtn">⚙ AI会話モード</button>
  </div>

  <div class="chat" id="chat"></div>
  <div class="quick" id="quick"></div>
  <div class="sim-entry" id="simEntry"></div>

  <div class="inputbar">
    <button id="attachBtn" type="button" title="製作イメージの画像を添付（AIが画像を見てご提案・ご相談内容と一緒に工房へも届きます）" aria-label="製作イメージの画像を添付" style="background:#faf7f4;color:#6b3a1f;border:1.5px solid #ede0d4">📷</button>
    <input id="txt" type="text" placeholder="メッセージを入力…（自由に話しかけてOK）" autocomplete="off">
    <button id="send">➤</button>
    <input id="attachFile" type="file" accept="image/*" multiple style="display:none">
  </div>
  <div class="foot">試作版プロトタイプ｜最終の仕様確定・お見積りは職人が確認します</div>
</div>

<!-- テクスチャシミュレーター フルスクリーンオーバーレイ -->
<div class="sim-overlay" id="simOverlay">
  <div class="sim-overlay-bar">
    <h3>🎨 テクスチャシミュレーターで試す</h3>
    <button id="simCloseBtn">✕ 閉じる</button>
  </div>
  <iframe id="simIframe" src="about:blank"></iframe>
</div>

<script src="./hearing-core.js"></script>
<script>
/* =========================================================================
   知識ベース・フロー定義は hearing-core.js（共有コア）に集約。
   知識の内容は hearing-kb.json を編集（管理画面 admin.html の「対話ナレッジ」
   から書き換え可能）。ここではコアを読み込んで使うだけ。
   ========================================================================= */
let KB = NSF_HEARING.DEFAULT_KB;
let CORE = NSF_HEARING.build(KB);
let PRODUCTS = CORE.PRODUCTS;
let COMMON_TAIL = CORE.COMMON_TAIL;
let SYSTEM_PROMPT = NSF_HEARING.buildSystemPrompt(KB);

const state = { answers:{}, step:0, liveMode:false };

/* テクスチャシミュレーター：型紙SVGをDrive上に用意できている商品のみ対応（パイロット段階）。
   未登録の商品は「準備中」表示になる。 */
const PRODUCT_PATTERN_FOLDERS = {
  planner: '1vdaUYGPXqF4SRmpwsm7YDkZjyOJxcaJn'
};

// オーダー進捗GAS（deploymentId据え置き）。発注票確定時にsubmitChatOrderへ送信する。
const ORDER_PROGRESS_GAS_URL = 'https://script.google.com/macros/s/AKfycby-lfLJy_hyy9FlIUT3XokVZs-R4MtUDWk6BB8TZaFKOHTzF-RTbFvZwOzHL3JHWEVRIQ/exec';

/* ---------- レンダリング ---------- */
const chat=document.getElementById('chat');
const quickEl=document.getElementById('quick');
const txt=document.getElementById('txt');
const sendBtn=document.getElementById('send');

function scrollDown(){ chat.scrollTop=chat.scrollHeight; }
function addMsg(who, text, tip){
  const m=document.createElement('div'); m.className='msg '+who;
  const ic=document.createElement('div'); ic.className='ic'; ic.textContent= who==='bot'?'🧵':'🙂';
  const b=document.createElement('div'); b.className='bubble';
  b.innerHTML=escapeHtml(text).replace(/\n/g,'<br>').replace(/【(.+?)】/g,'<b>【$1】</b>');
  if(tip){ const t=document.createElement('span'); t.className='tip'; t.textContent=tip; b.appendChild(t); }
  m.appendChild(ic); m.appendChild(b); chat.appendChild(m); scrollDown();
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showTyping(){
  const m=document.createElement('div'); m.className='msg bot'; m.id='typing';
  m.innerHTML='<div class="ic">🧵</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  chat.appendChild(m); scrollDown();
}
function hideTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }
function renderQuick(items){
  quickEl.innerHTML='';
  (items||[]).forEach(it=>{
    const btn=document.createElement('button');
    if(it.image){
      btn.className='img-chip';
      btn.innerHTML=`<img src="${it.image}" loading="lazy" alt="">`+
        `<span class="img-label">${escapeHtml(it.label)}</span>`+
        (it.sub?`<span class="sub">${escapeHtml(it.sub)}</span>`:'');
      // 画像が読めない時はテキストチップに退化（CDN障害時など）
      btn.querySelector('img').addEventListener('error',e=>{ e.target.remove(); btn.classList.remove('img-chip'); });
    }else{
      btn.innerHTML=escapeHtml(it.label)+(it.sub?`<span class="sub">${escapeHtml(it.sub)}</span>`:'');
    }
    btn.onclick=()=>{ it.onClick ? it.onClick() : handleAnswer(it.val, it.label); };
    quickEl.appendChild(btn);
  });
}

/* 革選択ステップの間だけ、テクスチャシミュレーターへの導線を表示する */
const simEntry=document.getElementById('simEntry');
function renderSimEntry(){
  simEntry.innerHTML='';
  if(state._awaitKey!=='leather') return;
  const folderId=PRODUCT_PATTERN_FOLDERS[state.productKey];
  if(folderId){
    const btn=document.createElement('button');
    btn.textContent='🎨 テクスチャシミュレーターで試す';
    btn.onclick=()=>openTextureSimulator(folderId);
    simEntry.appendChild(btn);
  }else{
    const span=document.createElement('span');
    span.className='sim-pending';
    span.textContent='🎨 型紙シミュレーター：準備中';
    simEntry.appendChild(span);
  }
}

/* ---------- テクスチャシミュレーター（フルスクリーンオーバーレイ） ---------- */
const simOverlay=document.getElementById('simOverlay');
const simIframe=document.getElementById('simIframe');
document.getElementById('simCloseBtn').onclick=closeTextureSimulator;

function openTextureSimulator(folderId){
  simIframe.src='../カラーシミュレーター/pattern-color-proto/floodfill.html?folderId='+encodeURIComponent(folderId)+'&embed=1';
  simOverlay.classList.add('on');
}
function closeTextureSimulator(){
  simOverlay.classList.remove('on');
  simIframe.src='about:blank';
  // シミュレーター内canvasの十字カーソル(crosshair)が閉じた後も残ることがあるため、
  // カーソルスタイルを一度明示的にリセットしてブラウザに再計算させる
  document.body.style.cursor='default';
  setTimeout(()=>{ document.body.style.cursor=''; }, 50);
}

window.addEventListener('message', (e)=>{
  const data=e.data;
  if(!data || data.type!=='nsfactory-floodfill-confirm') return;
  const parts=data.parts||[];
  state.answers.textureSimulation=parts;
  closeTextureSimulator();
  // 外装/内装など複数タブがある場合、配列先頭（＝外装側）の革を優先してa.leatherへ反映する
  const withLeather=parts.filter(p=>p.leatherName);
  const leatherName=withLeather.length ? withLeather[0].leatherName : null;
  if(leatherName && state._awaitKey==='leather'){
    handleAnswer(leatherName, leatherName+'（シミュレーターで確認）');
  }
});

/* ---------- ガイド対話ロジック ---------- */
function productQuickItems(){
  return Object.keys(PRODUCTS).map(k=>({label:`${PRODUCTS[k].emoji} ${PRODUCTS[k].name}`, sub:PRODUCTS[k].sub||'', val:k}));
}
function startPicker(){
  showTyping();
  setTimeout(()=>{
    hideTyping();
    addMsg('bot', KB.greeting || "こんにちは！オーダー相談AIです🧵 どんなアイテムをお考えですか？");
    renderQuick(productQuickItems());
    state._picking=true;
  }, 400);
}
function beginProduct(key){
  state.productKey=key; state.prod=PRODUCTS[key];
  state.flow=state.prod.steps.concat(COMMON_TAIL);
  state.step=0; state._picking=false;
  runStep();
}
function runStep(){
  const a=state.answers;
  let step=state.flow[state.step];
  // スキップ条件（例：名入れ無しなら刻印内容を飛ばす）
  while(step && step.skipIf && step.skipIf(a)){ state.step++; step=state.flow[state.step]; }
  if(!step){ finish(); return; }

  const sayText = typeof step.say==='function' ? step.say(a) : step.say;
  const tipText = step.tip ? (typeof step.tip==='function'?step.tip(a):step.tip) : null;
  state._isLast = !!step.last;
  showTyping();
  setTimeout(()=>{
    hideTyping();
    addMsg('bot', sayText, tipText);
    const items = typeof step.quick==='function'?step.quick(a):(step.quick||[]);
    renderQuick(items);
    state._awaitKey = typeof step.key==='function'?step.key(a):step.key;
    renderSimEntry();
    if(step.freeInput) txt.focus();
  }, 420);
}
function handleAnswer(val, label){
  if(state._done) return;
  // 商品選択フェーズ
  if(state._picking){
    if(!PRODUCTS[val]) return;
    addMsg('user', label||val);
    renderQuick([]);
    simEntry.innerHTML='';
    beginProduct(val);
    return;
  }
  addMsg('user', label||val);
  const key = state._awaitKey;
  if(key) state.answers[key]=val;
  state._awaitKey=null;           // 二重回答ガード
  renderQuick([]);
  simEntry.innerHTML='';
  // 進行
  if(state._isLast){ finish(); return; }
  state.step++;
  runStep();
}
function handleFreeInput(){
  const v=txt.value.trim(); if(!v) return;
  txt.value='';
  if(state.liveMode){ liveTurn(v); return; }
  // ステッチ（縫い糸）の質問は革より先に判定する（「ステッチの色」は色・在庫の単語だけ見ると
  // 革の回答に誤ルーティングされるため。2026-07-20: ステッチ質問が革在庫で返った問題の対策）
  if(detectStitchQuery(v)){
    addMsg('user', v);
    showStitchGallery();
    return;
  }
  // 革の色・シリーズ・種類の質問は、どのフェーズでも定型誘導より先に即答する
  // （2026-07-17: 「マルゴーフォグの革の色は何がある？」を無視して
  // 「上のボタンから〜」を返していた問題の対策。フローは中断せず後で戻れる）
  const leatherQ=detectLeatherQuery(v);
  if(leatherQ){
    addMsg('user', v);
    // 直前トピックの記憶（2026-07-20）: 直前にステッチの話をしていた（またはステッチ選択
    // ステップ中）のに「色のサンプルも確認したい」等、革と明言しない汎用質問が来たら
    // ステッチ側に振り向ける。色系統の指定（赤系等）は革カタログにしか無いため対象外。
    if((lastTopic==='stitch' || state._awaitKey==='stitch') &&
       state._awaitKey!=='leather' && // 革選択ステップ中の汎用質問は革を優先
       (leatherQ==='ask'||leatherQ==='stock'||leatherQ==='series') &&
       !/(革|レザー)/.test(v)){
      showStitchGallery();
      return;
    }
    showLeatherGallery(leatherQ);
    return;
  }
  // 革・ステッチ・色の単語すら無い汎用の続き質問（「在庫は？」「サンプル見せて」等）も、
  // 直前の話題があればそちらで答える。誤爆防止のため強い意図語のみに限定
  // （「どんな」「おすすめ」等はヒアリング回答と紛らわしいので対象外）。
  if(lastTopic && /(在庫|サンプル|一覧|カタログ|見せて|みせて|何がある|他には|ほかには)/.test(v)){
    addMsg('user', v);
    if(lastTopic==='stitch') showStitchGallery();
    else showLeatherGallery(/(在庫|取り寄せ|取寄)/.test(v)?'stock':'ask');
    return;
  }
  // 商品選択フェーズでの自由入力 → ボタンへ誘導
  if(state._picking){
    addMsg('user', v);
    addMsg('bot','下のボタンから作りたいアイテムをお選びくださいね🙂（革の色・在庫のご質問には、このままお答えできます）');
    return;
  }
  // ガイドモードで自由入力が来たとき
  if(state._awaitKey){ handleAnswer(v, v); }
  else { // 想定外の雑談 → やんわり誘導
    addMsg('user', v);
    addMsg('bot','ありがとうございます。下のボタンからお選びいただくか、続けて入力してくださいね。（自由に相談したい場合は右上「AI会話モード」もご利用いただけます）');
  }
}

/* =========================================================================
   革の色・シリーズ質問への即答ギャラリー（2026-07-17）
   ヒアリングのどの段階でも「マルゴーフォグの色は？」「赤系の革ある？」等に
   その場で写真スワッチ＋在庫バッジで回答する。GASは呼ばない（端末内で完結）。
   革カタログ・色系統解決は hearing-core.js（resolveTone/leathersByTone）を共用。
   ========================================================================= */
let LEATHERS=null;   // leather-catalog.json の配列（起動時に読込）
let STOCK_MAP=null;  // leather-stock.csv の id→残量%（null=未入力）

/* シリーズ名 → カタログの系列タグ。showroom/chat-widget.js の NSF_SERIES_MAP と同期を保つこと */
const SERIES_MAP=[
  [/ホースバット|ホースレザー|ホースハイド/i,'ホースバット'],
  [/コードバン/i,'コードバン'],
  [/リスシオ|LISCIO/i,'リスシオ'],
  [/マルゴー?\s*フォグ|MARGOT\s*FOG/i,'MARGOT FOG'],
  [/マルゴー?|MARGOT/i,'MARGOT'],
  [/ヴァスカ|バスカ|VASCA/i,'LINEA VASCA Box'],
  [/ブルガロ|BULGARO/i,'BULGARO'],
  [/ネブラスカ|NEBRASKA/i,'NEBRASKA'],
  [/テンダー|TENDER/i,'TENDER'],
  [/リベルソ|レベルソ|REVERSO/i,'REVERSO'],
  [/ツイスト|TWIST/i,'TWIST'],
  [/アラスカ|ALASKA/i,'ALASKA'],

/* 革の質問か判定: シリーズ名→系列タグ、色ことば→色系統、色・種類全般→'ask'、違えば null */
function detectLeatherQuery(text){
  if(!LEATHERS || !text) return null;
  if(/(革|レザー|ある|あり|見せ|在庫|ほし|欲し|ください|どんな|何|色|カラー|サイズ|種類|[？?])/.test(text)){
    for(const [re,tag] of SERIES_MAP){
      if(re.test(text) && NSF_HEARING.leathersByTone(LEATHERS,tag).length) return tag;
    }
  }
  if(!/(革|レザー|色|カラー)/.test(text)) return null;
  const fam=NSF_HEARING.resolveTone(text);
  if(fam && NSF_HEARING.leathersByTone(LEATHERS,fam).length) return fam;
  // 「色ではない」＝色以外（革の種類）を聞かれている（2026-07-18: 色回答ループでお客様を怒らせた対策）
  if(/色(では|じゃ)?な(い|く)/.test(text)) return 'series';
  // 「革の種類が知りたい」「シリーズは？」→ 色系統ではなくシリーズ一覧で答える
  if(/(種類|シリーズ|ラインナップ)/.test(text) && !/(色|カラー)/.test(text)) return 'series';
  // 「革の在庫状況を知りたい」→ 系統別の在庫内訳で答える
  if(/(在庫|取り寄せ|取寄)/.test(text)) return 'stock';
  // 「どんな革をお持ち？」「革だけ知りたい」「革を見せて」等、色の単語を含まない革の質問も拾う
  // （2026-07-18: 色・種類の単語を必須にしていたため素通りしてお客様を怒らせた問題の対策）
  if(/(色|カラー|種類|ラインナップ|カタログ|見せ|みせ|ある|あり|何|どんな|一覧|知りたい|教えて|持ち|取扱|取り扱|おすすめ|オススメ|選べ|えらべ)/.test(text)) return 'ask';
  return null;
}

/* 在庫判定（半裁の残量%）: out=0% / low=20%以下 / fresh=80%以上 / ok=その他・未入力 */
function leatherTier(id){
  if(!STOCK_MAP) return null;
  const p=STOCK_MAP[id];
  if(p===null||p===undefined) return {key:'ok',pct:null};
  if(p<=0)  return {key:'out',pct:p};
  if(p<=20) return {key:'low',pct:p};
  if(p>=80) return {key:'fresh',pct:p};
  return {key:'ok',pct:p};
}
const TIER_BADGE={fresh:'✨ 入荷したて',ok:'✅ 在庫あり',low:'⚠️ 残りわずか',out:'📦 お取り寄せ'};
const TIER_RANK={fresh:0,ok:1,low:2,out:3};

/* 革画像パスの解決。NSF_HEARINGのleatherImgSrcは公開APIに含まれないためローカルで持つ。
   カタログのimageはns-factoryルート基準（assets/leathers/…）、本ページはorder_estimate/配下のため'../'を前置 */
function leatherImg(img){
  if(!img) return '';
  if(/^https?:/.test(img) || img.indexOf('data:')===0) return img;
  return '../'+img;
}

/* ギャラリーから元のヒアリングへ戻る */
function backToFlow(){

function colorFamilies(){
  const seen={}, fams=[];
  (LEATHERS||[]).forEach(l=>{
    (l.tags||[]).forEach(t=>{ if(/系$/.test(t) && !seen[t]){ seen[t]=1; fams.push(t); } });
  });
  return fams;
}

/* ===== ステッチ（縫い糸）色の即答ギャラリー（2026-07-20） =====
   データ: stitch-colors.json（92色・画像はdata URI埋め込み）＋
   stitch-thread-stock.csv（thread_id, available=TRUE/FALSE）。 */
let STITCH_COLORS=null; // [{id,name,image}]
let STITCH_STOCK=null;  // thread_id -> true/false（未収録は在庫あり扱い＝安全側）
// 直前に開いたギャラリーの話題（'stitch'|'leather'）。「色のサンプルも確認したい」のような
// 主語のない続き質問を、直前の話題に振り向けるために使う（2026-07-20）
let lastTopic=null;

function loadStitchColors(){
  return fetch('./stitch-colors.json',{cache:'no-cache'})
    .then(r=>r.ok?r.json():null)
    .then(j=>(j&&j.stitchColors&&j.stitchColors.length)?j.stitchColors:null)
    .catch(()=>null);
}
function loadStitchStock(){
  return fetch('./stitch-thread-stock.csv?t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():null)
    .then(t=>{
      if(!t) return null;
      const lines=t.replace(/\r/g,'').split('\n').filter(l=>l.trim());
      const head=lines.shift().split(',');
      const idIdx=head.indexOf('thread_id'), avIdx=head.indexOf('available');
      if(idIdx<0||avIdx<0) return null;
      const map={};
      lines.forEach(line=>{
        const cols=line.split(',');
        const id=(cols[idIdx]||'').trim();
        if(id) map[id]=/^true$/i.test((cols[avIdx]||'').trim());
      });
      return map;
    }).catch(()=>null);
}

/* ステッチの質問か判定。「ステッチです」のような短い言い直しも拾う */

/* SERIES_MAPのうちカタログに実在するシリーズ（革の種類）一覧。色数の多い順 */
function seriesList(){
  const seen={}, out=[];
  SERIES_MAP.forEach(([re,tag])=>{

    const n=NSF_HEARING.leathersByTone(LEATHERS,tag).length;
    if(n) out.push({tag,n});
  });
  return out.sort((a,b)=>b.n-a.n);
}

      {label:backLabel,sub:'',val:'',onClick:backToFlow},
      {label:'📚 革の種類から探す',sub:'',val:'',onClick:()=>showLeatherGallery('series')}
    ].concat(famChips));

/* ---------- 製作イメージ画像の添付（お客様→工房）2026-07-14 Phase3 ----------
   📷ボタンで選んだ画像を端末内で縮小（長辺1280px・JPEG化）して保持し、
   ガイドモードは発注票確定時（submitToOrderProgress）に、AI会話モードは
   「工房へ送信」ボタンで、submitChatOrderのimages経路で工房へ送る。
   AIには画像を渡さない（添付→作家送信のみ方式）。 */
let customerImages=[];
// 2026-07-15 Phase4: AIにまだ渡していない添付画像のdataURL。添付直後の1ターンのみ
// HearingAI-Proxyへ同梱してVision解釈させ、リクエスト発行時にクリアする（毎ターン再送によるトークン浪費防止）。
let pendingAIImages=[];
let liveConsultSent=false;
const MAX_CUSTOMER_IMAGES=3, IMG_MAX_EDGE=1280;

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('read error'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('decode error'));
      img.onload=()=>{
        const scale=Math.min(1, IMG_MAX_EDGE/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.85));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function addImgMsg(dataUrl,label){
  const m=document.createElement('div'); m.className='msg user';
  const ic=document.createElement('div'); ic.className='ic'; ic.textContent='🙂';
  const b=document.createElement('div'); b.className='bubble';
  const img=document.createElement('img');
  img.src=dataUrl; img.alt=label;
  img.style.cssText='max-width:150px;max-height:150px;border-radius:8px;display:block';
  b.appendChild(img);
  const cap=document.createElement('div');
  cap.style.cssText='font-size:11px;opacity:.75;margin-top:4px';
  cap.textContent='📷 '+label;
  b.appendChild(cap);
  m.appendChild(ic); m.appendChild(b); chat.appendChild(m); scrollDown();
}

/* AI会話モード専用: 添付画像がある間、会話ごと工房へ送れるボタンを常設する */
function showLiveSendChip(){
  if(!state.liveMode || !customerImages.length) return;
  quickEl.innerHTML='';
  const btn=document.createElement('button');
  btn.textContent = liveConsultSent ? '📨 送信済み✓' : '📨 相談内容と画像を工房へ送信';
  btn.disabled = liveConsultSent;
  btn.onclick=sendLiveConsultation;
  quickEl.appendChild(btn);
}

function sendLiveConsultation(){
  if(liveConsultSent) return;
  const transcript=history.map(h=>(h.role==='user'?'お客様: ':'AI: ')+h.content).join('\n')||'（会話なし・画像のみ）';
  const images=customerImages.map(ci=>({fileName:ci.fileName,label:ci.label,base64:ci.dataUrl.split(',')[1]}));
  fetch(ORDER_PROGRESS_GAS_URL,{
    method:'POST',
    body:JSON.stringify({action:'submitChatOrder',client:'',contact:'',item:'オーダー相談AI（AI会話モード）',hearingContent:transcript,images})
  }).then(r=>r.json()).then(res=>{
    if(res.ok){
      liveConsultSent=true;
      addMsg('bot','📨 ご相談内容と画像を工房へお送りしました（受付番号: '+res.orderNo+'）。職人が確認してご案内いたします。');
      showLiveSendChip();
    }else{
      addMsg('bot','⚠️ 送信に失敗しました：'+(res.error||'不明なエラー')+'。時間をおいて再度お試しください。');
    }
  }).catch(()=>{
    addMsg('bot','⚠️ 通信エラーのため送信できませんでした。時間をおいて再度お試しください。');
  });
}

const attachBtnEl=document.getElementById('attachBtn');
const attachFileEl=document.getElementById('attachFile');
attachBtnEl.onclick=()=>attachFileEl.click();
attachFileEl.onchange=()=>{
  const files=Array.from(attachFileEl.files||[]).filter(f=>/^image\//.test(f.type));
  attachFileEl.value='';
  if(!files.length){ addMsg('bot','画像ファイル（JPEG・PNGなど）のみ添付できます🙏'); return; }
  const room=MAX_CUSTOMER_IMAGES-customerImages.length;
  if(room<=0){ addMsg('bot','添付できる画像は'+MAX_CUSTOMER_IMAGES+'枚までです🙏'); return; }
  // 添付順と表示順がずれないよう1枚ずつ直列に処理する
  files.slice(0,room).reduce((chain,file)=>chain.then(()=>
    compressImage(file).then(dataUrl=>{
      const idx=customerImages.length+1;
      customerImages.push({fileName:'customer_image_'+idx+'.jpg',label:'お客様の製作イメージ'+idx,dataUrl});
      pendingAIImages.push(dataUrl); // Phase4: 次のAI応答1ターンだけVision解釈に使う
      liveConsultSent=false; // 送信済み後の追加添付は再送信を許可する（新しい画像が漏れないように）
      addImgMsg(dataUrl,'製作イメージ'+idx);
      // AI会話モードでは、画像を添付した事実をAIにもテキストで共有する（画像本体は次のliveTurnで1回だけ送る）
      if(state.liveMode) history.push({role:'user',content:'（📷 製作イメージ画像を添付しました: 製作イメージ'+idx+'）'});
    }).catch(()=>addMsg('bot','申し訳ありません、画像の読み込みに失敗しました。別の画像でお試しください🙏'))
  ),Promise.resolve()).then(()=>{
    if(!customerImages.length) return;
    addMsg('bot', state.liveMode
      ? '画像をお預かりしました📷（'+customerImages.length+'/'+MAX_CUSTOMER_IMAGES+'枚）このままご希望をお送りいただくと、AIが画像を拝見してご提案します。下の「📨 相談内容と画像を工房へ送信」ボタンで、いつでも工房へもお送りいただけます。'
      : '画像をお預かりしました📷（'+customerImages.length+'/'+MAX_CUSTOMER_IMAGES+'枚）発注票が完成すると、ご相談内容と一緒に工房へ届きます。');
    showLiveSendChip();
  });
};

function copy(text,okMsg){
  navigator.clipboard.writeText(text).then(()=>toast(okMsg)).catch(()=>{
    // フォールバック
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); toast(okMsg);}catch(e){alert('コピーできませんでした。手動で選択してください。');}
    ta.remove();
  });
}
function toast(msg){
  const t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#3d1a08;color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.3)';
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}

/* =========================================================================
   ライブAIモード（GAS経由・APIキーはサーバー側のみで保持）
   ========================================================================= */
const HEARING_AI_PROXY_URL='https://script.google.com/macros/s/AKfycbwABbFeZucU9N4k8YyhIKbUUo3JUTGX0vXPBuuX0mSEqIpblyZFtf66w7lCB9R_xkCE-w/exec';

document.getElementById('modeBtn').onclick=()=>{
  if(state.liveMode){ exitLiveMode(); } else { enterLiveMode(); }
};

/* SYSTEM_PROMPT は hearing-core.js の buildSystemPrompt(KB) で生成（KB読込後に更新） */

let history=[];
function enterLiveMode(){
  state.liveMode=true;
  quickEl.innerHTML=''; chat.innerHTML='';
  history=[];
  addMsg('bot','AI会話モードに切り替えました🧵 自由にご相談ください。「A6でシンプルな手帳がほしい」「二つ折り財布を作りたい」のように、思いつくままに話しかけてくださいね。');
  document.getElementById('modeBtn').textContent='↩ ガイドに戻る';
}
function exitLiveMode(){
  state.liveMode=false;
  chat.innerHTML=''; quickEl.innerHTML='';
  document.getElementById('modeBtn').textContent='⚙ AI会話モード';
  startPicker();
}
async function liveTurn(userText){
  addMsg('user', userText);
  history.push({role:'user', content:userText});
  showTyping();
  try{
    const livePayload={ system:SYSTEM_PROMPT, history, model:'claude-sonnet-5' };
    if(pendingAIImages.length){
      livePayload.images=pendingAIImages.slice();
      pendingAIImages=[]; // 1回送ったらクリア（失敗時も再送しない＝有料枠・トークンの浪費防止を優先）
    }
    const res=await fetch(HEARING_AI_PROXY_URL,{
      method:'POST',
      body:JSON.stringify(livePayload)
    });
    hideTyping();
    const data=await res.json();
    if(data.error){
      const msg = data.error==='quota exceeded'
        ? '本日のAI相談回数の上限に達しました。恐れ入りますが、ガイド対話モードをご利用いただくか、後ほどお試しください。'
        : '⚠️ AIへの接続でエラーが出ました。少し時間をおいて再度お試しください。';
      addMsg('bot', msg);
      return;
    }
    const reply=data.reply||'(応答が空でした)';
    history.push({role:'assistant', content:reply});
    addMsg('bot', reply);
  }catch(e){
    hideTyping();
    addMsg('bot','⚠️ 通信に失敗しました。ネットワークをご確認のうえ、もう一度お試しください。');
  }
}

// 革在庫(leather-stock.csv)を id→残量% マップにして読み込む（AI会話モードの在庫優先提案用）。
// キャッシュ回避（GitHub Pages CDN・ブラウザキャッシュで古い在庫が残らないように）。読めない場合はnull（在庫タグ無しで動作）。
function loadLeatherStockMap(){
  return fetch('./leather-stock.csv?t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():null)
    .then(t=>{
      if(!t) return null;
      const lines=t.replace(/\r/g,'').split('\n').filter(l=>l.trim());
      const head=lines.shift().split(',');
      const idIdx=head.indexOf('id'), pctIdx=head.indexOf('stock_pct');
      if(idIdx<0||pctIdx<0) return null;
      const map={};
      lines.forEach(line=>{
        const cols=line.split(',');
        const id=(cols[idIdx]||'').trim();
        const raw=(cols[pctIdx]||'').trim();
        if(!id) return;
        map[id]=(raw==='')?null:Math.max(0,Math.min(100,Number(raw)));
      });
      return map;
    }).catch(()=>null);
}

// 知識ベース(hearing-kb.json)と革カタログ(leather-catalog.json)・在庫を読み込んでから開始。
// 読めない場合は内蔵既定値（革はテキスト選択）で開始。
Promise.all([
  NSF_HEARING.loadKB('./hearing-kb.json'),
  NSF_HEARING.loadLeathers('./leather-catalog.json'),
  loadLeatherStockMap(),
  loadStitchColors(),
  loadStitchStock()
]).then(([kb, leathers, stockMap, stitchColors, stitchStock])=>{
  KB=kb;
  CORE=NSF_HEARING.build(KB, leathers);
  PRODUCTS=CORE.PRODUCTS;
  COMMON_TAIL=CORE.COMMON_TAIL;
  SYSTEM_PROMPT=NSF_HEARING.buildSystemPrompt(KB, leathers, stockMap);
  LEATHERS=leathers;   // 革の色・シリーズ質問への即答ギャラリー用
  STOCK_MAP=stockMap;
  STITCH_COLORS=stitchColors; // ステッチ色の即答ギャラリー用
  STITCH_STOCK=stitchStock;
  startPicker();
});
