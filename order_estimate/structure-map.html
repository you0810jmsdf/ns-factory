<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<!-- 内部向け構造マップ（概念図／画面設計／ER図）。管理画面「🗺 構造マップ」タブから iframe で読む。
     正本は Claude Artifact（https://claude.ai/artifact/DQ9a77NdnRqKQ3jYVoYhMN）と同じ内容。
     ⛔ 認証情報・顧客データ・シートの中身は載せない（構造だけ）。2026-09-16 事業主決定A で同梱 -->
<style>[hidden]{display:none!important}</style>
<title>N's factory 構造マップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#0e0c0a; --bg2:#141110; --surface:#1a1613; --line:#33291f; --line2:#4a3d2f;
    --text:#ece3d3; --muted:#9c9080; --gold:#c9a96e; --gold2:#e6cf9a;
    --k-actor:#ece3d3; --k-page:#c9a96e; --k-admin:#a596cc; --k-gas:#6fb8a0; --k-sheet:#84bf6e; --k-data:#6fa4cf; --k-ext:#d0806f; --k-mail:#c9b98a;
    --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
    --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",sans-serif;
    --mono:"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;overflow:hidden;color-scheme:dark}
  button{font-family:inherit;color:inherit}

  .bar{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 16px;background:linear-gradient(to bottom,rgba(14,12,10,.98),rgba(14,12,10,.86));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0}
  .brand .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
  .views{display:flex;gap:4px;padding:3px;border:1px solid var(--line2);border-radius:999px;background:var(--bg2);margin-inline:auto}
  .views button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1;transition:background .2s,color .2s}
  .views button small{font-size:10px;font-weight:400;letter-spacing:.04em;opacity:.8}
  .views button[aria-selected="true"]{background:var(--gold);color:#1a1409}
  .views button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
  .tools{display:flex;gap:6px}
  .tools button{border:1px solid var(--line2);background:var(--bg2);border-radius:8px;min-width:36px;height:34px;padding:0 10px;cursor:pointer;font-size:14px}
  .tools button:hover{border-color:var(--gold)}
  .tools button:focus-visible{outline:2px solid var(--gold2)}

  .stage{position:fixed;inset:0;padding-top:58px}
  svg#canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:
    radial-gradient(circle at 1px 1px, #211c17 1px, transparent 1.5px) 0 0/28px 28px, var(--bg)}
  svg#canvas.drag{cursor:grabbing}
  .node{cursor:pointer}
  .node rect.body{transition:filter .15s}
  .node:hover rect.body{filter:brightness(1.18)}
  .node.sel rect.body{stroke-width:3}
  .edge path{fill:none;stroke:#5b4e40;stroke-width:1.6;marker-end:url(#arrow)}
  .edge.dashed path{stroke-dasharray:6 5}
  .edge.lit path{stroke:var(--gold2);stroke-width:2.4;marker-end:url(#arrowLit)}
  .edge text{font-size:11px;fill:var(--muted)}
  .edge.lit text{fill:var(--gold2)}
  .edge.dim path{opacity:.18}
  .edge.dim text{opacity:.18}
  .node.dim{opacity:.3}
  .rel path{fill:none;stroke:#6a5a48;stroke-width:1.5}
  .rel.lit path{stroke:var(--gold2);stroke-width:2.4}
  .rel text{font-size:10.5px;fill:var(--muted);font-family:var(--mono)}
  .rel.lit text{fill:var(--gold2)}
  .rel.dim{opacity:.18}

  .legend{position:fixed;left:16px;bottom:16px;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;background:rgba(20,17,16,.92);border:1px solid var(--line);border-radius:10px;font-size:12px;max-width:min(92vw,720px)}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .legend i{width:12px;height:12px;border-radius:3px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,#1a1613)}
  .hint{position:fixed;right:16px;bottom:16px;z-index:5;font-size:12px;color:var(--muted);background:rgba(20,17,16,.9);border:1px solid var(--line);border-radius:8px;padding:8px 12px}

  #panel{position:fixed;top:70px;right:16px;bottom:64px;width:360px;max-width:calc(100vw - 32px);z-index:8;overflow:auto;background:rgba(26,22,19,.97);border:1px solid var(--line2);border-radius:14px;padding:18px 20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  #panel .close{position:absolute;top:10px;right:10px;border:1px solid var(--line2);background:var(--bg2);border-radius:8px;width:30px;height:30px;cursor:pointer}
  #panel .kind{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--gold))}
  #panel h2{font-family:var(--display);font-size:20px;margin:4px 0 12px;line-height:1.35;text-wrap:balance;padding-right:30px}
  #panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 14px;font-size:13px}
  #panel dt{color:var(--muted);white-space:nowrap}
  #panel dd{margin:0;word-break:break-all}
  #panel dd code{font-family:var(--mono);font-size:12px;color:var(--gold2)}
  #panel p{margin:0 0 12px;line-height:1.7;font-size:13.5px}
  #panel .rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px}
  #panel .rows li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
  #panel .rows .tag{font-size:9px;letter-spacing:.08em;padding:1px 5px;border-radius:4px;border:1px solid var(--gold);color:var(--gold);flex:none}
  #panel .rows .tag.fk{border-color:var(--k-data);color:var(--k-data)}
  #panel .rows .memo{margin-left:auto;color:var(--muted);font-family:var(--ui);font-size:11.5px;text-align:right}
  #panel a.open{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:8px;background:var(--gold);color:#1a1409;text-decoration:none;font-weight:700;font-size:13px}
  #panel .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #panel .links button{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
  #panel .links button:hover{border-color:var(--gold)}

  @media (max-width:760px){
    .bar{flex-wrap:wrap;gap:8px;padding:8px 12px}
    .brand h1{font-size:15px}
    .views{order:3;width:100%;margin:0;justify-content:space-between}
    .views button{padding:6px 8px;flex:1}
    .tools{margin-left:auto}
    .stage{padding-top:104px}
    .hint{display:none}
    .legend{left:8px;right:8px;bottom:8px;max-width:none;font-size:11px;gap:4px 10px;padding:8px 10px}
    #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:52vh;padding:14px 16px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<header class="bar">
  <div class="brand"><span class="eyebrow">ns-factory · github pages</span><h1>N's factory 構造マップ</h1></div>
  <nav class="views" role="tablist" aria-label="図の切替" id="viewTabs"></nav>
  <div class="tools">
    <button id="zoomOut" title="縮小" aria-label="縮小">−</button>
    <button id="zoomIn" title="拡大" aria-label="拡大">＋</button>
    <button id="fitAll" title="3つの図を同時に見る">全体</button>
  </div>
</header>

<div class="stage">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="サイトの概念図・画面設計・ER図を載せたキャンバス"></svg>
  <aside id="panel" hidden aria-live="polite"></aside>
  <div class="legend" id="legend"></div>
  <div class="hint">ドラッグで移動 · ホイールで拡大縮小 · ← → で図を切替 · 箱を押すと説明</div>
</div>

/* 接続線（矢印つき・ラベルつき） */
function anchors(A,B){
  const ax=A.x+A.w/2, ay=A.y+A.h/2, bx=B.x+B.w/2, by=B.y+B.h/2;
  const dx=bx-ax, dy=by-ay;
  if(Math.abs(dx)*1.0 > Math.abs(dy) && (B.x>A.x+A.w || B.x+B.w<A.x)){
    return dx>0 ? [{x:A.x+A.w,y:ay},{x:B.x,y:by},"h"] : [{x:A.x,y:ay},{x:B.x+B.w,y:by},"h"];
  }
  return dy>0 ? [{x:ax,y:A.y+A.h},{x:bx,y:B.y},"v"] : [{x:ax,y:A.y},{x:bx,y:B.y+B.h},"v"];
}
function curve(p,q,dir){ const k= dir==="h" ? Math.max(40,Math.abs(q.x-p.x)*.45) : Math.max(30,Math.abs(q.y-p.y)*.45);

                   : `M${p.x},${p.y} C${p.x},${p.y+Math.sign(q.y-p.y)*k} ${q.x},${q.y-Math.sign(q.y-p.y)*k} ${q.x},${q.y}`; }

  if(label){ const mx=(p.x+q.x)/2, my=(p.y+q.y)/2; const w=tw(label,11)+10; rrect(eg,mx-w/2,my-9,w,16,4,{fill:"rgba(14,12,10,.9)"}); text(eg,mx,my+3,label,{fs:11,fill:"var(--muted)",anchor:"middle"}); }

function drawRel(g,a,b,ca,cb,label){

  // 端の記号：多側は三叉、1側は短い縦線

      el("path",{d:`M${pt.x+dx},${pt.y+dy} L${pt.x},${pt.y-(vert?s:0)+(vert?0:0)} M${pt.x+dx},${pt.y+dy} L${pt.x},${pt.y+(vert?s:0)} M${pt.x+dx},${pt.y+dy} L${pt.x},${pt.y}`,stroke:"currentColor"},eg).setAttribute("style","stroke:#8a7a66;fill:none");
    } else { el("path",{d: vert? `M${pt.x+(side==="a"?s:-s)},${pt.y-s} L${pt.x+(side==="a"?s:-s)},${pt.y+s}` : `M${pt.x-s},${pt.y+(side==="a"?s:-s)} L${pt.x+s},${pt.y+(side==="a"?s:-s)}`},eg).setAttribute("style","stroke:#8a7a66;fill:none"); }
    const off=14; text(eg, vert? pt.x+(side==="a"?off:-off) : pt.x+10, vert? pt.y-5 : pt.y+(side==="a"?off+4:-off), card,{fs:10.5,fill:"var(--muted)",mono:true,anchor:"middle"}); };

function applyVB(){ svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fitRect(r,pad=40){ const W=svg.clientWidth||1, H=svg.clientHeight||1; const ar=W/H; let w=r.w+pad*2, h=r.h+pad*2+90; /* 下端は凡例ぶん余白 */ if(w/h<ar) w=h*ar; else h=w/ar; return {x:r.x+r.w/2-w/2,y:r.y+r.h/2-h/2,w,h}; }
function animateTo(t,ms=520){ if(anim) cancelAnimationFrame(anim); if(reduced||ms===0){ vb=t; applyVB(); return; } const s={...vb}, t0=performance.now(); const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  const step=now=>{ const u=Math.min(1,(now-t0)/ms), e=ease(u); vb={x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e}; applyVB(); if(u<1) anim=requestAnimationFrame(step); }; anim=requestAnimationFrame(step); }
let current=0;
function goView(i,ms){ current=(i+VIEWS.length)%VIEWS.length; const v=VIEWS[current]; animateTo(fitRect(v),ms); document.querySelectorAll("#viewTabs button").forEach((b,j)=>b.setAttribute("aria-selected",j===current)); try{localStorage.setItem("nsf_map_view",String(current));}catch(e){} }
function fitAll(){ const x0=Math.min(...VIEWS.map(v=>v.x)), y0=0, x1=Math.max(...VIEWS.map(v=>v.x+v.w)), y1=Math.max(...VIEWS.map(v=>v.h)); animateTo(fitRect({x:x0,y:y0,w:x1-x0,h:y1-y0},80)); document.querySelectorAll("#viewTabs button").forEach(b=>b.setAttribute("aria-selected","false")); }
function zoomAt(f,cx,cy){ const nx=cx-(cx-vb.x)*f, ny=cy-(cy-vb.y)*f; vb={x:nx,y:ny,w:vb.w*f,h:vb.h*f}; applyVB(); }
function clientToSvg(px,py){ const r=svg.getBoundingClientRect(); return {x:vb.x+(px-r.left)/r.width*vb.w, y:vb.y+(py-r.top)/r.height*vb.h}; }

// メニュー
const tabs=document.getElementById("viewTabs");
VIEWS.forEach((v,i)=>{ const b=document.createElement("button"); b.setAttribute("role","tab"); b.dataset.view=i; b.innerHTML=`${v.label}<small>${v.sub}</small>`; b.addEventListener("click",()=>goView(i)); tabs.appendChild(b); });
document.getElementById("zoomIn").addEventListener("click",()=>zoomAt(.8,vb.x+vb.w/2,vb.y+vb.h/2));
document.getElementById("zoomOut").addEventListener("click",()=>zoomAt(1.25,vb.x+vb.w/2,vb.y+vb.h/2));
document.getElementById("fitAll").addEventListener("click",fitAll);
addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")) return; if(e.key==="ArrowRight") goView(current+1); else if(e.key==="ArrowLeft") goView(current-1); else if(e.key==="Escape") closePanel(); else if(e.key==="0") goView(current); });

// ドラッグ・ホイール・ピンチ
const ptrs=new Map(); let dragStart=null, moved=false, pinch0=null, downTarget=null;
svg.addEventListener("pointerdown",e=>{ downTarget=e.target.closest("[data-id]"); svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(ptrs.size===1){ dragStart={px:e.clientX,py:e.clientY,vx:vb.x,vy:vb.y}; moved=false; svg.classList.add("drag"); } else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb},mid:clientToSvg((a.x+b.x)/2,(a.y+b.y)/2)}; } });
svg.addEventListener("pointermove",e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2 && pinch0){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const f=pinch0.d/Math.max(1,d); const m=pinch0.mid; vb={x:m.x-(m.x-pinch0.vb.x)*f,y:m.y-(m.y-pinch0.vb.y)*f,w:pinch0.vb.w*f,h:pinch0.vb.h*f}; applyVB(); moved=true; return; }
  if(!dragStart) return; const r=svg.getBoundingClientRect(); const dx=(e.clientX-dragStart.px)/r.width*vb.w, dy=(e.clientY-dragStart.py)/r.height*vb.h; if(Math.abs(e.clientX-dragStart.px)+Math.abs(e.clientY-dragStart.py)>4) moved=true; vb.x=dragStart.vx-dx; vb.y=dragStart.vy-dy; applyVB(); });
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; if(ptrs.size===0){ dragStart=null; svg.classList.remove("drag"); } };
svg.addEventListener("pointerup",endPtr); svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{ e.preventDefault(); const p=clientToSvg(e.clientX,e.clientY); zoomAt(e.deltaY>0?1.12:1/1.12,p.x,p.y); },{passive:false});
/* ポインターキャプチャ中は click の対象が svg 自体になるため、押した瞬間の対象（downTarget）で判定する */
svg.addEventListener("click",e=>{ if(moved) return; const n=downTarget||e.target.closest("[data-id]"); downTarget=null; if(n) select(n.dataset.id); else closePanel(); });
svg.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ const n=e.target.closest("[data-id]"); if(n){ e.preventDefault(); select(n.dataset.id); } } });
addEventListener("resize",()=>{ if(current>=0) animateTo(fitRect(VIEWS[current]),0); });

/* ───────────────────────────── 選択と説明パネル ───────────────────────────── */
const panel=document.getElementById("panel"); let selected=null;
function closePanel(){ panel.hidden=true; selected=null; Object.values(nodeEls).forEach(n=>n.classList.remove("sel","dim")); edgeEls.forEach(x=>x.el.classList.remove("lit","dim")); }
function select(id){ const info=details[id]; if(!info) return; selected=id;
  Object.entries(nodeEls).forEach(([k,n])=>{ n.classList.toggle("sel",k===id); });
  const near=new Set([id]); edgeEls.forEach(x=>{ const hit=x.a===id||x.b===id; x.el.classList.toggle("lit",hit); x.el.classList.toggle("dim",!hit); if(hit){near.add(x.a);near.add(x.b);} });
  Object.entries(nodeEls).forEach(([k,n])=>n.classList.toggle("dim",!near.has(k)));
  const k=KIND[info.kind]||KIND.page; const d=info.d||{};
  let html=`<button class="close" aria-label="閉じる">✕</button><div class="kind" style="--c:${k.c}">${k.label}</div><h2>${esc(info.title)}</h2>`;
  const dl=[]; if(d.path) dl.push(["場所",`<code>${esc(d.path)}</code>`]); else if(info.sub) dl.push(["補足",esc(info.sub)]);
  if(d.backend) dl.push(["裏側",esc(d.backend)]); if(d.data) dl.push(["読むデータ",esc(d.data)]);
  if(dl.length) html+=`<dl>${dl.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`;
  if(d.note) html+=`<p>${esc(d.note)}</p>`; if(d.text) html+=`<p>${esc(d.text)}</p>`;
  if(d.blocks) html+=`<ul class="rows">${d.blocks.map(b=>`<li><span>${esc(b[0])}</span></li>`).join("")}</ul>`;
  if(d.rows) html+=`<ul class="rows">${d.rows.map(r=>`<li>${r[1]?`<span class="tag ${r[1]==="FK"?"fk":""}">${r[1]}</span>`:""}<span>${esc(r[0])}</span>${r[2]?`<span class="memo">${esc(r[2])}</span>`:""}</li>`).join("")}</ul>`;
  const related=[...near].filter(x=>x!==id); if(related.length) html+=`<div class="links">${related.map(r=>`<button data-go="${r}">${esc(details[r]?.title||r)}</button>`).join("")}</div>`;
  const url = d.path && /\.html/.test(d.path) && !/[ ,*]/.test(d.path.split(/\s/)[0]) ? SITE+d.path.split(/\s|,/)[0] : (d.path && /\/$/.test(d.path.split(/\s/)[0]) ? SITE+d.path.split(/\s/)[0] : null);
  if(url && (info.kind==="page"||info.kind==="admin")) html+=`<a class="open" href="${url}" target="_blank" rel="noopener">本番ページを開く ↗</a>`;
  panel.innerHTML=html; panel.hidden=false;
  panel.querySelector(".close").addEventListener("click",closePanel);
  panel.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ select(b.dataset.go); centerOn(b.dataset.go); }));
}
function centerOn(id){ const r=rects[id]; if(!r) return; const cx=r.x+r.w/2, cy=r.y+r.h/2; if(cx<vb.x||cx>vb.x+vb.w||cy<vb.y||cy>vb.y+vb.h) animateTo({x:cx-vb.w/2,y:cy-vb.h/2,w:vb.w,h:vb.h},380); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* 凡例 */
document.getElementById("legend").innerHTML = Object.values(KIND).map(k=>`<span><i style="--c:${k.c}"></i>${k.label}</span>`).join("") + `<span><i style="--c:#7a6a58;border-style:dashed"></i>点線＝GASのまとまり／間接の流れ</span>`;

/* 初期表示：前回の図を復元 */
let start=0; try{ const s=localStorage.getItem("nsf_map_view"); if(s!=null) start=+s; }catch(e){}
goView(start,0);
</script>

</html>
