<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../admin-gate.js"></script>
<title>顧客マスタ — N's factory</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ND1T7H067Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ND1T7H067Y');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .col-address {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* === SNS等ID セクション === */
  .platforms-section {
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    background: #fbfaf6;
  }
  .platforms-section .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-sub);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .platform-row {
    display: grid;
    grid-template-columns: 130px 1fr 1fr 140px 36px;
    gap: 6px;
    margin-bottom: 6px;
    align-items: center;
  }
  .platform-row input,
  .platform-row select {
    font-size: 13px;
    padding: 5px 8px;
  }
  .platform-row .btn-remove {
    background: transparent;
    border: 1px solid var(--color-border);
    color: #c0392b;
    border-radius: 4px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 13px;
  }
  .platform-row .btn-remove:hover { background: #fdecea; }
  @media (max-width: 720px) {
    .platform-row { grid-template-columns: 1fr 1fr; }
    .platform-row .btn-remove { grid-column: 1 / -1; }
  }
  .col-sns {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: var(--color-text-sub);
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="brand">N's factory</a>
  <nav>
    <a href="index.html"><span>書類台帳</span></a>
    <a href="customers.html" class="active"><span>顧客</span></a>
    <a href="products.html"><span>商品</span></a>
  </nav>
</header>

<div class="main-container">
  <div class="page-title">顧客マスタ</div>

  <div class="toolbar" style="background:#fbf3e6;border:1px solid var(--color-accent,#a07d3e);border-radius:8px;padding:10px 14px;">
    <span style="font-size:13px;color:var(--color-accent-dark,#7a5d2a);">📌 このページは閲覧専用です。新規登録・編集・削除は <strong>customer_manager.html</strong>（ローカル）で行ってください。保存すると自動でここに反映されます。</span>
  </div>

  <div class="toolbar">
    <div class="spacer"></div>
    <span style="font-size:12px;color:var(--color-text-sub);white-space:nowrap;">並び順：</span>
    <select class="form-control" id="sort-select" style="width:120px;font-size:12px;padding:5px 8px;">
      <option value="newest">最新順</option>
      <option value="oldest">古い順</option>
      <option value="name_asc">名前（昇順）</option>
      <option value="name_desc">名前（降順）</option>
    </select>
    <input type="text" class="form-control" id="search-input" placeholder="検索..." style="width:180px;">
    <button class="btn btn-secondary" id="btn-refresh">更新</button>
  </div>

  <!-- 一覧テーブル -->
  <div class="card" style="padding:0;overflow:hidden;">
    <table class="data-table" id="cust-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>顧客名</th>
          <th>敬称</th>
          <th>電話</th>
          <th>メール</th>
          <th>住所</th>
          <th>SNS等ID</th>
        </tr>
      </thead>
      <tbody id="cust-tbody">
        <tr><td colspan="7"><div class="empty-state"><span class="icon">&#x1F465;</span>読み込み中...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
