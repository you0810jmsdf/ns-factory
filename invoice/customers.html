<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../admin-gate.js"></script>
<title>顧客マスタ — N's factory</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ND1T7H067Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ND1T7H067Y');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .col-address {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* === SNS等ID セクション === */
  .platforms-section {
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    background: #fbfaf6;
  }
  .platforms-section .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-sub);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .platform-row {
    display: grid;
    grid-template-columns: 130px 1fr 1fr 140px 36px;
    gap: 6px;
    margin-bottom: 6px;
    align-items: center;
  }
  .platform-row input,
  .platform-row select {
    font-size: 13px;
    padding: 5px 8px;
  }
  .platform-row .btn-remove {
    background: transparent;
    border: 1px solid var(--color-border);
    color: #c0392b;
    border-radius: 4px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 13px;
  }
  .platform-row .btn-remove:hover { background: #fdecea; }
  @media (max-width: 720px) {
    .platform-row { grid-template-columns: 1fr 1fr; }
    .platform-row .btn-remove { grid-column: 1 / -1; }
  }
  .col-sns {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: var(--color-text-sub);
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="brand">N's factory</a>
  <nav>
    <a href="index.html"><span>書類台帳</span></a>
    <a href="customers.html" class="active"><span>顧客</span></a>
    <a href="products.html"><span>商品</span></a>
  </nav>
</header>

<div class="main-container">
  <div class="page-title">顧客マスタ</div>

  <div class="toolbar">
    <button class="btn btn-primary" id="btn-new">+ 新規登録</button>
    <div class="spacer"></div>
    <span style="font-size:12px;color:var(--color-text-sub);white-space:nowrap;">並び順：</span>
    <select class="form-control" id="sort-select" style="width:120px;font-size:12px;padding:5px 8px;">
      <option value="newest">最新順</option>
      <option value="oldest">古い順</option>
      <option value="name_asc">名前（昇順）</option>
      <option value="name_desc">名前（降順）</option>
    </select>
    <input type="text" class="form-control" id="search-input" placeholder="検索..." style="width:180px;">
    <button class="btn btn-secondary" id="btn-refresh">更新</button>
  </div>

  <!-- 新規/編集フォーム -->
  <div class="card" id="form-panel" style="display:none;">
    <div class="card-title" id="form-title">顧客登録</div>
    <input type="hidden" id="edit-id">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">顧客名 *</label>
        <input type="text" class="form-control" id="f-name" placeholder="山田 太郎">
      </div>
      <div class="form-group">
        <label class="form-label">敬称</label>
        <select class="form-control" id="f-honorific">
          <option value="様">様</option>
          <option value="御中">御中</option>
          <option value="">（なし）</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">郵便番号</label>
        <input type="text" class="form-control" id="f-zip" placeholder="000-0000">
      </div>
      <div class="form-group">
        <label class="form-label">住所</label>
        <input type="text" class="form-control" id="f-address" placeholder="千葉県...">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">電話</label>
        <input type="text" class="form-control" id="f-phone" placeholder="090-0000-0000">
      </div>
      <div class="form-group">
        <label class="form-label">メール</label>
        <input type="email" class="form-control" id="f-email" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">SNS等ID（旧・担当者欄／互換用）</label>
        <input type="text" class="form-control" id="f-contact" placeholder="旧データのみ・新規は下のSNS等IDセクションへ">
      </div>
    </div>

    <div class="platforms-section">
      <div class="section-title">
        <span>🔗 SNS等ID（複数登録可）</span>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-add-platform">＋ 1行追加</button>
      </div>
      <div id="platforms-list">
        <!-- 行は customers.js で動的生成 -->
      </div>
      <datalist id="dl-platform-sites">
        <option value="Creema">
        <option value="minne">
        <option value="BASE">
        <option value="STORE">
        <option value="メルカリ">
        <option value="ラクマ">
        <option value="PayPayフリマ">
        <option value="Pinkoi">
        <option value="Threads">
        <option value="Instagram">
        <option value="X">
        <option value="LINE">
        <option value="カタカムナ">
        <option value="その他">
      </datalist>
    </div>

    <div class="form-group" style="margin-top:10px;">
      <label class="form-label">備考</label>
      <textarea class="form-control" id="f-note" rows="2"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <button class="btn btn-primary" id="btn-submit">登録</button>
      <button class="btn btn-secondary" id="btn-cancel">キャンセル</button>
    </div>
  </div>

  <!-- 一覧テーブル -->
  <div class="card" style="padding:0;overflow:hidden;">
    <table class="data-table" id="cust-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>顧客名</th>
          <th>敬称</th>
          <th>電話</th>
          <th>メール</th>
          <th>住所</th>
          <th>SNS等ID</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="cust-tbody">
        <tr><td colspan="8"><div class="empty-state"><span class="icon">&#x1F465;</span>読み込み中...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
