<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{

  background:#f5f0eb;color:#2c1a0e;font-size:14px;line-height:1.7;

.topbar{
  background:linear-gradient(135deg,#3d1a08 0%,#6b3a1f 100%);

  flex:1;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;
}
.card{
  max-width:480px;width:100%;background:#fff;border-radius:14px;
  padding:40px 32px;text-align:center;
  box-shadow:0 4px 24px rgba(61,26,8,0.12);
  border-top:4px solid #b8863f;
}
.icon{font-size:40px;margin-bottom:16px}
.card h2{
  font-size:19px;color:#3d1a08;margin-bottom:16px;letter-spacing:0.03em;font-weight:700;
}
.card p{
  color:#5a4636;margin-bottom:28px;font-size:14px;line-height:1.8;
}
.btn{
  display:inline-block;width:100%;padding:14px;border-radius:8px;
  font-size:15px;font-weight:700;letter-spacing:0.04em;
  text-decoration:none;transition:background .2s;
  background:#6b3a1f;color:#fff;
  margin-bottom:10px;

.btn:hover{background:#7d4525}
.btn.secondary{
  background:#fff;color:#6b3a1f;border:2px solid #6b3a1f;
}
.btn.secondary:hover{background:#fdf0e5}
