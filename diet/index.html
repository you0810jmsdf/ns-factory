<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    connect-src は自社のGASだけに限定する。
    ⛔ ここに他のドメインを足さないこと。足した瞬間、記録が外部へ出る経路が増える。
    ⛔ 送っているのは「内蔵の食品一覧に無かった品目名」と「不具合検知の概要」だけ。
       体重・カロリー・日時・食事記録・写真は送らない。
       送信内容を増やすときは、必ず設定画面のプライバシー説明も同時に直すこと。
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <title>ダイエット管理</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ダイエット管理">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 id="page-title" class="app-title">ダイエット管理</h1>
      <button id="settings-button" class="icon-button header-action" type="button" aria-label="設定を開く" hidden>
        <span aria-hidden="true">⚙️</span>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite">
      <section class="empty-state">
        <p class="muted">起動中</p>
      </section>
    </main>

    <nav class="tabbar" aria-label="主要画面">
      <a class="tab-item" href="#/home" data-route="home" aria-label="ホーム">
        <span class="tab-icon" aria-hidden="true">🏠</span>
        <span class="tab-label">ホーム</span>
      </a>
      <a class="tab-item" href="#/weight" data-route="weight" aria-label="体重">
        <span class="tab-icon" aria-hidden="true">⚖️</span>
        <span class="tab-label">体重</span>
      </a>
      <a class="tab-item" href="#/meal" data-route="meal" aria-label="食事">
        <span class="tab-icon" aria-hidden="true">🍽️</span>
        <span class="tab-label">食事</span>
      </a>
      <a class="tab-item" href="#/exercise" data-route="exercise" aria-label="運動">
        <span class="tab-icon" aria-hidden="true">🏃</span>
        <span class="tab-label">運動</span>
      </a>
      <a class="tab-item" href="#/water" data-route="water" aria-label="水分">
        <span class="tab-icon" aria-hidden="true">💧</span>
        <span class="tab-label">水分</span>
      </a>
    </nav>
  </div>

  <div id="setup-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="setup-title" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="setup-title" class="modal-title">初回セットアップ</h2>
      </div>
      <div id="setup-content" class="modal-body">
        <p class="muted">準備中</p>
      </div>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
