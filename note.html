<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="千葉県印西市の革工房 N's factory の店主が、AIを相棒に個人事業を回した日々の記録「AI経営奮闘記」の記事一覧です。note で全文を無料公開しています。">
<meta property="og:title" content="AI経営奮闘記 記事一覧 | N's factory">
<meta property="og:description" content="革工房の店主がAIと一緒に事業を回した日々の記録。note で全文無料公開中。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* index.html と同じアンティーク調パレット（design_system.md v2.0） */
  --color-primary:#3A2C1E; --color-accent:#A6823F; --color-accent-light:#F0E6CE;
  --color-accent-dark:#7A5E2A; --color-bg:#F7F1E3; --color-bg-sub:#EFE5D0;
  --color-border:#DCCDAF; --color-text:#33291C; --color-text-sub:#6E5C44;
  --color-text-mute:#A08D6F; --paper:#FCF7EB;
  --shadow-sm:0 2px 8px rgba(74,52,18,.10); --shadow-md:0 4px 16px rgba(74,52,18,.13);
  --radius-md:12px; --radius-lg:16px;
  font-family:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);color:var(--color-text);line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

.nav{
  position:sticky;top:0;z-index:10;height:58px;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:rgba(247,241,227,.94);border-bottom:1px solid var(--color-border);
  backdrop-filter:saturate(180%) blur(12px);
}
.nav-brand{font-family:'Cinzel',serif;font-size:17px;letter-spacing:.12em;color:var(--color-primary)}
.nav-back{margin-left:auto;font-size:14px;color:var(--color-text-sub)}
.nav-back:hover{color:var(--color-accent-dark)}

.wrap{max-width:1120px;margin:0 auto;padding:48px 20px 80px}

.head{text-align:center;margin-bottom:40px}
.eyebrow{
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:.28em;
  color:var(--color-accent-dark);margin-bottom:10px;
}
h1{font-size:clamp(26px,4.4vw,38px);font-weight:700;letter-spacing:.04em;margin-bottom:14px}
.lead{color:var(--color-text-sub);font-size:15px;max-width:640px;margin:0 auto}
.rule{
  width:120px;height:1px;margin:26px auto 0;
  background:linear-gradient(90deg,transparent,var(--color-accent),transparent);
}

.toolbar{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  margin:34px 0 22px;
}
.search{
  flex:1 1 260px;max-width:380px;display:flex;align-items:center;gap:8px;
  background:var(--paper);border:1px solid var(--color-border);border-radius:999px;padding:9px 16px;
}
.search input{
  flex:1;border:none;background:none;outline:none;font-family:inherit;
  font-size:15px;color:var(--color-text);min-width:0;
}
.count{font-size:13px;color:var(--color-text-mute);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:26px}
.card{
  background:var(--paper);border:1px solid var(--color-border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--shadow-sm);
  transition:transform .2s ease,box-shadow .2s ease;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.thumb{
  /* カードの高さを揃えるため枠は正方形で固定する。
     比率を出どころ別に変えると、同じ行のカードの背が揃わず大きな余白ができた。 */
  aspect-ratio:1/1;background:var(--color-bg-sub);overflow:hidden;position:relative;
}
/* SNS投稿画像は正方形なので枠いっぱいに敷く（cover）。
   noteの固定バナーは横長で、coverだと文字が切れるため全体を収める（contain）。 */
.thumb:not(.is-sns) img{object-fit:contain}
/* 下地(.ph)は position:absolute なので、何もしないと通常フローの img より前面に来る。
   画像側を positioned にして必ず上に重ねる（画像が落ちたときだけ下地が見える）。 */
.thumb img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.thumb .ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:.2em;
  color:var(--color-text-mute);background:var(--color-bg-sub);
}
.card-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-date{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;color:var(--color-accent-dark)}
.card-title{font-size:16px;line-height:1.65;font-weight:700}
.card-more{margin-top:auto;font-size:12px;color:var(--color-text-mute);letter-spacing:.06em}

.more-wrap{text-align:center;margin-top:40px}
.btn{
  display:inline-block;padding:14px 34px;border-radius:999px;font-size:15px;
  border:1px solid var(--color-accent);color:var(--color-accent-dark);background:var(--paper);
  font-family:inherit;cursor:pointer;transition:.2s ease;
}
.btn:hover{background:var(--color-accent-light)}
.btn-primary{background:var(--color-primary);color:#F7F1E3;border-color:var(--color-primary)}
.btn-primary:hover{background:#55422E}

.cta{
  margin-top:56px;padding:34px 24px;text-align:center;
  background:var(--paper);border:1px solid var(--color-border);border-radius:var(--radius-lg);
}
.cta p{color:var(--color-text-sub);font-size:15px;margin-bottom:18px}

.note-msg{
  padding:28px;text-align:center;color:var(--color-text-sub);
  background:var(--paper);border:1px solid var(--color-border);border-radius:var(--radius-md);
}
.note-msg .btn{margin-top:16px}

footer{
  border-top:1px solid var(--color-border);margin-top:70px;padding:26px 20px;
  text-align:center;color:var(--color-text-mute);font-size:12px;
}
@media(max-width:520px){
  .wrap{padding:32px 16px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
  .card-title{font-size:14px}
  .card-body{padding:12px 13px 16px}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="./" class="nav-brand">N&#39;s factory</a>
  <a href="./shirei-room/" class="nav-back">← 司令官室へ戻る</a>
</nav>

<div class="wrap">
  <header class="head">
    <p class="eyebrow">AI MANAGEMENT DIARY</p>
    <h1>AI経営奮闘記</h1>
    <p class="lead">
      千葉の小さな革工房で、店主がAIを相棒に事業を回した日々の記録です。
      うまくいったことも、つまずいたことも、そのまま書いています。全文を note で無料公開しています。
    </p>
    <div class="rule"></div>
  </header>

  <div class="toolbar">
    <label class="search">
      <span aria-hidden="true" style="color:var(--color-text-mute)">検索</span>
      <input type="search" id="q" placeholder="キーワードで絞り込む" autocomplete="off">
    </label>
    <span class="count" id="count">読み込み中…</span>
  </div>

  <div id="list" class="grid"></div>
  <div id="msg"></div>

  <div class="more-wrap" id="moreWrap" hidden>
    <button type="button" class="btn" id="more">もっと見る</button>
  </div>

  <section class="cta">
    <p>note をフォローすると、新しい記事が届きます。</p>
    <a class="btn btn-primary" id="profileLink" href="https://note.com/you0810jmsdf" target="_blank" rel="noopener">note のプロフィールを見る</a>
  </section>
</div>

<footer>&copy; N&#39;s factory</footer>

<script>
(function () {
  var PAGE = 24;
  var all = [], filtered = [], shown = 0;
  var elList = document.getElementById('list');
  var elMsg = document.getElementById('msg');
  var elCount = document.getElementById('count');
  var elMore = document.getElementById('more');
  var elMoreWrap = document.getElementById('moreWrap');
  var elQ = document.getElementById('q');

  // 「2026-08-31（月） - タイトル」から日付部分を落とす（カードに日付欄が別にあるため）
  function cleanTitle(t) {
    return String(t || '').replace(/^\d{4}-\d{2}-\d{2}(（.）)?\s*[-–—]\s*/, '').trim();
  }
  function fmtDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    return m ? m[1] + '.' + m[2] + '.' + m[3] : '';
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(reset) {
    if (reset) { elList.innerHTML = ''; shown = 0; }
    var next = filtered.slice(shown, shown + PAGE);
    var html = next.map(function (it) {
      var title = cleanTitle(it.title);
      // 画像が落ちてもカードが白く抜けないよう、必ず下に屋号を敷いておく
      var ph = '<span class="ph">N&#39;S FACTORY</span>';
      var img = it.image
        ? ph + '<img src="' + esc(it.image) + '" alt="" loading="lazy" decoding="async"' +
          ' onerror="this.remove()">'
        : ph;
      var thumbCls = 'thumb' + (it.imageSource === 'sns' ? ' is-sns' : '');
      return '<a class="card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
             '<div class="' + thumbCls + '">' + img + '</div>' +
             '<div class="card-body">' +
               '<span class="card-date">' + fmtDate(it.date) + '</span>' +
               '<span class="card-title">' + esc(title) + '</span>' +
               '<span class="card-more">note で読む →</span>' +
             '</div></a>';
    }).join('');
    elList.insertAdjacentHTML('beforeend', html);
    shown += next.length;
    elMoreWrap.hidden = shown >= filtered.length;
    elCount.textContent = filtered.length
      ? '全 ' + filtered.length + ' 記事中 ' + shown + ' 件を表示'
      : '一致する記事がありません';
  }

  function applyFilter() {
    var q = elQ.value.trim().toLowerCase();
    filtered = !q ? all : all.filter(function (it) {
      return String(it.title || '').toLowerCase().indexOf(q) >= 0;
    });
    render(true);
  }

  // GitHub Pages はデータファイルを最大10分キャッシュする。
  // 更新直後でも新しいものを読むよう no-store とタイムスタンプを付ける。
  fetch('./note-data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      all = (d && d.items) || [];
      if (d && d.profileUrl) document.getElementById('profileLink').href = d.profileUrl;
      if (!all.length) throw new Error('記事が0件です');
      filtered = all;
      render(true);
    })
    .catch(function (e) {
      elCount.textContent = '';
      elMsg.innerHTML =
        '<div class="note-msg"><b>記事一覧をうまく読み込めませんでした。</b><br>' +
        '<span style="font-size:13px">（' + esc(e.message || e) + '）</span><br>' +
        'note のページから直接お読みいただけます。' +
        '<br><a class="btn" href="https://note.com/you0810jmsdf" target="_blank" rel="noopener">note を開く</a></div>';
    });

  elMore.addEventListener('click', function () { render(false); });
  var timer = null;
  elQ.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(applyFilter, 180);
  });
})();
</script>
</body>
</html>
