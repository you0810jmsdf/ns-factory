<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>幕僚活動モニタ | N's factory</title>
<style>
/* ダーク管制室テーマ（ローカル版 dashboard.html と統一）。文字コントラスト4.5:1以上 */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
  background:#0d1117;color:#e6edf3;
  min-height:100vh;
}
.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid #30363d;background:#161b22;
}
.topbar h1{margin:0;font-size:17px;letter-spacing:.04em}
.live{
  font-size:11px;font-weight:bold;padding:3px 10px;border-radius:999px;
  background:#12331f;color:#4ade80;border:1px solid #2ea043;
}
.live.stale{background:#3a2d10;color:#e3b341;border-color:#9e6a03}
.live.down{background:#3d1214;color:#ff9d9d;border-color:#f85149}
.cal-link{
  font-size:12px;font-weight:bold;text-decoration:none;padding:6px 14px;border-radius:8px;
  background:#1f6feb;color:#fff;border:1px solid #388bfd;
}
.cal-link:hover{background:#388bfd}
.updated{margin-left:auto;font-size:12px;color:#9aa4af;text-align:right;line-height:1.5}
.main{padding:16px 20px;max-width:1880px;margin:0 auto}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 16px}
.kpi .label{font-size:12px;color:#9aa4af}
.kpi .value{font-size:32px;font-weight:bold;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:13px;font-weight:normal;color:#9aa4af;margin-left:2px}
.kpi.alert .value{color:#ff9d9d}
.kpi.ok .value{color:#4ade80}

.cols{display:grid;grid-template-columns:5fr 7fr;gap:12px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.panel{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px 16px}
.panel h2{margin:0 0 10px;font-size:14px;color:#c9d1d9;letter-spacing:.03em}
.panel h2 .sub{font-size:11px;color:#9aa4af;font-weight:normal;margin-left:8px}

.sess{border:1px solid #30363d;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#0d1117}
.sess.active{border-color:#2ea043}
.sess .head{display:flex;align-items:center;gap:8px;font-size:12px;color:#9aa4af;flex-wrap:wrap}
.sess .dot{width:9px;height:9px;border-radius:50%;background:#6e7681;flex:none}
.sess.active .dot{background:#4ade80;box-shadow:0 0 6px #4ade80}
.sess .sid{font-family:Consolas,monospace;color:#c9d1d9}
.sess .age{margin-left:auto;font-variant-numeric:tabular-nums}
.sess .title{margin-top:5px;font-size:14px;font-weight:bold;color:#e6edf3}
.sess .work{margin-top:4px;font-size:12px;line-height:1.55;color:#9aa4af;word-break:break-word}
.sess.ended{opacity:.55}
.staff-badge{
  font-size:11px;font-weight:bold;padding:2px 9px;border-radius:999px;
  background:#3a2d10;color:#e3b341;border:1px solid #9e6a03;white-space:nowrap;
}

.staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:1400px){.staff-grid{grid-template-columns:repeat(2,1fr)}}
.staff{border:1px solid #30363d;border-radius:10px;padding:10px 12px;background:#0d1117;cursor:pointer}
.staff:hover{border-color:#58a6ff}
.staff.warn{border-color:#f85149;background:#1d1113}
.staff .name{font-size:14px;font-weight:bold;display:flex;align-items:center;gap:6px}
.staff .name .wbadge{font-size:10px;padding:2px 7px;border-radius:999px;background:#f85149;color:#fff}
.staff .metrics{margin-top:6px;font-size:12px;color:#9aa4af;display:flex;flex-direction:column;gap:2px}
.staff .metrics b{color:#e6edf3;font-variant-numeric:tabular-nums}
.staff .metrics .over b{color:#ff9d9d}
.staff .hint{font-size:10px;color:#6e7681;margin-top:4px}
.task-list{display:none;margin-top:8px;border-top:1px solid #30363d;padding-top:6px}
.task-list.open{display:block}
.task-item{padding:7px 0;border-bottom:1px dashed #21262d;font-size:12px}
.task-item:last-child{border-bottom:none}
.task-item .t-head{display:flex;gap:8px;justify-content:space-between;color:#e6edf3;font-weight:bold}
.task-item.overdue .t-head{color:#ff9d9d}
.task-item .t-date{white-space:nowrap;color:#9aa4af;font-weight:normal}
.task-item .t-actions{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.abtn{
  font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;
  background:#21262d;color:#c9d1d9;border:1px solid #30363d;
}
.abtn:hover{border-color:#58a6ff;color:#e6edf3}
.abtn.done{background:#12331f;color:#4ade80;border-color:#2ea043}
.abtn.copied{background:#0d2438;color:#79c0ff;border-color:#1f6feb}
.abtn:disabled{opacity:.5;cursor:default}

.overdue-panel{margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#9aa4af;font-size:11px;text-align:left;padding:4px 10px;border-bottom:1px solid #30363d;font-weight:normal}
td{padding:6px 10px;border-bottom:1px solid #21262d;vertical-align:top}
td.date{white-space:nowrap;color:#ff9d9d;font-variant-numeric:tabular-nums}
td.cat{white-space:nowrap;color:#9aa4af}
.empty{color:#6e7681;font-size:13px;padding:14px 0;text-align:center}
.err{
  margin:0 0 12px;padding:8px 12px;font-size:12px;border-radius:8px;
  background:#3d1214;color:#ff9d9d;border:1px solid #f85149;display:none;
}

.auth-overlay{
  position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(1,4,9,.8);backdrop-filter:blur(4px);
}
.auth-card{
  width:min(420px,100%);background:#161b22;border:1px solid #30363d;border-radius:18px;
  padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.5);
}
.auth-card h2{margin:0 0 8px;font-size:20px;color:#e6edf3}
.auth-card p{margin:0 0 14px;font-size:13px;color:#9aa4af;line-height:1.6}
.auth-card input{
  width:100%;border:1px solid #30363d;border-radius:8px;padding:10px 12px;font-size:14px;
  margin-bottom:10px;outline:none;background:#0d1117;color:#e6edf3;
}
.auth-card input:focus{border-color:#58a6ff}
.auth-btn{
  width:100%;padding:10px;background:#1f6feb;color:#fff;border:none;border-radius:8px;
  font-size:14px;font-weight:bold;cursor:pointer;
}
.auth-btn:hover{background:#388bfd}
.auth-error{min-height:18px;margin:6px 0 0;font-size:12px;color:#ff9d9d}
.auth-locked{overflow:hidden}
</style>
</head>
<body>
<div class="topbar">
  <h1>⚙ 幕僚活動モニタ</h1>
  <span class="live" id="liveBadge">…</span>
  <a class="cal-link" id="calLink" href="#" target="_blank" rel="noopener">📅 幕僚計画を開く</a>
  <span class="updated" id="updatedAt">読み込み中…</span>
</div>
<div class="main">
  <p class="err" id="loadErr"></p>

  <div class="kpis">
    <div class="kpi" id="kpiSess"><div class="label">稼働セッション</div><div class="value">–<span class="unit">件</span></div></div>
    <div class="kpi" id="kpiWarn"><div class="label">警告幕僚（日誌沈黙×期限超過）</div><div class="value">–<span class="unit">名</span></div></div>
    <div class="kpi" id="kpiOverdue"><div class="label">期限超過タスク</div><div class="value">–<span class="unit">件</span></div></div>
    <div class="kpi" id="kpiOpen"><div class="label">未完了タスク合計</div><div class="value">–<span class="unit">件</span></div></div>
  </div>

  <div class="cols">
    <div class="panel">
      <h2>🖥 セッション活動 <span class="sub" id="sessSub"></span></h2>
      <div id="sessList"><div class="empty">読み込み中…</div></div>
    </div>
    <div class="panel">
      <h2>👥 幕僚別ステータス <span class="sub">カードクリックでタスク明細</span></h2>
      <div class="staff-grid" id="staffGrid"></div>
    </div>
  </div>

  <div class="panel overdue-panel">
    <h2>⏰ 期限超過タスク <span class="sub">status≠完了・中止 かつ 開始日が過去</span></h2>
    <div id="overdueList"></div>
  </div>
</div>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>N's Factory</h2>
    <p>幕僚活動モニタ<br>サイト管理者パスワードを入力してください。</p>
    <input type="password" id="authPassword" placeholder="パスワード" onkeydown="if(event.key==='Enter')submitAuth()">
    <button class="auth-btn" onclick="submitAuth()">ログイン</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<script>
// ================================================================
// 認証（SHA-256照合）。ログイン成功時は admin.html と同じ nsf_admin_key に
// 平文キーを保存し、GAS（getMonitor / getEvents / updateEvent）呼び出しに使う。
// admin.html の iframe から開かれた場合は同一オリジンのため再入力不要。
// ================================================================
const ADMIN_PASS_HASH = '46f4870c381185671ba3ff063fd973ddb6ba34e5bcbd093a1ca8df3858ac018a';
const SESSION_KEY = 'nsfactory-staff-monitor-auth';
const KEY_STORE = 'nsf_admin_key';  // admin.html と共通
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwGydHIr4OyZZB4zeXwpmcXw7LXGCDDb2FMz7HG8YQwSrJIa422G1J_ESWHZPX5u3nH/exec';
const REFRESH_MS = 60000;  // データ源が5分おき更新のため60秒ポーリングで十分
const STALE_MIN = 12;      // 生成からこの分数を超えたら鮮度警告

function sha256(text) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then((buf) =>
    Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('')
  );
}
function getKey() {
  try { return sessionStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; }
}
function checkSession() {
  try { return sessionStorage.getItem(SESSION_KEY) === 'ok' && !!getKey(); } catch (e) { return false; }
}
function unlockAuth() {
  document.getElementById('authOverlay').style.display = 'none';
  document.body.classList.remove('auth-locked');
  document.getElementById('calLink').href = GAS_URL + '?key=' + encodeURIComponent(getKey());
  tick();
  setInterval(tick, REFRESH_MS);
}
function submitAuth() {
  const input = document.getElementById('authPassword');
  const errEl = document.getElementById('authError');
  sha256(input.value).then((hex) => {
    if (hex === ADMIN_PASS_HASH) {
      try {
        sessionStorage.setItem(SESSION_KEY, 'ok');
        sessionStorage.setItem(KEY_STORE, input.value);
      } catch (e) {}
      unlockAuth();
    } else {
      errEl.textContent = 'パスワードが違います';
    }
  }).catch(() => { errEl.textContent = '照合に失敗しました（https環境で開いてください）'; });
}

// ================================================================
// データ取得・描画
// ================================================================
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let taskIndex = {};
let suspendRefresh = false;

async function gasPost(body) {
  // Content-Type: text/plain で simple request にし CORS preflight を回避（GAS定石）
  const res = await fetch(GAS_URL, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function fmtAge(min){
  if(min < 60) return min + "分前";
  if(min < 1440) return Math.floor(min/60) + "時間" + (min%60) + "分前";
  return Math.floor(min/1440) + "日前";
}

function render(d){
  const genAt = new Date(d.generatedAt);
  const ageMin = Math.max(0, Math.round((Date.now() - genAt.getTime()) / 60000));
  document.getElementById("updatedAt").innerHTML =
    "データ生成: " + esc(d.generatedAt.replace("T"," ")) + "（" + fmtAge(ageMin) + "）<br>自宅PCから5分おきにアップロード";

  const badge = document.getElementById("liveBadge");
  if(ageMin <= STALE_MIN){ badge.textContent = "● 稼働中"; badge.className = "live"; }
  else { badge.textContent = "⚠ データ古い（アップローダー停止？）"; badge.className = "live stale"; }

  const active = d.sessions.filter(s => s.active);
  const warned = d.staff.filter(s => s.warning);
  const overdueTasks = d.staff.flatMap(s => s.openTasks.filter(t => t.overdue).map(t => ({...t, staff: s.name})));
  const openTotal = d.staff.reduce((a,s) => a + s.openTotal, 0);

  setKpi("kpiSess", active.length, active.length > 0 ? "ok" : "");
  setKpi("kpiWarn", warned.length, warned.length > 0 ? "alert" : "ok");
  setKpi("kpiOverdue", overdueTasks.length, overdueTasks.length > 0 ? "alert" : "ok");
  setKpi("kpiOpen", openTotal, "");

  document.getElementById("sessSub").textContent =
    `稼働 ${active.length}件（${d.activeWindowHours}時間以内の更新のみ稼働扱い）`;
  const shown = d.sessions.slice(0, 8);
  document.getElementById("sessList").innerHTML = shown.length === 0
    ? '<div class="empty">セッション記録がありません</div>'
    : shown.map(s => `
      <div class="sess ${s.active ? "active" : "ended"}">
        <div class="head">
          <span class="dot"></span>
          <span class="sid">${esc(s.sessionId.slice(0,8))}</span>
          <span>${s.active ? "稼働中" : "停止"}</span>
          <span class="staff-badge">${s.staff && s.staff.length ? "担当: " + s.staff.map(esc).join("・") : "担当: 推定不能"}</span>
          <span class="age">更新 ${fmtAge(s.ageMinutes)}</span>
        </div>
        <div class="title">${esc(s.theme || s.title || "（テーマ未取得）")}</div>
        <div class="work">直近指示: ${esc(s.latestWork)}</div>
      </div>`).join("");

  taskIndex = {};
  d.staff.forEach(s => s.openTasks.forEach(t => { taskIndex[t.id] = {...t, staff: s.name}; }));

  const openIds = new Set([...document.querySelectorAll(".task-list.open")].map(el => el.id));
  document.getElementById("staffGrid").innerHTML = d.staff.map((s, i) => `
    <div class="staff ${s.warning ? "warn" : ""}" onclick="toggleTasks('tl-${i}')">
      <div class="name">${esc(s.name)}${s.warning ? '<span class="wbadge">⚠ 警告</span>' : ""}</div>
      <div class="metrics">
        <span>未完了 <b>${s.openTotal}</b> 件 / <span class="over">超過 <b>${s.overdueCount}</b> 件</span></span>
        <span>日誌最終記載: <b>${s.lastLogDate ? esc(s.lastLogDate) + "（" + s.daysSinceLog + "日前）" : "記載なし"}</b></span>
      </div>
      ${s.openTasks.length ? `<div class="hint">▼ クリックでタスク明細（${s.openTasks.length}件）</div>
      <div class="task-list ${openIds.has("tl-"+i) ? "open" : ""}" id="tl-${i}">
        ${s.openTasks.map(t => taskItemHtml(t)).join("")}
      </div>` : ""}
    </div>`).join("");

  overdueTasks.sort((a,b) => a.date.localeCompare(b.date));
  document.getElementById("overdueList").innerHTML = overdueTasks.length === 0
    ? '<div class="empty">期限超過タスクはありません ✓</div>'
    : `<table><tr><th>期限（開始日）</th><th>担当</th><th>タスク</th><th>status</th><th>操作</th></tr>` +
      overdueTasks.map(t => `<tr>
        <td class="date">${esc(t.date)}</td>
        <td class="cat">${esc(t.staff)}</td>
        <td>${esc(t.title)}</td>
        <td class="cat">${esc(t.status)}</td>
        <td><span class="t-actions">${actionButtonsHtml(t.id)}</span></td>
      </tr>`).join("") + "</table>";
}

function taskItemHtml(t){
  return `
    <div class="task-item ${t.overdue ? "overdue" : ""}">
      <div class="t-head">
        <span>${esc(t.title || "（無題）")}</span>
        <span class="t-date">${esc(t.date || "日付未設定")}${t.overdue ? " ・超過" : ""}</span>
      </div>
      <div class="t-actions">${actionButtonsHtml(t.id)}</div>
    </div>`;
}

function actionButtonsHtml(id){
  return `
    <button class="abtn" onclick="event.stopPropagation(); completeTask('${esc(id)}', this)">✓ 完了にする</button>
    <button class="abtn" onclick="event.stopPropagation(); copyDirective('${esc(id)}', this)">📋 対処指示文をコピー</button>`;
}

function toggleTasks(id){
  document.getElementById(id)?.classList.toggle("open");
}

function setKpi(id, val, cls){
  const el = document.getElementById(id);
  el.className = "kpi " + cls;
  el.querySelector(".value").innerHTML = val + '<span class="unit">' + (id==="kpiWarn" ? "名" : "件") + "</span>";
}

// ================================================================
// タスク完了（幕僚計画GASを直接更新）
// updateEvent は送った項目で全上書きされるため（2026-07-06実害事案）、
// 必ず getEvents で元イベントの全項目を取得し status のみ差し替えて送る。
// ================================================================
async function completeTask(id, btn){
  const t = taskIndex[id];
  if(!t) return;
  if(!confirm(`「${t.title}」を完了にしますか？\n（幕僚計画カレンダーのstatusを「完了」に更新し、翌朝の再通知も止まります）`)) return;
  suspendRefresh = true;
  btn.disabled = true; btn.textContent = "更新中…";
  try{
    const key = getKey();
    const evRes = await gasPost({ action: "getEvents", apiKey: key, key: key });
    const ev = (evRes.events || []).find(e => e.id === id);
    if(!ev) throw new Error("イベントが見つかりません: " + id);
    const updated = { ...ev, status: "完了" };
    const r = await gasPost({ action: "updateEvent", key: key, apiKey: key, event: updated });
    if(r.error) throw new Error(r.error);
    btn.textContent = "✓ 完了しました"; btn.className = "abtn done";
    setTimeout(() => { suspendRefresh = false; tick(); }, 1500);
  }catch(e){
    suspendRefresh = false;
    btn.disabled = false; btn.textContent = "✕ 失敗（再試行）";
    alert("完了更新に失敗しました: " + e.message);
  }
}

function copyDirective(id, btn){
  const t = taskIndex[id];
  if(!t) return;
  const text = [
    `幕僚計画タスクの対処を依頼します。`,
    `担当: ${t.staff}`,
    `タスク: ${t.title}（期限 ${t.date}${t.overdue ? "・期限超過" : ""}）`,
    t.detail ? `詳細:\n${t.detail}` : "",
    ``,
    `対処が完了したら、幕僚計画カレンダーの本タスク（ID: ${t.id}）のstatusを「完了」に更新し、業務日誌へ記録してください。`
  ].filter(Boolean).join("\n");
  suspendRefresh = true;
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "✓ コピー済（Claudeに貼り付け）"; btn.className = "abtn copied";
    setTimeout(() => { btn.textContent = orig; btn.className = "abtn"; suspendRefresh = false; }, 3000);
  }, () => { suspendRefresh = false; });
}

// ================================================================
// ポーリング
// ================================================================
async function tick(){
  if(suspendRefresh) return;
  const badge = document.getElementById("liveBadge");
  const errEl = document.getElementById("loadErr");
  try{
    const r = await gasPost({ action: "getMonitor", apiKey: getKey(), key: getKey() });
    if(r.error) throw new Error(r.error);
    render(r.data);
    errEl.style.display = "none";
  }catch(e){
    badge.textContent = "✕ 取得失敗"; badge.className = "live down";
    errEl.textContent = "⚠ " + e.message;
    errEl.style.display = "block";
  }
}

if (checkSession()) {
  document.getElementById('authOverlay').style.display = 'none';
  unlockAuth();
} else {
  document.body.classList.add('auth-locked');
}
</script>
</body>
</html>
