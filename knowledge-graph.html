  var PASS_HASH = '46f4870c381185671ba3ff063fd973ddb6ba34e5bcbd093a1ca8df3858ac018a';
  var AUTH_KEY = 'nsf_admin_auth';
  var isAdmin = false;
  try { isAdmin = sessionStorage.getItem(AUTH_KEY) === PASS_HASH; } catch (e) {}

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', enc).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }

  var adminBtn = document.getElementById('adminBtn');
  var hintText = document.getElementById('hintText');

  function refreshAdminUI() {
    adminBtn.textContent = isAdmin ? '管理者モード ON' : '管理者ログイン';
    adminBtn.classList.toggle('on', isAdmin);
    hintText.textContent = isAdmin
      ? 'ドラッグでノード移動・ホイールでズーム。ノードをクリックするとObsidianで該当ファイルを開きます。'
      : 'ドラッグでノード移動・ホイールでズーム・ホバーでファイル名表示。二重丸は各部門のインデックス（ハブ）、灰色の点はルート直下ファイル（部門非該当）。管理者ログイン後はクリックでObsidianの該当ファイルを開けます。';
  }
  refreshAdminUI();

  function showLogin() {
    var ov = document.createElement('div');
    ov.className = 'login-ov';
    ov.innerHTML =
      '<form class="login-box">' +
        '<div style="font-size:12px;letter-spacing:.08em;color:#a07d3e;font-weight:700;">N\'s factory</div>' +
        '<h2 style="font-size:16px;margin:8px 0 2px;">管理者ログイン</h2>' +
        '<p style="font-size:12px;color:#8a8278;margin:0;">ファイルを開く操作は関係者専用です</p>' +
        '<input type="password" autocomplete="current-password" placeholder="パスワード">' +
        '<div class="login-msg"></div>' +
        '<button type="submit">ログイン</button>' +
      '</form>';
    document.body.appendChild(ov);
    var input = ov.querySelector('input');
    var msg = ov.querySelector('.login-msg');
    input.focus();
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });
    ov.querySelector('form').addEventListener('submit', function(ev){
      ev.preventDefault();
      msg.textContent = '';
      sha256Hex(input.value).then(function(hex){
        if (hex === PASS_HASH) {
          try { sessionStorage.setItem(AUTH_KEY, PASS_HASH); } catch (e) {}
          isAdmin = true;
          refreshAdminUI();
          ov.remove();
        } else {
          msg.textContent = 'パスワードが違います';
          input.value = '';
          input.focus();
        }
      }).catch(function(){
        msg.textContent = '照合に失敗しました（https環境で開いてください）';
      });
    });
  }

  adminBtn.addEventListener('click', function(){
    if (!isAdmin) showLogin();
  });

  var legend = document.getElementById('kg-legend');
  DATA.g.forEach(function(name, i){
    if (name === 'root') return;
    var sw = document.createElement('span');
    sw.style.display = 'inline-flex';
    sw.style.alignItems = 'center';
    sw.style.gap = '5px';
    var dot = document.createElement('span');
    dot.style.width = '10px';
    dot.style.height = '10px';
    dot.style.borderRadius = '50%';
    dot.style.display = 'inline-block';
    dot.style.background = RAMP[i];
    sw.appendChild(dot);
    var lbl = document.createElement('span');
    lbl.textContent = NAMES[i];
    sw.appendChild(lbl);
    legend.appendChild(sw);
  });

  var nodes = DATA.n.map(function(n, i){
    return { id: i, index: i, label: n[0], group: n[1], kind: n[2], path: n[3] };
  });
  var links = DATA.e.map(function(e){
    return { source: e[0], target: e[1] };
  });

  var wrap = document.querySelector('.kg-wrap');
  var width = wrap.clientWidth || 960;
  var height = 600;

  function nodeColor(d){
    if (d.group === 0) return d.kind === 1 ? '#F5E6C8' : '#8A8578';
    return RAMP[d.group];
  }
  function nodeRadius(d){ return d.kind === 1 ? 6.5 : 2.2; }

  var Graph = ForceGraph3D()(document.getElementById('kg-3d'))
    .width(width)
    .height(height)
    .backgroundColor('rgba(0,0,0,0)')
    .graphData({ nodes: nodes, links: links })
    .nodeThreeObjectExtend(false)
    .nodeThreeObject(function(d){
      var geo = new THREE.SphereGeometry(nodeRadius(d), 20, 20);
      var mat = new THREE.MeshPhysicalMaterial({
        color: nodeColor(d),
        emissive: nodeColor(d),
        emissiveIntensity: d.kind === 1 ? 0.35 : 0.18,
        roughness: 0.25,
        metalness: 0.2,
        clearcoat: 1,
        clearcoatRoughness: 0.1
      });
      return new THREE.Mesh(geo, mat);
    })
    .linkColor(function(){ return '#c8c4ff'; })
    .linkOpacity(0.35)
    .nodeLabel(function(d){
      return isAdmin ? d.label + '（クリックでObsidianを開く）' : d.label;
    })
    .onNodeClick(function(d){
      if (!isAdmin) { showLogin(); return; }
      var uri = 'obsidian://open?vault=' + encodeURIComponent(VAULT_NAME) + '&file=' + encodeURIComponent(d.path);
      window.location.href = uri;
    });

  Graph.d3Force('charge').strength(function(d){ return d.kind === 1 ? -140 : -9; });
  Graph.d3Force('link').distance(function(l){
    return (l.source.kind === 1 || l.target.kind === 1) ? 55 : 18;
  });

  // 鳥瞰の初期カメラ位置（見下ろし角度）。以降はドラッグで自由回転できる。
  Graph.cameraPosition({ x: 0, y: 280, z: 230 });
  // レイアウト収束後、見下ろし角度を保ったまま全体が収まるようズームを自動調整
  Graph.onEngineStop(function(){ Graph.zoomToFit(600, 40); });

  var controls = Graph.controls();
  if (controls) {
    controls.enableDamping = true;
    controls.autoRotate = false;
  }
})();
</script>
</body>
</html>
